<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orgaanisen kemian pelit</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#18212b;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:22px}
nav{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #d7dde3;border-radius:14px;padding:8px;margin-bottom:18px;box-shadow:0 2px 8px #00000008}
nav button{border:0;border-radius:9px;padding:10px 14px;font-size:15px;background:#eef2f6;color:#243342;cursor:pointer}
nav button.active{background:#2457a6;color:#fff}
header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}
h1{margin:0 0 4px;font-size:28px}.muted{color:#66727e}
.score{background:#fff;border:1px solid #d7dde3;border-radius:12px;padding:8px 15px;text-align:center}
.score b{display:block;font-size:24px}
.card{background:#fff;border:1px solid #d7dde3;border-radius:16px;padding:20px}
.top{display:flex;justify-content:space-between;color:#66727e;font-size:14px}
.figure{height:400px;margin-top:12px;border:1px solid #e2e6ea;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:white}
.figure img{max-width:96%;max-height:96%;object-fit:contain}
.q{font-size:19px;font-weight:650;margin:17px 0 8px}
input{width:100%;font-size:19px;padding:13px;border:1px solid #b8c1ca;border-radius:10px}
.buttons{display:flex;gap:10px;margin-top:12px}
.action{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;background:#2457a6;color:#fff}
.secondary{background:#e8edf3;color:#243342}
button:disabled{opacity:.5}
.feedback{min-height:30px;margin-top:12px;font-weight:650}
.good{color:#17733b}.bad{color:#b3261e}
details{margin-top:16px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;background:#eef2f6;padding:5px 8px;border-radius:999px}
.hidden{display:none}
.help{font-size:13px;color:#687583;margin-top:8px}
.example-label{font-size:13px;font-weight:700;color:#2457a6;text-transform:uppercase;letter-spacing:.04em}
.intro-text{font-size:17px;line-height:1.55;margin:14px 0 4px}
.intro-figure{height:330px}
#intro h2{margin:8px 0 4px}
</style>
</head>
<body>
<div class="wrap">
<nav id="menu">
<button data-game="hydro" class="active">Hiilivetypeli</button>
<button data-game="alcohol_acid">Alkoholi- ja happopeli</button>
<button data-game="ester">Esteripeli</button>
<button data-game="position">Paikkaisomeerit</button>
<button data-game="line">Viivakaavat</button>
<button data-game="line_challenge">Viivakaavahaaste</button>
</nav>

<header>
<div><h1 id="title"></h1><div class="muted" id="subtitle"></div></div>
<div class="score"><span>Pisteet</span><b id="score">0</b><span id="progress">1 / 10</span></div>
</header>


<section class="card hidden" id="intro">
  <div class="example-label">Esimerkki ennen harjoitusta</div>
  <h2 id="introTitle"></h2>
  <div class="figure intro-figure"><img id="introFormula" alt="Esimerkkikaava"></div>
  <p id="introText" class="intro-text"></p>
  <div class="buttons"><button class="action" id="startPractice">Aloita harjoitus</button></div>
</section>

<section class="card" id="game">
<div class="top"><span id="cat"></span><span id="streak">Putki: 0</span></div>
<div class="figure"><img id="formula" alt="Rakennekaava"></div>
<div class="q" id="question">Mikä yhdiste on kyseessä?</div>
<input id="answer" placeholder="Kirjoita yhdisteen nimi" autocomplete="off" spellcheck="false">
<div class="buttons">
<button class="action" id="check">Tarkista</button>
<button class="action secondary" id="next" disabled>Seuraava</button>
</div>
<div id="feedback" class="feedback"></div>
<div class="help">Rakennekaavassa C, H ja muut atomit näkyvät. Kaikki tehtävät ovat tässä vaiheessa rakennekaava → nimi.</div>
</section>

<details><summary><b>Tämän pelin tehtäväpankki</b></summary>
<div class="tags" id="tags"></div>
</details>

<section class="card hidden" id="end">
<h2>Kierros valmis!</h2><p id="result"></p>
<button class="action" id="restart">Uusi kierros</button>
</section>
</div>

 document.getElementById("check").disabled=false;
 document.getElementById("next").disabled=true;
 document.querySelector(".help").textContent=GAMES[gameKey].help || "Rakennekaavassa C, H ja muut atomit näkyvät. Kirjoita yhdisteen nimi.";
 answered=false;
 document.getElementById("answer").focus();
}
function check(){
 if(answered)return;
 answered=true;
 const answer=norm(document.getElementById("answer").value);
 const ok=(current.aliases || [current.name]).some(a=>norm(a)===answer);
 const f=document.getElementById("feedback");
 if(ok){
   correct++;streak++;
   score+=simpleScore()?1:100+Math.min(streak-1,5)*20;
   f.textContent="Oikein!";f.className="feedback good";
 } else {
   streak=0;f.innerHTML="Ei aivan. Oikea vastaus: <b>"+current.name+"</b>";f.className="feedback bad";
 }
 updateScore();
 document.getElementById("streak").textContent="Putki: "+streak;
 document.getElementById("check").disabled=true;
 document.getElementById("next").disabled=false;
}
function beginRound(){
 document.getElementById("intro").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 pick();
}
function startGame(key){
 gameKey=key;q=0;score=0;streak=0;correct=0;roundItems=[];
 const g=GAMES[key];
 document.getElementById("title").textContent=g.title;
 document.getElementById("subtitle").textContent=g.subtitle;
 updateScore();
 document.getElementById("streak").textContent="Putki: 0";
 document.getElementById("end").classList.add("hidden");
 document.querySelectorAll("#menu button").forEach(b=>b.classList.toggle("active",b.dataset.game===key));
 renderTags();
 if(g.intro){
   document.getElementById("game").classList.add("hidden");
   document.getElementById("intro").classList.remove("hidden");
   document.getElementById("introTitle").textContent=g.intro.title;
   document.getElementById("introFormula").src=g.intro.img;
   document.getElementById("introText").textContent=g.intro.text;
   document.getElementById("progress").textContent="Esimerkki";
 } else {
   document.getElementById("intro").classList.add("hidden");
   document.getElementById("game").classList.remove("hidden");
   pick();
 }
}
document.getElementById("startPractice").onclick=beginRound;
document.getElementById("check").onclick=check;
document.getElementById("answer").onkeydown=e=>{if(e.key==="Enter"&&!document.getElementById("check").disabled)check()};
document.getElementById("next").onclick=()=>{
 q++;
 if(q>=roundLength()){
   document.getElementById("game").classList.add("hidden");
   document.getElementById("end").classList.remove("hidden");
   document.getElementById("result").innerHTML=simpleScore()
     ? "Sait <b>"+score+" / "+roundLength()+" pistettä</b>."
     : "Sait <b>"+score+" pistettä</b> ja vastasit oikein <b>"+correct+"/"+roundLength()+"</b> tehtävään.";
 } else pick();
};
document.getElementById("restart").onclick=()=>startGame(gameKey);
document.querySelectorAll("#menu button").forEach(b=>b.onclick=()=>startGame(b.dataset.game));
startGame("hydro");
</script>
</body>
</html>
