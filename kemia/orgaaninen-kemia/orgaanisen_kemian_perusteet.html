<div class="tabs"><button class="active" data-p="p1">1 · Orgaaninen vai ei?</button><button data-p="p2">2 · Hiilen allotroopit</button><button data-p="p3">3 · Käsitteet</button><button data-p="p4">4 · Monivalinta</button></div>
<section id="p1" class="page active"><div class="card"><h2>Onko yhdiste orgaaninen vai epäorgaaninen?</h2><div id="cl" class="grid"></div><button class="action" onclick="checkC()">Tarkista</button><div id="cf" class="fb"></div></div></section>
<section id="p2" class="page"><div class="card"><h2>Hiilen allotroopit</h2><p class="hint">Yhdistä itse piirretty rakennemalli nimeen. Oikean vastauksen jälkeen näet yhden käyttötarkoituksen.</p><div id="al" class="allot"></div><button class="action" onclick="checkA()">Tarkista</button><div id="af" class="fb"></div></div></section>
<section id="p3" class="page"><div class="card"><h2>Keskeiset käsitteet</h2><p class="hint">Yhdistä käsite oikeaan selitykseen.</p><div id="ma" class="match"></div><button class="action" onclick="checkM()">Tarkista</button><div id="mf" class="fb"></div></div></section>
<section id="p4" class="page"><div class="card"><h2>Monivalinta</h2><div id="mc" class="mc"></div><button class="action" onclick="checkQ()">Tarkista</button><div id="qf" class="fb"></div></div></section>
