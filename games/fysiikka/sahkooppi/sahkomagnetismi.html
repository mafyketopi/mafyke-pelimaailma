function fixedValues(){let data=all[tab],q=data[0];let rows=params(q).filter(([key,val])=>data.every(item=>params(item).find(([k])=>k===key)?.[1]===val));if(tab===0)rows.push(['Yhden naulan massa','10 g'],['Nostotapa','Sama kaikissa kokeissa']);if(tab===1){if(research===3)rows=rows.filter(([k])=>k!=='Nopeus');if(research!==3)rows.push(['Kulkureitti','Sama käämiin nähden'])}if(tab===2)rows.push(['Kuorma','Ei kuormaa']);return rows.map(([k,v])=>k+': '+v).join(' · ')}
function results(mode=resultMode){resultMode=mode;let data=answers[tab],hasChart=!(research===2&&tab<2),pts=all[tab].flatMap((q,i)=>data[i]===undefined?[]:[{x:xValue(q),y:data[i]}]);$('#content').innerHTML=`<div class="card results"><div class="resulthead"><h2>Omat mittaukset</h2><div>${hasChart?`<button class="${mode==='table'?'active':''}" onclick="results('table')">Taulukko</button><button class="${mode==='graph'?'active':''}" onclick="results('graph')">Kuvaaja</button>`:''}${tab===1&&research===3?`<button class="${mode==='time'?'active':''}" onclick="results('time')">Aikakuvaaja</button>`:''}</div></div><p class="fixedsummary"><strong>Vakiona:</strong> ${fixedValues()}</p>${mode==='time'&&tab===1&&research===3?`<label for="tracecase">Valitse koe <select id="tracecase" onchange="resultTrace(Number(this.value))">${all[tab].map((q,i)=>`<option value="${i}">${i+1}. ${fmt(q.v*60,0)} kierrosta/min</option>`).join('')}</select></label><div class="chart" id="chart"></div>`:mode==='graph'&&hasChart?'<div class="chart" id="chart"></div>':`<table><thead><tr><th>Koe</th><th>${xLabel()}</th><th>${yLabel()}</th></tr></thead><tbody>${all[tab].map((q,i)=>`<tr><td>${i+1}</td><td>${tab===0&&research===2?(q.core?'Kyllä':'Ei'):tab===1&&research===2?(q.m===1?'Tavallinen':'Voimakas'):fmt(xValue(q),Number.isInteger(xValue(q))?0:2)}</td><td>${data[i]===undefined?'—':fmt(data[i],tab===0?2:3)}</td></tr>`).join('')}</tbody></table>`}<div class="resultfoot"><button onclick="setView(0)">← Mittaukset</button><button class="primary" onclick="setView(2)">Päätelmät →</button></div></div>`;if(mode==='time'&&tab===1&&research===3)resultTrace(0);if(mode==='graph'&&hasChart)chart(pts,xLabel(),yLabel(),Math.max(...pts.map(p=>p.x),.01),false)}
function scaleStep(max,target=5){let raw=Math.max(max,1e-6)/target,p=10**Math.floor(Math.log10(raw)),q=raw/p;return (q<=1?1:q<=2?2:q<=2.5?2.5:q<=5?5:10)*p}
function axisNumber(v,step){let digits=0;while(digits<4&&Math.abs(step*10**digits-Math.round(step*10**digits))>1e-7)digits++;return fmt(Math.abs(v)<step*1e-6?0:v,digits)}
function chart(pts,xlabel,ylabel,xmax,bipolar,line=false){let sx=scaleStep(xmax*1.08),xend=Math.ceil(xmax/sx+0.1)*sx,peak=Math.max(.001,...pts.map(p=>Math.abs(p.y))),sy=scaleStep(peak*1.1,bipolar?4:5),yend=Math.ceil(peak/sy+.1)*sy,L=112,T=68,W=790,H=388,X=x=>L+x/xend*W,Y=y=>bipolar?T+H/2-y/yend*H/2:T+H-y/yend*H;let svg=`<svg viewBox="0 0 960 570" role="img" aria-label="${ylabel}, ${xlabel}"><rect width="960" height="570" fill="white"/><text x="${L}" y="35" font-size="24" font-weight="600">${ylabel}</text>`;
for(let i=0;i<=Math.round(xend/sx);i++){let v=i*sx,x=X(v);svg+=`<path d="M${x} ${T}V${T+H}" stroke="#cdd4d6"/><text x="${x}" y="${T+H+35}" text-anchor="middle" font-size="23">${axisNumber(v,sx)}</text>`}
let from=bipolar?-Math.round(yend/sy):0,to=Math.round(yend/sy);for(let i=from;i<=to;i++){let v=i*sy,y=Y(v);svg+=`<path d="M${L} ${y}H${L+W}" stroke="#cdd4d6"/><text x="${L-18}" y="${y+8}" text-anchor="end" font-size="23">${axisNumber(v,sy)}</text>`}

if(line)svg+=`<polyline points="${pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}" stroke="#225d75" stroke-width="3" fill="none"/>`;else for(let p of pts)svg+=`<path d="M${X(p.x)-7} ${Y(p.y)-7}l14 14m-14 0l14-14" stroke="#1e5771" stroke-width="3.5"/>`;$('#chart').innerHTML=svg+'</svg>'}
function resultTrace(i){let q=all[tab][i],end=q.kind==='rotate'?4:q.kind==='still'?.5:.12/q.v,points=Array.from({length:401},(_,j)=>({x:end*j/400,y:voltage(q,end*j/400)}));chart(points,'Aika t (s)','Jännite U (V)',end,true,true)}

[['Magneetin ollessa paikallaan…',['indusoitu jännite on nolla.','jännite on suurimmillaan.'],0,'Muuttumaton magneettivuo ei indusoi jännitettä.'],['Nopeampi liike samoilla välineillä…',['pienentää huippujännitettä.','kasvattaa huippujännitettä.'],1,'Vertaa kokeita 1–3.'],['Käämin kierrosmäärän vaikutusta tutkivat…',['4–2–5','1–2–3'],0,'Magneetti ja nopeus pysyvät samoina.'],['Liikkeen suunnan tai napaisuuden kääntäminen…',['vaihtaa jännitteen etumerkin.','ei vaikuta jännitteeseen.'],0,'Vertaa kokeen 2 käyrää kokeisiin 8 ja 9.']],
