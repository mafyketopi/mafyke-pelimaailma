<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ohmin laki – analogimittarit</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']]}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17212b;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:1160px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:12px}h1{margin:0 0 5px;font-size:clamp(1.7rem,4vw,2.55rem)}.lead{margin:0;color:#5d6975}.progress{font-weight:800;color:#52606d;white-space:nowrap;padding-top:8px}.info,.exercise{background:#fff;border:1px solid #d5dde4;border-radius:16px}.info{padding:11px 16px;margin-bottom:14px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}.formula{font-size:1.07rem}.hint{color:#66727e;font-size:.93rem}.exercise{padding:15px 18px}.exercise h2{margin:0 0 3px;font-size:1.25rem}.exlead{margin:0 0 9px;color:#66727e}.meters{display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:14px}.meterCard{background:#fafbfc;border:1px solid #d9e0e6;border-radius:13px;padding:8px}.meterTitle{text-align:center;font-weight:800;margin:0 0 2px}svg{display:block;width:100%;height:auto;max-height:310px}.answers{display:grid;grid-template-columns:repeat(2,minmax(250px,1fr));gap:10px;margin-top:12px}.answer{background:#fafbfc;border:1px solid #d9e0e6;border-radius:11px;padding:10px 12px}.answer label{display:block;font-weight:800;margin-bottom:5px}.row{display:flex;align-items:center;gap:7px}input{width:100%;padding:9px 10px;border:1px solid #aab5bf;border-radius:8px;font-size:1rem;background:#fff}input:focus{outline:3px solid rgba(35,94,152,.18);border-color:#235e98}
input.liveok{border-color:#2e8b57;background:#edf8f1;box-shadow:0 0 0 2px rgba(46,139,87,.12)}
.answer.liveok{border-color:#62a879;background:#f0f9f3}.unit{font-weight:800;min-width:28px}.calcHelp{font-size:.83rem;color:#687581;margin-top:5px}
.eqPreview{min-height:40px;margin-top:7px;padding:7px 9px;background:#fff;border:1px dashed #cbd4dc;border-radius:8px}
.resultLine{display:flex;gap:7px;align-items:center;margin-top:7px}.resultLine input{width:145px}
.symbolBtn{padding:7px 11px;border:1px solid #b9c4ce;background:#eef2f5;color:#17212b;font-size:1.05rem}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:13px;flex-wrap:wrap}.navgroup{display:flex;gap:8px;align-items:center}button{border:0;border-radius:10px;padding:10px 15px;font-size:.98rem;font-weight:800;cursor:pointer}.primary{background:#235e98;color:#fff}.secondary{background:#e7ecf1;color:#17212b}button:disabled{opacity:.45;cursor:default}.kbd{font-size:.87rem;color:#65727e}.feedback{margin-top:10px;padding:10px 12px;border-radius:9px;font-weight:650;display:none}.ok{display:block;background:#e8f6ec;color:#1d6b36}.bad{display:block;background:#fff0f0;color:#9d2b2b}.summary{background:#fff;border:1px solid #d5dde4;border-radius:14px;padding:14px;margin-top:14px;display:none}@media(max-width:820px){.top{display:block}.progress{padding-top:4px}.meters{grid-template-columns:1fr}svg{max-height:none}.answers{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>Ohmin laki – mittariharjoitus</h1><p class="lead">Lue mittarit, laske resistanssi ja teho. Mittarilukemissa hyväksytään yhden pikkuasteikkovälin poikkeama kumpaankin suuntaan. Yksi tehtävä kerrallaan.</p></div><div id="progress" class="progress"></div></div>
<div class="info"><strong>Kaavat</strong><span class="formula">\(R=\dfrac{U}{I}\)</span><span class="formula">\(P=UI\)</span><span class="hint">Laskulausekkeissa käytä merkkejä <strong>*</strong> ja <strong>/</strong>. Esim. <strong>6/0,2</strong> tai <strong>6*0,2</strong>.</span></div>
<div id="exerciseHost"></div><div id="summary" class="summary"></div></div>
<script>
const NS="http://www.w3.org/2000/svg",cx=250,cy=245,start=205,end=335;let tasks=[],current=0,results=[];
function polar(r,d){const a=d*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}function el(n,a,p,t){const e=document.createElementNS(NS,n);Object.entries(a||{}).forEach(([k,v])=>e.setAttribute(k,v));if(t!==undefined)e.textContent=t;if(p)p.appendChild(e);return e}function line(g,a,b,w=1){el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"#222","stroke-width":w},g)}function txt(g,p,s,z=14,w=500){el("text",{x:p[0],y:p[1]+5,"text-anchor":"middle","font-size":z,"font-weight":w},g,s)}function rand(a){return a[Math.floor(Math.random()*a.length)]}function parseVal(s){return Number(String(s).trim().replace(",","."))}
function evalExpr(raw){let s=String(raw).trim().replaceAll(",",".").replaceAll("×","*").replaceAll("÷","/");if(!s||!/^[0-9+\-*/().\s]+$/.test(s))return NaN;try{const v=Function('"use strict";return ('+s+')')();return Number.isFinite(v)?v:NaN}catch{return NaN}}
function base(svg,l){el("rect",{x:12,y:10,width:476,height:340,rx:20,fill:"#f4f4ee",stroke:"#26313a","stroke-width":4},svg);el("rect",{x:32,y:28,width:436,height:245,rx:13,fill:"#fffefa",stroke:"#879197","stroke-width":2},svg);el("text",{x:250,y:205,"text-anchor":"middle","font-size":32,"font-style":"italic"},svg,l)}
function ticks(g,majorEvery=5){const p1=polar(170,start),p2=polar(170,end);el("path",{d:`M ${p1[0]} ${p1[1]} A 170 170 0 0 1 ${p2[0]} ${p2[1]}`,fill:"none",stroke:"#222","stroke-width":2},g);for(let i=0;i<=30;i++){const f=i/30,d=start+(end-start)*f,m=i%majorEvery===0;line(g,polar(m?143:158,d),polar(174,d),m?2.4:1)}}
function needle(svg,f){const d=start+(end-start)*f,p=polar(150,d);el("line",{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:"#171d21","stroke-width":2.5,"stroke-linecap":"round"},svg);el("circle",{cx,cy,r:9,fill:"#c9c29d",stroke:"#333","stroke-width":2},svg)}
function ports(svg,labels,sel){const xs=[120,250,380],y=318;labels.forEach((lab,i)=>{el("text",{x:xs[i],y:296,"text-anchor":"middle","font-size":15,"font-weight":800,fill:"#17212b"},svg,lab);el("circle",{cx:xs[i],cy:y,r:20,fill:"#d93625",stroke:"#7d1a12","stroke-width":3},svg);el("circle",{cx:xs[i],cy:y,r:7,fill:"#64150f"},svg);if(i===sel){el("circle",{cx:xs[i],cy:y,r:12,fill:"#171b1e"},svg);el("line",{x1:xs[i],y1:y+10,x2:xs[i],y2:350,stroke:"#c52b20","stroke-width":7,"stroke-linecap":"round"},svg)}})}
function drawVolt(svg,f,r){base(svg,"V");const g=el("g",{},svg);ticks(g,10);[0,1/3,2/3,1].forEach((fr,j)=>{const d=start+(end-start)*fr;txt(g,polar(142,d),["0","5","10","15"][j],15,600);txt(g,polar(190,d),["0","1","2","3"][j],15,600);txt(g,polar(210,d),["0","10","20","30"][j],15,600)});needle(svg,f);ports(svg,["3 V","15 V","30 V"],r)}
function drawAmp(svg,f,r){
 base(svg,"A");
 const g=el("g",{},svg);ticks(g,6);
 const marks=[0,6,12,18,24,30];
 marks.forEach((step,j)=>{
   const fr=step/30,d=start+(end-start)*fr;
   txt(g,polar(205,d),["0","100","200","300","400","500"][j],14,750);
   txt(g,polar(137,d),["0","10","20","30","40","50"][j],14,650);
   txt(g,polar(116,d),["0","1","2","3","4","5"][j],14,550);
 });
 // Yksikkö heti asteikon viimeisen numeron jälkeen samalla "rivillä".
 const unitAngle=end+4;
 txt(g,polar(213,unitAngle),"mA",13,800);
 txt(g,polar(146,unitAngle),"mA",13,800);
 txt(g,polar(125,unitAngle),"A",13,800);
 needle(svg,f);
 ports(svg,["50 mA","500 mA","5 A"],r);
}
const vRanges=[3,15,30],aRanges=[.05,.5,5],easy=[5,10,15,20,25].map(x=>x/30),med=[6,12,18,24,27].map(x=>x/30),hard=[7,8,11,13,17,19,22,23,26,28].map(x=>x/30);
function makeTasks(){tasks=[];results=Array(6).fill(null);current=0;for(let n=0;n<6;n++){const pool=n<2?easy:n<4?med:hard;let vi,ai,vf,af,U,I,R,P,g=0;do{vi=Math.floor(Math.random()*3);ai=Math.floor(Math.random()*3);vf=rand(pool);af=rand(pool);U=vRanges[vi]*vf;I=aRanges[ai]*af;R=U/I;P=U*I;g++}while((R<.5||R>5000||P>100)&&g<1000);tasks.push({vi,ai,vf,af,U,I,R,P})}render()}
function latexAtom(raw){
 let x=String(raw).trim();
 // Convert decimal comma/point to Finnish decimal comma in MathJax.
 x=x.replace(/(\d)[.,](\d)/g,"$1{,}$2");
 // Units are rendered upright and separated from the number.
 x=x.replace(/\s*mA\b/gi,String.raw`\,\mathrm{mA}`);
 x=x.replace(/\s*V\b/gi,String.raw`\,\mathrm{V}`);
 x=x.replace(/\s*A\b/gi,String.raw`\,\mathrm{A}`);
 x=x.replace(/\s*W\b/gi,String.raw`\,\mathrm{W}`);
 x=x.replace(/Ω/g,String.raw`\,\Omega`);
 return x.trim();
}
function latexExpr(raw,kind){
 const src=String(raw).trim();
 if(!src) return kind==="R" ? String.raw`R=\frac{U}{I}` : String.raw`P=UI`;

 if(kind==="R"){
   const pos=src.indexOf("/");
   if(pos>=0){
     const num=latexAtom(src.slice(0,pos));
     const den=latexAtom(src.slice(pos+1));
     return String.raw`R=\frac{${num}}{${den}}`;
   }
   return "R="+latexAtom(src);
 }

 // Power: accept * as multiplication and render it as a centred dot.
 const parts=src.split("*");
 if(parts.length===2){
   return "P="+latexAtom(parts[0])+String.raw`\cdot `+latexAtom(parts[1]);
 }
 return "P="+latexAtom(src).replace(/\*/g,String.raw`\cdot `);
}
function preview(inp,box,kind){const f=()=>{box.textContent="\\("+latexExpr(inp.value,kind)+"\\)";if(window.MathJax?.typesetPromise)MathJax.typesetPromise([box])};inp.addEventListener("input",f);f()}
function sig3(x){return !Number.isFinite(x)||x===0?x:Number(x.toPrecision(2))}
function sig3ok(g,e){if(!Number.isFinite(g))return false;const t=sig3(e),dec=Math.max(0,1-Math.floor(Math.log10(Math.abs(t)))),tol=.5001*Math.pow(10,-dec);return Math.abs(g-t)<=tol}
function exprOK(raw,kind){
 const t=String(raw).replace(/\s/g,"").toUpperCase();
 if(kind==="R") return /^[-+0-9.,]+V\/[-+0-9.,]+A$/.test(t);
 return /^[-+0-9.,]+V\*[-+0-9.,]+A$/.test(t);
}

function markLive(input,ok){
 if(!input)return;
 input.classList.toggle("liveok",!!ok);
 const card=input.closest(".answer");
 if(card) card.classList.toggle("liveok",!!ok);
}
function liveCheck(){
 const t=tasks[current];
 const iv=parseVal(ival.value), uv=parseVal(uval.value);
 const iTol=aRanges[t.ai]/30*1.01, uTol=vRanges[t.vi]/30*1.01;
 const iok=Number.isFinite(iv)&&Math.abs(iv-t.I)<=iTol;
 const uok=Number.isFinite(uv)&&Math.abs(uv-t.U)<=uTol;
 markLive(ival,iok);
 markLive(uval,uok);

 let rExpected=NaN,pExpected=NaN;
 if(iok&&uok&&iv!==0){rExpected=uv/iv;pExpected=uv*iv}

 const rok=iok&&uok&&exprOK(rexpr.value,"R")&&sig3ok(parseVal(ranswer.value),rExpected);
 const pok=iok&&uok&&exprOK(pexpr.value,"P")&&sig3ok(parseVal(panswer.value),pExpected);
 markLive(ranswer,rok);
 markLive(panswer,pok);

 // Laskulausekkeen laatikko vihreäksi, kun yksiköt ja laskutoimitus ovat oikein
 // ja annettu lopputulos vastaa hyväksyttyjä mittarilukemia.
 markLive(rexpr,rok);
 markLive(pexpr,pok);
}
function render(){const t=tasks[current],host=document.getElementById("exerciseHost");document.getElementById("progress").textContent=`Tehtävä ${current+1} / ${tasks.length}`;host.innerHTML=`<section class="exercise"><h2>Tehtävä ${current+1}</h2><p class="exlead">Lue virta- ja jännitemittarit. Laske sitten resistanssi ja teho.</p><div class="meters"><div class="meterCard"><div class="meterTitle">Virtamittari</div><svg id="amp" viewBox="0 0 500 365"></svg></div><div class="meterCard"><div class="meterTitle">Jännitemittari</div><svg id="volt" viewBox="0 0 500 365"></svg></div></div><div class="answers"><div class="answer"><label>Sähkövirta I</label><div class="row"><input id="ival" inputmode="decimal"><span class="unit">A</span></div></div><div class="answer"><label>Jännite U</label><div class="row"><input id="uval" inputmode="decimal"><span class="unit">V</span></div></div><div class="answer"><label>Resistanssin laskulauseke yksiköineen</label><div class="row"><input id="rexpr" placeholder="esim. 6 V / 0,2 A"></div><div id="rpreview" class="eqPreview">\(R=\frac{U}{I}\)</div><div class="resultLine"><b>Vastaus:</b><input id="ranswer" inputmode="decimal"><span class="unit">Ω</span></div><div class="calcHelp">Kirjoita esimerkiksi <strong>6 V / 0,2 A</strong>. LaTeX-muoto muodostuu automaattisesti. Vastaus 2 merkitsevän numeron tarkkuuteen.</div></div><div class="answer"><label>Tehon laskulauseke yksiköineen</label><div class="row"><input id="pexpr" placeholder="esim. 6 V * 0,2 A"></div><div id="ppreview" class="eqPreview">\(P=UI\)</div><div class="resultLine"><b>Vastaus:</b><input id="panswer" inputmode="decimal"><span class="unit">W</span></div><div class="calcHelp">Kirjoita esimerkiksi <strong>6 V * 0,2 A</strong>. LaTeX-muoto muodostuu automaattisesti. Vastaus 2 merkitsevän numeron tarkkuuteen.</div></div></div><div id="feedback" class="feedback"></div><div class="nav"><div class="navgroup"><button class="secondary" id="prev" ${current===0?"disabled":""}>← Edellinen</button><button class="secondary" id="next" ${current===tasks.length-1?"disabled":""}>Seuraava →</button></div><div class="navgroup"><span class="kbd">Enter = seuraava kenttä · Ctrl+Enter = tarkista · ←/→ = tehtävä</span><button class="primary" id="check">Tarkista tehtävä</button></div></div></section>`;drawAmp(document.getElementById("amp"),t.af,t.ai);drawVolt(document.getElementById("volt"),t.vf,t.vi);const saved=results[current];if(saved?.values){ival.value=saved.values.i;uval.value=saved.values.u;rexpr.value=saved.values.r;pexpr.value=saved.values.p;ranswer.value=saved.values.ra||"";panswer.value=saved.values.pa||"";if(saved.checked)show(saved)}const inputs=[...host.querySelectorAll("input")];inputs.forEach((inp,i)=>inp.onkeydown=e=>{if(e.key==="Enter"&&!e.ctrlKey){e.preventDefault();if(i<inputs.length-1)inputs[i+1].focus();else check(true)}});preview(rexpr,rpreview,"R");preview(pexpr,ppreview,"P");
 [ival,uval,rexpr,pexpr,ranswer,panswer].forEach(x=>x.addEventListener("input",liveCheck));
 setTimeout(liveCheck,0);prev.onclick=()=>go(-1);next.onclick=()=>go(1);document.getElementById("check").onclick=()=>check(false);setTimeout(()=>ival.focus(),0)}
function vals(){return{i:ival.value,u:uval.value,r:rexpr.value,p:pexpr.value,ra:ranswer.value,pa:panswer.value}}
function check(auto=false){
 const t=tasks[current],v=vals();
 const iv=parseVal(v.i),uv=parseVal(v.u),rav=parseVal(v.ra),pav=parseVal(v.pa);
 const iTol=aRanges[t.ai]/30*1.01,uTol=vRanges[t.vi]/30*1.01;

 const iok=Number.isFinite(iv)&&Math.abs(iv-t.I)<=iTol;
 const uok=Number.isFinite(uv)&&Math.abs(uv-t.U)<=uTol;

 // Jos mittarilukemat hyväksytään, R ja P tarkistetaan oppilaan omista U- ja I-arvoista.
 let rExpected=NaN,pExpected=NaN;
 if(iok&&uok&&iv!==0){
   rExpected=uv/iv;
   pExpected=uv*iv;
 }

 const rok=iok&&uok&&exprOK(v.r,"R")&&sig3ok(rav,rExpected);
 const pok=iok&&uok&&exprOK(v.p,"P")&&sig3ok(pav,pExpected);

 const res={checked:true,values:v,iok,uok,rok,pok,rExpected,pExpected};
 res.ok=iok&&uok&&rok&&pok;
 results[current]=res;
 show(res);
 summary();
 if(auto&&res.ok&&current<tasks.length-1)setTimeout(()=>{current++;render()},300);
}
function show(r){const f=document.getElementById("feedback");if(r.ok){f.className="feedback ok";f.textContent="Oikein."}else{let m=[];if(!r.iok)m.push("Tarkista virtamittarin asteikko ja mittausalue.");if(!r.uok)m.push("Tarkista jännitemittarin asteikko ja mittausalue.");if(r.iok&&r.uok&&!r.rok)m.push("Tarkista resistanssin laskulauseke, yksiköt ja 2 merkitsevän numeron vastaus.");if(r.iok&&r.uok&&!r.pok)m.push("Tarkista tehon laskulauseke, yksiköt ja 2 merkitsevän numeron vastaus.");f.className="feedback bad";f.textContent=m.join(" ")}}
function go(d){const v=vals(),old=results[current]||{};results[current]={...old,values:v};const n=current+d;if(n>=0&&n<tasks.length){current=n;render()}}function summary(){if(results.every(r=>r&&r.checked)){const c=results.filter(r=>r.ok).length,s=document.getElementById("summary");s.style.display="block";s.innerHTML=`<strong>${c} / 6 tehtävää oikein.</strong> <button class="secondary" id="newSet">Uusi tehtäväsarja</button>`;newSet.onclick=makeTasks}}
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();check(false);return}if(document.activeElement?.tagName==="INPUT")return;if(e.key==="ArrowLeft"){e.preventDefault();go(-1)}if(e.key==="ArrowRight"){e.preventDefault();go(1)}});makeTasks();
</script></body></html>
