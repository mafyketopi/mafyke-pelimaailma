let page=0, answers=Array(questions.length).fill(null);
const host=document.getElementById("pages");
for(let p=0;p<3;p++) {
 const div=document.createElement("div"); div.className="page"+(p===0?" active":"");
 questions.slice(p*8,p*8+8).forEach((q,j)=>{
  const i=p*8+j, card=document.createElement("div");card.className="qcard";
  card.innerHTML=`<div class="qnum">Kysymys ${i+1}</div><div class="question">${q.q}</div>
  ${q.visual?`<div class="visual">${visualSVG(q.visual)}</div>`:""}
  <div class="options">${q.opts.map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}"><span>${String.fromCharCode(65+k)}) ${o}</span></label>`).join("")}</div>
  <div class="explain" id="e${i}"></div>`;
  div.appendChild(card);
 });
 host.appendChild(div);
}
function update() {
 document.querySelectorAll(".page").forEach((x,i)=>x.classList.toggle("active",i===page));
 document.getElementById("progress").textContent=`Sivu ${page+1} / 3`;
 document.getElementById("prev").disabled=page===0;
 document.getElementById("next").textContent=page===2?"Tarkista kaikki":"Seuraava →";
}
document.addEventListener("change",e=>{if(e.target.matches('input[type="radio"]')) answers[Number(e.target.name.slice(1))]=Number(e.target.value);});
document.getElementById("prev").onclick=()=>{if(page>0){page--;update();scrollTo(0,0)}};
document.getElementById("next").onclick=()=>{if(page<2){page++;update();scrollTo(0,0)}else grade()};
function grade() {
 let score=0;
 questions.forEach((q,i)=>{
  const rs=[...document.querySelectorAll(`input[name="q${i}"]`)];
  rs.forEach((r,k)=>{const l=r.closest(".option");if(k===q.a)l.classList.add("correct");if(r.checked&&k!==q.a)l.classList.add("wrong")});
  if(answers[i]===q.a)score++;
  const e=document.getElementById(`e${i}`);
  e.textContent=(q.exp?q.exp+" ":"")+`Oikea vastaus: ${String.fromCharCode(65+q.a)}.`;
  e.classList.add("show");
 });
 document.getElementById("score").textContent=`${score} / 24`;
 const s=document.getElementById("summary");s.classList.add("show");
 s.innerHTML=`<h2 style="margin-top:0">Tulos: ${score} / 24</h2><p class="small">Oikeat vaihtoehdot näkyvät vihreinä ja omat väärät valinnat punaisina.</p>`;
 scrollTo(0,document.body.scrollHeight);
}
update();
</script>
