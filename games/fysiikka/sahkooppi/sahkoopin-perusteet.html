<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sähköopin perusteet – 24 monivalintaa</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#17212b;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.wrap{max-width:1080px;margin:auto;padding:20px 18px 36px}
header{display:flex;justify-content:space-between;gap:16px;margin-bottom:15px;align-items:flex-start}
h1{margin:0 0 5px;font-size:clamp(1.7rem,4vw,2.5rem)}
.lead{color:#5f6b76;margin:0;font-size:.98rem}
.scorebox{background:#fff;border:1px solid #d7dee5;border-radius:11px;padding:8px 13px;text-align:center;min-width:110px;font-size:.9rem}
.scorebox b{display:block;font-size:1.35rem}
.page{display:none}.page.active{display:block}
.qcard{background:#fff;border:1px solid #d8e0e7;border-radius:13px;padding:13px 15px;margin-bottom:10px}
.qnum{font-size:.8rem;color:#6c7883;font-weight:700;margin-bottom:3px}
.question{font-size:.98rem;font-weight:720;line-height:1.32;margin-bottom:8px}
.visual{margin:7px 0 9px;border:1px solid #e0e5ea;border-radius:10px;padding:7px;background:#fbfcfd}
.visual svg{width:100%;height:auto;display:block;max-height:190px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.option{display:flex;gap:8px;align-items:flex-start;border:1px solid #d7dee5;border-radius:8px;padding:7px 9px;background:#fafbfc;cursor:pointer;font-size:.9rem;line-height:1.25}
.option:hover{background:#f4f7fb}.option input{margin-top:2px}
.option.correct{border-color:#58a66a;background:#eef8f0}.option.wrong{border-color:#cf6464;background:#fff1f1}
.explain{display:none;margin-top:8px;padding:8px;border-radius:8px;background:#f3f6f8;color:#40505f;font-size:.88rem;line-height:1.35}.explain.show{display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:9px 14px;font-weight:740;font-size:.95rem;cursor:pointer}
.primary{background:#235e98;color:#fff}.secondary{background:#e7ecf1;color:#17212b}.progress{font-weight:700;color:#53606c;align-self:center;font-size:.92rem}
.summary{display:none;background:#fff;border:1px solid #d8e0e7;border-radius:13px;padding:16px;margin-top:15px}.summary.show{display:block}
.small{font-size:.88rem;color:#66727e}
@media(max-width:760px){header{display:block}.scorebox{margin-top:10px;width:120px}.options{grid-template-columns:1fr}.qcard{padding:12px}}
</style>
</head>

function svgWrap(inner,label=""){
 return `<svg viewBox="0 0 620 180" aria-label="${label}">${inner}</svg>`;
}
function battery(x=290,y=130){
 return `<line x1="${x-42}" y1="${y}" x2="${x-10}" y2="${y}" stroke="#222" stroke-width="4"/>
 <line x1="${x-10}" y1="${y-24}" x2="${x-10}" y2="${y+24}" stroke="#222" stroke-width="4"/>
 <line x1="${x+10}" y1="${y-16}" x2="${x+10}" y2="${y+16}" stroke="#222" stroke-width="4"/>
 <line x1="${x+10}" y1="${y}" x2="${x+42}" y2="${y}" stroke="#222" stroke-width="4"/>
 <text x="${x-17}" y="${y-31}" font-size="16" font-weight="700">+</text>
 <text x="${x+6}" y="${y-31}" font-size="16" font-weight="700">−</text>`;
}
function lamp(x,y,r=24){
 return `<line x1="${x-r-28}" y1="${y}" x2="${x-r}" y2="${y}" stroke="#222" stroke-width="4"/>
 <circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#222" stroke-width="4"/>
 <line x1="${x-r*.65}" y1="${y-r*.65}" x2="${x+r*.65}" y2="${y+r*.65}" stroke="#222" stroke-width="4"/>
 <line x1="${x+r*.65}" y1="${y-r*.65}" x2="${x-r*.65}" y2="${y+r*.65}" stroke="#222" stroke-width="4"/>
 <line x1="${x+r}" y1="${y}" x2="${x+r+28}" y2="${y}" stroke="#222" stroke-width="4"/>`;
}
function meter(x,y,letter){
 return `<line x1="${x-52}" y1="${y}" x2="${x-24}" y2="${y}" stroke="#222" stroke-width="4"/>
 <circle cx="${x}" cy="${y}" r="24" fill="#fff" stroke="#222" stroke-width="4"/>
 <text x="${x}" y="${y+8}" text-anchor="middle" font-size="24" font-weight="700">${letter}</text>
 <line x1="${x+24}" y1="${y}" x2="${x+52}" y2="${y}" stroke="#222" stroke-width="4"/>`;
}

let page=0, answers=Array(questions.length).fill(null);
const host=document.getElementById("pages");
for(let p=0;p<3;p++){
 const div=document.createElement("div"); div.className="page"+(p===0?" active":"");
 questions.slice(p*8,p*8+8).forEach((q,j)=>{
  const i=p*8+j, card=document.createElement("div");card.className="qcard";
  card.innerHTML=`<div class="qnum">Kysymys ${i+1}</div><div class="question">${q.q}</div>
  ${q.visual?`<div class="visual">${visualSVG(q.visual)}</div>`:""}
  <div class="options">${q.opts.map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}"><span>${String.fromCharCode(65+k)}) ${o}</span></label>`).join("")}</div>
  <div class="explain" id="e${i}"></div>`;
  div.appendChild(card);
 });
 host.appendChild(div);
}
function update(){
 document.querySelectorAll(".page").forEach((x,i)=>x.classList.toggle("active",i===page));
 document.getElementById("progress").textContent=`Sivu ${page+1} / 3`;
 document.getElementById("prev").disabled=page===0;
 document.getElementById("next").textContent=page===2?"Tarkista kaikki":"Seuraava →";
}
document.addEventListener("change",e=>{
 if(e.target.matches('input[type="radio"]')) answers[Number(e.target.name.slice(1))]=Number(e.target.value);
});
document.getElementById("prev").onclick=()=>{if(page>0){page--;update();scrollTo(0,0)}};
document.getElementById("next").onclick=()=>{if(page<2){page++;update();scrollTo(0,0)}else grade()};
function grade(){
 let score=0;
 questions.forEach((q,i)=>{
  const rs=[...document.querySelectorAll(`input[name="q${i}"]`)];
  rs.forEach((r,k)=>{const l=r.closest(".option");if(k===q.a)l.classList.add("correct");if(r.checked&&k!==q.a)l.classList.add("wrong")});
  if(answers[i]===q.a)score++;
  const e=document.getElementById(`e${i}`);
  e.textContent=(q.exp?q.exp+" ":"")+`Oikea vastaus: ${String.fromCharCode(65+q.a)}.`;
  e.classList.add("show");
 });
 document.getElementById("score").textContent=`${score} / 24`;
 const s=document.getElementById("summary");s.classList.add("show");
 s.innerHTML=`<h2 style="margin-top:0">Tulos: ${score} / 24</h2><p class="small">Oikeat vaihtoehdot näkyvät vihreinä ja omat väärät valinnat punaisina.</p>`;
 scrollTo(0,document.body.scrollHeight);
}
update();
