<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ohmin lain tutkiminen</title>
<style>
:root{--ink:#213d38;--muted:#5b6b65;--accent:#176c61;--border:#d5dfd9;--paper:#fff;--wash:#f1f5f2}
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:1240px;margin:auto;padding:18px 24px 24px}.brand{font-size:.76rem;font-weight:800;letter-spacing:.16em;color:var(--accent);margin-bottom:7px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:17px}h1{margin:0;font:700 clamp(1.65rem,3vw,2.35rem)/1.15 Georgia,serif;letter-spacing:-.02em}.progress{font-size:.88rem;font-weight:700;white-space:nowrap;border:1px solid var(--border);border-radius:24px;background:#fff;padding:7px 13px}
.task,.experiment{background:var(--paper);border:1px solid var(--border);border-radius:15px;padding:18px 20px;box-shadow:0 3px 15px #1d403308}.task h2,.experiment h2{font:700 1.3rem/1.25 Georgia,serif;margin:0 0 7px}.tasklead{margin:0 0 17px;max-width:76ch;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(245px,275px) minmax(0,1fr);gap:20px;align-items:start}.layout>*{min-width:0}.data-panel{border:1px solid var(--border);border-radius:11px;overflow:hidden;background:#fbfcfa}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:6px 12px;text-align:center;border-bottom:1px solid #e4eae5}th{background:#e9f0eb;font-weight:750;color:var(--ink);padding:9px 12px}th+th,td+td{border-left:1px solid #e2e8e3}tbody tr:last-child td{border-bottom:0}tr:nth-child(even) td{background:#f5f8f4}
.answers{margin:0;padding:13px 13px 15px;border-top:1px solid var(--border);background:#fff}.resrow{display:grid;grid-template-columns:minmax(0,1fr) 86px auto;gap:8px;align-items:center;margin:0 0 10px}.resrow span{font-size:.93rem}.answers>b{display:block;font-size:.93rem;margin-bottom:12px}.info{font-size:.85rem;line-height:1.5;color:var(--muted)}
input{width:100%;min-width:0;padding:9px 8px;font:600 1rem system-ui;font-variant-numeric:tabular-nums;text-align:right;background:white;border:1px solid #a9b9b0;border-radius:7px;color:var(--ink)}input:focus-visible{outline:3px solid #176c6125;border-color:var(--accent)}input.liveok{background:#edf8ef;border-color:#4b9263;box-shadow:inset 3px 0 #4b9263}
.graphbox{border:1px solid var(--border);border-radius:11px;padding:8px 10px 10px;background:#fff;overflow:hidden}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}button{font:650 .9rem/1.25 system-ui;border:1px solid transparent;border-radius:8px;padding:10px 13px;cursor:pointer;transition:background .15s}button:focus-visible{outline:3px solid #176c6155;outline-offset:3px}button:disabled{opacity:.42;cursor:default}button:not(:disabled):hover{filter:brightness(.96)}
.tools{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid #e2e8e3;padding-top:10px;margin-top:3px}.mode,.clear,.nav button{color:var(--ink);background:#eff3ef;border-color:var(--border)}.mode.active,.check{background:var(--accent);border-color:var(--accent);color:#fff}.tools .check{margin-left:auto}.mode#tri{background:#f3f7f0}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:13px}.nav button{min-width:110px;background:#fff}
.feedback{display:none;margin-top:11px;padding:10px 12px;border-radius:8px;font-size:.94rem;font-weight:600;line-height:1.5}.ok{display:block;background:#eaf5ed;color:#23603b;border:1px solid #c5decf}.bad{display:block;background:#fff3ee;color:#8b3c2e;border:1px solid #ecd2c6}
.experiment p{color:var(--muted);max-width:95ch;line-height:1.55;margin:6px 0 14px}.image-button{display:block;width:100%;padding:0;background:#fff;border:1px solid #e1e7e2;border-radius:10px;cursor:zoom-in;overflow:hidden}.experiment img{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain;margin:0 auto;background:#fff}.expactions{display:flex;justify-content:flex-end;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}.expactions button{background:var(--accent);color:white}.zoom-label{font-size:.83rem;color:var(--muted);margin-right:auto}
dialog{width:min(1500px,96vw);max-width:96vw;max-height:95vh;padding:12px;border:1px solid #acbdb2;border-radius:13px;background:#fff;color:var(--ink)}dialog::backdrop{background:#172b25b8}dialog img{display:block;max-width:100%;max-height:82vh;width:auto;height:auto;margin:auto}dialog .close-row{display:flex;justify-content:flex-end;margin-bottom:8px}dialog button{background:var(--wash);color:var(--ink)}math{font-size:1.1em}
@media(max-width:850px){.wrap{padding:14px}.topbar{gap:10px;align-items:flex-start}.layout{grid-template-columns:1fr}.data-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.answers{border-top:0;border-left:1px solid var(--border);align-self:stretch}.task,.experiment{padding:15px}.experiment img{max-height:none}.tools .check{margin-left:0}}
@media(max-width:500px){.topbar{flex-wrap:wrap}.topbar h1{font-size:1.75rem}.progress{padding:5px 11px}.data-panel{display:block}.answers{border-left:0;border-top:1px solid var(--border)}.layout{gap:13px}.tools button{flex:1 1 auto}.graphbox{padding:4px 2px 9px}.tools,.feedback{margin-left:6px;margin-right:6px}.tools{gap:6px}.zoom-label{display:none}}

.topbar{margin-bottom:14px}.topbar .nav{margin:0;align-items:center;flex-wrap:nowrap}.topbar .nav button{min-width:0;padding:9px 12px}.topbar .progress{border:0;background:none;padding:0 4px}.graphbox{border:0;padding:0;border-radius:0}.plot-stage{position:relative;width:100%;aspect-ratio:1000/540;margin:0 auto}.plot-stage .plot-paper,.plot-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.plot-paper{pointer-events:none}.tasklead{margin-bottom:12px}.task,.experiment{box-shadow:none}.experiment{padding:20px 24px}.experiment img{max-height:min(43vh,320px);padding:14px;object-fit:contain}.image-button{border:0}.expactions{margin-top:8px}.tools .mode[data-m=points]{cursor:default}.answers{padding:12px}.info math{vertical-align:middle}.task .layout{align-items:start}dialog img{max-height:78vh;max-width:90vw;padding:24px}
@media(min-width:851px) and (max-height:800px){.wrap{padding-top:12px;padding-bottom:12px}.brand{margin-bottom:5px}.topbar{margin-bottom:10px}h1{font-size:2rem}.task{padding:14px 18px}.task h2{font-size:1.2rem}.tasklead{font-size:.94rem;margin-bottom:9px}th,td{padding-top:5px;padding-bottom:5px}.tools{padding-top:8px}.tools button{padding:9px 11px}.answers{padding:10px 12px}.info{font-size:.83rem}}
@media(max-width:850px){.topbar{flex-wrap:wrap}.plot-stage{max-width:100%}.experiment img{max-height:none;max-width:100%;padding:4px}.topbar .nav{width:100%;justify-content:space-between}}

.wrap{max-width:1320px}.layout{grid-template-columns:245px minmax(0,1fr);gap:20px}.plot-stage canvas{max-height:none}.experiment img{max-height:min(56vh,440px);padding:0}.experiment p{margin-bottom:8px}.experiment h2{margin-bottom:5px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.experiment img{max-height:none}.plot-stage{min-height:0}}

.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}.intro-study{padding:5px 22px}.intro-study+ .intro-study{border-left:1px solid var(--border)}.intro-study h2{font-size:1.25rem}.intro-study p{font-size:.94rem;min-height:3em}.intro-study .image-button img{max-height:none;width:100%;padding:0}.experiment .expactions{margin-top:15px}.point-hint{font-size:.9rem;min-height:24px;margin-bottom:4px;color:var(--muted)}tr[data-row]{cursor:pointer}tr[data-row]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}tr.row-ok td{background:#eaf6ed;color:#245a35}tr.row-current td{box-shadow:inset 0 2px #176c61,inset 0 -2px #176c61;background:#f3f8f3}tr.row-current td:first-child{box-shadow:inset 3px 0 #176c61,inset 0 2px #176c61,inset 0 -2px #176c61}.field-note{font-size:.85rem;color:var(--muted)}.conclusion-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.conclusion-question{min-width:0;margin:0;border:1px solid var(--border);border-radius:10px;padding:14px}.conclusion-question legend{font-weight:700;padding:0 4px;line-height:1.4}.conclusion-question label{display:flex;gap:8px;margin:9px 0;padding:9px 7px;background:#f4f6f3;border-radius:7px;font-size:.95rem;cursor:pointer}.conclusion-question input{width:17px;min-width:17px;height:17px;padding:0;margin:3px 0 0;accent-color:var(--accent)}.conclusion-question.complete{border-color:#5e9c6f;background:#f1f9f2}.choice-correct{background:#e3f2e7!important}.conclusion-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.conclusion-actions{display:flex;gap:10px;align-items:center;margin-top:18px}.conclusion-status{font-size:.9rem;color:#2e6a40;min-height:24px}.point-hint:empty{visibility:hidden}
@media(max-width:850px){.intro-grid{grid-template-columns:1fr}.intro-study{padding:8px 0}.intro-study+.intro-study{border-left:0;border-top:1px solid var(--border);padding-top:18px}.conclusion-grid{grid-template-columns:1fr}.conclusion-top{flex-wrap:wrap}.conclusion-question label{margin:6px 0}}
</style></head><body>

 const t=T[cur],s=S[cur],c=document.getElementById('graph'),field=id=>document.getElementById(id);let drag=null;
 const feedback=(text,ok=false)=>{field('fb').className='feedback '+(ok?'ok':'bad');field('fb').textContent=text};
 const invalidate=()=>{s.calcDone=false;s.done=false;if(field('goConclusions'))field('goConclusions').disabled=true};
 const live=()=>{if(t.type==='line')field('ri').classList.toggle('liveok',s.fit!==null&&ok2(val(s.R),s.fit));else{const target=t.checks.map(z=>z[1]/z[0]);field('r1').classList.toggle('liveok',ok2(val(s.r1),target[0]));field('r2').classList.toggle('liveok',ok2(val(s.r2),target[1]))}};
 const rows=()=>{document.querySelectorAll('[data-row]').forEach(row=>{const j=Number(row.dataset.row);row.classList.toggle('row-ok',!!s.pts[j]);row.classList.toggle('row-current',j===s.selected);row.setAttribute('aria-pressed',String(j===s.selected))});const missing=firstMissing(s);field('pointHint').textContent=missing<0?'Kaikki mittauspisteet on merkitty.':`Merkitse korostetun rivin mittauspari koordinaatistoon (${hits(c,t,s)} / ${t.data.length}).`;if(t.type==='curve')field('makeCurve').disabled=hits(c,t,s)!==t.data.length};
 const position=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
 const accept=(j,p)=>{const q=P(c,t,...t.data[j]);if(Math.hypot(p.x-q[0],p.y-q[1])>18){feedback('Tarkista korostetun rivin arvot, akselit ja asteikot.');return false}s.pts[j]=p;invalidate();update(c,t,s);field('fb').className='feedback';return true};
 c.onpointerdown=e=>{const p=position(e),g=G(c);if(p.x<g.L||p.x>g.R||p.y<g.T||p.y>g.B)return;const near=s.pts.findIndex(q=>q&&Math.hypot(q.x-p.x,q.y-p.y)<=14);if(near>=0){s.selected=near;drag={index:near,old:{...s.pts[near]}};c.setPointerCapture?.(e.pointerId);rows();return}const j=s.selected;if(firstMissing(s)<0&&!s.pts[j])return;if(accept(j,p)){const missing=firstMissing(s);if(missing>=0)s.selected=missing}draw(c,t,s);live();rows()};
 c.onpointermove=e=>{if(!drag)return;s.pts[drag.index]=position(e);draw(c,t,s)};
 c.onpointerup=e=>{if(!drag)return;const d=drag;drag=null;if(!accept(d.index,position(e)))s.pts[d.index]=d.old;update(c,t,s);draw(c,t,s);live();rows()};
 c.onpointercancel=()=>{if(drag){s.pts[drag.index]=drag.old;drag=null;update(c,t,s);draw(c,t,s);rows()}};
 document.querySelectorAll('[data-row]').forEach(row=>{const select=()=>{s.selected=Number(row.dataset.row);rows()};row.onclick=select;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}}});
 if(t.type==='line'){field('tri').onclick=()=>{if(s.fit===null){feedback('Merkitse ensin kaikki mittauspisteet.');return}s.tri=!s.tri;field('tri').textContent=s.tri?'Piilota apukolmio':'Näytä apukolmio';draw(c,t,s)};field('ri').oninput=()=>{s.R=field('ri').value;invalidate();live();field('fb').className='feedback'}}
 else{for(const id of['r1','r2'])field(id).oninput=()=>{s[id]=field(id).value;invalidate();live();field('fb').className='feedback'};field('makeCurve').onclick=()=>{if(hits(c,t,s)!==t.data.length)return;s.curve=smoothCurve(t);draw(c,t,s);field('fb').className='feedback'};field('goConclusions').onclick=()=>{if(s.calcDone){s.view='conclusions';render()}}}
 field('clear').onclick=()=>{s.pts=[];s.curve=[];s.fit=null;s.tri=false;s.selected=0;invalidate();if(t.type==='line')field('tri').textContent='Näytä apukolmio';draw(c,t,s);live();rows();field('fb').className='feedback'};
 field('check').onclick=()=>checkTask(c,t,s);for(const id of(t.type==='line'?['ri']:['r1','r2'])){field(id).autocomplete='off';field(id).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();checkTask(c,t,s)}}}
 update(c,t,s);draw(c,t,s);live();rows();
}
function checkTask(c,t,s){
 const fb=document.getElementById('fb');update(c,t,s);const points=hits(c,t,s)===t.data.length,targets=t.type==='line'?[s.fit]:t.checks.map(z=>z[1]/z[0]),answers=t.type==='line'?[s.R]:[s.r1,s.r2],numbers=targets.every((x,j)=>x!==null&&ok2(val(answers[j]),x)),curve=t.type==='line'||s.curve.length>5;
 s.calcDone=points&&numbers&&curve;if(t.type==='line')s.done=s.calcDone;const button=document.getElementById('goConclusions');if(button)button.disabled=!s.calcDone;fb.className='feedback '+(s.calcDone?'ok':'bad');fb.textContent=s.calcDone?'✓ Kuvaaja ja resistanssit oikein.':!points?'Merkitse kaikki taulukon mittausparit koordinaatistoon.':!curve?'Muodosta käyrä ennen tarkistamista.':'Tarkista resistanssit ja ilmoita vastaukset kahden merkitsevän numeron tarkkuudella.';
}
function conclusionQuestions(t){return[
 {q:'Noudattaako hehkulamppu Ohmin lakia koko tutkitulla alueella?',options:['Ei. Jännitteen ja sähkövirran suhde ei pysy vakiona.','Kyllä. Sähkövirta kasvaa jännitteen kasvaessa.','Kyllä. Resistanssi voidaan laskea kaavalla R = U/I.','Ei. Sähkövirran pitäisi pienentyä jännitteen kasvaessa.']},
 {q:'Mistä tämä nähdään kuvaajassa?',options:['Kuvaaja kaartuu: jännite ja sähkövirta eivät ole suoraan verrannollisia.','Kuvaaja nousee: resistanssi pysyy siis vakiona.','Kuvaaja kulkee origon kautta: resistanssi siis muuttuu.','Kuvaajan lopussa arvot ovat suurempia: tämä osoittaa suoran verrannollisuuden.']},
 {q:'Mikä selittää lampun resistanssin muuttumisen?',options:['Hehkulanka kuumenee, jolloin sen resistanssi kasvaa.','Lampussa kuluu sähkövirtaa, jolloin sen resistanssi kasvaa.','Mittarin mittausalueen vaihtuminen muuttaa lampun resistanssia.','Jännitteen kasvaessa hehkulangan lämpötila pysyy samana ja resistanssi pienenee.']}
]}
function renderConclusions(t,s){
 const questions=conclusionQuestions(t),orders=cur===3?[[1,0,2,3],[2,3,0,1],[0,1,3,2]]:[[2,1,3,0],[0,3,2,1],[3,2,0,1]];
 host.innerHTML=`<section class="task"><div class="conclusion-top"><h2>${t.title}: johtopäätökset</h2><button class="secondary" id="backGraph">← Takaisin kuvaajaan</button></div><div class="conclusion-grid">${questions.map((q,j)=>`<fieldset class="conclusion-question" id="cq${j}"><legend>${j+1}. ${q.q}</legend>${orders[j].map((k,l)=>`<label><input type="radio" name="conclusion${j}" value="${k}" ${s.choices[j]===k?'checked':''}><span><b>${'abcd'[l]}.</b> ${q.options[k]}</span></label>`).join('')}<div class="conclusion-status" id="cqStatus${j}" aria-live="polite"></div></fieldset>`).join('')}</div><div class="conclusion-actions"><button class="check" id="checkConclusions">Tarkista johtopäätökset</button></div><div id="conclusionFeedback" class="feedback" role="status"></div></section>`;
 const mark=()=>{questions.forEach((q,j)=>{document.getElementById('cq'+j).classList.toggle('complete',s.choices[j]===0);document.getElementById('cqStatus'+j).textContent=s.choices[j]===0?'✓ Oikein':''});s.done=questions.every((q,j)=>s.choices[j]===0)};
 questions.forEach((q,j)=>document.querySelectorAll(`[name="conclusion${j}"]`).forEach(input=>{input.onchange=()=>{s.choices[j]=Number(input.value);mark();document.getElementById('conclusionFeedback').className='feedback'}}));
 document.getElementById('backGraph').onclick=()=>{s.view='graph';render()};document.getElementById('checkConclusions').onclick=()=>{mark();const f=document.getElementById('conclusionFeedback');f.className='feedback '+(s.done?'ok':'bad');f.textContent=s.done?'✓ Johtopäätökset oikein.':'Tarkista kohdat '+questions.flatMap((q,j)=>s.choices[j]!==0?[j+1]:[]).join(', ')+'.'};mark();
}
prev.onclick=()=>{if(stage!=='task')return;if(cur===0){stage='experiment'}else{cur--}render()};next.onclick=()=>{if(stage==='task'&&cur<T.length-1){cur++;render()}};
render();
