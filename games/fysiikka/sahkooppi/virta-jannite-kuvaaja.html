function helper(t,m){let a=[];for(let k=3;k<=Math.floor(t.xm/t.dx);k++){let I=k*t.dx,U=m*I;if(U<t.ym*.35||U>t.ym*.86)continue;a.push({I,U,z:Math.abs(U/t.dy-Math.round(U/t.dy))-.15*I/t.xm})}a.sort((x,y)=>x.z-y.z);return a[0]||{I:t.xm*.65,U:m*t.xm*.65}}
function draw(c,t,s){let x=c.getContext("2d"),g=G(c),C=Math.round(t.xm/t.dx),R=Math.round(t.ym/t.dy);x.clearRect(0,0,c.width,c.height);x.fillStyle="#fff";x.fillRect(g.L,g.T,g.R-g.L,g.B-g.T);
x.strokeStyle="#dce3e9";x.lineWidth=.8;for(let k=0;k<=C*5;k++){let q=g.L+k*(g.R-g.L)/(C*5);x.beginPath();x.moveTo(q,g.T);x.lineTo(q,g.B);x.stroke()}for(let k=0;k<=R*5;k++){let q=g.B-k*(g.B-g.T)/(R*5);x.beginPath();x.moveTo(g.L,q);x.lineTo(g.R,q);x.stroke()}
x.strokeStyle="#9eabb6";x.lineWidth=1.3;for(let k=0;k<=C;k++){let q=g.L+k*(g.R-g.L)/C;x.beginPath();x.moveTo(q,g.T);x.lineTo(q,g.B);x.stroke()}for(let k=0;k<=R;k++){let q=g.B-k*(g.B-g.T)/R;x.beginPath();x.moveTo(g.L,q);x.lineTo(g.R,q);x.stroke()}
x.strokeStyle="#17212b";x.lineWidth=2.4;x.beginPath();x.moveTo(g.L,g.T);x.lineTo(g.L,g.B);x.lineTo(g.R,g.B);x.stroke();x.fillStyle="#17212b";x.font="bold 16px system-ui";x.textAlign="center";for(let k=0;k<=C;k++)x.fillText(fmt(k*t.dx),g.L+k*(g.R-g.L)/C,g.B+24);x.textAlign="right";for(let k=0;k<=R;k++)x.fillText(fmt(k*t.dy,1),g.L-12,g.B-k*(g.B-g.T)/R+5);x.font="bold 19px system-ui";x.textAlign="center";x.fillText("I (A)",(g.L+g.R)/2,c.height-13);x.save();x.translate(24,(g.T+g.B)/2);x.rotate(-Math.PI/2);x.fillText("U (V)",0,0);x.restore();
x.fillStyle="#245f9b";s.pts.forEach(p=>{x.beginPath();x.arc(p.x,p.y,5.5,0,7);x.fill()});
if(t.type==="line"&&s.fit!==null){let m=s.fit,e=Math.min(t.xm,t.ym/m),a=P(c,t,0,0),b=P(c,t,e,m*e);x.strokeStyle="#b3261e";x.lineWidth=4;x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke();if(s.tri){let h=helper(t,m),o=P(c,t,0,0),bx=P(c,t,h.I,0),q=P(c,t,h.I,h.U);x.strokeStyle="#2f6f3e";x.lineWidth=3;x.setLineDash([8,5]);x.beginPath();x.moveTo(...o);x.lineTo(...bx);x.lineTo(...q);x.stroke();x.setLineDash([]);x.fillStyle="#183b24";x.font="bold 16px system-ui";x.textAlign="center";x.fillText("ΔI = "+fmt(h.I)+" A",(o[0]+bx[0])/2,o[1]-10);x.save();x.translate(bx[0]+22,(bx[1]+q[1])/2);x.rotate(-Math.PI/2);x.fillText("ΔU = "+fmt(h.U)+" V",0,0);x.restore()}}
if(s.curve.length>1){x.strokeStyle="#b3261e";x.lineWidth=5;x.beginPath();x.moveTo(s.curve[0].x,s.curve[0].y);for(let i=1;i<s.curve.length;i++)x.lineTo(s.curve[i].x,s.curve[i].y);x.stroke()}}
function render(){
 if(cur===-1){
   progress.textContent="Johdanto";
   host.innerHTML=`<section class="intro">
     <h2>Tutustu koejärjestelyihin</h2>
     <p class="introlead">Seuraavissa tehtävissä muodostetaan virta–jännite-kuvaajia näillä koejärjestelyillä saaduista mittaustuloksista.</p>
     <div class="introgrid">
       <div class="introcard">
         <h3>Vastuslangan resistanssin mittaaminen</h3>
         <img src="${WIRE_IMG}" alt="Vastuslangan koejärjestely: virtamittari sarjassa ja jännitemittari vastuslangan rinnalla.">
       </div>
       <div class="introcard">
         <h3>Hehkulampun resistanssin tutkiminen</h3>
         <img src="${LAMP_IMG}" alt="Hehkulampun koejärjestely: virtamittari sarjassa ja jännitemittari lampun rinnalla.">
       </div>
     </div>
     <p class="introhint"><strong>Huomaa:</strong> virtamittari on kytketty sarjaan tutkittavan komponentin kanssa, kun taas jännitemittari on kytketty sen rinnalle. Siirry seuraavaksi mittaustulosten käsittelyyn.</p>
   </section>`;
   prev.disabled=true;
   next.disabled=false;
   next.textContent="Aloita tehtävät →";
   return;
 }
 let t=T[cur],s=S[cur];
 progress.textContent=`Tehtävä ${cur+1} / ${T.length}`;
 let rows=t.data.map(([i,u])=>`<tr><td>${i.toFixed(2).replace(".",",")}</td><td>${u.toFixed(1).replace(".",",")}</td></tr>`).join("");
 let a=t.type==="line"
 ?`<div class="answers"><div class="resrow"><b>Resistanssi:</b><input id="ri" value="${s.R}"><span>Ω</span></div><div class="info">Määritä resistanssi sovitesuoran kulmakertoimesta. Vastaus kahden merkitsevän numeron tarkkuudella.</div></div>`
 :`<div class="answers"><b>Laske lampun resistanssi kahdessa kohdassa.</b><div class="resrow"><span>Kun I = 0,10 A:</span><input id="r1" value="${s.r1}"><span>Ω</span></div><div class="resrow"><span>Kun I = 0,45 A:</span><input id="r2" value="${s.r2}"><span>Ω</span></div><div class="info">Käytä R = U/I. Vastaukset kahden merkitsevän numeron tarkkuudella.</div></div>`;
 host.innerHTML=`<section class="task"><h2>${t.title}</h2><p class="tasklead">${t.desc}</p><div class="layout"><div><table><tr><th>I (A)</th><th>U (V)</th></tr>${rows}</table>${a}</div><div class="graphbox"><canvas id="graph" width="820" height="570"></canvas><div class="tools"><button class="mode active" data-m="points">Merkitse pisteitä</button>${t.type==="curve"?'<button class="mode" data-m="curve">Piirrä käyrä</button>':'<button class="mode" id="tri">Näytä apukolmio</button>'}<button class="clear" id="clear">Tyhjennä piirros</button><button class="check" id="check">Tarkista</button></div><div id="fb" class="feedback"></div></div></div></section>`;
 setup();
 prev.disabled=false;
 next.disabled=cur===T.length-1;
 next.textContent="Seuraava →";
}
function setup(){let t=T[cur],s=S[cur],c=graph;draw(c,t,s);let pos=e=>{let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
c.onpointerdown=e=>{let p=pos(e),g=G(c);if(p.x<g.L||p.x>g.R||p.y<g.T||p.y>g.B)return;if(s.mode==="points"){s.pts.push(p);update(c,t,s)}else{s.drawing=true;s.curve=[p]}draw(c,t,s)};c.onpointermove=e=>{if(!s.drawing||s.mode!=="curve")return;let p=pos(e),l=s.curve.at(-1);if(Math.hypot(p.x-l.x,p.y-l.y)>4){s.curve.push(p);draw(c,t,s)}};c.onpointerup=()=>s.drawing=false;
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{s.mode=b.dataset.m;document.querySelectorAll("[data-m]").forEach(z=>z.classList.toggle("active",z===b))});if(t.type==="line"){tri.onclick=()=>{if(s.fit===null){fb.className="feedback bad";fb.textContent="Merkitse ensin kaikki mittauspisteet.";return}s.tri=!s.tri;tri.textContent=s.tri?"Piilota apukolmio":"Näytä apukolmio";draw(c,t,s)};ri.oninput=()=>{s.R=ri.value;ri.classList.toggle("liveok",s.fit!==null&&ok2(val(s.R),s.fit))}}else{let target=t.checks.map(z=>z[1]/z[0]);let live=()=>{s.r1=r1.value;s.r2=r2.value;r1.classList.toggle("liveok",ok2(val(s.r1),target[0]));r2.classList.toggle("liveok",ok2(val(s.r2),target[1]))};r1.oninput=live;r2.oninput=live;live()}
clear.onclick=()=>{s.pts=[];s.curve=[];s.fit=null;s.tri=false;draw(c,t,s);fb.className="feedback"};check.onclick=()=>checkTask(c,t,s)}
function checkTask(c,t,s){let n=hits(c,t,s);if(t.type==="line"){update(c,t,s);let a=n===t.data.length,b=s.fit!==null&&ok2(val(s.R),s.fit);fb.className="feedback "+(a&&b?"ok":"bad");fb.textContent=a&&b?"Oikein. Mittauspisteet ja resistanssi ovat kunnossa.":(!a?`Pisteistä ${n}/${t.data.length} on riittävän lähellä oikeaa kohtaa. `:"")+"Tarkista resistanssi sovitesuoran kulmakertoimesta ja kahden merkitsevän numeron tarkkuus."}else{let ch=0;if(s.curve.length>5)t.data.forEach(([I,U])=>{let q=P(c,t,I,U),d=Math.min(...s.curve.map(p=>Math.hypot(p.x-q[0],p.y-q[1])));if(d<=28)ch++});let tg=t.checks.map(z=>z[1]/z[0]),good=n>=8&&ch>=7&&ok2(val(s.r1),tg[0])&&ok2(val(s.r2),tg[1]);fb.className="feedback "+(good?"ok":"bad");fb.textContent=good?"Oikein. Kuvaaja kaartuu ja resistanssi muuttuu virran kasvaessa.":"Tarkista mittauspisteet, käyrä sekä molemmat resistanssit kahden merkitsevän numeron tarkkuudella."}}
prev.onclick=()=>{if(cur>=0){cur--;render()}};next.onclick=()=>{if(cur<T.length-1){cur++;render()}};render();
</script></body></html>
