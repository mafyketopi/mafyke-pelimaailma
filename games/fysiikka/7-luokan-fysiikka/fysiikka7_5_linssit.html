const labels=[['Taulukko','Monivalinta','Kuvaaja'],['Laske vaiheittain','Ääni ja aallot','Heilurikoe'],['Yhdistä käsitteet','Varjosimulaatio','Luksimittaus'],['Monivalinta','Mittaa kulmat','Kokonaisheijastuminen'],['Säteiden kulku','Kuvan paikka','Soveltavat tehtävät'],['Monivalinta','Ristikko','Valovuosi']];
let topic=4,part=0,cleanup=()=>{};const $=s=>document.querySelector(s),app=$('#app');function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function fmt(n,d=1){return Number(n).toFixed(d).replace('.',',')}function note(s,bad=false){const e=$('#feedback');if(e)e.innerHTML=`<div class="msg ${bad?'warn':''}">${s}</div>`}function go(t,p=0){cleanup();cleanup=()=>{};topic=4;part=p;render()}function render(){const side=$('#side');side.innerHTML=topics.map((x,i)=>`<button class="${i===topic?'active':''}" data-i="${i}"><span>${String(i+1).padStart(2,'0')}</span>${x[0]}</button>`).join('');side.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));$('#cover').innerHTML=`<div class="kicker">Harjoitus ${topic+1} / 6</div><h2>${topics[topic][0]}</h2><p>${topics[topic][1]}</p>`;$('#parts').innerHTML=labels[topic].map((x,i)=>`<button role="tab" aria-selected="${part===i}" class="${part===i?'active':''}" data-p="${i}">${String.fromCharCode(97+i)}) ${x}</button>`).join('');$('#parts').querySelectorAll('button').forEach(b=>b.onclick=()=>go(topic,+b.dataset.p));[ex1a,ex1b,ex1c,ex2a,ex2b,ex2c,ex3a,ex3b,ex3c,ex4a,ex4b,ex4c,ex5a,ex5b,ex5c,ex6a,ex6b,ex6c][topic*3+part]();}
function heading(title,lead){app.innerHTML=`<h3>${title}</h3><p class="lead">${lead}</p><div id="work"></div><div id="feedback"></div>`;return $('#work')}
function mc(container,items,group){container.innerHTML=items.map((q,i)=>`<div class="task"><span class="num">${i+1}.</span>${q[0]}<div class="opts">${q[1].map((x,j)=>`<label><input type="radio" name="${group}${i}" value="${j}"><span>${x}</span></label>`).join('')}</div></div>`).join('')+`<button class="btn" id="check">Tarkista vastaukset</button>`;container.querySelector('#check').onclick=()=>{let n=0;const missed=[];items.forEach((q,i)=>{const v=container.querySelector(`input[name="${group}${i}"]:checked`);if(v&&+v.value===q[2])n++;else missed.push(i+1)});note(`${n}/${items.length} oikein. ${missed.length?'Tarkista kohdat '+missed.join(', ')+'.':''} ${items.map((q,i)=>missed.includes(i+1)?`<br><b>${i+1}.</b> ${q[3]}`:'').join('')}`,!!missed.length)}}
function ex1a(){const w=heading('Suure, tunnus, yksikkö ja mittaväline','Täydennä puuttuvat kohdat. Kirjoita yksikön tunnus, ei koko nimeä.');const rows=[['pituus','l','m','viivoitin'],['aika','t','s','sekuntikello'],['massa','m','kg','vaaka'],['lämpötila','T','°C','lämpömittari'],['nopeus','v','m/s','nopeusmittari'],['tilavuus','V','m³','mittalasi'],['sähkövirta','I','A','ampeerimittari'],['valaistusvoimakkuus','E','lx','luksimittari'],['taajuus','f','Hz','taajuusmittari']];const missing=[[1,2],[0,3],[1,3],[0,2],[0,2],[1,2],[0,3],[1,2],[0,2]];w.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Suure</th><th>Tunnus</th><th>Yksikkö</th><th>Mittaväline</th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td>${missing[i].includes(j)?`<input class="field" data-r="${i}" data-c="${j}" aria-label="${['Suure','Tunnus','Yksikkö','Mittaväline'][j]}, rivi ${i+1}">`:v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="btn" id="check">Tarkista taulukko</button>`;w.querySelector('#check').onclick=()=>{let n=0;let total=0;w.querySelectorAll('input[data-r]').forEach(x=>{total++;let a=rows[+x.dataset.r][+x.dataset.c].toLocaleLowerCase('fi').replace(/\s/g,'');let b=x.value.trim().toLocaleLowerCase('fi').replace(/\s/g,'');if(a===b||a==='viivoitin'&&b==='mittanauha'||a==='nopeusmittari'&&b==='tutka')n++;x.style.borderColor=(a===b||a==='viivoitin'&&b==='mittanauha'||a==='nopeusmittari'&&b==='tutka')?'#16805e':'#bc7859'});note(`${n}/${total} oikein. Tunnus ja yksikkö ovat eri asioita: esimerkiksi ajan tunnus on <i>t</i> ja yksikkö sekunti (s).`,n<total)}}
const basicMC=[['Mitä fysiikka tutkii?',['Luonnonilmiöitä ja niiden lainalaisuuksia','Vain planeettojen nimiä','Vain eläviä eliöitä','Sanojen alkuperää'],0,'Fysiikka on kokeellinen luonnontiede.'],['Mikä on suure?',['Mittaväline','Mitattava ominaisuus','Mittaajan nimi','Laskun lopputulos'],1,'Pituus, aika ja massa ovat suureita.'],['Mitä mittaustulos 21 °C kertoo?',['Lukuarvo 21 ja yksikkö °C','Lukuarvo °C ja yksikkö 21','Suure 21','Mittaväline 21 °C'],0,'Lukuarvo on 21 ja yksikkö celsiusaste.'],['Mikä näistä on pituuden SI-yksikkö?',['senttimetri','kilometri','metri','millimetri'],2,'Pituuden SI-perusyksikkö on metri.'],['Mikä seuraavista on johdannaissuure?',['pituus','aika','massa','nopeus'],3,'Nopeus muodostuu matkasta ja ajasta.'],['Mikä mittaväline sopii kirjan paksuuden tarkkaan mittaamiseen?',['sekuntikello','työntömitta','lämpömittari','mittalasi'],1,'Työntömitalla voidaan mitata paksuus millimetrin osia myöten.'],['Mitä etuliite milli tarkoittaa?',['tuhatkertaista','sadasosaa','tuhannesosaa','miljoonasosaa'],2,'Milli = 0,001.'],['Mikä vastaa 2,5 metriä?',['25 cm','250 cm','2 500 cm','0,25 cm'],1,'2,5 m = 250 cm.'],['Miksi sama mittaus kannattaa tehdä useamman kerran?',['Jotta yksikkö muuttuisi','Jotta nähdään, kuinka paljon mittaustulokset eroavat toisistaan','Jotta tulos olisi aina suurempi','Jotta mittavälinettä ei tarvita'],1,'Mittaustulos voi vaihdella hieman eri kerroilla. Toistamalla mittaus nähdään, kuinka paljon tulokset eroavat toisistaan.'],['Miten yhden pienen vesipisaran tilavuuden voisi määrittää?',['Punnitsemalla kellon','Mittaamalla usean pisaran yhteistilavuuden ja jakamalla pisaroiden määrällä','Mittaamalla yhden pisaran lämpötilan','Kertomalla mittalasin asteikon sadalla'],1,'Usean pisaran yhteistilavuus on helpompi mitata.'],['Mikä on mittaustuloksen oikea esitystapa?',['12,4','12,4 s','s = 12,4','sekuntikello'],1,'Lukuarvon jälkeen ilmoitetaan yksikkö.'],['Mikä on tilavuuden SI-järjestelmän yksikkö?',['litra','kuutiometri','millilitra','neliömetri'],1,'Tilavuus saadaan kolmesta pituudesta: m³.'],['Miten määrität säännöllisen laatikon tilavuuden?',['pituus + leveys + korkeus','pituus · leveys · korkeus','massa / aika','ympärysmitta · korkeus'],1,'Särmiön tilavuus on sivujen tulo.'],['Mikä on 0,75 kg grammoina?',['7,5 g','75 g','750 g','7 500 g'],2,'1 kg = 1 000 g.'],['Miksi mittauksessa ilmoitetaan yksikkö?',['Se kertoo mitä ja missä mittakaavassa on mitattu','Se muuttaa lukuarvon aina kokonaisluvuksi','Se korvaa kalibroinnin','Se kertoo mittaajan'],0,'Sama lukuarvo tarkoittaa eri asiaa eri yksiköissä.'],['Mikä mittari sopii sähkövirralle?',['ampeerimittari','luksimittari','lämpömittari','sekuntikello'],0,'Sähkövirran yksikkö on ampeeri.'],['Mikä väite mittaustarkkuudesta on perusteltu?',['Tulos on tarkempi kuin pienin asteikkoväli','Tulos ilmoitetaan mittarin tarkkuuden mukaisesti','Mittausvirhe poistuu yhdellä mittauksella','Arvioituja numeroita voi lisätä rajatta'],1,'Mittarin asteikko rajoittaa tarkkuutta.'],['Mikä on nopeuden laskutapa?',['matka / aika','aika / matka','matka · aika','massa / matka'],0,'Nopeus on matka jaettuna ajalla.'],['Mitä kuvaajan vaakasuora osuus matka–aika-kuvaajassa tarkoittaa?',['tasainen vauhti','matka ei muutu','liike kiihtyy','aika pysähtyy'],1,'Aika kuluu, mutta matka pysyy samana.']];function ex1b(){mc(heading('Fysiikan perusteet','Valitse jokaisessa kohdassa yksi vaihtoehto. Kaikki kysymykset näkyvät samalla sivulla.'),basicMC,'f')}
function graphSVG(data,xmax,ymax,xlabel,ylabel){let W=600,H=330,L=64,R=24,T=26,B=54,s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Koordinaatisto"><rect width="${W}" height="${H}" fill="white"/>`;for(let i=0;i<=5;i++){let x=L+i*(W-L-R)/5,y=H-B-i*(H-T-B)/5;s+=`<line class="gridline" x1="${x}" y1="${T}" x2="${x}" y2="${H-B}"/><line class="gridline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text x="${x}" y="${H-B+23}" text-anchor="middle">${fmt(i*xmax/5,1)}</text><text x="${L-10}" y="${y+5}" text-anchor="end">${fmt(i*ymax/5,1)}</text>`}s+=`<line class="axis" x1="${L}" y1="${H-B}" x2="${W-R+3}" y2="${H-B}"/><line class="axis" x1="${L}" y1="${H-B}" x2="${L}" y2="${T-3}"/><text x="${(W+L-R)/2}" y="${H-7}" text-anchor="middle">${xlabel}</text><text x="${L}" y="18">${ylabel}</text>`;if(data?.length)s+=`<path class="plotline" d="${data.map((p,i)=>`${i?'L':'M'}${L+p[0]/xmax*(W-L-R)} ${H-B-p[1]/ymax*(H-T-B)}`).join(' ')}"/>${data.map(p=>`<circle cx="${L+p[0]/xmax*(W-L-R)}" cy="${H-B-p[1]/ymax*(H-T-B)}" r="5" class="point"/>`).join('')}`;return s+`</svg>`}
function ex1c(){let w=heading('Lue kuvaajaa','Kuvaaja esittää koulumatkan aikana kuljettua matkaa. Lue yksittäisiä arvoja, vertaile osuuksia ja laske keskinopeus.');w.innerHTML=`<div class="figure">${graphSVG([[0,0],[2,0.4],[4,0.8],[6,0.8],[8,1.3],[10,1.8]],10,2,'aika (min)','matka (km)')}</div><div class="task">a) Kuinka monta kilometriä oli kuljettu neljässä minuutissa? <input class="field small" id="g1" inputmode="decimal"> km</div><div class="task">b) Millä aikavälillä matka ei kasvanut? <input class="field small" id="g2" inputmode="numeric" placeholder="alku">–<input class="field small" id="g3" inputmode="numeric" placeholder="loppu"> min</div><div class="task">c) Kuinka pitkä matka kuljettiin aikavälillä 6–10 min? <input class="field small" id="g5" inputmode="decimal"> km</div><div class="task">d) Kuinka suuri oli keskinopeus koko 10 minuutin matkalla kilometreinä tunnissa? <input class="field small" id="g4" inputmode="decimal"> km/h</div><div class="task">e) Millä osuudella vauhti oli suurin? <select class="field" id="g6"><option value="">Valitse</option><option value="0">0–4 min</option><option value="1">4–6 min</option><option value="2">6–10 min</option></select></div><button class="btn" id="check">Tarkista päätelmät</button>`;w.querySelector('#check').onclick=()=>{const v=id=>Number($(id).value.replace(',','.'));let ok=[Math.abs(v('#g1')-.8)<.02,v('#g2')===4&&v('#g3')===6,Math.abs(v('#g5')-1)<.02,Math.abs(v('#g4')-10.8)<.1,$('#g6').value==='2'];note(`${ok.filter(Boolean).length}/5 oikein. Ajanhetkellä 4 min matka on 0,8 km. Pysähdys kestää 4–6 min. Viimeisellä osuudella kertyy 1,8 − 0,8 = 1,0 km neljässä minuutissa, joten sen kuvaaja on jyrkin. Koko matkan keskinopeus on 1,8 km ÷ (10/60 h) = 10,8 km/h.`,!ok.every(Boolean))}}
function ex2a(){let w=heading('Värähdysaika ja taajuus','Mittasit värähtelevän viivoittimen: 24 täyttä värähdystä kesti 6,0 s. Näytä laskulausekkeet ja tulokset. Sovella sitten tulosta uuteen havaintoon.');w.innerHTML=`<div class="formula"><math display="block"><mi>T</mi><mo>=</mo><mfrac><mi>t</mi><mi>N</mi></mfrac><mspace width="1em"/><mi>f</mi><mo>=</mo><mfrac><mi>N</mi><mi>t</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>T</mi></mfrac></math><small>T = yhden värähdyksen aika, f = taajuus, N = lukumäärä, t = kokonaisaika</small></div><div class="step"><b>1. Yhden värähdyksen aika</b><p>Kirjoita laskulauseke kokonaisaika / lukumäärä: <input class="field medium" id="e1" placeholder="6/24"></p><p>T = <input class="field small" id="e2" inputmode="decimal"> s</p></div><div class="step"><b>2. Taajuus</b><p>Kirjoita laskulauseke lukumäärä / kokonaisaika: <input class="field medium" id="e3" placeholder="24/6"></p><p>f = <input class="field small" id="e4" inputmode="decimal"> Hz</p></div><div class="step"><b>3. Sovella</b><p>Toinen viivoitin värähtelee taajuudella 2,5 Hz. Kuinka monta täyttä värähdystä se tekee 8 sekunnissa? <input class="field small" id="e5" inputmode="numeric"> kpl</p><p>Mikä on sen värähdysaika? <input class="field small" id="e6" inputmode="decimal"> s</p></div><button class="btn" id="check">Tarkista välivaiheet</button>`;w.querySelector('#check').onclick=()=>{const expr=(id,a,b)=>{let m=$(id).value.replace(',','.').replace(/\s/g,'').match(/^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);return !!m&&+m[1]===a&&+m[2]===b};const val=id=>Number($(id).value.replace(',','.'));let ok=[expr('#e1',6,24),Math.abs(val('#e2')-.25)<.01,expr('#e3',24,6),Math.abs(val('#e4')-4)<.01,val('#e5')===20,Math.abs(val('#e6')-.4)<.01];note(`${ok.filter(Boolean).length}/6 oikein. T = 6,0 s / 24 = 0,25 s ja f = 24 / 6,0 s = 4 Hz. Toisessa tilanteessa N = f · t = 2,5 Hz · 8 s = 20 ja T = 1 / 2,5 Hz = 0,4 s.`,!ok.every(Boolean))}}
const soundMC=[['Ääni syntyy, kun…',['esine värähtelee','valo heijastuu','esine ei liiku','lämpötila on nolla'],0,'Värähtelevä kappale saa ympäröivän aineen värähtelemään.'],['Ääni ei voi edetä…',['vedessä','teräksessä','tyhjiössä','ilmassa'],2,'Ääni tarvitsee väliaineen.'],['Mikä määrää äänen korkeuden?',['taajuus','intensiteettitaso','etäisyys yksinään','ilman väri'],0,'Suurempi taajuus merkitsee korkeampaa ääntä.'],['Äänen voimakkuustaso ilmoitetaan…',['hertseinä','desibeleinä','metreinä','sekunteina'],1,'Voimakkuustason yksikkö on desibeli (dB).'],['Mikä on ultraääntä?',['alle 20 Hz','yli 20 000 Hz','kaikki yli 20 dB:n äänet','kuultava puhe'],1,'Ultraäänen taajuus on yli 20 kHz.'],['Miten ääni etenee ilmassa?',['pitkittäisenä aaltona','poikittaisena valona','pelkkänä ainevirtana','tyhjiön läpi'],0,'Ilmahiukkaset värähtelevät etenemissuunnassa.'],['Mikä on värähdysajan yksikkö?',['hertsi','sekunti','desibeli','metri'],1,'Värähdysaika on yhden värähdyksen kesto.'],['Mitä 5 Hz tarkoittaa?',['viisi sekuntia yhdessä värähdyksessä','viisi värähdystä sekunnissa','viisi metriä sekunnissa','viisi desibeliä'],1,'Hertsi on värähdystä sekunnissa.'],['Mikä muuttuu, kun kitarankieltä kiristetään ja ääni kohoaa?',['värähtelyn taajuus kasvaa','äänen nopeus tyhjiössä kasvaa','ilma muuttuu nesteeksi','aallonpituus kasvaa samassa väliaineessa'],0,'Kiristetty kieli värähtelee nopeammin.'],['Millainen aalto etenee kitarankielessä sivusuunnassa?',['poikittainen','pitkittäinen','sähkövirta','ei mikään aalto'],0,'Kieli värähtelee etenemissuuntaa vastaan kohtisuoraan.'],['Mikä suojaa kuuloa pitkässä melualtistuksessa?',['korvatulpat','lähemmäksi kaiutinta siirtyminen','äänen taajuuden nostaminen','kämmenen heiluttaminen'],0,'Kuulosuojain vähentää korvaan tulevaa ääntä.'],['Mitä äänen kaiku osoittaa?',['ääni heijastuu pinnasta','ääni kulkee tyhjiössä','valo muuttuu ääneksi','ääni ei etene ilmassa'],0,'Kaiku on pinnasta takaisin tullut ääni.'],['Ukkosen välähdys näkyy ennen jyrähdystä. Miksi?',['valo etenee ilmaa pitkin ääntä nopeammin','ääni syntyy minuuttia myöhemmin','valo tarvitsee enemmän väliaineita','ukkonen on äänetön'],0,'Valo saapuu lähes heti; ääni kulkee ilmassa hitaammin.'],['Kun värähdysaika kaksinkertaistuu, taajuus…',['kaksinkertaistuu','puolittuu','pysyy samana','nelinkertaistuu'],1,'Taajuus ja värähdysaika ovat käänteislukuja.']];function ex2b(){let w=heading('Ääni ja aallonpituus','Valitse vastaukset. Lopuksi lue aaltokuvasta peräkkäisten harjanteiden välinen etäisyys.');let box=document.createElement('div');w.append(box);mc(box,soundMC,'sound');let extra=document.createElement('div');extra.innerHTML=`<div class="task"><b>Aallonpituus kuvasta</b><div class="figure"><svg viewBox="0 0 600 180" role="img" aria-label="Aalto ja senttimetriasteikko. Harjanteet kohdissa 10, 50 ja 90 cm."><path d="M40 80 Q90 -5 140 80 T240 80 T340 80 T440 80 T540 80" fill="none" stroke="#1b2420" stroke-width="2.5"/><line x1="40" y1="130" x2="540" y2="130" stroke="#333"/>${[0,20,40,60,80,100].map((n,i)=>`<line x1="${40+i*100}" y1="125" x2="${40+i*100}" y2="135" stroke="#333"/><text x="${40+i*100}" y="155" text-anchor="middle">${n}</text>`).join('')}<text x="565" y="155">cm</text></svg></div>Kuinka monta senttimetriä on aallonpituus? <input class="field small" id="waveanswer" inputmode="decimal"> cm <button class="btn secondary" id="wavecheck">Tarkista</button></div>`;w.append(extra);extra.querySelector('#wavecheck').onclick=()=>{const good=+$('#waveanswer').value.replace(',','.')===40;note(good?'Oikein. Peräkkäiset harjat ovat kohdissa 10 cm ja 50 cm, joten aallonpituus on 40 cm.':'Katso kahden vierekkäisen harjan etäisyys asteikolta. Harjat ovat kohdissa 10 cm ja 50 cm.',!good)}}
function measurementPlot(root,opts){const {xs,xmax,ymax,xlabel,ylabel,tolerance}=opts;let marks=[],revealed=null;function draw(){root.innerHTML=`<svg class="graph" viewBox="0 0 600 330" role="img" aria-label="Koordinaatisto, johon merkitään mittauspisteet">${graphSVG(revealed,xmax,ymax,xlabel,ylabel).replace(/^<svg[^>]*>|<\/svg>$/g,'')}${marks.map(p=>`<circle cx="${64+p[0]/xmax*512}" cy="${276-p[1]/ymax*250}" r="5" fill="#a65932"/>`).join('')}<rect x="64" y="26" width="512" height="250" fill="transparent" style="cursor:crosshair"/></svg><p class="micro">Napsauta koordinaatistoon piste kutakin mittausta varten. Oranssit pisteet ovat omiasi. <button class="btn secondary" id="undoMark" type="button">Kumoa viimeinen piste</button></p>`;root.querySelector('#undoMark').onclick=()=>{if(!revealed){marks.pop();draw()}};root.querySelector('svg').onclick=e=>{if(revealed)return;const svg=root.querySelector('svg'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const pos=pt.matrixTransform(svg.getScreenCTM().inverse()),x=pos.x,y=pos.y;if(x<64||x>576||y<26||y>276)return;marks.push([+((x-64)/512*xmax).toFixed(2),+((276-y)/250*ymax).toFixed(2)]);draw()}}draw();return{reveal(measured){revealed=xs.map((x,i)=>[x,measured[i]]);draw();return xs.filter((x,i)=>marks.some(p=>Math.abs(p[0]-x)<=tolerance[0]&&Math.abs(p[1]-measured[i])<=tolerance[1])).length},count(){return marks.length},clear(){marks=[];revealed=null;draw()}}}
function ex2c(){let w=heading('Heilurikoe','Muuta langan pituutta. Käynnistä heiluri ja sekuntikello yhdessä, laske kymmenen täyttä heilahdusta ja pysäytä. Jaa mittaamasi aika kymmenellä.');let lengths=[.30,.50,.70,.90],times=lengths.map(l=>2*Math.PI*Math.sqrt(l/9.81)),values=Array(4).fill(null);let running=false,start=0,elapsed=0,raf=0,current=0,plot;w.innerHTML=`<div class="controls"><label>Langan pituus <select class="field" id="length">${lengths.map((v,i)=>`<option value="${i}">${fmt(v,2)} m</option>`).join('')}</select></label><button class="btn" id="start">Käynnistä heiluri ja kello</button><button class="btn secondary" id="stop" disabled>Pysäytä</button><span class="readout mono" id="clock">0,00 s</span><span class="readout mono" id="cycles" aria-label="Täysien värähdysten määrä">0 / 10</span></div><div class="figure sim"><svg viewBox="0 0 620 310" role="img" aria-label="Heiluri ja langan pituusasteikko"><rect x="70" y="20" width="480" height="9" fill="#4f5b54"/><circle cx="310" cy="36" r="6" fill="#303934"/><line id="string" x1="310" y1="36" x2="310" y2="180" stroke="#2d3732" stroke-width="2"/><circle id="bob" cx="310" cy="180" r="16" fill="#526b61" stroke="#1c2b24" stroke-width="2"/><line x1="540" y1="35" x2="540" y2="263" stroke="#313b34"/>${[0,.3,.5,.7,.9].map((v,i)=>`<line x1="533" y1="${35+v*220}" x2="548" y2="${35+v*220}" stroke="#313b34"/><text x="552" y="${40+v*220}">${fmt(v,1)} m</text>`).join('')}<text x="35" y="290">Laske täysi edestakainen heilahdus, kun pallo palaa samaan ääriasentoon.</text></svg></div><div class="table-wrap"><table><tr><th>Pituus l (m)</th><th>10 heilahduksen aika (s)</th><th>Värähdysaika T (s)</th><th>Kirjaa mittaus</th></tr>${lengths.map((l,i)=>`<tr><td>${fmt(l,2)}</td><td><input class="field small" id="ten${i}" inputmode="decimal" placeholder="mittaa" readonly></td><td><input class="field small" id="per${i}" inputmode="decimal" placeholder="laske"></td><td><button class="btn secondary record" data-i="${i}">Merkitse</button></td></tr>`).join('')}</table></div><div class="figure" id="plot"></div><button class="btn" id="showgraph">Näytä kuvaaja ja tarkista pisteet</button>`;plot=measurementPlot($('#plot'),{xs:lengths,ys:times,xmax:1,ymax:2.2,xlabel:'langan pituus l (m)',ylabel:'värähdysaika T (s)',tolerance:[.055,.18]});function frame(now){if(!running)return;elapsed=(now-start)/1000;let T=times[current],angle=.36*Math.cos(2*Math.PI*elapsed/T),len=65+lengths[current]*200,x=310+len*Math.sin(angle),y=36+len*Math.cos(angle);$('#string').setAttribute('x2',x);$('#string').setAttribute('y2',y);$('#bob').setAttribute('cx',x);$('#bob').setAttribute('cy',y);$('#clock').textContent=fmt(elapsed,2)+' s';$('#cycles').textContent=Math.floor(elapsed/T)+' / 10';raf=requestAnimationFrame(frame)}$('#length').onchange=e=>{if(running)$('#stop').click();current=+e.target.value;let len=65+lengths[current]*200;$('#string').setAttribute('y2',36+len);$('#bob').setAttribute('cy',36+len)};$('#start').onclick=()=>{if(running)return;current=+$('#length').value;running=true;elapsed=0;$('#cycles').textContent='0 / 10';$('#clock').textContent='0,00 s';start=performance.now();$('#start').disabled=true;$('#stop').disabled=false;raf=requestAnimationFrame(frame)};$('#stop').onclick=()=>{if(!running)return;running=false;cancelAnimationFrame(raf);$('#start').disabled=false;$('#stop').disabled=true;let count=Math.floor(elapsed/times[current]);if(count===10){$('#ten'+current).value=fmt(elapsed,2);note(`Mittaustulos ${fmt(elapsed,2)} s kirjautui pituudelle ${fmt(lengths[current],2)} m. Laske yhden värähdyksen aika jakamalla kymmenellä.`)}else note(`Pysäytit kellon ${count} täyden värähdyksen jälkeen. Mittaa uudelleen ja pysäytä kymmenennen kohdalla.`,true)};w.querySelectorAll('.record').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,a=+$('#ten'+i).value.replace(',','.'),v=+$('#per'+i).value.replace(',','.');if(!a||!v){note('Täytä ensin molemmat lukuarvot.',true);return}if(Math.abs(a/10-v)>.08){note('Tarkista jakolasku: yhden värähdyksen aika saadaan jakamalla kymmenen heilahduksen aika kymmenellä.',true);return}values[i]=v;note(`Pituuden ${fmt(lengths[i],2)} m mittaus kirjattu. Merkitse vielä piste koordinaatistoon.`)});$('#showgraph').onclick=()=>{if(values.some(x=>x===null)||plot.count()<4){note('Kirjaa ensin neljä mittausta ja merkitse neljä pistettä koordinaatistoon.',true);return}let n=plot.reveal(values);note(`Kirjattu ${values.filter(x=>x!==null).length}/4 mittausta ja ${n}/4 pistettä osui mittaustulosten lähelle. Pidemmällä langalla värähdysaika kasvaa. Musta kuvaaja muodostuu kirjaamistasi värähdysajoista.`)};cleanup=()=>{running=false;cancelAnimationFrame(raf)}}
const concepts=[['valonlähde','Kappale, joka lähettää itse valoa'],['varjo','Alue, johon valonlähteen valo ei pääse suoraan'],['spektri','Valon värijakauma'],['pinnan normaali','Pintaa vastaan kohtisuora apusuora'],['valonsäde','Valon kulkusuuntaa kuvaava malli'],['valaistusvoimakkuus','Pinnalle tulevan valon määrää kuvaava suure'],['sydänvarjo','Alue, johon laajasta lähteestä ei tule lainkaan suoraa valoa'],['puolivarjo','Alue, jonne pääsee valo vain osasta laajaa lähdettä'],['heijastuminen','Valon suunnan muutos, kun säde palaa rajapinnasta'],['taittuminen','Valon suunnan muutos aineiden rajapinnassa'],['tulokulma','Tulevan säteen ja pinnan normaalin välinen kulma'],['polttopiste','Piste, johon akselin suuntaiset säteet kokoontuvat kuperan linssin jälkeen'],['luksi','Valaistusvoimakkuuden yksikkö'],['kokonaisheijastuminen','Valo palautuu kokonaan rajapinnasta lähtöaineeseen'],['näennäinen kuva','Kuva, jota ei saada tarkkana varjostimelle']];function ex3a(){let w=heading('Yhdistä käsite ja selitys','Valitse jokaisen käsitteen kohdalle sitä vastaava selitys.');let opts=concepts.map((x,i)=>({i,t:x[1]})).sort((a,b)=>a.t.localeCompare(b.t,'fi'));w.innerHTML=`<div class="table-wrap"><table><tr><th>Käsite</th><th>Selitys</th></tr>${concepts.map((x,i)=>`<tr><td>${x[0]}</td><td><select class="field wide" data-i="${i}"><option value="">Valitse selitys</option>${opts.map(o=>`<option value="${o.i}">${o.t}</option>`).join('')}</select></td></tr>`).join('')}</table></div><button class="btn" id="check">Tarkista</button>`;$('#check').onclick=()=>{let n=[...w.querySelectorAll('select')].filter(s=>+s.value===+s.dataset.i&&s.value!=='').length;note(`${n}/${concepts.length} oikein. ${n<concepts.length?'Vertaa erityisesti varjon, valonlähteen ja valonsäteen määritelmiä.':'Kaikki käsitteet ovat oikein.'}`,n<concepts.length)}}
function ex3b(){let w=heading('Sydänvarjo ja puolivarjo','Siirrä estettä ja muuta valonlähteen kokoa. Vertaa varjostimelle muodostuvaa tummaa sydänvarjoa ja vaaleampaa puolivarjoa.');w.innerHTML=`<div class="controls"><label>Esteen etäisyys lähteestä <input type="range" id="obstacle" min="1.2" max="3.6" step="0.1" value="2.1"><b id="dread">2,1 m</b></label><label>Valonlähteen korkeus <input type="range" id="source" min="0" max="0.8" step="0.05" value="0.4"><b id="sread">0,4 m</b></label></div><div class="figure sim"><svg viewBox="0 0 700 380" id="shadow" role="img" aria-label="Laaja valonlähde, este ja varjostin; sydän- ja puolivarjon rajat"></svg></div><p>Varjostin on 4,5 metrin päässä valonlähteestä. Esteen korkeus on 0,5 m.</p><div class="task">a) Muodostuuko sydänvarjo, kun este on 2,1 m:n päässä ja lähteen korkeus 0,4 m? <select class="field" id="shadowa"><option value="">Valitse</option><option>Kyllä</option><option>Ei</option></select></div><div class="task">b) Mitä puolivarjon leveydelle tapahtuu, kun lähteen kokoa kasvatetaan? <select class="field" id="shadowb"><option value="">Valitse</option><option>Kasvaa</option><option>Pienenee</option><option>Ei muutu</option></select></div><button class="btn" id="check">Tarkista päätelmät</button>`;function draw(){const d=+$('#obstacle').value,s=+$('#source').value,o=.25,D=4.5,outer=o*D/d+s/2*(D-d)/d,inner=Math.max(0,o*D/d-s/2*(D-d)/d),sx=65,ox=sx+d/D*565,screen=630,Y=190,scale=125;$('#dread').textContent=fmt(d,1)+' m';$('#sread').textContent=fmt(s,2)+' m';let a=Y-outer*scale,b=Y-inner*scale,c=Y+inner*scale,z=Y+outer*scale;$('#shadow').innerHTML=`<defs><pattern id="shade" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 5L5 0" stroke="#c7cbc6" stroke-width=".5"/></pattern></defs><rect width="700" height="380" fill="#fff"/><path d="M${sx} ${Y-s/2*scale}L${screen} ${a}L${screen} ${z}L${sx} ${Y+s/2*scale}Z" fill="#f4f4f2"/><path d="M${ox} ${Y-o*scale}L${screen} ${a}L${screen} ${z}L${ox} ${Y+o*scale}Z" fill function opticsScene(kind,angle=35,chosen=null){let cx=330,cy=180,rad=145,deg=a=>a*Math.PI/180, incoming={x:cx-rad*Math.sin(deg(angle)),y:cy-rad*Math.cos(deg(angle))},reflection={x:cx+rad*Math.sin(deg(angle)),y:cy-rad*Math.cos(deg(angle))},rangle=kind==='airglass'?Math.asin(Math.sin(deg(angle))/1.5)*180/Math.PI:kind==='glassair'?Math.asin(Math.min(.999,1.5*Math.sin(deg(angle))))*180/Math.PI:angle,trans={x:cx+rad*Math.sin(deg(rangle)),y:cy+rad*Math.cos(deg(rangle))};let upper=kind==='glassair'?'lasi':'ilma',lower=kind==='glassair'?'ilma':'lasi';let targets=kind==='mirror'?[reflection,{x:cx-rad*Math.sin(deg(angle)),y:cy+rad*Math.cos(deg(angle))},{x:cx+rad*Math.cos(deg(angle)),y:cy-rad*Math.sin(deg(angle))}]:[trans,reflection,{x:cx-rad*Math.sin(deg(rangle)),y:cy+rad*Math.cos(deg(rangle))}];let base=`<svg viewBox="0 0 700 380" role="img" aria-label="Säteen täydentämistehtävä"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#1b2420"/></marker></defs>${kind==='mirror'?`<path d="M105 ${cy}H560" stroke="#242b26" stroke-width="5"/>${Array.from({length:12},(_,i)=>`<path d="M${115+i*36} ${cy+3}l-13 14" stroke="#777"/>`).join('')}`:`<rect x="70" y="${cy}" width="540" height="175" fill="#f0f1ef"/><path d="M70 ${cy}H610" stroke="#343c36" stroke-width="2"/><text x="85" y="48">${upper}</text><text x="85" y="310">${lower}</text>`}<path d="M${cx} 25V355" class="dash"/><text x="${cx+12}" y="37">normaali</text><path d="M${incoming.x} ${incoming.y}L${cx} ${cy}" class="ray" marker-end="url(#arr)"/><text x="${incoming.x-30}" y="${incoming.y-15}">tuleva säde</text><circle cx="${cx}" cy="${cy}" r="4" fill="#202920"/>${chosen!==null?`<path d="M${cx} ${cy}L${chosen.x} ${chosen.y}" class="ray" marker-end="url(#arr)"/>`:''}<text x="${cx-33}" y="${cy-36}">${angle}°</text></svg>`;return{base,target:targets[0]}}
function rayTask(w,scenes){let index=0,correct=0;function draw(){const s=scenes[index],geo=opticsScene(s.kind,s.angle);w.innerHTML=`<div class="task"><b>${index+1}/${scenes.length}. ${s.prompt}</b><p class="muted">Piirrä puuttuva säde: napsauta tai kosketa kuvassa kohtaa, johon säteen tulisi jatkua rajapinnasta.</p><div class="figure" id="rayfig">${geo.base}</div><div id="local"></div></div>`;const svg=w.querySelector('#rayfig svg');svg.style.cursor='crosshair';svg.onclick=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const pos=pt.matrixTransform(svg.getScreenCTM().inverse()),x=pos.x,y=pos.y,dx=x-330,dy=y-180,tx=geo.target.x-330,ty=geo.target.y-180;if(Math.hypot(dx,dy)<45)return;const angle=Math.acos(Math.max(-1,Math.min(1,(dx*tx+dy*ty)/(Math.hypot(dx,dy)*Math.hypot(tx,ty)))))*180/Math.PI,good=angle<=10;correct+=good?1:0;svg.onclick=null;$('#rayfig').innerHTML=opticsScene(s.kind,s.angle,{x,y}).base;$('#local').innerHTML=`<div class="msg ${good?'':'warn'}">${good?'Säde piirretty oikeaan suuntaan. ':'Säteen suunta ei vielä vastaa tilannetta. '}${s.why}</div><button class="btn" id="next">${index+1===scenes.length?'Näytä yhteenveto':'Seuraava kuva'}</button>`;$('#next').onclick=()=>{index++;if(index<scenes.length)draw();else w.innerHTML=`<h4>${correct}/${scenes.length} säteen suuntaa oikein</h4><p>Voit tehdä tämän osan uudestaan valitsemalla osion yläpuolelta.</p>`}}}draw()}

function ex5a(){let w=heading('Jatka linssiin tuleva säde','Tarkastele linssiä ja polttopisteitä. Piirrä puuttuva säde napsauttamalla kuvassa kohtaa, johon se kulkee linssin jälkeen.');let cases=[{kind:'convex',title:'Kupera linssi: pääakselin suuntainen säde',why:'Kupera linssi kokoaa pääakselin suuntaisen säteen toisella puolella olevaan polttopisteeseen.',target:[470,170]},{kind:'concave',title:'Kovera linssi: pääakselin suuntainen säde',why:'Kovera linssi hajottaa säteen. Sen taaksepäin piirretty jatke kulkisi tulopuolen valepolttopisteen kautta.',target:[540,18]},{kind:'center',title:'Kupera linssi: keskipisteen kautta kulkeva säde',why:'Ohuen linssin mallissa keskipisteen kautta tuleva säde jatkaa suoraan.',target:[560,270]}];let index=0,score=0;function base(c,chosen){let incoming=c.kind==='center'?'M120 70L340 170':'M85 110L340 110',lens=c.kind==='concave'?'M325 30Q355 170 325 310M355 30Q325 170 355 310':'M340 30Q310 170 340 310M340 30Q370 170 340 310';let start=c.kind==='center'?[340,170]:[340,110];return `<svg viewBox="0 0 700 340" role="img" aria-label="Linssi ja valonsäde"><path d="M35 170H665" class="axis"/><path d="${lens}" fill="none" stroke="#26332c" stroke-width="2.5"/><circle cx="210" cy="170" r="4"/><circle cx="470" cy="170" r="4"/><text x="205" y="193">F</text><text x="465" y="193">F</text><path d="${incoming}" class="ray"/>${chosen?`<path d="M${start[0]} ${start[1]}L${chosen[0]} ${chosen[1]}" class="ray"/>`:''}<text x="85" y="45">tuleva säde</text><text x="520" y="202">pääakseli</text></svg>`}function draw(){let c=cases[index];w.innerHTML=`<div class="task"><b>${index+1}/3. ${c.title}</b><p class="muted">Piirrä säde osoittamalla sen suuntaa linssin oikealla puolella.</p><div class="figure" id="lensray">${base(c)}</div><div id="local"></div></div>`;const svg=w.querySelector('#lensray svg');svg.style.cursor='crosshair';svg.onclick=e=>{let pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let pos=pt.matrixTransform(svg.getScreenCTM().inverse()),x=pos.x,y=pos.y,start=c.kind==='center'?[340,170]:[340,110],dx=x-start[0],dy=y-start[1],tx=c.target[0]-start[0],ty=c.target[1]-start[1];if(x<385||Math.hypot(dx,dy)<60)return;let error=Math.acos(Math.max(-1,Math.min(1,(dx*tx+dy*ty)/(Math.hypot(dx,dy)*Math.hypot(tx,ty)))))*180/Math.PI,good=error<=10;score+=good?1:0;svg.onclick=null;$('#lensray').innerHTML=base(c,[x,y]);$('#local').innerHTML=`<div class="msg ${good?'':'warn'}">${good?'Säteen suunta on oikein. ':'Säde ei kulje oikeaan suuntaan. '}${c.why}</div><button class="btn" id="next">${index===2?'Näytä tulos':'Seuraava kuva'}</button>`;$('#next').onclick=()=>{index++;index<cases.length?draw():w.innerHTML=`<h4>${score}/3 säteen suuntaa oikein</h4><p>Voit tehdä osion uudestaan välilehdestä.</p>`}}}draw()}

function expression(s){
 s=String(s).replace(/\s/g,'').replace(/,/g,'.').replace(/[·×]/g,'*').replace(/[÷:]/g,'/').replace(/−/g,'-');
 if(!s||!/^[\d.eE+*/^()\-]+$/.test(s))return NaN;
 let tokens=s.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?|[+*/^()\-]/g),i=0;
 if(!tokens||tokens.join('')!==s)return NaN;
 function primary(){let t=tokens[i++];if(t==='('){let v=sum();if(tokens[i++]!==')')throw 0;return v;}if(t==='-')return -primary();if(t==='+')return primary();let v=Number(t);if(!Number.isFinite(v))throw 0;return v;}
 function power(){let v=primary();if(tokens[i]==='^'){i++;v=v**power();}return v;}
 function product(){let v=power();while(tokens[i]==='*'||tokens[i]==='/'){let op=tokens[i++],r=power();v=op==='*'?v*r:v/r;}return v;}
 function sum(){let v=product();while(tokens[i]==='+'||tokens[i]==='-'){let op=tokens[i++],r=product();v=op==='+'?v+r:v-r;}return v;}
 try{let v=sum();return i===tokens.length&&Number.isFinite(v)?v:NaN;}catch{return NaN;}
}
function closeNumber(a,b,tol=.01){return Number.isFinite(a)&&Math.abs(a-b)<=tol;}
function calculated(s,answer,tol=.01){return /[*/÷:×·]/.test(s)&&closeNumber(expression(s),answer,tol);}
function fig(id,alt,caption=''){return `<figure class="precision"><img src="${scienceAssets[id]}" alt="${esc(alt)}"><figcaption>${caption}</figcaption></figure>`;}
function formula(id,caption=''){return `<div class="latex-formula"><img src="${scienceAssets[id]}" alt="${esc(caption)}">${caption?`<p>${caption}</p>`:''}</div>`;}
function inputsFor(items,prefix){return items.map((q,i)=>`<div class="task"><label for="${prefix}${i}"><span class="num">${String.fromCharCode(97+i)})</span>${q.q}</label> ${q.options?`<select class="field" id="${prefix}${i}"><option value="">Valitse</option>${q.options.map(v=>`<option>${esc(v)}</option>`).join('')}</select>`:`<input class="field ${q.expr?'medium':'small'}" id="${prefix}${i}" ${q.expr?'':'inputmode="decimal"'} autocomplete="off">`} ${q.unit||''}<div class="item-feedback" id="${prefix}f${i}"></div></div>`).join('');}
function checkItems(items,prefix){let count=0;items.forEach((q,i)=>{let value=$('#'+prefix+i).value.trim(),good=q.options?value===q.answer:q.expr?calculated(value,q.answer,q.tol||.01):value!==''&&closeNumber(expression(value),q.answer,q.tol||.01);count+=good;$('#'+prefix+i).setAttribute('aria-invalid',String(!good));$('#'+prefix+'f'+i).innerHTML=`<div class="msg ${good?'':'warn'}">${good?'Oikein.':'Tarkista vielä.'} ${q.why}</div>`;});note(`${count}/${items.length} oikein.`,count<items.length);}
