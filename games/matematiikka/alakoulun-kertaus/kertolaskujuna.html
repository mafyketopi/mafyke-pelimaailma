<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kertolaskujuna</title>
  <style>
    :root{--ink:#17324d;--cream:#fffaf0;--red:#c8423b;--green:#46a85a;--gold:#efb94c}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);background:#dff3ff}body{overflow-x:hidden}
    .game{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(#cceeff 0 54%,#9ed77d 54% 73%,#70b759 73%)}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,4vw,46px);background:rgba(255,250,240,.94);border-bottom:3px solid #e7c98e;box-shadow:0 3px 12px #17324d20;z-index:10}
    h1{font-family:Georgia,serif;font-size:clamp(1.5rem,3.4vw,2.65rem);margin:0;letter-spacing:.02em}.subtitle{margin:2px 0 0;color:#536779;font-size:.9rem}
    .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}label{font-weight:800}.table-select{font:inherit;font-weight:800;font-size:1.05rem;color:var(--ink);background:white;border:2px solid #b48a43;border-radius:10px;padding:7px 34px 7px 12px;cursor:pointer}
    button{font:inherit;font-weight:900;border:0;border-radius:11px;padding:10px 17px;cursor:pointer;box-shadow:0 4px 0 #74201d;transition:transform .12s,filter .12s;background:var(--red);color:#fff}button:hover{filter:brightness(1.08)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #74201d}button.secondary{background:#fff;color:var(--ink);border:2px solid #9db1bf;box-shadow:0 3px 0 #70838f;padding:8px 14px}
    .scene{position:relative;min-height:620px;overflow:hidden}.sun{position:absolute;right:7%;top:34px;width:74px;height:74px;border-radius:50%;background:#ffd763;box-shadow:0 0 0 12px #ffd76338}.cloud{position:absolute;width:110px;height:34px;border-radius:50px;background:#fff;opacity:.85;top:52px;left:8%}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:48px;height:48px;left:17px;top:-22px}.cloud:after{width:58px;height:58px;right:12px;top:-31px}.cloud.c2{left:45%;top:96px;transform:scale(.72)}
    .instructions{position:absolute;top:118px;left:50%;transform:translateX(-50%);z-index:4;width:min(720px,92%);text-align:center;background:#fffaf0e8;border:2px solid #e5c688;border-radius:14px;padding:9px 15px;font-weight:700;box-shadow:0 5px 18px #17324d16}.instructions kbd{font:inherit;font-size:.86rem;background:white;border:1px solid #a8b3bc;border-bottom-width:3px;border-radius:6px;padding:1px 6px}
    .rail-window{position:absolute;z-index:3;left:0;right:0;bottom:60px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.rail-window::-webkit-scrollbar{display:none}.train{--train-scale:1;position:relative;display:flex;align-items:flex-end;gap:7px;width:max-content;margin-left:max(8px,calc((100vw - 1260px)/2));padding:70px 20px 35px 6px;transform:translateX(0) scale(var(--train-scale));transform-origin:left bottom}.train.depart{animation:depart 5.5s cubic-bezier(.45,.08,.9,.55) .7s forwards}.train.depart .wheel{animation:spin .42s linear infinite}
    .engine{position:relative;width:196px;height:124px;flex:none}.engine-body{position:absolute;bottom:21px;left:18px;width:167px;height:74px;background:linear-gradient(#d8574d,#b6302d);border:4px solid #702b27;border-radius:13px 32px 10px 9px}.boiler{position:absolute;left:-16px;bottom:7px;width:105px;height:58px;border-radius:33px 14px 14px 33px;background:#c8423b;border:4px solid #702b27}.boiler:after{content:"";position:absolute;left:-12px;top:9px;width:14px;height:36px;border-radius:8px;background:#efb94c;border:3px solid #6f4a1d}.cab-window{position:absolute;right:19px;top:12px;width:40px;height:34px;border-radius:5px;background:#bde8fa;border:4px solid #73322b;box-shadow:inset 0 0 0 3px #fff8}.chimney{position:absolute;left:42px;top:-40px;width:34px;height:51px;background:#2e3a42;border:4px solid #18242b;border-radius:5px 5px 8px 8px}.chimney:before{content:"";position:absolute;left:-9px;top:-10px;width:44px;height:14px;border-radius:5px;background:#2e3a42;border:4px solid #18242b}.cowcatcher{position:absolute;left:-28px;bottom:12px;width:48px;height:37px}.lamp{position:absolute;left:4px;top:5px;width:18px;height:18px;border-radius:50%;background:#fff1a4;border:3px solid #684d20;box-shadow:0 0 15px #fff4a5}
    .wagon{position:relative;width:82px;height:96px;flex:none}.wagon-box{height:62px;border:4px solid #714327;border-radius:7px 7px 12px 12px;background:linear-gradient(#e4a253,#c77b31);box-shadow:inset 0 5px #f1bf72;display:grid;place-items:center;transition:.25s}.wagon.correct .wagon-box{background:linear-gradient(#6acb78,#3e9f52);border-color:#236d35;box-shadow:inset 0 5px #91e19c}.wagon.active .wagon-box{outline:5px solid #ffe36d;outline-offset:3px}.wagon-input{width:62px;height:48px;text-align:center;font:900 1.55rem ui-rounded,system-ui;border:0;background:#fffdf5;border-radius:7px;color:#1d3850;outline:none}.wagon.correct .wagon-input{color:#155426;background:#eaffe9}.wagon-label{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;border-radius:10px;background:#fff8e8;border:2px solid #77503a;padding:3px 7px;font-size:.75rem;font-weight:900}.coupler{position:absolute;right:-11px;bottom:27px;width:14px;height:7px;background:#3c4348}.wheel{position:absolute;bottom:8px;width:27px;height:27px;border-radius:50%;background:radial-gradient(circle,#e7bf59 0 20%,#313a40 22% 54%,#e7bf59 56% 63%,#313a40 65%);border:3px solid #202a2f}.wheel.left{left:12px}.wheel.right{right:12px}.engine .wheel{width:42px;height:42px;bottom:0}.engine .wheel.left{left:34px}.engine .wheel.right{right:21px}
    .track{position:absolute;left:-5%;right:-5%;bottom:77px;height:18px;background:repeating-linear-gradient(90deg,#69492f 0 8px,transparent 8px 34px),linear-gradient(transparent 5px,#555 5px 9px,transparent 9px 13px,#555 13px 17px)}
    .steam{position:absolute;left:48px;top:4px;width:34px;height:34px;pointer-events:none}.puff{position:absolute;width:var(--size,34px);height:var(--size,34px);border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 28%,#eef3f5 72%);filter:drop-shadow(0 3px 3px #61717b36);opacity:0}.celebrating .puff{animation:puff 3.3s ease-out var(--delay,0s) forwards}.departing .puff{animation:puffTravel 1.35s ease-out infinite}.departing .puff:nth-child(3n+2){animation-delay:.22s}.departing .puff:nth-child(3n){animation-delay:.44s}
    .station-zone{position:absolute;z-index:2;right:18px;bottom:0;width:190px;height:430px;pointer-events:none}.platform{position:absolute;z-index:1;right:0;bottom:230px;width:190px;height:25px;border-radius:8px;background:repeating-linear-gradient(90deg,#c6a575 0 18px,#b79260 18px 36px);border:3px solid #765637;box-shadow:0 4px 0 #61472f}.platform:before,.platform:after{content:"";position:absolute;z-index:-1;top:21px;width:18px;height:150px;background:repeating-linear-gradient(0deg,#765637 0 14px,#9c744c 14px 25px);border:3px solid #61472f}.platform:before{left:20px}.platform:after{right:20px}.conductor{position:absolute;z-index:2;right:15px;bottom:250px;width:160px;height:175px;text-align:center}.conductor-person{position:absolute;left:13px;bottom:0;width:134px;height:174px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 5px 3px #17324d3d)}.flag{position:absolute;z-index:3;right:-4px;top:54px;width:58px;height:78px;font-size:0;transform:rotate(-18deg);transform-origin:12px 72px}.flag:before{content:"";position:absolute;left:11px;top:0;width:45px;height:36px;background:linear-gradient(135deg,#ef6b62,#b82f2a);clip-path:polygon(0 0,100% 0,82% 50%,100% 100%,0 100%);border-radius:2px;box-shadow:0 2px 3px #17324d30;transition:background .25s}.flag:after{content:"";position:absolute;left:7px;top:0;width:6px;height:76px;border-radius:5px;background:#6d4a29}.whistle-lines{position:absolute;left:110px;top:48px;color:#fff7c7;font:900 1.35rem/1 monospace;letter-spacing:-5px;opacity:0;text-shadow:0 1px 3px #17324d}.bubble{position:absolute;right:105px;top:0;width:125px;padding:7px 8px;border:2px solid #8c6334;border-radius:12px;background:#fffaf0;font-weight:900;font-size:.82rem;opacity:0;transform:scale(.7);transition:.25s}.bubble:after{content:"";position:absolute;right:-10px;bottom:9px;border-width:8px 0 8px 11px;border-style:solid;border-color:transparent transparent transparent #8c6334}.departing .flag{animation:waveFlag .55s ease-in-out infinite alternate}.departing .flag:before{background:linear-gradient(135deg,#61cf70,#21883b)}.departing .whistle-lines{animation:tootLines .62s ease-out 3}.departing .conductor-person{animation:conductorBounce .55s ease-in-out infinite alternate}.departing .bubble{opacity:1;transform:scale(1)}
    .message{position:absolute;z-index:20;left:50%;top:36%;transform:translate(-50%,-50%) scale(.6);opacity:0;width:min(1050px,96%);text-align:center;background:#fffaf0;border:5px solid var(--gold);border-radius:24px;padding:20px 14px;box-shadow:0 14px 50px #17324d42;pointer-events:none}.message.show{animation:pop .6s cubic-bezier(.2,1.5,.45,1) forwards}.message strong{display:block;color:#24763a;font:900 clamp(1.25rem,5vw,3.8rem) Georgia,serif;letter-spacing:.015em;white-space:nowrap}
    .status{position:absolute;left:0;right:0;top:168px;min-height:27px;text-align:center;font-weight:900;color:#8e2f2a}.status.ok{color:#26763b}footer{position:relative;z-index:9;background:#fffaf0;padding:8px 18px 10px;text-align:center;color:#5f6e79;font-size:.82rem;border-top:2px solid #e8c987}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes depart{0%{transform:translateX(0) scale(var(--train-scale))}12%{transform:translateX(18px) scale(var(--train-scale))}100%{transform:translateX(calc(-100vw - 1300px)) scale(var(--train-scale))}}@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.35)}8%{opacity:.94}55%{opacity:.76}100%{opacity:0;transform:translate(var(--dx,-48px),var(--dy,-125px)) scale(2.8)}}@keyframes puffTravel{0%{opacity:0;transform:translate(0,0) scale(.35)}12%{opacity:.92}70%{opacity:.62}100%{opacity:0;transform:translate(-86px,-118px) scale(2.35)}}@keyframes pop{to{transform:translate(-50%,-50%) scale(1);opacity:1}}@keyframes waveFlag{from{transform:rotate(-32deg)}to{transform:rotate(18deg)}}@keyframes conductorBounce{from{transform:translateY(0)}to{transform:translateY(-3px)}}@keyframes tootLines{0%{opacity:0;transform:translateX(0) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translateX(24px) scale(1.25)}}
    @media(max-width:700px){header{align-items:flex-start;flex-direction:column}.toolbar{justify-content:flex-start}.subtitle{display:none}.scene{min-height:700px}.instructions{top:106px}.status{top:164px}.train{margin-left:8px}.message{top:31%}.station-zone{right:4px;width:145px}.platform{bottom:230px;width:145px}.platform:before{left:14px}.platform:after{right:14px}.conductor{right:-5px;bottom:247px;transform:scale(.72);transform-origin:right bottom}.bubble{right:95px;top:4px}}
    @media(prefers-reduced-motion:reduce){.train.depart{animation-duration:.01ms}.train.depart .wheel,.celebrating .puff,.departing .flag,.departing .conductor-person,.departing .whistle-lines{animation:none}.message.show{animation:none;opacity:1;transform:translate(-50%,-50%)}}
  </style>
</head>

  <script>
    const railWindow=document.querySelector('.rail-window'),train=document.querySelector('#train'),table=document.querySelector('#table'),status=document.querySelector('#status'),message=document.querySelector('#message'),game=document.querySelector('#game'),recordedSong=document.querySelector('#recordedSong');
    const count=11;let multiplier=2,inputs=[],finished=false,audioCtx=null;
    for(let n=2;n<=10;n++){const o=document.createElement('option');o.value=n;o.textContent=n+':n kertotaulu';table.append(o)}
    function build(){train.querySelectorAll('.wagon').forEach(w=>w.remove());inputs=[];finished=false;train.classList.remove('depart');game.classList.remove('celebrating','departing');message.classList.remove('show');recordedSong.pause();recordedSong.currentTime=0;status.textContent='';status.className='status';multiplier=Number(table.value);
      for(let i=0;i<count;i++){const w=document.createElement('div');w.className='wagon';w.innerHTML=`<div class="wagon-box"><input class="wagon-input" inputmode="numeric" maxlength="3" aria-label="${i} kertaa ${multiplier}"></div><span class="wagon-label">${i} · ${multiplier}</span><i class="coupler"></i><i class="wheel left"></i><i class="wheel right"></i>`;const input=w.querySelector('input');input.dataset.answer=String(i*multiplier);input.dataset.index=String(i);input.addEventListener('focus',()=>setActive(i));input.addEventListener('input',()=>validateOne(input));input.addEventListener('keydown',handleKey);train.append(w);inputs.push(input)}requestAnimationFrame(()=>{fitTrain();railWindow.scrollLeft=0;inputs[0].focus()})}
    function fitTrain(){train.style.setProperty('--train-scale','1');const natural=train.scrollWidth,available=railWindow.clientWidth-18,minScale=innerWidth<700?.72:.55;const scale=Math.min(1,Math.max(minScale,available/natural));train.style.setProperty('--train-scale',scale.toFixed(3))}
    function setActive(index){document.querySelectorAll('.wagon').forEach((w,i)=>w.classList.toggle('active',i===index));if(index===0){railWindow.scrollTo({left:0,behavior:'smooth'})}else if(innerWidth<900){inputs[index].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}}
    function validateOne(input){input.value=input.value.replace(/[^0-9-]/g,'').slice(0,3);const good=input.value!==''&&Number(input.value)===Number(input.dataset.answer);input.closest('.wagon').classList.toggle('correct',good);if(good){const next=inputs[Number(input.dataset.index)+1];if(next&&!next.value)setTimeout(()=>next.focus(),120)}}
    function handleKey(e){const i=Number(e.currentTarget.dataset.index);if(e.key==='ArrowRight'){e.preventDefault();inputs[Math.min(count-1,i+1)].focus()}else if(e.key==='ArrowLeft'){e.preventDefault();inputs[Math.max(0,i-1)].focus()}else if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault()}else if(e.key==='Enter'){e.preventDefault();checkAll()}}
    function checkAll(){if(finished)return;inputs.forEach(validateOne);const wrong=inputs.filter(x=>!x.closest('.wagon').classList.contains('correct'));if(wrong.length){status.textContent=wrong.length===1?'Vielä yksi vaunu kaipaa oikeaa lukua.':'Vielä '+wrong.length+' vaunua kaipaa oikean luvun.';status.className='status';wrong[0].focus();wrong[0].select();playOops();return}finished=true;status.textContent='Kaikki oikein — juna lähtee!';status.className='status ok';celebrate()}
    function context(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
    function tone(freq,start,duration,type='sine',gain=.08){const c=context(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+start);g.gain.setValueAtTime(.0001,c.currentTime+start);g.gain.exponentialRampToValueAtTime(gain,c.currentTime+start+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+start+duration);o.connect(g).connect(c.destination);o.start(c.currentTime+start);o.stop(c.currentTime+start+duration+.03)}
    function sweepTone(from,to,start,duration,type='sine',gain=.06){const c=context(),o=c.createOscillator(),g=c.createGain(),now=c.currentTime;o.type=type;o.frequency.setValueAtTime(from,now+start);o.frequency.exponentialRampToValueAtTime(to,now+start+duration);g.gain.setValueAtTime(.0001,now+start);g.gain.exponentialRampToValueAtTime(gain,now+start+.08);g.gain.setValueAtTime(gain*.86,now+start+duration-.12);g.gain.exponentialRampToValueAtTime(.0001,now+start+duration);o.connect(g).connect(c.destination);o.start(now+start);o.stop(now+start+duration+.04)}
    function steamHiss(start,duration){const c=context(),rate=c.sampleRate,buffer=c.createBuffer(1,Math.ceil(rate*duration),rate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(.6+.4*Math.sin(i*.013));const source=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain(),now=c.currentTime;source.buffer=buffer;filter.type='bandpass';filter.frequency.value=3100;filter.Q.value=.55;gain.gain.setValueAtTime(.0001,now+start);gain.gain.exponentialRampToValueAtTime(.09,now+start+.18);gain.gain.setValueAtTime(.075,now+start+duration-.35);gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);source.connect(filter).connect(gain).connect(c.destination);source.start(now+start);source.stop(now+start+duration)}
    function playOops(){tone(220,0,.13,'triangle',.035);tone(185,.15,.18,'triangle',.035)}
    function whistle(){
      // Kolme hieman eri taajuutta muodostaa höyrypillin karhean soinnin.
      sweepTone(690,760,.02,.82,'sine',.052);sweepTone(925,1015,.02,.82,'sine',.039);sweepTone(1190,1280,.02,.82,'triangle',.022);
      // Matala kaksiosainen veturin tuuttaus.
      [[128,1.02,.48],[128,1.62,.64]].forEach(([f,s,d])=>{sweepTone(f*.96,f,s,d,'sawtooth',.048);sweepTone(f*2.01,f*2.04,s,d,'sine',.038);sweepTone(f*3.02,f*3.08,s,d,'triangle',.021)});
