mpt": "Kuinka monta kirjaa keskiviikkona luettiin enemmän kuin maanantaina?", "correct": "6", "alts": [], "solution": "Keskiviikkona arvo on 10 ja maanantaina 4. Ero on \\(10-4=6\\).", "visual": "<svg viewBox=\"0 0 430 210\" role=\"img\" aria-label=\"pylväsdiagrammi\"><text x=\"215\" y=\"18\" text-anchor=\"middle\" font-size=\"13\">Luetut kirjat</text><line x1=\"42\" y1=\"25\" x2=\"42\" y2=\"178\" stroke=\"#172033\"/><line x1=\"42\" y1=\"178\" x2=\"418\" y2=\"178\" stroke=\"#172033\"/><rect x=\"55.0\" y=\"122.0\" width=\"45.5\" height=\"56.0\" fill=\"#a8c8ea\" stroke=\"#172033\"/><text x=\"77.75\" y=\"198\" text-anchor=\"middle\" font-size=\"11\">ma</text><text x=\"77.75\" y=\"117.0\" text-anchor=\"middle\" font-size=\"10\">4</text><rect x=\"142.5\" y=\"80.0\" width=\"45.5\" height=\"98.0\" fill=\"#a8c8ea\" stroke=\"#172033\"/><text x=\"165.25\" y=\"198\" text-anchor=\"middle\" font-size=\"11\">ti</text><text x=\"165.25\" y=\"75.0\" text-anchor=\"middle\" font-size=\"10\">7</text><rect x=\"230.0\" y=\"38.0\" width=\"45.5\" height=\"140.0\" fill=\"#a8c8ea\" stroke=\"#172033\"/><text x=\"252.75\" y=\"198\" text-anchor=\"middle\" font-size=\"11\">ke</text><text x=\"252.75\" y=\"33.0\" text-anchor=\"middle\" font-size=\"10\">10</text><rect x=\"317.5\" y=\"94.0\" width=\"45.5\" height=\"84.0\" fill=\"#a8c8ea\" stroke=\"#172033\"/><text x=\"340.25\" y=\"198\" text-anchor=\"middle\" font-size=\"11\">to</text><text x=\"340.25\" y=\"89.0\" text-anchor=\"middle\" font-size=\"10\">6</text></svg>", "kind": "text"}, {"type": "mc", "prompt": "Pussissa on 5 punaista, 3 sinistä ja 2 vihreää palloa. Pussista otetaan sattumanvaraisesti yksi pallo. Minkä värin saaminen on todennäköisintä?", "choices": ["punainen", "sininen", "vihreä", "kaikki yhtä todennäköisiä"], "correct": "punainen", "solution": "Punaisia palloja on eniten, joten punainen on todennäköisin.", "visual": ""}, {"type": "mc", "prompt": "Noppaa heitetään. Tapahtuma on “tulos on suurempi kuin 4”. Mikä on vastatapahtuma?", "choices": ["tulos on enintään 4", "tulos on 4", "tulos on alle 4", "tulos on 6"], "correct": "tulos on enintään 4", "solution": "Vastatapahtuma sisältää kaikki tilanteet, joissa alkuperäinen tapahtuma ei toteudu: tulos on 1, 2, 3 tai 4.", "visual": ""}, {"type": "mc", "prompt": "Kyselyn tulokset ovat: kävely 12, pyörä 8, bussi 5, auto 5. Mikä esitys sopii määrien vertailuun?", "choices": ["pylväsdiagrammi", "satunnainen kuva", "pelkkä suurin luku", "koordinaatisto ilman nimiä"], "correct": "pylväsdiagrammi", "solution": "Pylväsdiagrammi tekee eri luokkien määrien vertailusta helppoa.", "visual": ""}, {"type": "input", "prompt": "Neljä kalaa ovat massaltaan 180 g; 0,2 kg; 250 g; 190 g. Laske kalojen keskimääräinen massa grammoina.", "correct": "205", "alts": [], "solution": "Muunna kaikki grammoiksi: 180 g; 200 g; 250 g; 190 g. \\((180+200+250+190)\\,\\mathrm g:4=205\\,\\mathrm g\\).", "visual": "", "kind": "text", "unit": "g"}, {"type": "mc", "prompt": "Kortit 1–10 ovat pussissa. Pussista nostetaan sattumanvaraisesti yksi kortti. Mikä tapahtuma on varma?", "choices": ["nostettu luku on alle 11", "nostettu luku on parillinen", "nostettu luku on 7", "nostettu luku on yli 5"], "correct": "nostettu luku on alle 11", "solution": "Kaikki pussin kortit ovat lukuja 1–10, joten jokainen niistä on alle 11.", "visual": ""}, {"type": "mc", "prompt": "Mikä tapahtuma on tavallisella nopalla mahdoton?", "choices": ["saadaan 7", "saadaan 6", "saadaan parillinen", "saadaan alle 6"], "correct": "saadaan 7", "solution": "Tavallisen nopan silmäluvut ovat 1–6, joten 7 on mahdoton.", "visual": ""}, {"type": "input", "prompt": "Samin kahden kokeen keskiarvo on 8,5. Ensimmäisen kokeen arvosana oli 7. Mikä oli toisen kokeen arvosana?", "correct": "10", "alts": [], "solution": "Arvosanojen summa on \\(2\\cdot8{,}5=17\\). Toinen arvosana on \\(17-7=10\\).", "visual": "", "kind": "text"}, {"type": "input", "prompt": "Aineistossa ovat luvut 12, 15, 15, 18 ja x. Keskiarvo on 16. Mikä on x?", "correct": "20", "alts": [], "solution": "Viiden luvun summa on \\(5\\cdot16=80\\). Tunnettujen summa on 60, joten \\(x=20\\).", "visual": "", "kind": "text"}];const PER=3; let page=0; const saved={};
function norm(s){return String(s??'').trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-').replace(/÷/g,':').replace(/·/g,'*')}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function fracValue(s){s=norm(s); if(/^[-+]?\d+(\.\d+)?$/.test(s)) return Number(s); let m=s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/); if(m)return Number(m[1])+(Number(m[1])<0?-1:1)*Number(m[2])/Number(m[3]); m=s.match(/^(-?\d+)\/(\d+)$/); if(m)return Number(m[1])/Number(m[2]); return NaN}
function equivalent(a,b){if(norm(a)===norm(b))return true; const x=fracValue(a),y=fracValue(b);return Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<1e-9}
function coordWidget(i){let e=`<div class="coordpick"><svg viewBox="0 0 320 320">`;for(let k=-5;k<=5;k++){let p=160+k*25;e+=`<line x1="${p}" y1="25" x2="${p}" y2="295" stroke="#e1e6ed"/><line x1="25" y1="${p}" x2="295" y2="${p}" stroke="#e1e6ed"/>`}e+=`<line x1="25" y1="160" x2="295" y2="160" stroke="#172033" stroke-width="2"/><line x1="160" y1="25" x2="160" y2="295" stroke="#172033" stroke-width="2"/><circle id="mark${i}" cx="160" cy="160" r="7" fill="#d9534f" style="display:none"/>`;for(let x=-5;x<=5;x++)for(let y=-5;y<=5;y++){e+=`<circle class="hitpt" cx="${160+x*25}" cy="${160-y*25}" r="8" onclick="pickPoint(${i},${x},${y})"/>`}return e+`</svg><span id="ptlabel${i}" class="small">Valitse piste ruudukolta.</span></div>`}function pickPoint(i,x,y){saved[i]={pt:[x,y]};const m=document.getElementById('mark'+i);if(m){m.setAttribute('cx',160+x*25);m.setAttribute('cy',160-y*25);m.style.display='block'}const l=document.getElementById('ptlabel'+i);if(l)l.textContent=`Valittu piste: (${x}, ${y})`}function angleWidget(i){return `<div class="anglebox"><div class="ray"></div><div class="ray moving" id="ray${i}"></div></div><div style="text-align:center"><input class="angleslider" id="ang${i}" type="range" min="0" max="180" value="90" oninput="pickAngle(${i},this.value)"><div id="anglabel${i}">90°</div></div>`}function pickAngle(i,v){v=Number(v);saved[i]={a:v};const r=document.getElementById('ray'+i);if(r)r.style.transform=`rotate(${-v}deg)`;const l=document.getElementById('anglabel'+i);if(l)l.textContent=v+'°'}
function collect(){const start=page*PER; DATA.slice(start,start+PER).forEach((q,j)=>{const i=start+j;if(q.type==='mc'){const x=document.querySelector(`input[name=q${i}]:checked`);if(x)saved[i]={v:x.value}}else if(q.type==='input'){const x=document.getElementById('in'+i);if(x)saved[i]={v:x.value}}else if(q.type==='expr'){const e=document.getElementById('ex'+i),r=document.getElementById('res'+i);if(e&&r)saved[i]={e:e.value,r:r.value}}})}
function restore(i,q){const s=saved[i];if(!s)return;if(q.type==='mc'){const x=[...document.querySelectorAll(`input[name=q${i}]`)].find(z=>z.value===s.v);if(x)x.checked=true}else if(q.type==='input'){document.getElementById('in'+i).value=s.v||''}else if(q.type==='expr'){document.getElementById('ex'+i).value=s.e||'';document.getElementById('res'+i).value=s.r||''}else if(q.type==='coordpoint'&&s.pt){pickPoint(i,s.pt[0],s.pt[1])}else if(q.type==='angle'&&s.a!=null){const a=document.getElementById('ang'+i);a.value=s.a;pickAngle(i,s.a)}}
function phase(i){const r=(i+1)/DATA.length;if(r<=.25)return'Perusta';if(r<=.5)return'Vahvistus';if(r<=.75)return'Soveltaminen';return'Haaste'}
function render(){const start=page*PER,qs=DATA.slice(start,start+PER);document.getElementById('pageNo').textContent=(page+1)+' / '+Math.ceil(DATA.length/PER);document.getElementById('phaseName').textContent=phase(start);const root=document.getElementById('questions');root.innerHTML='';qs.forEach((q,j)=>{const i=start+j,d=document.createElement('section');d.className='q';let b=`<div class="phase">${phase(i)}</div><h3>${i+1}. ${q.prompt}</h3>${q.visual?`<div class="visual">${q.visual}</div>`:''}`;if(q.type==='mc')b+=`<div class="choices">${q.choices.map(c=>`<label class="choice"><input type="radio" name="q${i}" value="${c.replaceAll('"','&quot;')}"> ${c}</label>`).join('')}</div>`;else if(q.type==='input')b+=`<div class="exprline"><input id="in${i}" type="text" inputmode="decimal" placeholder="Vastaus">${q.unit?`<span class="answerunit">${q.unit}</span>`:''}</div>`;else if(q.type==='expr')b+=`<div class="exprline"><span>Lasku:</span><input id="ex${i}" type="text" placeholder="laskulauseke"><span>=</span><input id="res${i}" type="text" inputmode="decimal" placeholder="vastaus">${q.unit?`<span class="answerunit">${q.unit}</span>`:''}</div>`;else if(q.type==='coordpoint')b+=coordWidget(i);else if(q.type==='angle')b+=angleWidget(i);b+=`<div id="fb${i}" class="feedback"></div>`;d.innerHTML=b;root.appendChild(d);restore(i,q)});document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page>=Math.ceil(DATA.length/PER)-1;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([root])}
function okAnswer(q,v){return equivalent(v,q.correct)||(q.alts||[]).some(a=>equivalent(v,a))}
function check(){collect();const start=page*PER;DATA.slice(start,start+PER).forEach((q,j)=>{const i=start+j,fb=document.getElementById('fb'+i);let ok=false;if(q.type==='mc'){const x=document.querySelector(`input[name=q${i}]:checked`);ok=!!x&&x.value===q.correct}else if(q.type==='input'){ok=okAnswer(q,document.getElementById('in'+i).value)}else if(q.type==='expr'){const ex=norm(document.getElementById('ex'+i).value),res=document.getElementById('res'+i).value;const allowed=q.expr_answers.map(norm);ok=allowed.includes(ex)&&okAnswer(q,res)}else if(q.type==='coordpoint'){const pt=(saved[i]||{}).pt;ok=!!pt&&pt[0]===q.correct[0]&&pt[1]===q.correct[1]}else if(q.type==='angle'){ok=Math.abs(((saved[i]||{}).a??-999)-q.correct)<=1}fb.innerHTML=(ok?'<span class="ok">Oikein!</span>':'<span class="bad">Tarkista vastaus.</span>')+`<div class="solution"><b>Ratkaisu:</b> ${q.solution}</div>`;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([fb])})}
document.getElementById('check').onclick=check;document.getElementById('prev').onclick=()=>{collect();if(page>0){page--;render()}};document.getElementById('next').onclick=()=>{collect();if(page<Math.ceil(DATA.length/PER)-1){page++;render()}};render();
