<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Päässälaskuhaaste – 10 kenttää</title><style>
:root{--ink:#14261d;--cream:#fffbea;--danger:#e43e36;--gold:#ffd45c}*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);background:#cfeeff}button,input{font:inherit}body{overflow-x:hidden}.world{position:relative;min-height:100vh;padding:18px clamp(12px,3vw,32px) 28px;overflow:hidden;background:linear-gradient(#bde8ff 0 57%,#69b64e 57% 66%,#735033 66%)}.world:after{content:"";position:absolute;z-index:0;left:0;right:0;bottom:0;height:34%;opacity:.22;background:repeating-linear-gradient(0deg,transparent 0 31px,#21190f 32px),repeating-linear-gradient(90deg,transparent 0 31px,#21190f 32px)}.cloud{position:absolute;z-index:0;width:150px;height:42px;border-radius:6px;background:#fff9;top:58px;left:7%;box-shadow:48px -24px 0 #fff9,88px 0 0 #fff9}.cloud.two{left:auto;right:10%;top:116px;transform:scale(.72)}.shell{position:relative;z-index:2;max-width:980px;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;padding:13px 17px;border:4px solid #263c31;border-radius:6px;background:#fffbeaee;box-shadow:0 7px 0 #263c31}h1{margin:0;font:900 clamp(1.25rem,3.4vw,2.25rem)/1.05 Georgia,serif}.score{flex:none;padding:8px 13px;border-radius:5px;background:#1f4934;color:white;font-weight:900;font-size:1.05rem}.score b{color:var(--gold);font-size:1.35rem}.arena{position:relative;display:grid;grid-template-columns:minmax(250px,.82fr) minmax(330px,1.18fr);min-height:540px;border:6px solid #263c31;border-radius:8px;background:linear-gradient(135deg,#eaf9de,#a8d987);box-shadow:0 13px 0 #263c31,0 20px 34px #17302438;overflow:hidden}.monster-side{position:relative;display:grid;place-items:end center;padding:42px 22px 54px;background:radial-gradient(circle at 50% 58%,#d7ff9b 0 19%,transparent 48%)}.monster-side:after{content:"";position:absolute;left:0;right:0;bottom:0;height:62px;background:#806042;box-shadow:inset 0 12px #4f9c44}.panel{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(22px,4vw,48px);background:#fffbeaee;border-left:5px solid #263c31;text-align:center}.timer-wrap{width:min(430px,100%);margin-bottom:24px}.timer-label{display:flex;align-items:end;justify-content:space-between;font-weight:900}.timer{font:900 clamp(3.2rem,9vw,6.2rem)/.88 ui-monospace,monospace;color:#237a3a;font-variant-numeric:tabular-nums}.danger .timer{color:var(--danger)}.bar{height:17px;margin-top:10px;border:3px solid #263c31;border-radius:4px;background:#fff;overflow:hidden}.bar-fill{height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#51b94e,#a8ef70)}.question{min-width:min(430px,100%);margin:0 0 20px;padding:20px 18px;border:4px solid #263c31;border-radius:6px;background:white;box-shadow:0 7px 0 #c9b77f;font:900 clamp(2.9rem,8vw,5.7rem)/1 ui-monospace,monospace}.answer-row{display:flex;gap:10px;width:min(430px,100%)}.answer{min-width:0;flex:1;height:72px;border:4px solid #263c31;border-radius:6px;background:white;text-align:center;font-size:2.25rem;font-weight:900;color:var(--ink);outline:none}.answer:focus{box-shadow:0 0 0 5px #ffd45c}.submit,.start,.again{border:4px solid #263c31;border-radius:6px;background:#56b94f;color:#10291c;font-weight:1000;cursor:pointer;box-shadow:0 6px 0 #263c31}.submit{padding:0 20px;font-size:1.2rem}.feedback{height:33px;margin-top:14px;font-weight:900;font-size:1.1rem}.feedback.wrong{color:#b62e28}.feedback.right{color:#237a3a}

:root{--calcColor:#58b9cf;--calcDark:#26758a}
.hudline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.fieldpill{padding:8px 11px;border-radius:5px;background:#fff8d5;border:3px solid #263c31;font-weight:900}
.field-info{width:min(430px,100%);margin-bottom:17px;padding:10px 12px;border:3px solid #263c31;border-radius:6px;background:#fff8d5;text-align:left}
.field-info b{display:block;font-size:1.08rem}.field-info span{display:block;font-size:.86rem;margin-top:3px}
.calculator{width:min(270px,91%);max-height:420px;overflow:visible}

html,body{width:100%;height:100%;overflow:hidden}
body{min-height:0}
.world{
  width:100%;
  height:100dvh;
  min-height:0;
  overflow:hidden;
  padding:clamp(8px,1.5vh,14px) clamp(10px,2vw,26px) clamp(10px,2vh,18px);
}
.shell{
  height:100%;
  max-width:1040px;
  display:flex;
  flex-direction:column;
}
.topbar{
  flex:0 0 auto;
  margin-bottom:clamp(7px,1.2vh,12px);
  padding:clamp(7px,1.2vh,11px) 14px;
}
.topbar h1{font-size:clamp(1.15rem,3.1vh,2rem)}
.hudline{gap:6px;flex-wrap:nowrap}
.fieldpill,.score{padding:6px 9px;font-size:clamp(.74rem,1.7vh,1rem)}
.arena{
  flex:1 1 auto;
  min-height:0;
  height:auto;
  grid-template-columns:minmax(235px,.82fr) minmax(360px,1.18fr);
}
.monster-side{min-height:0;padding:clamp(16px,3vh,30px) 18px clamp(34px,6vh,54px)}
.calculator{
  width:min(230px,78%,31vh);
  max-height:min(340px,54vh);
}
.panel{min-height:0;padding:clamp(10px,2.2vh,24px) clamp(16px,2.8vw,34px)}
.field-info{
  margin-bottom:clamp(6px,1.2vh,12px);
  padding:7px 10px;
}
.timer-wrap{margin-bottom:clamp(7px,1.2vh,13px)}
.timer{font-size:clamp(2.45rem,8vh,4.7rem)}
.question{
  min-width:0;
  width:min(430px,100%);
  min-height:clamp(64px,11vh,92px);
  margin-bottom:clamp(8px,1.5vh,14px);
  padding:clamp(8px,1.5vh,14px) 12px;
  font-size:clamp(2rem,6.8vh,4.1rem);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.08em;
  flex-wrap:wrap;
}
.answer{height:clamp(52px,7.8vh,66px);font-size:clamp(1.55rem,4vh,2rem)}
.feedback{
  min-height:clamp(23px,3.5vh,30px);
  height:auto;
  margin-top:clamp(5px,1vh,9px);
  font-size:clamp(.78rem,1.8vh,1rem);
}
.math-frac{
  display:inline-grid;
  grid-template-rows:auto auto;
  vertical-align:middle;
  line-height:.9;
  margin:0 .08em;
  font-size:.82em;
  text-align:center;
}
.math-frac>span:first-child{border-bottom:.075em solid currentColor;padding:0 .12em .04em}
.math-frac>span:last-child{padding:.04em .12em 0}
.math-box{
  display:inline-flex;
  width:.78em;height:.78em;
  border:.09em solid currentColor;
}
.math-text{font-family:system-ui,sans-serif;font-size:.55em;font-weight:850}
.math-unit{font-family:system-ui,sans-serif;font-size:.58em;font-weight:850;white-space:nowrap}

@media(max-width:720px){
  .world{padding:5px 5px 8px}
  .cloud{display:none}
  .topbar{
    margin-bottom:5px;
    padding:5px 7px;
    border-width:3px;
    gap:4px;
    flex-wrap:wrap;
  }
  .topbar h1{
    width:100%;
    text-align:center;
    font-size:clamp(1rem,4.4vw,1.25rem);
  }
  .hudline{width:100%;display:grid;grid-template-columns:1fr 1fr 1.15fr}
  .fieldpill,.score{min-width:0;padding:4px 3px;font-size:clamp(.65rem,2.8vw,.78rem);text-align:center}
  .arena{
    display:grid;
    grid-template-columns:1fr;
    grid-template-rows:minmax(108px,24%) minmax(0,76%);
    border-width:4px;
  }
  .monster-side{
    min-height:0;
    padding:4px 8px 16px;
    place-items:center;
  }
  .monster-side:after{height:20px}
  .calculator{width:min(98px,25vw);max-height:118px}
  .panel{
    min-height:0;
    border-left:0;
    border-top:4px solid #263c31;
    padding:6px 8px 8px;
    justify-content:center;
  }
  .field-info{width:100%;margin-bottom:3px;padding:4px 7px;border-width:2px}
  .field-info b{font-size:.76rem}
  .field-info span{font-size:.61rem;margin-top:1px}
  .timer-wrap{width:100%;margin-bottom:4px}
  .timer{font-size:clamp(2rem,10vw,3rem)}
  .bar{height:9px;border-width:2px;margin-top:2px}
  .question{
    width:100%;
    min-height:56px;
    margin-bottom:6px;
    padding:5px;
    border-width:3px;
    font-size:clamp(1.65rem,8vw,2.65rem);
  }
  .answer-row{width:100%;gap:5px}
  .answer{height:48px;border-width:3px;font-size:1.45rem}
  .submit{min-width:76px;padding:0 8px;border-width:3px;font-size:.9rem}
  .feedback{min-height:20px;margin-top:4px;font-size:.72rem;line-height:1.1}
}

@media(max-width:900px) and (max-height:520px) and (orientation:landscape){
  .world{padding:4px 6px 7px}
  .topbar{margin-bottom:4px;flex-wrap:nowrap;padding:4px 7px}
  .topbar h1{width:auto;text-align:left;font-size:.92rem;white-space:nowrap}
  .hudline{width:auto;display:flex;margin-left:auto}
  .fieldpill,.score{font-size:.62rem;padding:3px 4px}
  .arena{grid-template-columns:28% 72%;grid-template-rows:1fr}
  .monster-side{padding:5px 6px 18px}
  .calculator{width:min(112px,20vw);max-height:62vh}
  .panel{border-top:0;border-left:4px solid #263c31;padding:4px 10px}
  .field-info{display:none}
  .timer{font-size:2rem}
  .question{min-height:48px;margin-bottom:5px;font-size:clamp(1.5rem,6vh,2.4rem);padding:4px}
  .answer{height:42px;font-size:1.25rem}
  .feedback{margin-top:3px;font-size:.68rem;min-height:16px}
}

@media(min-width:721px) and (max-height:700px){
  .world{padding-top:6px;padding-bottom:8px}
  .topbar{margin-bottom:6px;padding:6px 11px}
  .monster-side{padding-top:10px;padding-bottom:34px}
  .calculator{width:min(205px,28vh)}
  .panel{padding-top:6px;padding-bottom:7px}
  .field-info{margin-bottom:4px;padding:5px 8px}
  .timer{font-size:2.75rem}
  .question{min-height:58px;margin-bottom:6px;padding:6px 8px;font-size:2.2rem}
  .answer{height:48px;font-size:1.45rem}
  .feedback{margin-top:4px;min-height:19px}
}
</style></head>
<body>
<div class="world field-1" id="world">
<div class="cloud"></div><div class="cloud two"></div>
<div class="shell">
<div class="topbar">
<h1>Päässälaskuhaaste</h1>
<div class="hudline">
<div class="fieldpill">Kenttä <b id="fieldNo">1</b>/10</div>
<div class="fieldpill">Tehtävä <b id="taskNo">1</b>/8</div>
<div class="score">Pisteet <b id="score">0</b></div>
</div>
</div>

<div class="arena">
<div class="monster-side">
<svg class="calculator" viewBox="0 0 260 330" aria-label="Laskin">
<rect x="20" y="10" width="220" height="300" rx="28" fill="var(--calcColor)" stroke="#263c31" stroke-width="10"/>
<rect x="48" y="38" width="164" height="62" rx="9" fill="#dff5dc" stroke="#263c31" stroke-width="7"/>
<text id="calcFaceText" x="130" y="77" text-anchor="middle" font-size="21" font-weight="900" fill="#263c31">VALMIS</text>
<g fill="#fff6cb" stroke="#263c31" stroke-width="6">
<rect x="48" y="126" width="44" height="38" rx="6"/>
<rect x="108" y="126" width="44" height="38" rx="6"/>
<rect x="168" y="126" width="44" height="38" rx="6"/>
<rect x="48" y="180" width="44" height="38" rx="6"/>
<rect x="108" y="180" width="44" height="38" rx="6"/>
<rect x="168" y="180" width="44" height="38" rx="6"/>
<rect x="48" y="234" width="44" height="38" rx="6"/>
<rect x="108" y="234" width="104" height="38" rx="6"/>
</g>
</svg>
</div>

<div class="panel">
<div class="field-info">
<b id="fieldTitle">Kenttä 1</b>
<span id="fieldDesc"></span>
</div>

<div class="timer-wrap">
<div class="timer-label"><span>Aikaa</span><span id="timer" class="timer">30.0</span></div>
<div class="bar"><div class="bar-fill" id="bar"></div></div>
</div>

<div class="question" id="question">7 · 8 − 5 · 6</div>

<form class="answer-row" id="form">
<input id="answer" class="answer" inputmode="decimal" autocomplete="off">
<button class="submit">Vastaa</button>
</form>

<div id="feedback" class="feedback"></div>
</div>
</div>
</div>
</div>

<script>
const FIELDS=[
 {time:30,title:"Lämmittely"},
 {time:28,title:"Peruslaskut"},
 {time:26,title:"Laskujärjestys"},
 {time:24,title:"Desimaalit"},
 {time:22,title:"Murtoluvut"},
 {time:20,title:"Prosentit"},
 {time:18,title:"Yksiköt"},
 {time:16,title:"Sekalaskut"},
 {time:13,title:"Haaste"},
 {time:10,title:"Mestaruuskenttä"}
];

const world=document.getElementById("world"),
fieldNoEl=document.getElementById("fieldNo"),
taskNoEl=document.getElementById("taskNo"),
scoreEl=document.getElementById("score"),
fieldTitleEl=document.getElementById("fieldTitle"),
fieldDescEl=document.getElementById("fieldDesc"),
timerEl=document.getElementById("timer"),
bar=document.getElementById("bar"),
questionEl=document.getElementById("question"),
answerEl=document.getElementById("answer"),
feedback=document.getElementById("feedback"),
form=document.getElementById("form"),
calcFaceText=document.getElementById("calcFaceText");

let field=0,task=0,score=0,answer=0,running=true,deadline=0,frame,lastKey="";

const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const ch=a=>a[Math.floor(Math.random()*a.length)];
const clean=n=>Math.round(n*1000000)/1000000;
const fmt=n=>String(clean(n)).replace(".",",");
const frac=(n,d)=>`\\frac{${n}}{${d}}`;
const makeQ=(latex,ans,key=latex)=>({text:latex,ans:Number(ans),key});

function escHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))
}
function renderMath(src){
 let s=escHtml(src);
 s=s.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,
 '<span class="math-frac"><span>$1</span><span>$2</span></span>');
 s=s.replace(/\\text\{([^{}]*)\}/g,'<span class="math-text">$1</span>');
 s=s.replace(/\\square/g,'<span class="math-box"></span>');
 s=s.replace(/\\cdot/g,'·');
 s=s.replace(/\\,/g,'&thinsp;');
 s=s.replace(/\\%/g,'%');
 return s;
}

const FAMILIES={
 mental(){
   let a=r(20,80),b=r(10,40);
   return makeQ(`${a}+${b}`,a+b)
 },
 order(){
   let a=r(2,9),b=r(2,9),c=r(2,9);
   return makeQ(`${a}+${b}\\cdot${c}`,a+b*c)
 },
 paren(){
   let a=r(8,20),b=r(2,8),c=r(2,5);
   return makeQ(`(${a}+${b})\\cdot${c}`,(a+b)*c)
 },
 missing(){
   let a=r(3,12),b=r(3,12);
   return makeQ(`${a}\\cdot\\square=${a*b}`,b)
 },
 decimal(){
   let a=r(12,49)/10,b=r(11,35)/10;
   return makeQ(`${fmt(a)}+${fmt(b)}`,clean(a+b))
 },
 tens(){
   let a=r(12,89)/10,m=ch([10,100]);
   return makeQ(`${fmt(a)}\\cdot${m}`,clean(a*m))
 },
 fracbasic(){
   let d=ch([2,4,5,10]),n=r(1,d-1),whole=d*r(2,10);
   return makeQ(`${frac(n,d)}\\text{ luvusta }${whole}`,whole*n/d)
 },
 percent(){
   let p=ch([10,20,25,50]),base=ch([40,60,80,100,120,160,200]);
   return makeQ(`${p}\\,\\%\\text{ luvusta }${base}`,p*base/100)
 },
 time(){
   let h=r(1,3),m=ch([15,30,45]);
   return makeQ(`${h}\\text{ h }${m}\\text{ min}=?\\text{ min}`,h*60+m)
 },
 units(){
   let x=r(12,49)/10;
   return makeQ(`${fmt(x)}\\text{ m}=?\\text{ cm}`,x*100)
 },
 money(){
   let price=ch([1.2,1.5,1.8,2.4,2.5]),n=r(2,4);
   return makeQ(`${n}\\cdot${fmt(price)}\\,€`,clean(n*price))
 }
};

function generateTask(i){
 const pool=Object.keys(FAMILIES);
 let name=ch(pool);
 let q=FAMILIES[name]();
 let guard=0;
 while((!Number.isFinite(q.ans)||q.ans<0)&&guard<30){
   name=ch(pool);q=FAMILIES[name]();guard++;
 }
 return q
}

function applyFieldTheme(){
 fieldNoEl.textContent=field+1;
 fieldTitleEl.textContent=`Kenttä ${field+1}: ${FIELDS[field].title}`;
 fieldDescEl.textContent=`8 tehtävää • ${FIELDS[field].time} s / tehtävä`;
}

function newQuestion(){
 let q;
 do{q=generateTask(task)}while(q.key===lastKey);
 lastKey=q.key;
 answer=q.ans;
 taskNoEl.textContent=task+1;
 questionEl.innerHTML=renderMath(q.text);
 answerEl.value="";
 feedback.textContent="";
 deadline=performance.now()+FIELDS[field].time*1000;
 answerEl.focus();
}

function tick(now){
 const left=Math.max(0,deadline-now);
 const ratio=left/(FIELDS[field].time*1000);
 timerEl.textContent=(left/1000).toFixed(1);
 bar.style.transform=`scaleX(${ratio})`;
 world.classList.toggle("danger",left<3000);
 if(left<=0){feedback.textContent="Aika loppui!";return}
 frame=requestAnimationFrame(tick)
}

function parseAnswer(v){
 v=v.trim().replace(",",".");
 if(v.includes("/")){
  const p=v.split("/");
  if(p.length===2)return Number(p[0])/Number(p[1])
 }
 return Number(v)
}

form.addEventListener("submit",e=>{
 e.preventDefault();
 const v=parseAnswer(answerEl.value);
 if(Number.isFinite(v)&&Math.abs(v-answer)<1e-9){
   score+=100;
   scoreEl.textContent=score;
   feedback.textContent="Oikein!";
   feedback.className="feedback right";
   cancelAnimationFrame(frame);
   task++;
   if(task>=8){
     task=0;
     field++;
     if(field>=10){
       feedback.textContent="Kaikki kentät läpäisty!";
       return
     }
     applyFieldTheme()
   }
   setTimeout(()=>{newQuestion();frame=requestAnimationFrame(tick)},350)
 }else{
   feedback.textContent="Väärä vastaus!";
   feedback.className="feedback wrong"
 }
});

applyFieldTheme();
newQuestion();
frame=requestAnimationFrame(tick);
</script>
</body></html>
