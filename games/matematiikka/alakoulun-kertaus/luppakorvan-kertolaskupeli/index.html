<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Luppakorvan kertolaskupolku</title>
  <meta name="description" content="Harjoittele kertotauluja 2–10 iloisessa tablettipelissä.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='16' width='64' height='64' fill='%23e83e8c'/%3E%3Cpath d='M17 19c7-9 23-9 30 0v24c-8 10-22 10-30 0z' fill='%23fff'/%3E%3Ccircle cx='25' cy='31' r='3' fill='%23274358'/%3E%3Ccircle cx='39' cy='31' r='3' fill='%23274358'/%3E%3Cpath d='M27 40q5 5 10 0' fill='none' stroke='%23274358' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#17344b;--pink:#e93f8d;--pink2:#ff78b3;--pale:#fff2f8;--green:#28a96b;--red:#e24c5b;--card:rgba(255,255,255,.91);--shadow:0 14px 36px rgba(35,61,84,.16)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:ui-rounded,"Arial Rounded MT Bold",Nunito,system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
    body{min-height:100svh;background:#fdf7fb url('assets/unicorn-bg.png') center/cover fixed no-repeat;touch-action:manipulation}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:4px solid #218bc7;outline-offset:3px}
    .app{min-height:100svh;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:center}
    .shell{width:min(1180px,100%);height:min(790px,calc(100svh - 28px));min-height:560px;position:relative;background:rgba(255,255,255,.66);border:2px solid rgba(255,255,255,.88);border-radius:32px;box-shadow:var(--shadow);backdrop-filter:blur(11px);overflow:hidden}
    .topbar{height:76px;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(233,63,141,.13)}
    .brand{font-size:clamp(1.35rem,2.2vw,2rem);font-weight:900;letter-spacing:-.03em;display:flex;gap:10px;align-items:center}.brand span{color:var(--pink)}
    .audio-controls{display:flex;gap:8px}.iconbtn{width:50px;height:50px;border:0;border-radius:16px;background:#fff;box-shadow:0 5px 14px #c88da933;font-size:1.35rem;font-weight:900;cursor:pointer}
    .screen{height:calc(100% - 76px);padding:24px;display:none}.screen.active{display:flex}
    #menu{flex-direction:column;justify-content:center;gap:18px}.menu-head{text-align:center}.menu-head h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:0 0 10px}.menu-head p{margin:0;font-size:clamp(1rem,2vw,1.35rem);font-weight:750}
    .modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(900px,100%);margin:0 auto;position:relative;z-index:2}
    .mode{min-height:140px;border:0;border-radius:25px;padding:18px 22px;text-align:left;background:linear-gradient(135deg,#fff,#fff0f7);box-shadow:0 9px 0 #e9bfd2,0 15px 26px #8a587522;cursor:pointer;display:grid;grid-template-columns:64px 1fr;align-items:center;gap:16px;transition:.16s transform}.mode:active{transform:translateY(6px);box-shadow:0 3px 0 #e9bfd2}.num{width:58px;height:58px;border-radius:18px;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:1.8rem;font-weight:950}.mode b{display:block;font-size:clamp(1.2rem,2vw,1.55rem);margin-bottom:5px}.mode small{font-size:.96rem;font-weight:700;color:#537083}
    .menu-dog{position:absolute;width:clamp(150px,18vw,230px);height:clamp(155px,19vw,240px);right:-15px;bottom:-20px;background:url('assets/lapphund-bow-poses.png') left center/300% 100% no-repeat;filter:drop-shadow(0 10px 9px #4c35452c);pointer-events:none;z-index:1}
    #game{padding:14px 18px 18px;flex-direction:column}.game-head{display:flex;align-items:center;gap:12px;height:54px}.back{border:0;background:#fff;border-radius:15px;padding:10px 16px;font-weight:900;cursor:pointer;box-shadow:0 4px 12px #76485d26}.title{font-weight:900;font-size:1.2rem;white-space:nowrap}.progress{height:16px;flex:1;background:#fff;border-radius:999px;overflow:hidden;border:2px solid #efd2df}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--pink));border-radius:999px;transition:.35s}.counter{font-weight:900;min-width:62px;text-align:right}
    .playgrid{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.65fr);gap:18px;padding-top:12px}.stage,.calc{background:var(--card);border-radius:26px;box-shadow:0 10px 26px #704c641e}.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 190px 16px 26px;overflow:hidden}.instruction{font-size:clamp(1rem,2vw,1.35rem);font-weight:800;color:#587184;text-align:center;min-height:1.5em}.equation{font-size:clamp(3.2rem,8vw,6.4rem);font-weight:950;letter-spacing:-.055em;line-height:1.05;margin:12px 0;text-align:center}.equation .op{color:var(--pink)}
    .decomp{display:none;align-items:center;justify-content:center;gap:10px;font-size:clamp(1.8rem,4.2vw,3.5rem);font-weight:950;flex-wrap:wrap}.decomp.show{display:flex}.slot{display:inline-grid;place-items:center;min-width:1.25em;height:1.25em;padding:0 .1em;border:4px dashed #e798bb;border-radius:14px;background:#fff;color:var(--pink)}.slot.active{border-style:solid;box-shadow:0 0 0 5px #ffd6e8}.slot.ok{background:#d9f6e7;border-color:var(--green);color:#167849}.answer-boxes{display:flex;align-items:flex-end;gap:12px;margin-top:14px}.place{text-align:center}.place small{font-weight:900;color:#607a8b}.digit{width:clamp(70px,9vw,100px);height:clamp(70px,9vw,100px);display:grid;place-items:center;border:4px solid #eab0cb;border-radius:20px;background:#fff;font-size:clamp(2.4rem,5vw,4rem);font-weight:950}.place.active .digit{border-color:var(--pink);box-shadow:0 0 0 6px #ffd9e9}.digit.ok{background:#d8f7e6;border-color:var(--green);color:#167849}.dog{position:absolute;right:8px;bottom:-6px;width:clamp(170px,20vw,255px);height:clamp(180px,22vw,270px);background:url('assets/lapphund-bow-poses.png') left center/300% 100% no-repeat;filter:drop-shadow(0 9px 8px #2736492c);transform-origin:center bottom}.dog.happy{background-position:center}.dog.sad{background-position:right}.dog.bounce{animation:dogBounce .7s ease}.bubble{position:absolute;right:22px;top:18px;background:white;border:3px solid #ef9dc2;border-radius:20px;padding:10px 16px;font-weight:900;opacity:0;transform:translateY(8px);transition:.2s}.bubble.show{opacity:1;transform:none}
    .calc{padding:16px;display:flex;flex-direction:column;justify-content:center}.calc h2{text-align:center;margin:0 0 4px;font-size:1.15rem}.calc p{text-align:center;margin:0 0 12px;color:#617a8c;font-weight:800}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{min-height:62px;border:0;border-radius:18px;background:#fff;box-shadow:0 6px 0 #e3bfd0;font-size:1.8rem;font-weight:950;cursor:pointer}.key:active{transform:translateY(4px);box-shadow:0 2px 0 #e3bfd0}.key.zero{grid-column:2}.key.wrong{animation:shake .25s;background:#ffdce1;color:#ad2638}.key.correct{background:#cdf2df;color:#167849;box-shadow:0 6px 0 #86d4ad}
    #finish{position:absolute;inset:76px 0 0;z-index:10;background:linear-gradient(#fff7fbdd,#fff0f8ef);align-items:center;justify-content:center;text-align:center;flex-direction:column;overflow:hidden}.finish-copy{position:relative;z-index:2;margin-bottom:220px}.finish-copy h2{font-size:clamp(2.6rem,7vw,5.6rem);margin:0;color:var(--pink)}.finish-copy p{font-size:clamp(1.15rem,2.5vw,1.7rem);font-weight:900;margin:10px}.again{border:0;border-radius:18px;padding:15px 25px;background:var(--pink);color:#fff;font-weight:950;font-size:1.2rem;cursor:pointer;box-shadow:0 7px 0 #a52560}.dance-dog{position:absolute;bottom:-15px;width:clamp(270px,38vw,470px);height:clamp(280px,40vw,490px);background:url('assets/lapphund-bow-poses.png') center/300% 100% no-repeat;animation:dance 1.05s infinite ease-in-out;filter:drop-shadow(0 14px 12px #71364d38)}.note{position:absolute;font-size:2.5rem;color:var(--pink);font-weight:950;animation:notes 2s infinite ease-out}.n1{left:22%;bottom:22%;animation-delay:.2s}.n2{right:20%;bottom:28%;animation-delay:.8s}.n3{left:34%;bottom:42%;animation-delay:1.3s}
    @keyframes dogBounce{50%{transform:translateY(-18px) rotate(3deg)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@keyframes dance{0%,100%{transform:translateY(0) rotate(-6deg) scale(1)}25%{transform:translateY(-24px) rotate(7deg) scale(1.03)}50%{transform:translateY(0) rotate(-2deg) scale(.97)}75%{transform:translateY(-18px) rotate(8deg) scale(1.04)}}@keyframes notes{0%{opacity:0;transform:translateY(15px) rotate(-10deg)}30%{opacity:1}100%{opacity:0;transform:translateY(-110px) rotate(20deg)}}
    @media(max-width:760px){.shell{height:calc(100svh - 16px);min-height:620px;border-radius:24px}.app{padding:8px}.topbar{height:64px;padding:8px 10px}.topbar .brand{font-size:clamp(.9rem,4.4vw,1.15rem);gap:5px}.audio-controls{gap:5px}.iconbtn{width:42px;height:42px;border-radius:13px;font-size:1.12rem}.screen{height:calc(100% - 64px)}.screen#menu{padding:12px}.menu-head h1{font-size:2.25rem}.modes{grid-template-columns:1fr;gap:10px}.mode{min-height:91px;padding:10px 14px;grid-template-columns:50px 1fr}.num{width:48px;height:48px}.mode b{font-size:1.12rem}.menu-dog{opacity:.32}.playgrid{grid-template-columns:1fr;grid-template-rows:minmax(300px,1fr) auto;gap:10px}.stage{padding:12px 125px 12px 12px}.dog{width:145px;height:155px}.calc{padding:10px}.calc h2,.calc p{display:none}.keys{grid-template-columns:repeat(5,1fr);gap:7px}.key,.key.zero{grid-column:auto;min-height:55px}.equation{font-size:3.5rem}.decomp{font-size:2rem}.bubble{right:8px;top:8px;font-size:.85rem}.finish-copy{margin-bottom:190px}}
    @media(max-height:680px) and (orientation:landscape){.shell{height:calc(100svh - 12px);min-height:0}.app{padding:6px}.topbar{height:54px}.screen{height:calc(100% - 54px)}#game{padding:6px 12px 10px}.game-head{height:40px}.playgrid{grid-template-columns:minmax(0,1.4fr) minmax(320px,.6fr);grid-template-rows:1fr}.stage{padding-right:155px}.dog{width:180px;height:185px}.keys{grid-template-columns:repeat(5,1fr)}.key,.key.zero{grid-column:auto;min-height:55px}.calc h2,.calc p{display:none}.equation{font-size:4rem}.finish-copy{margin-bottom:150px}}

    .array{display:grid;justify-content:center;align-content:center;width:max-content;max-width:100%;margin:4px auto 2px;padding:10px 14px;border-radius:22px;background:linear-gradient(145deg,#fff8fc,#fff);box-shadow:inset 0 0 0 2px #f6d6e5;overflow:hidden}
    .dot{width:var(--dot-size,16px);aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#ff80b8,#dc2f7c);box-shadow:0 2px 0 #b52263}
    .streak{position:absolute;left:18px;top:18px;background:#fff;border:3px solid #f2b5d0;border-radius:16px;padding:8px 12px;font-weight:950;color:#a52560;opacity:0;transform:translateY(-8px);transition:.2s}.streak.show{opacity:1;transform:none}
    .timer{min-width:82px;text-align:center;padding:8px 10px;border-radius:14px;background:#fff;border:3px solid #f0c2d6;font-size:1.12rem;font-weight:950;color:#a52560;font-variant-numeric:tabular-nums}.timer.warn{background:#fff0ce;border-color:#efbd51;color:#8a5900}.timer.danger{background:#ffe0e5;border-color:#e24c5b;color:#ad2638;animation:timerPulse .55s infinite alternate}
    .countdown{display:none;position:absolute;inset:0;z-index:8;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(255,238,247,.97));font-size:clamp(5rem,17vw,10rem);font-weight:950;color:var(--pink);text-shadow:0 8px 0 #ffd0e4}.countdown.show{display:grid}.countdown.go{font-size:clamp(3.4rem,10vw,7rem)}
    #timeout{position:absolute;inset:76px 0 0;z-index:11;background:linear-gradient(#fff8fcf2,#fff0f7f5);overflow:hidden}#timeout.active{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(240px,.85fr);align-items:center;padding:clamp(18px,4vw,54px);gap:12px}.timeout-copy{position:relative;z-index:2;margin:0;max-width:650px;justify-self:center}.timeout-copy h2{font-size:clamp(2.6rem,6vw,4.8rem);line-height:.95;margin:0;color:#a52560}.timeout-copy p{font-size:clamp(1.05rem,2.2vw,1.45rem);line-height:1.25;font-weight:900;margin:18px 0}.timeout-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.timeout-dog{position:relative;right:auto;bottom:auto;transform:none;width:min(100%,430px);height:min(76vh,400px);justify-self:center;align-self:end}
    .dog.barking{animation:dogMouth .28s steps(1,end) infinite}.dog.bounce.barking{animation:dogBounce .7s ease,dogMouth .28s steps(1,end) infinite}.dance-dog.barking{animation:dance 1.05s infinite ease-in-out,dogMouth .28s steps(1,end) infinite}
    @keyframes timerPulse{to{transform:scale(1.06)}}@keyframes dogMouth{0%,49%{background-position:left center}50%,100%{background-position:center center}}
    .modes.many{grid-template-columns:repeat(3,minmax(0,1fr));max-width:980px}.modes.many .mode{min-height:112px;padding:14px 16px;grid-template-columns:54px 1fr}.modes.many .num{width:50px;height:50px;font-size:1.45rem}.modes.many .mode b{font-size:clamp(1.05rem,1.6vw,1.35rem)}
    @media(max-width:760px){.timer{min-width:64px;padding:5px;font-size:.88rem}.title{display:none}.modes.many{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.modes.many .mode{min-height:82px;padding:8px;grid-template-columns:39px 1fr;gap:8px}.modes.many .num{width:38px;height:38px;border-radius:12px;font-size:1.08rem}.modes.many .mode b{font-size:.94rem;margin:0}.modes.many .mode small{font-size:.75rem}.array{padding:6px 8px;border-radius:16px}.stage{justify-content:flex-start;padding-top:16px}.equation{margin:4px 0}.instruction{min-height:1.2em}.streak{left:8px;top:8px;font-size:.82rem}#timeout.active{grid-template-columns:1fr;grid-template-rows:auto minmax(150px,1fr);padding:16px 12px 0;gap:2px}.timeout-copy h2{font-size:clamp(2.4rem,11vw,4rem)}.timeout-copy p{margin:10px 0}.timeout-dog{height:min(36vh,260px);align-self:end}.timeout-actions{gap:8px}.timeout-actions button{padding:11px 15px;font-size:1rem}}
    @media(max-height:680px) and (orientation:landscape){.array{padding:5px 7px}.equation{margin:1px 0}.stage{justify-content:center;padding-top:6px}#timeout.active{grid-template-columns:minmax(0,1.2fr) minmax(220px,.8fr);grid-template-rows:1fr;padding:10px 28px}.timeout-copy h2{font-size:clamp(2.5rem,7vw,4rem)}.timeout-copy p{margin:10px 0}.timeout-dog{height:calc(100svh - 105px)}}
  </style>
</head>
<body>
<main class="app"><section class="shell">
  <header class="topbar"><div class="brand">Luppakorvan <span>kertolaskupolku</span></div><div class="audio-controls"><button class="iconbtn" id="music-toggle" aria-label="Musiikki päällä">♫</button><button class="iconbtn" id="sound" aria-label="Puhe ja tehosteet päällä">🔊</button></div></header>
  <section class="screen active" id="menu">
    <div class="menu-head"><h1>Valitse kertotaulut</h1><p>Harjoittele omaan tahtiin. Luppakorva kannustaa matkalla.</p></div>
    <div class="modes many">
      <button class="mode" data-mode="easy"><span class="num">1</span><span><b>Hyvä alku</b><small>2:n, 5:n ja 10:n kertotaulut</small></span></button>
      <button class="mode" data-mode="middle"><span class="num">2</span><span><b>Kolmoset ja neloset</b><small>3:n ja 4:n kertotaulut</small></span></button>
      <button class="mode" data-mode="six"><span class="num">3</span><span><b>Kuutosten kenttä</b><small>6:n kertotaulu</small></span></button>
      <button class="mode" data-mode="seven"><span class="num">4</span><span><b>Seiskojen kenttä</b><small>7:n kertotaulu</small></span></button>
      <button class="mode" data-mode="eight"><span class="num">5</span><span><b>Kahdeksikkojen kenttä</b><small>8:n kertotaulu</small></span></button>
      <button class="mode" data-mode="all"><span class="num">★</span><span><b>Kokonaisharjoitus</b><small>Kaikki kertotaulut 2–10</small></span></button>
    </div><div class="menu-dog" aria-hidden="true"></div>
  </section>
  <section class="screen" id="game">
    <div class="game-head"><button class="back">← Valikko</button><div class="title"></div><div class="timer" aria-label="Aikaa jäljellä">10,0 s</div><div class="progress"><i></i></div><div class="counter"></div></div>
    <div class="playgrid">
      <section class="stage"><div class="countdown" aria-live="assertive"></div><div class="instruction"></div><div class="equation"></div><div class="array" aria-label="Kertolasku kuvana"></div><div class="answer-boxes"><div class="place hundreds"><small>sadat</small><div class="digit"></div></div><div class="place tens"><small>kymmenet</small><div class="digit"></div></div><div class="place ones"><small>ykköset</small><div class="digit"></div></div></div><div class="streak"></div><div class="bubble"></div><div class="dog" role="img" aria-label="Suomenlapinkoira pinkissä rusetissa"></div></section>
      <aside class="calc"><h2>Vastauslaskin</h2><p class="calc-help">Paina vastauksen numerot järjestyksessä.</p><div class="keys"></div></aside>
    </div>
  </section>
  <section class="screen" id="timeout"><div class="timeout-copy"><h2>Aika loppui</h2><p class="timeout-score"></p><div class="timeout-actions"><button class="again retry">Yritä uudelleen</button><button class="back timeout-menu">Valitse toinen kenttä</button></div></div><div class="dog sad timeout-dog" aria-label="Murjottava suomenlapinkoira"></div></section>
  <section class="screen" id="finish"><div class="finish-copy"><h2>Mahtavaa!</h2><p>Kertolaskupolku tuli valmiiksi!</p><button class="again">Valitse uusi harjoitus</button></div><span class="note n1">♪</span><span class="note n2">♫</span><span class="note n3">♪</span><div class="dance-dog"></div></section>
</section></main>
<audio id="music" src="assets/unicorn-garden.mp3" preload="auto" loop></audio><audio id="bark" src="assets/dog-bark.mp3" preload="auto"></audio><audio id="whimper" src="assets/dog-whimper.mp3" preload="auto"></audio>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const menu=$('#menu'),game=$('#game'),finish=$('#finish'),timeout=$('#timeout'),keys=$('.keys'),bark=$('#bark'),whimper=$('#whimper'),music=$('#music');
let mode='',deck=[],round=0,step=0,answerDigits=[],task=null,effectsMuted=false,musicMuted=false,barkTimer=null,barkStartTimer=null,warningTimer=null,clockTimer=null,countdownTimer=null,lastTick=0,timeBank=10,timerRunning=false,streak=0,locked=false;
music.volume=.12;
for(let n=1;n<=9;n++)keys.insertAdjacentHTML('beforeend',`<button class="key" data-n="${n}">${n}</button>`);
keys.insertAdjacentHTML('beforeend','<button class="key zero" data-n="0">0</button>');
const names={easy:'2, 5 ja 10',middle:'3 ja 4',six:'6:n kertotaulu',seven:'7:n kertotaulu',eight:'8:n kertotaulu',all:'Kokonaisharjoitus'};
const tables={easy:[2,5,10],middle:[3,4],six:[6],seven:[7],eight:[8],all:[2,3,4,5,6,7,8,9,10]};
function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(m){
  const count=m==='all'?40:20,onesCount=m==='all'?5:3,pool=[];
  for(const table of tables[m])for(let n=2;n<=10;n++)pool.push({a:n,b:table,ans:n*table});
  const result=[],target=count-onesCount;
  while(result.length<target){
    const cycle=shuffle(pool.map(t=>({...t})));
    for(const t of cycle){if(result.length>=target)break;if(result.length&&result.at(-1).a===t.a&&result.at(-1).b===t.b)continue;result.push(t)}
  }
  const ones=shuffle([2,3,4,5,6,7,8,9,10]).slice(0,onesCount).map(n=>({a:n,b:1,ans:n}));
  return shuffle([...result,...ones]);
}
function drawTimer(){const el=$('.timer');el.textContent=`${Math.max(0,timeBank).toFixed(1).replace('.',',')} s`;el.classList.toggle('warn',timeBank<=5&&timeBank>3);el.classList.toggle('danger',timeBank<=3)}
function setStageBarking(on){const dog=$('.stage .dog');if(dog)dog.classList.toggle('barking',on)}
function setDanceBarking(on){$('.dance-dog').classList.toggle('barking',on)}
function stopWarning(){clearInterval(warningTimer);warningTimer=null;setStageBarking(false);bark.pause();bark.currentTime=0}
function startWarning(){if(warningTimer||effectsMuted)return;setStageBarking(true);const warn=()=>{bark.currentTime=0;bark.play().catch(()=>{})};warn();warningTimer=setInterval(warn,850)}
function stopClock(){timerRunning=false;clearInterval(clockTimer);clockTimer=null;clearInterval(countdownTimer);countdownTimer=null;$('.countdown').classList.remove('show','go');stopWarning()}
function startClock(){clearInterval(clockTimer);lastTick=performance.now();timerRunning=true;drawTimer();clockTimer=setInterval(()=>{if(!timerRunning)return;const now=performance.now();timeBank-=(now-lastTick)/1000;lastTick=now;drawTimer();if(timeBank<=3&&timeBank>0)startWarning();if(timeBank<=0)timeOut()},50)}
function runCountdown(){
  locked=true;timerRunning=false;let n=5;const el=$('.countdown');el.textContent=n;el.classList.add('show');el.classList.remove('go');
  countdownTimer=setInterval(()=>{n--;if(n>0){el.textContent=n;return}if(n===0){el.textContent='Aloita!';el.classList.add('go');return}clearInterval(countdownTimer);countdownTimer=null;el.classList.remove('show','go');locked=false;startClock()},650)
}
function start(m){stopClock();mode=m;deck=makeDeck(m);round=0;streak=0;timeBank=10;menu.classList.remove('active');finish.classList.remove('active');timeout.classList.remove('active');game.classList.add('active');$('.title').textContent=names[m];if(!musicMuted)music.play().catch(()=>{});showTask(false,true)}
function fitArray(){
  if(!task||!game.classList.contains('active'))return;
  const el=$('.array'),stage=$('.stage'),rows=task.a,cols=task.b;
  const compact=rows>=8||cols>=8||rows*cols>=56,gap=compact?2:4;
  const padX=compact?14:24,padY=compact?10:18;
  const maxW=Math.min(430,Math.max(120,stage.clientWidth-(innerWidth<=760?145:230)));
  const maxH=Math.min(190,Math.max(76,stage.clientHeight-(innerHeight<=680?185:220)));
  const byW=Math.floor((maxW-padX-gap*(cols-1))/cols),byH=Math.floor((maxH-padY-gap*(rows-1))/rows);
  const size=Math.max(5,Math.min(20,byW,byH));
  el.style.gap=`${gap}px`;el.style.gridTemplateColumns=`repeat(${cols},${size}px)`;el.style.setProperty('--dot-size',`${size}px`);
}
function showTask(addTime=true,withCountdown=false){
  if(addTime)timeBank+=10;stopWarning();
  task=deck[round];answerDigits=String(task.ans).split('').map(Number);step=0;locked=false;$('.dog').className='dog';$('.bubble').classList.remove('show');$('.streak').classList.remove('show');$('.counter').textContent=`${round+1} / ${deck.length}`;$('.progress i').style.width=`${round/deck.length*100}%`;
  $('.equation').innerHTML=`${task.a} <span class="op">·</span> ${task.b}`;
  const array=$('.array');array.innerHTML='';
  for(let i=0;i<task.a*task.b;i++)array.insertAdjacentHTML('beforeend','<span class="dot"></span>');
  $('.hundreds').style.display=answerDigits.length===3?'':'none';$('.tens').style.display=answerDigits.length>=2?'':'none';$$('.answer-boxes .digit').forEach(x=>{x.textContent='';x.classList.remove('ok')});updateFocus();fitArray();requestAnimationFrame(fitArray);withCountdown?runCountdown():startClock();
}
function activePlace(){return answerDigits.length===3?['.hundreds','.tens','.ones'][step]:answerDigits.length===2?['.tens','.ones'][step]:'.ones'}
function expected(){return answerDigits[step]}
function updateFocus(){$$('.place').forEach(x=>x.classList.remove('active'));$(activePlace()).classList.add('active');const labels=answerDigits.length===3?['sadat','kymmenet','ykköset']:answerDigits.length===2?['kymmenet','ykköset']:['ykköset'];$('.instruction').textContent=`Laske ja paina vastauksen ${labels[step]}.`}
function wrong(btn){streak=0;btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),350);$('.dog').className='dog sad';$('.bubble').textContent='Kokeile vielä!';$('.bubble').classList.add('show');if(!effectsMuted){whimper.currentTime=0;whimper.play().catch(()=>{})}}
function press(n,btn){
  if(locked)return;if(n!==expected()){wrong(btn);return}
  btn.classList.add('correct');setTimeout(()=>btn.classList.remove('correct'),300);const d=$(`${activePlace()} .digit`);d.textContent=n;d.classList.add('ok');step++;
  if(step===answerDigits.length){locked=true;timerRunning=false;stopWarning();streak++;$('.dog').className='dog happy bounce';const praise=streak>=3?`${streak} oikein peräkkäin!`:['Mahtavaa!','Hienosti!','Oikein!'][round%3];$('.bubble').textContent=praise;$('.bubble').classList.add('show');if(streak>=3){$('.streak').textContent=`⭐ ${streak} oikein peräkkäin`;$('.streak').classList.add('show')}if(!effectsMuted){setStageBarking(true);bark.currentTime=0;bark.play().catch(()=>{});setTimeout(()=>setStageBarking(false),650)}setTimeout(()=>{round++;round<deck.length?showTask(true):celebrate()},900)}else updateFocus()
}
function timeOut(){if(locked)return;locked=true;stopClock();game.classList.remove('active');$('.timeout-score').textContent=`Pääsit tehtävään ${round+1} / ${deck.length}. Kokeile uudelleen!`;timeout.classList.add('active');if(!effectsMuted){whimper.currentTime=0;whimper.play().catch(()=>{})}}
function celebrate(){stopClock();game.classList.remove('active');finish.classList.add('active');$('.progress i').style.width='100%';if(!effectsMuted){barkStartTimer=setTimeout(()=>{if(effectsMuted)return;setDanceBarking(true);bark.currentTime=0;bark.play().catch(()=>{});barkTimer=setInterval(()=>{bark.currentTime=0;bark.play().catch(()=>{})},1450)},300)}}
function goMenu(){stopClock();clearTimeout(barkStartTimer);barkStartTimer=null;clearInterval(barkTimer);barkTimer=null;setDanceBarking(false);setStageBarking(false);bark.pause();finish.classList.remove('active');timeout.classList.remove('active');game.classList.remove('active');menu.classList.add('active')}
$$('.mode').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));keys.addEventListener('click',e=>{const b=e.target.closest('.key');if(b)press(+b.dataset.n,b)});$('.game-head .back').addEventListener('click',goMenu);$('.finish-copy .again').addEventListener('click',goMenu);$('.retry').addEventListener('click',()=>start(mode));$('.timeout-menu').addEventListener('click',goMenu);
$('#sound').addEventListener('click',e=>{effectsMuted=!effectsMuted;e.currentTarget.textContent=effectsMuted?'🔇':'🔊';e.currentTarget.setAttribute('aria-label',effectsMuted?'Tehosteet pois':'Tehosteet päällä');if(effectsMuted){clearTimeout(barkStartTimer);clearInterval(barkTimer);setDanceBarking(false);setStageBarking(false);stopWarning();bark.pause();whimper.pause()}else if(timerRunning&&timeBank<=3)startWarning()});
$('#music-toggle').addEventListener('click',e=>{musicMuted=!musicMuted;e.currentTarget.textContent=musicMuted?'♩':'♫';e.currentTarget.setAttribute('aria-label',musicMuted?'Musiikki pois':'Musiikki päällä');if(musicMuted)music.pause();else music.play().catch(()=>{})});
addEventListener('resize',fitArray);
})();
</script></body></html>
