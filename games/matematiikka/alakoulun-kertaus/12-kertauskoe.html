": "text", "unit": "l"}, {"type": "input", "prompt": "Laske \\(10-0{,}2\\cdot(0{,}5+3{,}5)\\).", "correct": "9,2", "alts": [], "solution": "Sulut ensin, sitten kertolasku: \\(4\\), \\(0{,}8\\), joten tulos on \\(9{,}2\\).", "visual": "", "kind": "text"}, {"type": "input", "prompt": "Neljä kalaa ovat massaltaan 0,18 kg; 0,2 kg; 0,25 kg; 190 g. Laske keskimääräinen massa grammoina.", "correct": "205", "alts": [], "solution": "Muunna grammoiksi: 180 g; 200 g; 250 g; 190 g. \\((180+200+250+190)\\,\\mathrm g:4=205\\,\\mathrm g\\).", "visual": "", "kind": "text", "unit": "g"}];const PER=3;let page=0;const saved={};
function norm(s){return String(s??'').trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-').replace(/÷/g,':').replace(/·/g,'*')}
function fracValue(s){s=norm(s);if(/^[-+]?\d+(\.\d+)?$/.test(s))return Number(s);let m=s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);if(m)return Number(m[1])+(Number(m[1])<0?-1:1)*Number(m[2])/Number(m[3]);m=s.match(/^(-?\d+)\/(\d+)$/);if(m)return Number(m[1])/Number(m[2]);return NaN}
function equivalent(a,b){if(norm(a)===norm(b))return true;const x=fracValue(a),y=fracValue(b);return Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<1e-9}
function collect(){const start=page*PER;DATA.slice(start,start+PER).forEach((q,j)=>{const i=start+j;if(q.type==='mc'){const x=document.querySelector(`input[name=q${i}]:checked`);if(x)saved[i]={v:x.value}}else if(q.type==='input'){const x=document.getElementById('in'+i);if(x)saved[i]={v:x.value}}else{saved[i]={e:document.getElementById('ex'+i).value,r:document.getElementById('res'+i).value}}})}
function restore(i,q){const s=saved[i];if(!s)return;if(q.type==='mc'){const x=[...document.querySelectorAll(`input[name=q${i}]`)].find(z=>z.value===s.v);if(x)x.checked=true}else if(q.type==='input')document.getElementById('in'+i).value=s.v||'';else if(q.type==='expr'){document.getElementById('ex'+i).value=s.e||'';document.getElementById('res'+i).value=s.r||''}else if(q.type==='coordpoint'&&s.pt){pickPoint(i,s.pt[0],s.pt[1])}else if(q.type==='angle'&&s.a!=null){const a=document.getElementById('ang'+i);a.value=s.a;pickAngle(i,s.a)}}
function render(){const start=page*PER,root=document.getElementById('questions');document.getElementById('pageNo').textContent=(page+1)+' / '+Math.ceil(DATA.length/PER);root.innerHTML='';DATA.slice(start,start+PER).forEach((q,j)=>{const i=start+j,d=document.createElement('section');d.className='q';let b=`<h3>${i+1}. ${q.prompt}</h3>${q.visual?`<div class="visual">${q.visual}</div>`:''}`;if(q.type==='mc')b+=`<div class="choices">${q.choices.map(c=>`<label class="choice"><input type="radio" name="q${i}" value="${c.replaceAll('"','&quot;')}"> ${c}</label>`).join('')}</div>`;else if(q.type==='input')b+=`<div class="exprline"><input id="in${i}" type="text" placeholder="Vastaus"></div>`;else b+=`<div class="exprline"><span>Lasku:</span><input id="ex${i}" type="text" placeholder="laskulauseke"><span>=</span><input id="res${i}" type="text" placeholder="vastaus"></div>`;d.innerHTML=b;root.appendChild(d);restore(i,q)});document.getElementById('prev').disabled=page===0;document.getElementById('next').style.display=page===Math.ceil(DATA.length/PER)-1?'none':'inline-block';document.getElementById('finish').style.display=page===Math.ceil(DATA.length/PER)-1?'inline-block':'none';if(window.MathJax?.typesetPromise)MathJax.typesetPromise([root])}
function isok(q,i){const s=saved[i]||{};if(q.type==='mc')return s.v===q.correct;if(q.type==='input')return equivalent(s.v,q.correct)||(q.alts||[]).some(a=>equivalent(s.v,a));const ex=norm(s.e),allowed=q.expr_answers.map(norm);return allowed.includes(ex)&&equivalent(s.r,q.correct)}
function finish(){collect();let pts=0;DATA.forEach((q,i)=>{if(isok(q,i))pts++});const root=document.getElementById('questions');root.innerHTML=`<section class="q" style="grid-column:1/-1"><h2>Tulos: ${pts} / ${DATA.length}</h2><p>Alla ovat lyhyet ratkaisut kaikkiin tehtäviin.</p>${DATA.map((q,i)=>`<div class="solution"><b>${i+1}. ${isok(q,i)?'✓':'✗'}</b> ${q.solution}</div>`).join('')}</section>`;document.querySelector('.nav').style.display='none';document.getElementById('finish').style.display='none';if(window.MathJax?.typesetPromise)MathJax.typesetPromise([root])}
document.getElementById('prev').onclick=()=>{collect();if(page>0){page--;render()}};document.getElementById('next').onclick=()=>{collect();page++;render()};document.getElementById('finish').onclick=finish;render();
