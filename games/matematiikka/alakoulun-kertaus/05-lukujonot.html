<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lukujonot ja säännönmukaisuus</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6fa;color:#172033}
header{background:#fff;border-bottom:1px solid #dbe3ec;padding:17px 4%}header h1{margin:0;font-size:clamp(1.65rem,3.6vw,2.55rem)}header p{margin:.35rem 0 0;color:#5d6878}
.wrap{max-width:1220px;margin:auto;padding:17px 4% 34px}.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.badge{background:#fff;border:1px solid #dbe3ec;border-radius:10px;padding:7px 10px}
button{border:0;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer;background:#1769d2;color:#fff}button.secondary{background:#e9eef5;color:#172033}button:disabled{opacity:.4}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.q{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:13px;min-height:150px;box-shadow:0 3px 13px rgba(25,45,70,.04)}
.q h3{font-size:1rem;margin:.05rem 0 .5rem;line-height:1.35}.phase{display:inline-block;font-size:.75rem;font-weight:750;background:#eef3f8;border-radius:999px;padding:3px 8px;margin-bottom:7px;color:#526071}.choices{display:grid;gap:6px;margin-top:8px}.choice{display:block;border:1px solid #ccd7e3;background:#fbfcfe;border-radius:9px;padding:7px 8px;cursor:pointer}.choice:hover{background:#f0f5fb}
input[type=text]{font:inherit;padding:8px;border:1px solid #bdc9d8;border-radius:8px;width:155px;max-width:100%}.exprline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.answerunit{font-weight:700;white-space:nowrap}.feedback{min-height:22px;margin-top:7px;font-weight:700}.ok{color:#14803d}.bad{color:#b42318}.solution{font-weight:400;margin-top:7px;padding:8px 9px;background:#f6f8fb;border-left:3px solid #9aabc0;border-radius:6px;line-height:1.36}
.coordpick{display:flex;flex-direction:column;align-items:center;gap:5px}.coordpick svg{max-width:310px;width:100%;height:auto}.hitpt{fill:transparent;cursor:pointer}.hitpt:hover{fill:#dceafa}.anglebox{position:relative;width:190px;height:105px;margin:4px auto}.ray{position:absolute;left:45px;bottom:25px;width:120px;height:3px;background:#172033;transform-origin:left center}.ray.moving{transform:rotate(-90deg)}.angleslider{width:min(280px,100%)}
.visual{display:flex;justify-content:center;align-items:center;min-height:82px;margin:5px 0 7px;overflow:auto}.visual svg{max-width:100%;height:auto}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:13px}.cardlink{text-decoration:none;color:inherit}.card{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:16px;min-height:128px;box-shadow:0 3px 13px rgba(25,45,70,.04)}.card:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(25,45,70,.09)}.card h2{font-size:1.08rem;margin:.1rem 0 .45rem}.small{color:#667085;font-size:.88rem}
@media(min-width:1050px){body.compact4 .qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}body.compact4 .q{min-height:145px}}
@media(max-width:780px){.qgrid{grid-template-columns:1fr}.q{min-height:0}}
</style><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script></head><body class="compact4"><header><h1>Lukujonot ja säännönmukaisuus</h1><p>Tehtävät vaikeutuvat perustaidosta soveltamiseen. Tarkistuksen jälkeen näet lyhyen ratkaisun.</p></header><main class="wrap"><div class="bar"><a href="index.html"><button class="secondary">← Etusivu</button></a><span class="badge">Sivu <b id="pageNo"></b></span><span class="badge">Vaihe: <b id="phaseName"></b></span><span class="badge">12 tehtävää</span><button id="check">Tarkista sivu</button></div><div id="questions" class="qgrid"></div><div class="nav"><button id="prev" class="secondary">← Edellinen</button><button id="next">Seuraava →</button></div></main>
<script>
const DATA=[{"type": "input", "prompt": "Jatka jonoa: 125, 150, 175, 200, …", "correct": "225", "alts": [], "solution": "Jokainen luku kasvaa 25:llä, joten seuraava on \\(200+25=225\\).", "visual": "", "kind": "text"}, {"type": "input", "prompt": "Jatka jonoa: 3,6; 3,2; 2,8; 2,4; …", "correct": "2", "alts": ["2,0"], "solution": "Jokaisessa vaiheessa vähennetään \\(0{,}4\\), joten seuraava on \\(2{,}0\\).", "visual": "", "kind": "text"}, {"type": "mc", "prompt": "Mikä sääntö sopii jonoon 7, 13, 19, 25, …?", "choices": ["lisää joka kerta 6", "kerro edellinen luku kahdella ja vähennä 1", "lisää joka kerta 5", "lisää joka kerta 7"], "correct": "lisää joka kerta 6", "solution": "Erotus peräkkäisten lukujen välillä on aina 6.", "visual": ""}, {"type": "input", "prompt": "Täydennä: 96, 48, 24, __, 6", "correct": "12", "alts": [], "solution": "Jokainen luku puolitetaan: \\(24:2=12\\).", "visual": "", "kind": "text"}, {"type": "input", "prompt": "Jono alkaa luvusta 5 ja jokaiseen lukuun lisätään 7. Mikä on jonon 10. luku?", "correct": "68", "alts": [], "solution": "Ensimmäisestä kymmenenteen tehdään 9 lisäystä: \\(5+9\\cdot7=68\\).", "visual": "", "kind": "text"}, {"type": "mc", "prompt": "Mikä sääntö sopii jonoon 2, 5, 11, 23, 47, …?", "choices": ["kerro edellinen luku kahdella ja lisää 1", "lisää joka kerta 3", "kerro edellinen luku kolmella ja vähennä 1", "lisää peräkkäiset parittomat luvut"], "correct": "kerro edellinen luku kahdella ja lisää 1", "solution": "Esimerkiksi \\(11\\cdot2+1=23\\) ja \\(23\\cdot2+1=47\\).", "visual": ""}, {"type": "input", "prompt": "Jatka: 1, 4, 9, 16, 25, …", "correct": "36", "alts": [], "solution": "Luvut ovat neliölukuja: \\(1^2,2^2,3^2,4^2,5^2\\). Seuraava on \\(6^2=36\\).", "visual": "", "kind": "text"}, {"type": "input", "prompt": "Jatka: 80, 72, 65, 59, 54, …", "correct": "50", "alts": [], "solution": "Vähennetään peräkkäin 8, 7, 6, 5, joten seuraavaksi vähennetään 4: \\(54-4=50\\).", "visual": "", "kind": "text"}, {"type": "mc", "prompt": "Mikä luku ei kuulu sääntöön 3, 6, 12, 24, 47, 96?", "choices": ["12", "24", "47", "96"], "correct": "47", "solution": "Sääntö on kaksinkertaistaminen. 24:n jälkeen pitäisi tulla 48, ei 47.", "visual": ""}, {"type": "input", "prompt": "Jatka jonoa: 2, 6, 12, 20, 30, …", "correct": "42", "alts": [], "solution": "Erotukset ovat 4, 6, 8, 10, joten seuraava erotus on 12: \\(30+12=42\\).", "visual": "", "kind": "text"}, {"type": "input", "prompt": "Jatka jonoa: 100; 50; 25; 12,5; …", "correct": "6,25", "alts": [], "solution": "Jokainen luku puolitetaan: \\(12{,}5:2=6{,}25\\).", "visual": "", "kind": "text"}, {"type": "mc", "prompt": "Mikä sääntö sopii jonoon 81, 27, 9, 3, …?", "choices": ["jaa kolmella", "vähennä 54", "kerro kolmella", "jaa kahdella"], "correct": "jaa kolmella", "solution": "\\(81:3=27\\), \\(27:3=9\\) ja \\(9:3=3\\).", "visual": ""}];const PER=4; let page=0; const saved={};
function norm(s){return String(s??'').trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-').replace(/÷/g,':').replace(/·/g,'*')}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function fracValue(s){s=norm(s); if(/^[-+]?\d+(\.\d+)?$/.test(s)) return Number(s); let m=s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/); if(m)return Number(m[1])+(Number(m[1])<0?-1:1)*Number(m[2])/Number(m[3]); m=s.match(/^(-?\d+)\/(\d+)$/); if(m)return Number(m[1])/Number(m[2]); return NaN}
function equivalent(a,b){if(norm(a)===norm(b))return true; const x=fracValue(a),y=fracValue(b);return Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<1e-9}
function coordWidget(i){let e=`<div class="coordpick"><svg viewBox="0 0 320 320">`;for(let k=-5;k<=5;k++){let p=160+k*25;e+=`<line x1="${p}" y1="25" x2="${p}" y2="295" stroke="#e1e6ed"/><line x1="25" y1="${p}" x2="295" y2="${p}" stroke="#e1e6ed"/>`}e+=`<line x1="25" y1="160" x2="295" y2="160" stroke="#172033" stroke-width="2"/><line x1="160" y1="25" x2="160" y2="295" stroke="#172033" stroke-width="2"/><circle id="mark${i}" cx="160" cy="160" r="7" fill="#d9534f" style="display:none"/>`;for(let x=-5;x<=5;x++)for(let y=-5;y<=5;y++){e+=`<circle class="hitpt" cx="${160+x*25}" cy="${160-y*25}" r="8" onclick="pickPoint(${i},${x},${y})"/>`}return e+`</svg><span id="ptlabel${i}" class="small">Valitse piste ruudukolta.</span></div>`}function pickPoint(i,x,y){saved[i]={pt:[x,y]};const m=document.getElementById('mark'+i);if(m){m.setAttribute('cx',160+x*25);m.setAttribute('cy',160-y*25);m.style.display='block'}const l=document.getElementById('ptlabel'+i);if(l)l.textContent=`Valittu piste: (${x}, ${y})`}function angleWidget(i){return `<div class="anglebox"><div class="ray"></div><div class="ray moving" id="ray${i}"></div></div><div style="text-align:center"><input class="angleslider" id="ang${i}" type="range" min="0" max="180" value="90" oninput="pickAngle(${i},this.value)"><div id="anglabel${i}">90°</div></div>`}function pickAngle(i,v){v=Number(v);saved[i]={a:v};const r=document.getElementById('ray'+i);if(r)r.style.transform=`rotate(${-v}deg)`;const l=document.getElementById('anglabel'+i);if(l)l.textContent=v+'°'}
function collect(){const start=page*PER; DATA.slice(start,start+PER).forEach((q,j)=>{const i=start+j;if(q.type==='mc'){const x=document.querySelector(`input[name=q${i}]:checked`);if(x)saved[i]={v:x.value}}else if(q.type==='input'){const x=document.getElementById('in'+i);if(x)saved[i]={v:x.value}}else if(q.type==='expr'){const e=document.getElementById('ex'+i),r=document.getElementById('res'+i);if(e&&r)saved[i]={e:e.value,r:r.value}}})}
function restore(i,q){const s=saved[i];if(!s)return;if(q.type==='mc'){const x=[...document.querySelectorAll(`input[name=q${i}]`)].find(z=>z.value===s.v);if(x)x.checked=true}else if(q.type==='input'){document.getElementById('in'+i).value=s.v||''}else if(q.type==='expr'){document.getElementById('ex'+i).value=s.e||'';document.getElementById('res'+i).value=s.r||''}else if(q.type==='coordpoint'&&s.pt){pickPoint(i,s.pt[0],s.pt[1])}else if(q.type==='angle'&&s.a!=null){const a=document.getElementById('ang'+i);a.value=s.a;pickAngle(i,s.a)}}
function phase(i){const r=(i+1)/DATA.length;if(r<=.25)return'Perusta';if(r<=.5)return'Vahvistus';if(r<=.75)return'Soveltaminen';return'Haaste'}
function render(){const start=page*PER,qs=DATA.slice(start,start+PER);document.getElementById('pageNo').textContent=(page+1)+' / '+Math.ceil(DATA.length/PER);document.getElementById('phaseName').textContent=phase(start);const root=document.getElementById('questions');root.innerHTML='';qs.forEach((q,j)=>{const i=start+j,d=document.createElement('section');d.className='q';let b=`<div class="phase">${phase(i)}</div><h3>${i+1}. ${q.prompt}</h3>${q.visual?`<div class="visual">${q.visual}</div>`:''}`;if(q.type==='mc')b+=`<div class="choices">${q.choices.map(c=>`<label class="choice"><input type="radio" name="q${i}" value="${c.replaceAll('"','&quot;')}"> ${c}</label>`).join('')}</div>`;else if(q.type==='input')b+=`<div class="exprline"><input id="in${i}" type="text" inputmode="decimal" placeholder="Vastaus">${q.unit?`<span class="answerunit">${q.unit}</span>`:''}</div>`;else if(q.type==='expr')b+=`<div class="exprline"><span>Lasku:</span><input id="ex${i}" type="text" placeholder="laskulauseke"><span>=</span><input id="res${i}" type="text" inputmode="decimal" placeholder="vastaus">${q.unit?`<span class="answerunit">${q.unit}</span>`:''}</div>`;else if(q.type==='coordpoint')b+=coordWidget(i);else if(q.type==='angle')b+=angleWidget(i);b+=`<div id="fb${i}" class="feedback"></div>`;d.innerHTML=b;root.appendChild(d);restore(i,q)});document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page>=Math.ceil(DATA.length/PER)-1;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([root])}
function okAnswer(q,v){return equivalent(v,q.correct)||(q.alts||[]).some(a=>equivalent(v,a))}
function check(){collect();const start=page*PER;DATA.slice(start,start+PER).forEach((q,j)=>{const i=start+j,fb=document.getElementById('fb'+i);let ok=false;if(q.type==='mc'){const x=document.querySelector(`input[name=q${i}]:checked`);ok=!!x&&x.value===q.correct}else if(q.type==='input'){ok=okAnswer(q,document.getElementById('in'+i).value)}else if(q.type==='expr'){const ex=norm(document.getElementById('ex'+i).value),res=document.getElementById('res'+i).value;const allowed=q.expr_answers.map(norm);ok=allowed.includes(ex)&&okAnswer(q,res)}else if(q.type==='coordpoint'){const pt=(saved[i]||{}).pt;ok=!!pt&&pt[0]===q.correct[0]&&pt[1]===q.correct[1]}else if(q.type==='angle'){ok=Math.abs(((saved[i]||{}).a??-999)-q.correct)<=1}fb.innerHTML=(ok?'<span class="ok">Oikein!</span>':'<span class="bad">Tarkista vastaus.</span>')+`<div class="solution"><b>Ratkaisu:</b> ${q.solution}</div>`;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([fb])})}
document.getElementById('check').onclick=check;document.getElementById('prev').onclick=()=>{collect();if(page>0){page--;render()}};document.getElementById('next').onclick=()=>{collect();if(page<Math.ceil(DATA.length/PER)-1){page++;render()}};render();
</script></body></html>
