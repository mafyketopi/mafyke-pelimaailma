<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verrannollisuus ja koordinaatisto</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#617087;--line:#dce3ed;--accent:#3559e0;--ok:#198754;--bad:#c0392b;--soft:#eef2ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:20px 5%}header h1{margin:0 0 5px;font-size:clamp(1.7rem,4vw,2.6rem)}header p{margin:0;color:var(--muted)}main{max-width:1180px;margin:auto;padding:20px 4% 46px}.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden;flex:1;min-width:160px}.progress>div{height:100%;background:var(--accent)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 18px #1e32500d}.taskgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(420px,1.1fr);gap:18px;align-items:start}.tablewrap{margin:12px 0 16px}.tablewrap+.tablewrap{border-top:2px solid #e2e8f0;padding-top:15px}table{border-collapse:collapse;width:100%;table-layout:fixed;margin-top:7px}th,td{border:1px solid #cbd5e1;padding:8px;text-align:center}th{background:#f1f5f9}input{width:100%;max-width:90px;padding:8px;border:1px solid #b8c3d1;border-radius:8px;text-align:center;font:inherit}.answers{display:grid;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.answerRow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.answerRow label{flex:1 1 260px}.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#e9eef5;color:var(--ink)}.feedback{min-height:27px;margin-top:10px;font-weight:750}.ok{color:var(--ok)}.bad{color:var(--bad)}.hint{background:var(--soft);padding:11px 13px;border-radius:11px;margin:10px 0;color:#344268}.small{font-size:.92rem;color:var(--muted)}.hidden{display:none!important}.canvasWrap{background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:7px}.canvasWrap canvas{display:block;width:100%;height:auto;max-width:620px;margin:auto}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:.92rem}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}.a{background:#3559e0}.b{background:#e07a35}.package-home{position:fixed;right:12px;bottom:12px;background:#172033;color:#fff;text-decoration:none;padding:8px 12px;border-radius:999px;font:600 13px system-ui;z-index:20}@media(max-width:900px){.taskgrid{grid-template-columns:1fr}}@media(max-width:600px){main{padding:14px 3% 50px}.card{padding:12px}}
</style></head><body>
<a class="package-home" href="index.html">← Pelivalikko</a><header><h1>Verrannollisuus ja koordinaatisto</h1><p>Täytä ensin taulukko, piirrä kuvaaja ja vastaa vasta sen jälkeen kuvaajaa koskeviin kysymyksiin.</p></header>
<main><div class="topbar"><span class="pill">Tehtävä <b id="taskNum">1</b>/8</span><span class="pill">Pisteet <b id="score">0</b></span><div class="progress"><div id="prog"></div></div></div><section class="card" id="game"></section></main>
<script>
const tasks=[
{type:'direct',title:'1. Tuntipalkka',text:'Aino saa palkkaa 12 € tunnilta.',xs:[0,2,4,6],ys:[0,24,48,72],xMax:8,yMax:100,xStep:1,yStep:10,xLabel:'tunnit x',yLabel:'palkka y (€)',q:[['Paljonko Aino saa 5 tunnista?',60],['Kuinka monta tuntia pitää työskennellä saadakseen 96 €?',8]]},
{type:'direct',title:'2. Pyörän vuokraus',text:'Polkupyörän vuokra maksaa 7 € tunnilta.',xs:[0,1,3,5],ys:[0,7,21,35],xMax:7,yMax:50,xStep:1,yStep:5,xLabel:'tunnit x',yLabel:'hinta y (€)',q:[['Paljonko 6 tunnin vuokra maksaa?',42],['Kuinka monta tuntia saa 28 eurolla?',4]]},
{type:'spa',title:'3. Kylpylä: jäsen vai ei?',text:'Ilman jäsenyyttä käynti maksaa 14 €. Jäsenenä maksat 30 € jäsenmaksun ja 8 € käynniltä.',xs:[0,2,5,8],yA:[0,28,70,112],yB:[30,46,70,94],xMax:10,yMax:140,xStep:1,yStep:10,xLabel:'käynnit x',yLabel:'hinta y (€)',q:[['Kuinka monella käynnillä hinnat ovat samat?',5],['Paljonko silloin on maksettu?',70]]},
{type:'spa',title:'4. Liikuntakeskus',text:'Kertakäynti maksaa 18 €. Kausikortissa perusmaksu on 36 € ja jokainen käynti 12 €.',xs:[0,2,6,10],yA:[0,36,108,180],yB:[36,60,108,156],xMax:12,yMax:220,xStep:1,yStep:20,xLabel:'käynnit x',yLabel:'hinta y (€)',q:[['Kuinka monella käynnillä hinnat ovat samat?',6],['Paljonko silloin on maksettu?',108]]},
{type:'inverse',title:'5. 100 km matka',text:'Matka on 100 km. Valitse itse viisi sopivaa nopeutta ja laske matka-ajat.',customX:true,d:100,xMax:120,yMax:6,xStep:20,yStep:1,xLabel:'nopeus x (km/h)',yLabel:'aika y (h)',q:[['Arvioi kuvaajasta aika nopeudella 50 km/h.',2],['Mikä nopeus tarvitaan, jos aikaa on 2,5 h?',40]]},
{type:'inverse',title:'6. 120 km matka',text:'Matka on 120 km. Täydennä taulukko ja piirrä ajan kuvaaja nopeuden funktiona.',xs:[20,30,40,60,120],ys:[6,4,3,2,1],d:120,xMax:140,yMax:7,xStep:20,yStep:1,xLabel:'nopeus x (km/h)',yLabel:'aika y (h)',q:[['Kuinka kauan matka kestää nopeudella 60 km/h?',2],['Mikä nopeus tarvitaan, jos aikaa on 3 h?',40]]},
{type:'mix',title:'7. Hyperbeli ja suora',text:'Piirrä y = 12/x ja y = x + 1 samaan koordinaatistoon.',xs:[1,2,3,4,6],ys:[12,6,4,3,2],d:12,line:x=>x+1,xMax:8,yMax:14,xStep:1,yStep:1,xLabel:'x',yLabel:'y',q:[['Leikkauspisteen x-koordinaatti?',3],['Leikkauspisteen y-koordinaatti?',4]]},
{type:'mix',title:'8. Haaste',text:'Valitse itse viisi x-arvoa hyperbelille y = 20/x. Piirrä sen jälkeen myös y = x + 1.',customX:true,d:20,line:x=>x+1,xMax:10,yMax:22,xStep:1,yStep:2,xLabel:'x',yLabel:'y',q:[['Leikkauspisteen x-koordinaatti?',4],['Leikkauspisteen y-koordinaatti?',5]]}
];
let idx=0,score=0,tableOK=false,answered=false,currentXs=[],currentYs=[];const $=id=>document.getElementById(id);const fmt=n=>Number.isInteger(n)?String(n):String(Number(n.toFixed(2))).replace('.',',');const num=s=>Number(String(s).trim().replace(',','.'));const near=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<.06;
function computed(t,x){if(t.type==='inverse'||t.type==='mix')return t.d/x;return null}
function render(){tableOK=false;answered=false;const t=tasks[idx];$('taskNum').textContent=idx+1;$('score').textContent=score;$('prog').style.width=(idx/tasks.length*100)+'%';currentXs=t.xs?[...t.xs]:[];currentYs=t.ys?[...t.ys]:[];let tables=t.type==='spa'?tableHTML('1. Ilman jäsenyyttä / kertakäynnit',t.xs,t.yA,'a',false)+tableHTML('2. Jäsenyys / kausikortti',t.xs,t.yB,'b',false):tableHTML(t.type==='inverse'?'Nopeus ja aika':'Arvotaulukko',t.xs||Array(5).fill(''),t.ys||Array(5).fill(''),'a',!!t.customX);let qs=t.q.map((q,i)=>`<div class="answerRow"><label>${q[0]}</label><input id="q${i}" inputmode="decimal"></div>`).join('');$('game').innerHTML=`<h2>${t.title}</h2><p>${t.text}</p>${t.type==='inverse'?'<div class="hint">Kun matka on vakio: aika = matka / nopeus. Valitse nopeudet niin, että ne ovat positiivisia ja toisistaan poikkeavia.</div>':''}<div class="taskgrid"><div>${tables}<div class="btns"><button class="primary" onclick="checkTable()">Tarkista taulukko ja piirrä</button><button class="secondary" onclick="render()">Tyhjennä</button></div><div id="tableFb" class="feedback"></div><div id="questionArea" class="answers hidden">${qs}<div class="btns"><button class="primary" onclick="checkQuestions()">Tarkista vastaukset</button></div><div id="qFb" class="feedback"></div></div><div class="btns"><button class="secondary" onclick="nextTask()">Seuraava tehtävä →</button></div></div><div><div class="canvasWrap"><canvas id="graph" width="620" height="500"></canvas></div><div class="legend">${legend(t)}</div></div></div>`;drawAxes(t)}
function tableHTML(title,xs,ys,prefix,custom){let xrow=xs.map((x,i)=>custom?`<td><input id="x${i}" inputmode="decimal" placeholder="x"></td>`:`<td>${fmt(x)}</td>`).join('');let yrow=ys.map((_,i)=>`<td><input id="${prefix}${i}" inputmode="decimal" placeholder="y"></td>`).join('');return `<div class="tablewrap"><b>${title}</b><table><tr><th>x</th>${xrow}</tr><tr><th>y</th>${yrow}</tr></table></div>`}
function legend(t){if(t.type==='spa')return '<span><i class="dot a"></i>1. kuvaaja</span><span><i class="dot b"></i>2. kuvaaja</span>';if(t.type==='mix')return '<span><i class="dot a"></i>hyperbeli</span><span><i class="dot b"></i>suora</span>';return '<span><i class="dot a"></i>kuvaaja</span>'}
function mark(el,ok){el.style.borderColor=ok?'#198754':'#c0392b';el.style.background=ok?'#eefaf2':'#fff1ef'}
function checkTable(){const t=tasks[idx];let ok=true;if(t.customX){currentXs=[0,1,2,3,4].map(i=>num($('x'+i).value));const distinct=new Set(currentXs.map(x=>String(x))).size===5;const xgood=currentXs.every(x=>Number.isFinite(x)&&x>0&&x<=t.xMax)&&distinct;[0,1,2,3,4].forEach(i=>mark($('x'+i),xgood&&currentXs[i]>0));ok=ok&&xgood;currentYs=currentXs.map(x=>computed(t,x));}if(t.type==='spa'){t.yA.forEach((y,i)=>{const e=$('a'+i),g=near(num(e.value),y);mark(e,g);ok=ok&&g});t.yB.forEach((y,i)=>{const e=$('b'+i),g=near(num(e.value),y);mark(e,g);ok=ok&&g})}else{const ys=t.customX?currentYs:t.ys;ys.forEach((y,i)=>{const e=$('a'+i),g=near(num(e.value),y);mark(e,g);ok=ok&&g})}if(ok){tableOK=true;$('tableFb').innerHTML='<span class="ok">Taulukko oikein. Kuvaaja on nyt piirretty – käytä sitä seuraaviin kysymyksiin.</span>';$('questionArea').classList.remove('hidden');drawSolution(t)}else $('tableFb').innerHTML='<span class="bad">Tarkista punaisella merkityt taulukon arvot.</span>'}
function checkQuestions(){const t=tasks[idx];let ok=true;t.q.forEach((q,i)=>{const e=$('q'+i),g=near(num(e.value),q[1]);mark(e,g);ok=ok&&g});if(ok){if(!answered){score++;answered=true;$('score').textContent=score}$('qFb').innerHTML='<span class="ok">Oikein!</span>';drawSolution(t,true)}else $('qFb').innerHTML='<span class="bad">Katso kuvaajaa vielä kerran.</span>'}
function nextTask(){if(idx<tasks.length-1){idx++;render()}else{$('prog').style.width='100%';$('game').innerHTML=`<h2>Valmis!</h2><p>Sait ${score} / ${tasks.length} pistettä.</p><button class="primary" onclick="idx=0;score=0;render()">Aloita alusta</button>`}}
function drawAxes(t){const c=$('graph'),ctx=c.getContext('2d'),W=c.width,H=c.height,m={l:68,r:24,t:24,b:58};ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const X=x=>m.l+x/t.xMax*(W-m.l-m.r),Y=y=>H-m.b-y/t.yMax*(H-m.t-m.b);ctx.font='bold 13px system-ui';for(let x=0;x<=t.xMax+1e-9;x+=t.xStep){ctx.strokeStyle='#c1cad7';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(X(x),m.t);ctx.lineTo(X(x),H-m.b);ctx.stroke();ctx.fillStyle='#334155';ctx.textAlign='center';ctx.fillText(fmt(x),X(x),H-m.b+20)}for(let y=0;y<=t.yMax+1e-9;y+=t.yStep){ctx.strokeStyle='#c1cad7';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(m.l,Y(y));ctx.lineTo(W-m.r,Y(y));ctx.stroke();ctx.fillStyle='#334155';ctx.textAlign='right';ctx.fillText(fmt(y),m.l-9,Y(y)+4)}ctx.strokeStyle='#0f172a';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(m.l,m.t);ctx.lineTo(m.l,H-m.b);ctx.lineTo(W-m.r,H-m.b);ctx.stroke();ctx.fillStyle='#0f172a';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(t.xLabel,W/2,H-12);ctx.save();ctx.translate(18,H/2);ctx.rotate(-Math.PI/2);ctx.fillText(t.yLabel,0,0);ctx.restore();return{ctx,X,Y}}
function drawSolution(t,highlight=false){const g=drawAxes(t),{ctx,X,Y}=g;function curve(fn,color,start,end,step=.04){ctx.strokeStyle=color;ctx.lineWidth=3.5;ctx.beginPath();let begun=false;for(let x=start;x<=end;x+=step){const y=fn(x);if(!isFinite(y)||y<0||y>t.yMax*1.15){begun=false;continue}if(!begun){ctx.moveTo(X(x),Y(y));begun=true}else ctx.lineTo(X(x),Y(y))}ctx.stroke()}function pts(xs,ys,color){ctx.fillStyle=color;xs.forEach((x,i)=>{ctx.beginPath();ctx.arc(X(x),Y(ys[i]),5,0,Math.PI*2);ctx.fill()})}if(t.type==='direct'){curve(x=>t.ys[1]/t.xs[1]*x,'#3559e0',0,t.xMax);pts(t.xs,t.ys,'#3559e0')}if(t.type==='spa'){const ka=t.yA[1]/t.xs[1],kb=(t.yB[1]-t.yB[0])/t.xs[1];curve(x=>ka*x,'#3559e0',0,t.xMax);curve(x=>t.yB[0]+kb*x,'#e07a35',0,t.xMax);pts(t.xs,t.yA,'#3559e0');pts(t.xs,t.yB,'#e07a35')}if(t.type==='inverse'){curve(x=>t.d/x,'#3559e0',Math.max(.4,t.xStep/5),t.xMax);pts(currentXs.length?currentXs:t.xs,currentYs.length?currentYs:t.ys,'#3559e0')}if(t.type==='mix'){curve(x=>t.d/x,'#3559e0',.25,t.xMax);curve(t.line,'#e07a35',0,t.xMax);pts(currentXs.length?currentXs:t.xs,currentYs.length?currentYs:t.ys,'#3559e0')}if(highlight&&(t.type==='spa'||t.type==='mix')){const x=t.q[0][1],y=t.q[1][1];ctx.strokeStyle='#198754';ctx.lineWidth=4;ctx.beginPath();ctx.arc(X(x),Y(y),10,0,Math.PI*2);ctx.stroke()}}
render();
</script></body></html>
