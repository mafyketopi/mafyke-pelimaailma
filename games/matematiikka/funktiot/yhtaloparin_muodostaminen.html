<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yhtälöparin muodostaminen</title>

<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#617086;--line:#dce3ec;--blue:#2f6fed;--ok:#168451;--bad:#c43b3b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:22px 5%}header h1{margin:0 0 5px;font-size:clamp(1.8rem,4vw,2.7rem)}header p{margin:0;color:var(--muted)}main{max-width:900px;margin:auto;padding:22px 4%}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,28px);box-shadow:0 7px 22px #2030500d}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-weight:700}.story{font-size:1.18rem;line-height:1.55;margin:20px 0 14px}.meaning{background:#eef3ff;border-radius:12px;padding:13px 15px;line-height:1.7}.pair{display:grid;grid-template-columns:36px 1fr;align-items:center;margin:18px 0}.brace{font-family:Georgia,serif;font-size:5rem;line-height:.75}.fields{display:grid;gap:10px}.eqrow{display:flex;align-items:center;gap:8px}.eqrow input{width:min(100%,430px);padding:11px 13px;border:2px solid #c6d0de;border-radius:10px;font:1.08rem system-ui}.eqrow input.good{border-color:var(--ok);background:#f2fbf5}.eqrow input.bad{border-color:var(--bad);background:#fff5f5}.buttons{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 16px;font-weight:750;font-size:1rem;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e9eef6;color:var(--ink)}.feedback{min-height:30px;margin-top:13px;font-weight:700;line-height:1.5}.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}.solution{margin-top:12px;padding:12px 14px;background:#f7f9fc;border:1px solid var(--line);border-radius:11px}.hidden{display:none}.hint{color:var(--muted);font-size:.94rem;margin:8px 0 16px}

.package-home{position:fixed;right:14px;bottom:14px;z-index:9999;background:#172033;color:#fff;text-decoration:none;padding:9px 13px;border-radius:999px;font:600 14px system-ui,sans-serif;box-shadow:0 3px 14px #0002;opacity:.92}.package-home:hover{opacity:1}
@media(max-width:600px){.package-home{right:8px;bottom:8px;padding:7px 10px;font-size:12px}}

/* Käytettävyyskierros */

@media (min-width:900px){
  header{padding-top:12px!important;padding-bottom:12px!important}
  main{padding-top:14px!important;padding-bottom:24px!important}
}

.tasknav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}.tasknav button{min-width:38px;padding:7px 10px;border:1px solid #cfd8e4;border-radius:9px;background:#fff;color:#172033;font-weight:700;cursor:pointer}.tasknav button.active{background:#172033;color:#fff;border-color:#172033}
.eqpreview{min-height:28px;margin-top:5px;font-size:1.05rem}
</style></head><body>
<a class="package-home" href="index.html" aria-label="Takaisin pelivalikkoon">← Pelivalikko</a>
<header><h1>Yhtälöparin muodostaminen</h1><p>Muodosta kaksi yhtälöä sanallisen tehtävän tiedoista. Yhtälöparia ei tarvitse ratkaista.</p></header>
<main><section class="card"><div class="top"><span id="progress"></span><span id="score"></span></div><div class="tasknav" id="taskNav"></div><div class="story" id="story"></div><div class="meaning" id="meaning"></div><p class="hint">Kirjoita yhtäsuuruusmerkki mukaan. Yhtälöiden järjestyksellä tai puolten järjestyksellä ei ole väliä.</p><div class="pair"><div class="brace">{</div><div class="fields"><div class="eqrow"><input id="eq1" aria-label="Ensimmäinen yhtälö"><div class="eqpreview" id="prev1"></div></div><div class="eqrow"><input id="eq2" aria-label="Toinen yhtälö"><div class="eqpreview" id="prev2"></div></div></div></div><div class="buttons"><button class="primary" id="check">Tarkista</button><button class="secondary" id="next">Seuraava tehtävä</button></div><div class="feedback" id="feedback"></div><div class="solution hidden" id="solution"></div></section></main>
<script>
document.addEventListener('keydown',e=>{if(!e.target.matches('#eq1,#eq2'))return;if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();(e.target.id==='eq1'?document.getElementById('eq2'):document.getElementById('check')).focus()}if(e.key==='ArrowUp'&&e.target.id==='eq2'){e.preventDefault();document.getElementById('eq1').focus()}});
const tasks=[
 {story:'Pihalla on yhteensä 100 lintua ja kissaa. Eläimillä on yhteensä 230 jalkaa.',x:'kissojen määrä',y:'lintujen määrä',eqs:[[1,1,-100],[4,2,-230]],show:['x+y=100','4x+2y=230']},
 {story:'Konserttiin myytiin 120 lippua. Aikuisten lippu maksoi 10 € ja lasten lippu 6 €. Lipputuloja kertyi 960 €.',x:'aikuisten lippujen määrä',y:'lasten lippujen määrä',eqs:[[1,1,-120],[10,6,-960]],show:['x+y=120','10x+6y=960']},
 {story:'Lippaassa on 70 yhden ja kahden euron kolikkoa. Rahaa on yhteensä 110 €.',x:'yhden euron kolikoiden määrä',y:'kahden euron kolikoiden määrä',eqs:[[1,1,-70],[1,2,-110]],show:['x+y=70','x+2y=110']},
 {story:'Kaupasta ostettiin yhteensä 40 vihkoa ja kynää. Vihko maksoi 3 € ja kynä 2 €. Ostokset maksoivat 100 €.',x:'vihkojen määrä',y:'kynien määrä',eqs:[[1,1,-40],[3,2,-100]],show:['x+y=40','3x+2y=100']},
 {story:'Varastossa on yhteensä 28 polkupyörää ja kolmipyörää. Niissä on yhteensä 66 pyörää.',x:'polkupyörien määrä',y:'kolmipyörien määrä',eqs:[[1,1,-28],[2,3,-66]],show:['x+y=28','2x+3y=66']},
 {story:'Äidin ja lapsen iät ovat yhteensä 50 vuotta. Viisi vuotta sitten äiti oli kaksi kertaa niin vanha kuin lapsi.',x:'äidin nykyinen ikä',y:'lapsen nykyinen ikä',eqs:[[1,1,-50],[1,-2,5]],show:['x+y=50','x-5=2(y-5)']},
 {story:'Säästötilillä on yhteensä 6000 euroa kahdessa eri sijoituksessa. Toisen sijoituksen vuotuinen korko on 2 % ja toisen 5 %. Vuodessa sijoituksille kertyy korkoa yhteensä 210 euroa. Muodosta tilanteesta yhtälöpari.',x:'2-prosenttiseen sijoitukseen sijoitettu rahamäärä euroina',y:'5-prosenttiseen sijoitukseen sijoitettu rahamäärä euroina',eqs:[[1,1,-6000],[0.02,0.05,-210]],show:['x+y=6000','0{,}02x+0{,}05y=210']},
 {story:'Laboratoriossa valmistetaan 600 g suolaliuosta sekoittamalla 5-prosenttista ja 15-prosenttista suolaliuosta. Valmiin liuoksen suolapitoisuuden tulee olla 9 %. Muodosta tilanteesta yhtälöpari.',x:'5-prosenttisen liuoksen massa grammoina',y:'15-prosenttisen liuoksen massa grammoina',eqs:[[1,1,-600],[0.05,0.15,-54]],show:['x+y=600','0{,}05x+0{,}15y=0{,}09\\cdot600']},
];
let i=0,points=0,attempted=false,done=false,failedAttempts=0;const $=id=>document.getElementById(id);
function coeffs(raw){let s=String(raw).toLowerCase().replace(/−/g,'-').replace(/,/g,'.').replace(/\s+/g,'').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if((s.match(/=/g)||[]).length!==1)return null;let [l,r]=s.split('=');const val=(e,x,y)=>{e=e.replace(/(\d|\))([xy])/g,'$1*$2').replace(/([xy])(\d)/g,'$1*$2').replace(/(\d|[xy]|\))\(/g,'$1*(');if(!/^[0-9xy+\-*/().]+$/.test(e))throw 0;return Function('x','y','"use strict";return ('+e+')')(x,y)};try{const f=(x,y)=>val(l,x,y)-val(r,x,y),c=f(0,0),a=f(1,0)-c,b=f(0,1)-c;if(![a,b,c].every(Number.isFinite))return null;return[a,b,c]}catch{return null}}
function same(a,b){if(!a||Math.abs(a[0])+Math.abs(a[1])<1e-9)return false;let k=null;for(let j=0;j<3;j++)if(Math.abs(b[j])>1e-9){k=a[j]/b[j];break}return k!==null&&Math.abs(k)>1e-9&&a.every((v,j)=>Math.abs(v-k*b[j])<1e-7)}
function render(){const t=tasks[i];$("taskNav").innerHTML=tasks.map((_,j)=>`<button type="button" class="${j===i?'active':''}" onclick="i=${j};render()">${j+1}</button>`).join('');attempted=false;done=false;failedAttempts=0;$('progress').textContent=`Tehtävä ${i+1}/${tasks.length}`;$('score').textContent=`Oikein ${points}`;$('story').textContent=t.story;$('meaning').innerHTML=`\\(x\\) = ${t.x}<br>\\(y\\) = ${t.y}`;['eq1','eq2'].forEach(id=>{$(id).value='';$(id).className=''});$('feedback').textContent='';$('feedback').className='feedback';$('solution').classList.add('hidden');$('solution').innerHTML='';if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('meaning')])}
function check(){attempted=true;const t=tasks[i],a=coeffs($('eq1').value),b=coeffs($('eq2').value);const direct=same(a,t.eqs[0])&&same(b,t.eqs[1]),reverse=same(a,t.eqs[1])&&same(b,t.eqs[0]),ok=direct||reverse;[a,b].forEach((v,j)=>$('eq'+(j+1)).className=v&&(same(v,t.eqs[0])||same(v,t.eqs[1]))?'good':'bad');if(ok){if(!done)points++;done=true;$('score').textContent=`Oikein ${points}`;$('feedback').textContent='Oikein! Molemmat tehtävän tiedot on muutettu yhtälöiksi.';$('feedback').className='feedback ok';$('solution').classList.add('hidden')}else{failedAttempts++;$('feedback').innerHTML=(failedAttempts>=2?'Ei vielä oikein. Voit jatkaa yrittämistä tai <button type="button" id="showSolution">näyttää ratkaisun</button>.':'Ei vielä oikein. Yritä uudelleen.');$('feedback').className='feedback bad';$('solution').classList.add('hidden');if(failedAttempts>=2)$('showSolution').onclick=()=>{$('solution').innerHTML=`Yksi oikea yhtälöpari on \\(\\begin{cases}${t.show[0]}\\\\${t.show[1]}\\end{cases}\\)`;$('solution').classList.remove('hidden');if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('solution')])}}}
['eq1','eq2'].forEach((id,j)=>$(id).addEventListener('input',()=>{const raw=$(id).value.trim();$('prev'+(j+1)).innerHTML=raw?'\\('+raw.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'\\)':'';if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('prev'+(j+1))])}));$('check').onclick=check;$('next').onclick=()=>{i=(i+1)%tasks.length;render()};render();
</script><!-- Cloudflare Web Analytics -->

\n<script>
// Näppäimistökäyttö: Enter vastaa kulloinkin näkyvän Tarkista-painikkeen painamista.
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey) return;
  const a=document.activeElement;
  if(!a || !/^(INPUT|SELECT)$/.test(a.tagName)) return;
  const buttons=[...document.querySelectorAll('button')].filter(b=>{
    const label=(b.textContent||'').trim();
    const cs=getComputedStyle(b);
    return !b.disabled && label.startsWith('Tarkista') && cs.display!=='none' && cs.visibility!=='hidden' && b.getClientRects().length>0;
  });
  if(buttons.length===1){ e.preventDefault(); buttons[0].click(); }
});
</script>\n</body></html>
