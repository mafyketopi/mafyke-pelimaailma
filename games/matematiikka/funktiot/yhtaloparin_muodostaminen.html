<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yhtälöparin muodostaminen</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']]},svg:{fontCache:'global'}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#617086;--line:#dce3ec;--blue:#2f6fed;--ok:#168451;--bad:#c43b3b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:22px 5%}header h1{margin:0 0 5px;font-size:clamp(1.8rem,4vw,2.7rem)}header p{margin:0;color:var(--muted)}main{max-width:900px;margin:auto;padding:22px 4%}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,28px);box-shadow:0 7px 22px #2030500d}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-weight:700}.story{font-size:1.18rem;line-height:1.55;margin:20px 0 14px}.meaning{background:#eef3ff;border-radius:12px;padding:13px 15px;line-height:1.7}.pair{display:grid;grid-template-columns:36px 1fr;align-items:center;margin:18px 0}.brace{font-family:Georgia,serif;font-size:5rem;line-height:.75}.fields{display:grid;gap:10px}.eqrow{display:flex;align-items:center;gap:8px}.eqrow input{width:min(100%,430px);padding:11px 13px;border:2px solid #c6d0de;border-radius:10px;font:1.08rem system-ui}.eqrow input.good{border-color:var(--ok);background:#f2fbf5}.eqrow input.bad{border-color:var(--bad);background:#fff5f5}.buttons{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 16px;font-weight:750;font-size:1rem;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e9eef6;color:var(--ink)}.feedback{min-height:30px;margin-top:13px;font-weight:700;line-height:1.5}.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}.solution{margin-top:12px;padding:12px 14px;background:#f7f9fc;border:1px solid var(--line);border-radius:11px}.hidden{display:none}.hint{color:var(--muted);font-size:.94rem;margin:8px 0 16px}
</style></head><body>
<header><h1>Yhtälöparin muodostaminen</h1><p>Muodosta kaksi yhtälöä sanallisen tehtävän tiedoista. Yhtälöparia ei tarvitse ratkaista.</p></header>
<main><section class="card"><div class="top"><span id="progress"></span><span id="score"></span></div><div class="story" id="story"></div><div class="meaning" id="meaning"></div><p class="hint">Kirjoita yhtäsuuruusmerkki mukaan. Yhtälöiden järjestyksellä tai puolten järjestyksellä ei ole väliä.</p><div class="pair"><div class="brace">{</div><div class="fields"><div class="eqrow"><input id="eq1" aria-label="Ensimmäinen yhtälö" placeholder="esim. x + y = 100"></div><div class="eqrow"><input id="eq2" aria-label="Toinen yhtälö" placeholder="esim. 4x + 2y = 230"></div></div></div><div class="buttons"><button class="primary" id="check">Tarkista</button><button class="secondary" id="next">Seuraava tehtävä</button></div><div class="feedback" id="feedback"></div><div class="solution hidden" id="solution"></div></section></main>
<script>
const tasks=[
 {story:'Pihalla on yhteensä 100 lintua ja kissaa. Eläimillä on yhteensä 230 jalkaa.',x:'kissojen määrä',y:'lintujen määrä',eqs:[[1,1,-100],[4,2,-230]],show:['x+y=100','4x+2y=230']},
 {story:'Konserttiin myytiin 120 lippua. Aikuisten lippu maksoi 10 € ja lasten lippu 6 €. Lipputuloja kertyi 960 €.',x:'aikuisten lippujen määrä',y:'lasten lippujen määrä',eqs:[[1,1,-120],[10,6,-960]],show:['x+y=120','10x+6y=960']},
 {story:'Lippaassa on 70 yhden ja kahden euron kolikkoa. Rahaa on yhteensä 110 €.',x:'yhden euron kolikoiden määrä',y:'kahden euron kolikoiden määrä',eqs:[[1,1,-70],[1,2,-110]],show:['x+y=70','x+2y=110']},
 {story:'Kaupasta ostettiin yhteensä 40 vihkoa ja kynää. Vihko maksoi 3 € ja kynä 2 €. Ostokset maksoivat 100 €.',x:'vihkojen määrä',y:'kynien määrä',eqs:[[1,1,-40],[3,2,-100]],show:['x+y=40','3x+2y=100']},
 {story:'Varastossa on yhteensä 28 polkupyörää ja kolmipyörää. Niissä on yhteensä 66 pyörää.',x:'polkupyörien määrä',y:'kolmipyörien määrä',eqs:[[1,1,-28],[2,3,-66]],show:['x+y=28','2x+3y=66']},
 {story:'Äidin ja lapsen iät ovat yhteensä 50 vuotta. Viisi vuotta sitten äiti oli kaksi kertaa niin vanha kuin lapsi.',x:'äidin nykyinen ikä',y:'lapsen nykyinen ikä',eqs:[[1,1,-50],[1,-2,5]],show:['x+y=50','x-5=2(y-5)']},
 {story:'Sekoitetaan 10-prosenttista ja 30-prosenttista liuosta. Seosta valmistetaan 500 grammaa, ja sen pitoisuuden pitää olla 20 %.',x:'10-prosenttisen liuoksen massa grammoina',y:'30-prosenttisen liuoksen massa grammoina',eqs:[[1,1,-500],[0.10,0.30,-100]],show:['x+y=500','0{,}10x+0{,}30y=0{,}20\\cdot500']},
 {story:'Sekoitetaan 5-prosenttista ja 25-prosenttista suolaliuosta. Seosta tarvitaan 600 grammaa ja sen pitoisuuden tulee olla 12 %.',x:'5-prosenttisen liuoksen massa grammoina',y:'25-prosenttisen liuoksen massa grammoina',eqs:[[1,1,-600],[0.05,0.25,-72]],show:['x+y=600','0{,}05x+0{,}25y=0{,}12\\cdot600']}
];
let i=0,points=0,attempted=false,done=false;const $=id=>document.getElementById(id);
function coeffs(raw){let s=String(raw).toLowerCase().replace(/−/g,'-').replace(/,/g,'.').replace(/\s+/g,'').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if((s.match(/=/g)||[]).length!==1)return null;let [l,r]=s.split('=');const val=(e,x,y)=>{e=e.replace(/(\d|\))([xy])/g,'$1*$2').replace(/([xy])(\d)/g,'$1*$2').replace(/(\d|[xy]|\))\(/g,'$1*(');if(!/^[0-9xy+\-*/().]+$/.test(e))throw 0;return Function('x','y','"use strict";return ('+e+')')(x,y)};try{const f=(x,y)=>val(l,x,y)-val(r,x,y),c=f(0,0),a=f(1,0)-c,b=f(0,1)-c;if(![a,b,c].every(Number.isFinite))return null;return[a,b,c]}catch{return null}}
function same(a,b){if(!a||Math.abs(a[0])+Math.abs(a[1])<1e-9)return false;let k=null;for(let j=0;j<3;j++)if(Math.abs(b[j])>1e-9){k=a[j]/b[j];break}return k!==null&&Math.abs(k)>1e-9&&a.every((v,j)=>Math.abs(v-k*b[j])<1e-7)}
function render(){const t=tasks[i];attempted=false;done=false;$('progress').textContent=`Tehtävä ${i+1}/${tasks.length}`;$('score').textContent=`Oikein ${points}`;$('story').textContent=t.story;$('meaning').innerHTML=`\\(x\\) = ${t.x}<br>\\(y\\) = ${t.y}`;['eq1','eq2'].forEach(id=>{$(id).value='';$(id).className=''});$('feedback').textContent='';$('feedback').className='feedback';$('solution').classList.add('hidden');$('solution').innerHTML='';if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('meaning')])}
function check(){attempted=true;const t=tasks[i],a=coeffs($('eq1').value),b=coeffs($('eq2').value);const direct=same(a,t.eqs[0])&&same(b,t.eqs[1]),reverse=same(a,t.eqs[1])&&same(b,t.eqs[0]),ok=direct||reverse;[a,b].forEach((v,j)=>$('eq'+(j+1)).className=v&&(same(v,t.eqs[0])||same(v,t.eqs[1]))?'good':'bad');if(ok){if(!done)points++;done=true;$('score').textContent=`Oikein ${points}`;$('feedback').textContent='Oikein! Molemmat tehtävän tiedot on muutettu yhtälöiksi.';$('feedback').className='feedback ok'}else{$('feedback').textContent='Yhtälöpari ei vielä vastaa molempia tehtävän tietoja. Ratkaisu näkyy alla, ja voit jatkaa seuraavaan tehtävään.';$('feedback').className='feedback bad'}$('solution').innerHTML=`Yksi oikea yhtälöpari on \\(\\begin{cases}${t.show[0]}\\\\${t.show[1]}\\end{cases}\\)`;$('solution').classList.remove('hidden');if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('solution')])}
$('check').onclick=check;$('next').onclick=()=>{if(!attempted){$('feedback').textContent='Tarkista tehtävä ennen jatkamista.';$('feedback').className='feedback bad';return}i=(i+1)%tasks.length;render()};render();
</script></body></html>
