<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funktion kuvaajan tutkiminen</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e1ea;--blue:#2563eb;--green:#168447;--red:#c93f3f;--yellow:#b77900}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%}
h1{font-size:clamp(1.45rem,3vw,2.25rem);margin:0}.score{font-weight:800}
main{max-width:1180px;margin:auto;padding:18px 3% 30px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 7px;font-weight:750;cursor:pointer}
.tab.active{background:var(--blue);color:white;border-color:var(--blue)}
.workspace{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(350px,.95fr);gap:16px;align-items:start}
.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px rgba(25,40,65,.05)}
.graphcard{padding:12px;display:flex;align-items:center;justify-content:center}.taskcard{padding:16px 18px}
canvas{display:block;width:min(100%,510px);height:auto;aspect-ratio:1;margin:auto}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.badge{background:#eef2f7;border-radius:999px;padding:6px 10px;font-size:.9rem;font-weight:750}
h2{font-size:1.3rem;margin:8px 0 8px}.lead{color:var(--muted);line-height:1.45;margin:6px 0 13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input{font:inherit;width:80px;padding:9px;border:1px solid #b8c4d1;border-radius:9px}
button{font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.soft{background:#eef2f7;color:var(--ink)}
.feedback{min-height:27px;font-weight:750;margin-top:10px}.good{color:var(--green)}.bad{color:var(--red)}
.nav{display:flex;justify-content:space-between;margin-top:15px;gap:8px}.hidden{display:none!important}
.option{border:2px solid #d5dde7;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700}
.option.sel{border-color:#6da0f8;background:#eef5ff}
.math{font-family:Cambria,Georgia,serif;font-size:1.08rem}.analysis-grid{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;align-items:center;margin:10px 0}.analysis-grid input{width:100%;min-width:0}.analysis-input.answer-correct{border:2px solid #168447;background:#eef9f2}.analysis-input.answer-wrong{border:2px solid #c94a4a;background:#fff7f7}.symbolbar{display:flex;gap:7px;margin:8px 0}.symbolbtn{border:1px solid #b8c4d1;background:#fff;border-radius:8px;padding:6px 12px;font:700 1.05rem Cambria,serif;cursor:pointer}.hintline{font-size:.92rem;color:var(--muted);margin:4px 0 8px}@media(max-width:520px){.analysis-grid{grid-template-columns:1fr}}
.choices{display:grid;gap:8px;margin:12px 0}
.segment{min-height:38px;border:2px solid transparent;border-radius:8px;background:rgba(226,232,240,.82);cursor:pointer;font-weight:750}
.segment.sel{background:#cfe1ff;border-color:#4e8df5}
.answer{background:#f7f9fc;border:1px solid #e0e6ed;padding:10px;border-radius:10px;margin-top:10px}
@media(max-width:820px){header{height:auto;padding:14px 4%}.workspace{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr}canvas{max-height:none}}

.package-home{position:fixed;right:14px;bottom:14px;z-index:9999;background:#172033;color:#fff;text-decoration:none;padding:9px 13px;border-radius:999px;font:600 14px system-ui,sans-serif;box-shadow:0 3px 14px #0002;opacity:.92}.package-home:hover{opacity:1}
@media(max-width:600px){.package-home{right:8px;bottom:8px;padding:7px 10px;font-size:12px}}

/* Käytettävyyskierros */

@media (min-width:900px){
  header{padding-top:12px!important;padding-bottom:12px!important}
  main{padding-top:14px!important;padding-bottom:24px!important}
}


/* Käytettävyyskierros */

@media (min-width:900px){
  header{height:58px!important;padding-top:8px!important;padding-bottom:8px!important}
  .workspace{gap:14px!important}
  .tabs{margin-top:8px!important;margin-bottom:8px!important}
}

</style>
</head>
<body>
<a class="package-home" href="index.html" aria-label="Takaisin pelivalikkoon">← Pelivalikko</a>
<header><div><h1>Funktion kuvaajan tutkiminen</h1></div><div class="score" id="score">0 / 20 oikein</div></header>
<main>
<div class="tabs">
 <button class="tab active" data-sec="0">1. Nollakohdat</button>
 <button class="tab" data-sec="1">2. Pienin ja suurin arvo</button>
 <button class="tab" data-sec="2">3. Positiivinen / negatiivinen</button>
 <button class="tab" data-sec="3">4. Kasvava / vähenevä</button>
 <button class="tab" data-sec="4">5. Tutki kuvaajia</button>
</div>
<div class="workspace">
 <section class="card graphcard"><canvas id="g" width="1000" height="1000"></canvas></section>
 <section class="card taskcard">
   <div class="topline"><span class="badge" id="counter"></span><span class="badge" id="typeBadge"></span></div>
   <h2 id="question"></h2><p class="lead" id="help"></p>
   <div id="controls"></div>
   <div id="feedback" class="feedback"></div>
   <div id="answer" class="answer hidden"></div>
   <div class="nav"><button class="btn soft" id="prev">← Edellinen</button><button class="btn primary" id="next">Seuraava →</button></div>
 </section>
</div>
</main>
<script>
const sections=[
 {name:"Nollakohdat", tasks:[
  {kind:"zeros",fn:x=>2*x-2,label:"suora",roots:[1]},
  {kind:"zeros",fn:x=>x*x-x-2,label:"paraabeli",roots:[-1,2]},
  {kind:"zeros",fn:x=>(x+2)*x*(x-3)/3,label:"3. asteen kuvaaja",roots:[-2,0,3]},
  {kind:"zeros",fn:x=>x*x+2,label:"paraabeli",roots:[]}
 ]},
 {name:"Ääriarvot",tasks:[
  {kind:"extrema",fn:x=>x*x-4,label:"paraabeli",min:-4,max:null,points:[[0,-4]]},
  {kind:"extrema",fn:x=>-x*x+5,label:"paraabeli",min:null,max:5,points:[[0,5]]},
  {kind:"extrema",fn:x=>x*x-2*x-3,label:"suljettu väli",domain:[-2,3],min:-4,max:5,points:[[1,-4],[-2,5]]},
  {kind:"extrema",fn:x=>(x*x*x)/3-x,label:"3. asteen kuvaaja, suljettu väli",domain:[-3,3],min:-6,max:6,points:[[-3,-6],[3,6]]}
 ]},
 {name:"Positiivisuus",tasks:[
  {kind:"sign",fn:x=>x*x-4,label:"positiivinen",answer:"x < −2 tai x > 2",correctOption:0,options:["x < −2 tai x > 2","−2 < x < 2","x < 2","x > −2","x ≠ 2","kaikilla x:n arvoilla"]},
  {kind:"sign",fn:x=>-x*x+x+2,label:"negatiivinen",answer:"x < −1 tai x > 2",correctOption:1,options:["−1 < x < 2","x < −1 tai x > 2","x < 2","x > −1","x ≠ −1","ei millään x:n arvolla"]},
  {kind:"sign",fn:x=>(x+2)*x*(x-2)/2,label:"positiivinen",range:8,answer:"−2 < x < 0 tai x > 2",correctOption:2,options:["x < −2 tai 0 < x < 2","x < 0 tai x > 2","−2 < x < 0 tai x > 2","−2 < x < 2","x > −2","x ≠ 0"]},
  {kind:"sign",fn:x=>(x+2)*x*(x-2)/2,label:"negatiivinen",range:8,answer:"x < −2 tai 0 < x < 2",correctOption:3,options:["−2 < x < 0 tai x > 2","x < 0 tai x > 2","−2 < x < 2","x < −2 tai 0 < x < 2","x < 2","x ≠ 2"]}
 ]},
 {name:"Monotonisuus",tasks:[
  {kind:"mono",fn:x=>x*x-4,label:"vähenevä",answer:"x ≤ 0",correctOption:0,options:["x ≤ 0","x ≥ 0","x < −4","−4 ≤ x ≤ 4","x ≠ 0","kaikilla x:n arvoilla"]},
  {kind:"mono",fn:x=>-x*x+4,label:"kasvava",answer:"x ≤ 0",correctOption:2,options:["x ≥ 0","−2 ≤ x ≤ 2","x ≤ 0","x < −2","x ≠ 0","ei millään x:n arvolla"]},
  {kind:"mono",fn:x=>(x*x*x)/3-x*x-3*x+2,label:"kasvava, 3. asteen kuvaaja",range:8,answer:"x ≤ −1 tai x ≥ 3",correctOption:1,options:["−1 ≤ x ≤ 3","x ≤ −1 tai x ≥ 3","x ≤ 3","x ≥ −1","x < −1 tai x > 3","kaikilla x:n arvoilla"]},
  {kind:"mono",fn:x=>(x*x*x)/6-2*x,label:"vähenevä, 3. asteen kuvaaja",range:8,answer:"−2 ≤ x ≤ 2",correctOption:4,options:["x ≤ −2 tai x ≥ 2","x ≤ 2","x ≥ −2","−2 < x < 2","−2 ≤ x ≤ 2","kaikilla x:n arvoilla"]}
 ]},
 {name:"Tutki kuvaajia",tasks:[
  {kind:"analysis",fn:x=>(x+12)*(x+3)*(x-12)/100,label:"3. asteen kuvaaja",range:13,analysis:{zeros:"x = −12, x = −3 ja x = 12",positive:"−12 < x < −3 tai x > 12",negative:"x < −12 tai −3 < x < 12",increasing:"x ≤ −8 tai x ≥ 6",decreasing:"−8 ≤ x ≤ 6"}},
  {kind:"analysis",fn:x=>(2*x*x*x+3*x*x-12*x+32)/10,label:"3. asteen kuvaaja",range:6,analysis:{zeros:"x = −4",positive:"x > −4",negative:"x < −4",increasing:"x ≤ −2 tai x ≥ 1",decreasing:"−2 ≤ x ≤ 1"}},
  {kind:"analysis",fn:x=>-(x+12)*(x-3)*(x-12)/100,label:"3. asteen kuvaaja",range:13,analysis:{zeros:"x = −12, x = 3 ja x = 12",positive:"x < −12 tai 3 < x < 12",negative:"−12 < x < 3 tai x > 12",increasing:"−6 ≤ x ≤ 8",decreasing:"x ≤ −6 tai x ≥ 8"}},
  {kind:"analysis",fn:x=>x*(x-3)*(x-3),label:"3. asteen kuvaaja",range:6,analysis:{zeros:"x = 0 ja x = 3",positive:"x > 0",negative:"x < 0",increasing:"x ≤ 1 tai x ≥ 3",decreasing:"1 ≤ x ≤ 3"}}
 ]}
];
let sec=0,idx=0,selected=new Set(),solved=new Set(),highlight=false,attempted=false,failedAttempts=0;
const cvs=document.getElementById("g"),ctx=cvs.getContext("2d");
const bound=()=>task().range||6,X=x=>cvs.width/2+x*cvs.width/(2*bound()),Y=y=>cvs.height/2-y*cvs.height/(2*bound());
function task(){return sections[sec].tasks[idx]}
function key(){return sec+"-"+idx}
function curve(a,b,color="#172033",w=4,signMode=false){
 let t=task(),R=bound(),started=false;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();
 for(let x=a;x<=b;x+=.018){let y=t.fn(x);if(signMode)ctx.strokeStyle=y>=0?'#d33b3b':'#2563eb';if(y< -R-.5||y>R+.5){started=false;continue}
 if(!started){ctx.moveTo(X(x),Y(y));started=true}else ctx.lineTo(X(x),Y(y))}
 ctx.stroke()
}
function ranges(cuts){let R=bound(),a=[-R,...cuts,R],r=[];for(let i=0;i<a.length-1;i++)r.push([a[i],a[i+1]]);return r}
function draw(){
 let t=task(),R=bound(),xmin=-R,xmax=R,ymin=-R,ymax=R;ctx.clearRect(0,0,cvs.width,cvs.height);ctx.fillStyle="#fff";ctx.fillRect(0,0,cvs.width,cvs.height);
 ctx.strokeStyle="#e4e6e9";ctx.lineWidth=1.15;
 for(let x=xmin;x<=xmax;x++){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),cvs.height);ctx.stroke()}
 for(let y=ymin;y<=ymax;y++){ctx.beginPath();ctx.moveTo(0,Y(y));ctx.lineTo(cvs.width,Y(y));ctx.stroke()}
 if(t.domain){ctx.fillStyle="rgba(37,99,235,.07)";ctx.fillRect(X(t.domain[0]),0,X(t.domain[1])-X(t.domain[0]),cvs.height);
  ctx.strokeStyle="#8cb3f7";ctx.lineWidth=2;t.domain.forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),cvs.height);ctx.stroke()})}
 ctx.strokeStyle="#17191c";ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(cvs.width,Y(0));ctx.stroke();ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),cvs.height);ctx.stroke();
 ctx.strokeStyle="#17191c";ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(X(xmax)-7,Y(0)-3.5);ctx.lineTo(X(xmax),Y(0));ctx.lineTo(X(xmax)-7,Y(0)+3.5);ctx.stroke();ctx.beginPath();ctx.moveTo(X(0)-3.5,Y(ymax)+7);ctx.lineTo(X(0),Y(ymax));ctx.lineTo(X(0)+3.5,Y(ymax)+7);ctx.stroke();
 ctx.fillStyle="#202124";ctx.font='26px "Times New Roman", Times, serif';ctx.textAlign='center';ctx.textBaseline='top';for(let x=xmin+1;x<=xmax-1;x++)if(x)ctx.fillText(x,X(x),Y(0)+10);
 ctx.textAlign='left';ctx.textBaseline='middle';for(let y=ymin+1;y<=ymax-1;y++)if(y)ctx.fillText(y,X(0)+13,Y(y));ctx.font='italic 30px "Times New Roman", Times, serif';ctx.fillStyle='#202124';ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('x',X(xmax)-10,Y(0)-10);ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('y',X(0)+10,Y(ymax)+10);
 curve(xmin,xmax,"#111315",4.2);
 if(highlight && (t.kind==='sign'||t.kind==='mono')){
   const wanted=t.label.includes('positiivinen')?'positive':t.label.includes('negatiivinen')?'negative':t.label.includes('kasvava')?'increasing':'decreasing';
   const goodAt=x=>{if(wanted==='positive')return t.fn(x)>0;if(wanted==='negative')return t.fn(x)<0;const h=.002,der=(t.fn(x+h)-t.fn(x-h))/(2*h);return wanted==='increasing'?der>1e-3:der< -1e-3};
   let start=null;
   const col=wanted==='increasing'?'#b77900':wanted==='decreasing'?'#168447':wanted==='positive'?'#d33b3b':'#2563eb';
   for(let x=xmin;x<=xmax+.02;x+=.02){const good=x<=xmax&&goodAt(x);if(good&&start===null)start=x;if((!good||x>xmax)&&start!==null){curve(start,Math.min(x,xmax),col,7);start=null}}
 }
 if(highlight){
   let pts=[];
   if(t.kind==="zeros") pts=t.roots.map(x=>[x,0]);
   if(t.kind==="extrema")pts=t.points;
   pts.forEach(([x,y])=>{ctx.beginPath();ctx.arc(X(x),Y(y),7,0,Math.PI*2);ctx.fillStyle="rgba(22,132,71,.14)";ctx.fill();ctx.strokeStyle="#168447";ctx.lineWidth=3;ctx.stroke()})
 }
}
function render(){
 selected.clear();highlight=false;attempted=false;failedAttempts=0;feedback.textContent="";feedback.className="feedback";answer.classList.add("hidden");
 let t=task();counter.textContent=`Tehtävä ${idx+1} / ${sections[sec].tasks.length}`;typeBadge.textContent=t.label;
 if(t.kind==="zeros")renderZeros(t); if(t.kind==="extrema")renderExtrema(t); if(t.kind==="sign")renderIntervals(t); if(t.kind==="mono")renderIntervals(t); if(t.kind==="analysis")renderAnalysis(t);
 prev.disabled=idx===0;next.textContent=idx===sections[sec].tasks.length-1?(sec===4?"Valmis":"Seuraava osio →"):"Seuraava →";
 document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("active",i===sec));draw()
}
function renderZeros(t){
 question.textContent="Määritä funktion nollakohdat.";help.textContent="Anna x-akselin leikkauskohdat. Jos niitä ei ole, valitse “ei nollakohtia”.";
 let n=Math.max(t.roots.length,1),s='<div class="row">';
 for(let i=0;i<n;i++)s+=`<span>x =</span><input class="z" type="number" step="any">`;
 s+='</div><div class="row"><button class="option" id="none">ei nollakohtia</button><button class="btn primary" id="check">Tarkista</button></div>';controls.innerHTML=s;
 none.onclick=()=>none.classList.toggle("sel");check.onclick=checkZeros
}
function renderExtrema(t){
 question.textContent=t.domain?`Määritä pienin ja suurin arvo välillä ${t.domain[0]} ≤ x ≤ ${t.domain[1]}.`:"Määritä funktion pienin ja suurin arvo.";
 help.textContent=t.domain?"Tutki vain sinisellä rajattua osaa kuvaajasta.":"Valitse “ei ole”, jos kuvaajalla ei ole pienintä tai suurinta arvoa.";
 controls.innerHTML=`<div class="row"><span>Pienin arvo</span><input id="mn" type="number"><button class="option" id="mnNone">ei ole</button></div>
 <div class="row"><span>Suurin arvo</span><input id="mx" type="number"><button class="option" id="mxNone">ei ole</button></div><button class="btn primary" id="check">Tarkista</button>`;
 mnNone.onclick=()=>{mnNone.classList.toggle("sel");if(mnNone.classList.contains("sel"))mn.value=""};
 mxNone.onclick=()=>{mxNone.classList.toggle("sel");if(mxNone.classList.contains("sel"))mx.value=""};check.onclick=checkExtrema
}
function renderIntervals(t){
 let sign=t.kind==="sign";
 question.textContent=sign?`Millä muuttujan arvoilla funktio on ${t.label}?`:`Millä muuttujan arvoilla funktio on ${t.label}?`;
 help.textContent="Valitse yksi oikea kokonaisvastaus. Tarkistuksen jälkeen kuvaajasta korostetaan tehtävässä kysytty osa.";
 let labels=t.options.map((txt,i)=>`<button class="segment" data-i="${i}">${txt}</button>`).join('');
 controls.innerHTML=`<div class="choices">${labels}</div>
 <button class="btn primary" id="check">Tarkista</button>`;
 document.querySelectorAll(".segment").forEach(b=>b.onclick=()=>{selected.clear();document.querySelectorAll('.segment').forEach(x=>x.classList.remove('sel'));selected.add(+b.dataset.i);b.classList.add('sel')});
 check.onclick=checkIntervals
}

let lastAnalysisInput=null;
function renderAnalysis(t){
 question.textContent="Tutki kuvaajaa ja kirjoita vastaukset.";
 help.textContent="Ilmoita vastaukset epäyhtälöinä. Jos vastaukseen kuuluu kaksi väliä, yhdistä ne sanalla tai.";
 controls.innerHTML=`<div class="analysis-grid">
  <label>Nollakohdat</label><input id="az" class="analysis-input" placeholder="esim. x = −5 ja x = 2">
  <label>Positiivinen</label><input id="ap" class="analysis-input" placeholder="esim. x < −1 tai x > 4">
  <label>Negatiivinen</label><input id="an" class="analysis-input" placeholder="esim. −3 < x < 2">
  <label>Kasvava</label><input id="ai" class="analysis-input" placeholder="esim. x ≤ −4 tai x ≥ 3">
  <label>Vähenevä</label><input id="ad" class="analysis-input" placeholder="esim. −2 ≤ x ≤ 5">
 </div>
 <div class="symbolbar"><button type="button" class="symbolbtn" data-sym="≤">≤</button><button type="button" class="symbolbtn" data-sym="≥">≥</button></div>
 <button class="btn primary" id="check">Tarkista</button>`;
 document.querySelectorAll('.analysis-input').forEach(inp=>{inp.addEventListener('focus',()=>lastAnalysisInput=inp);inp.addEventListener('click',()=>lastAnalysisInput=inp)});
 lastAnalysisInput=document.getElementById('az');
 document.querySelectorAll('.symbolbtn').forEach(b=>b.onclick=()=>{const inp=lastAnalysisInput;if(!inp)return;const a=inp.selectionStart??inp.value.length,z=inp.selectionEnd??a;inp.value=inp.value.slice(0,a)+b.dataset.sym+inp.value.slice(z);inp.focus();inp.setSelectionRange(a+1,a+1)});
 check.onclick=checkAnalysis;
}
function rootValues(v){
 const m=[...v.replace(/−/g,'-').matchAll(/x\s*=\s*(-?\d+(?:[.,]\d+)?)/gi)];
 return m.map(z=>Number(z[1].replace(',','.'))).sort((a,b)=>a-b);
}
function canonicalIntervals(v){
 let src=v.toLowerCase().replace(/−/g,'-').replace(/<=/g,'≤').replace(/>=/g,'≥').replace(/,/g,'.').replace(/\s+/g,'');
 const parts=src.split(/tai/).filter(Boolean), out=[];
 for(const part of parts){
   let m;
   if((m=part.match(/^x([<>≤≥])(-?\d+(?:\.\d+)?)$/))){
     const op=m[1],n=Number(m[2]);
     out.push(op==='>'||op==='≥'?{lo:n,li:op==='≥',hi:null,ui:false}:{lo:null,li:false,hi:n,ui:op==='≤'}); continue;
   }
   if((m=part.match(/^(-?\d+(?:\.\d+)?)([<>≤≥])x$/))){
     const n=Number(m[1]),op=m[2];
     out.push(op==='<'||op==='≤'?{lo:n,li:op==='≤',hi:null,ui:false}:{lo:null,li:false,hi:n,ui:op==='≥'}); continue;
   }
   if((m=part.match(/^(-?\d+(?:\.\d+)?)([<≤])x([<≤])(-?\d+(?:\.\d+)?)$/))){
     out.push({lo:Number(m[1]),li:m[2]==='≤',hi:Number(m[4]),ui:m[3]==='≤'}); continue;
   }
   if((m=part.match(/^(-?\d+(?:\.\d+)?)([>≥])x([>≥])(-?\d+(?:\.\d+)?)$/))){
     out.push({lo:Number(m[4]),li:m[3]==='≥',hi:Number(m[1]),ui:m[2]==='≥'}); continue;
   }
   return null;
 }
 const key=o=>`${o.lo===null?'-inf':o.lo}:${o.li?1:0}:${o.hi===null?'inf':o.hi}:${o.ui?1:0}`;
 return out.map(key).sort();
}
function equivalent(v,w,key){
 if(key==='zeros'){
   const a=rootValues(v),b=rootValues(w);
   return a.length===b.length && a.every((x,i)=>x===b[i]);
 }
 const a=canonicalIntervals(v),b=canonicalIntervals(w);
 return !!a&&!!b&&a.length===b.length&&a.every((x,i)=>x===b[i]);
}
function checkAnalysis(){
 const t=task(),A=t.analysis;
 const fields={zeros:az,positive:ap,negative:an,increasing:ai,decreasing:ad};
 const names={zeros:'Nollakohdat',positive:'Positiivinen',negative:'Negatiivinen',increasing:'Kasvava',decreasing:'Vähenevä'};
 let allGood=true, newlyGood=0;
 for(const [k,inp] of Object.entries(fields)){
   if(inp.dataset.correct==='1') continue;
   const good=equivalent(inp.value,A[k],k);
   inp.classList.toggle('answer-correct',good);
   inp.classList.toggle('answer-wrong',!good);
   if(good){inp.dataset.correct='1';newlyGood++;} else allGood=false;
 }
 allGood=Object.values(fields).every(inp=>inp.dataset.correct==='1');
 attempted=true;
 if(allGood){
   feedback.textContent="Oikein! Kuvaaja on tutkittu kokonaan.";feedback.className="feedback good";highlight=true;solved.add(key());score.textContent=`${solved.size} / 20 oikein`;draw();
   answer.innerHTML=`Nollakohdat: <b>${A.zeros}</b><br>Positiivinen: <b>${A.positive}</b><br>Negatiivinen: <b>${A.negative}</b><br>Kasvava: <b>${A.increasing}</b><br>Vähenevä: <b>${A.decreasing}</b>`;answer.classList.remove('hidden');
 }else{
   failedAttempts++;
   const done=Object.entries(fields).filter(([k,inp])=>inp.dataset.correct==='1').map(([k])=>names[k]);
   feedback.textContent=(done.length?`Oikein: ${done.join(', ')}. `:'')+(failedAttempts>=2?"Korjaa vielä muut kohdat. Voit jatkaa yrittämistä tai pyytää ratkaisun Seuraava-painikkeella.":"Korjaa vielä muut kohdat ja yritä uudelleen.");
   feedback.className="feedback bad";
 }
}
function ok(msg){attempted=true;feedback.textContent=msg;feedback.className="feedback good";highlight=true;solved.add(key());score.textContent=`${solved.size} / 20 oikein`;draw()}
function no(msg){attempted=true;failedAttempts++;feedback.textContent=failedAttempts>=2?"Ei vielä oikein. Voit jatkaa yrittämistä tai pyytää ratkaisun Seuraava-painikkeella.":"Ei vielä oikein. Yritä uudelleen.";feedback.className="feedback bad"}
function checkZeros(){
 let t=task(),vals=[...document.querySelectorAll(".z")].map(x=>Number(x.value)).filter(x=>x.value!==""),noneSel=none.classList.contains("sel");
 let good=t.roots.length===0?noneSel:(!noneSel&&vals.length===t.roots.length&&t.roots.every(x=>vals.includes(x)));
 good?ok(t.roots.length?`Oikein! Nollakohdat: ${t.roots.map(x=>"x = "+x).join(", ")}.`:"Oikein! Funktiolla ei ole nollakohtia."):no("Ei vielä. Katso tarkasti x-akselin leikkauskohtia.")
}
function checkExtrema(){
 let t=task(),mingood=t.min===null?mnNone.classList.contains("sel"):Number(mn.value)===t.min,maxgood=t.max===null?mxNone.classList.contains("sel"):Number(mx.value)===t.max;
 if(mingood&&maxgood){ok("Oikein! Ääriarvokohdat on korostettu kuvaajaan.");answer.innerHTML=`Pienin arvo: <b>${t.min===null?"ei ole":t.min}</b><br>Suurin arvo: <b>${t.max===null?"ei ole":t.max}</b>`;answer.classList.remove("hidden")}else no("Ei vielä. Tarkista kuvaajan alin ja ylin kohta"+(t.domain?" annetulla välillä.":"."))
}
function checkIntervals(){
 let t=task(),good=selected.size===1&&selected.has(t.correctOption);
 if(good){ok("Oikein! Valittu kuvaajan osa on korostettu.");answer.innerHTML=`Vastaus: <b class="math">${t.answer}</b>`;answer.classList.remove("hidden")}else no("Ei vielä. Vertaa valitsemaasi aluetta kuvaajaan.")
}
prev.onclick=()=>{if(idx>0){idx--;render()}};
next.onclick=()=>{
 if(!solved.has(key())&&!highlight){
   if(failedAttempts<2){feedback.textContent='Yritä vielä itse. Ratkaisun voi pyytää kahden epäonnistuneen tarkistuksen jälkeen.';feedback.className='feedback bad';return;}
   let t=task(); selected=new Set(t.correctOption===undefined?[]:[t.correctOption]); highlight=true;
   let txt='Ratkaisu on merkitty kuvaajaan.';
   if(t.kind==='zeros') txt=t.roots.length?`Nollakohdat: <b>${t.roots.map(x=>'x = '+x).join(', ')}</b>`:'Funktiolla ei ole nollakohtia.';
   else if(t.kind==='extrema') txt=`Pienin arvo: <b>${t.min===null?'ei ole':t.min}</b><br>Suurin arvo: <b>${t.max===null?'ei ole':t.max}</b>`;
   else if(t.answer) txt=`Vastaus: <b class="math">${t.answer}</b>`;
   else if(t.kind==='analysis'){const A=t.analysis;txt=`Nollakohdat: <b>${A.zeros}</b><br>Positiivinen: <b>${A.positive}</b><br>Negatiivinen: <b>${A.negative}</b><br>Kasvava: <b>${A.increasing}</b><br>Vähenevä: <b>${A.decreasing}</b>`;}
   answer.innerHTML=txt; answer.classList.remove('hidden'); feedback.textContent='Ratkaisu näytetään. Paina Seuraava uudelleen jatkaaksesi.'; feedback.className='feedback good'; draw(); return;
 }
 if(idx<sections[sec].tasks.length-1){idx++;render()}else if(sec<4){sec++;idx=0;render()}
};
document.addEventListener('keydown',e=>{
 if(e.target.matches('#controls input') && e.key==='Enter'){
   e.preventDefault();
   document.getElementById('check')?.click();
 }
});
document.querySelectorAll(".tab").forEach((b,i)=>b.onclick=()=>{sec=i;idx=0;render()});
render();

// Näppäimistökäyttö: Enter vastaa kulloinkin näkyvän Tarkista-painikkeen painamista.
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey) return;
  const a=document.activeElement;
  if(!a || !/^(INPUT|SELECT)$/.test(a.tagName)) return;
  const buttons=[...document.querySelectorAll('button')].filter(b=>{
    const label=(b.textContent||'').trim();
    const cs=getComputedStyle(b);
    return !b.disabled && label.startsWith('Tarkista') && cs.display!=='none' && cs.visibility!=='hidden' && b.getClientRects().length>0;
  });
  if(buttons.length===1){ e.preventDefault(); buttons[0].click(); }
});
