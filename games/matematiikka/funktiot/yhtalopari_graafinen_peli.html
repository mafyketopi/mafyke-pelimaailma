<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yhtälöparit – graafinen ratkaisutapa</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']]},svg:{fontCache:'global'}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --ink:#172033; --muted:#5d6978; --line:#dbe2ea;
  --good:#1b7f4b; --bad:#b23a3a; --accent:#2457c5; --soft:#eef3ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:white;border-bottom:1px solid var(--line);padding:14px 4%}
header h1{margin:0;font-size:clamp(1.35rem,2.5vw,2rem)}
header p{margin:.25rem 0 0;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:18px 4% 28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.progress{font-weight:700}
.score{color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(360px,1fr) minmax(420px,1.05fr);gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 14px #0000000b}
.left{min-height:590px}
.graph-card{position:sticky;top:12px}
.eqpair{font-size:1.2rem;line-height:1.7;background:#fafbfe;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0 14px}
.eqrow{display:flex;gap:10px;align-items:center}
.brace{font-size:2.7rem;line-height:1}
.small-note{font-size:.94rem;color:var(--muted);margin:.4rem 0 .8rem}
.table-block{margin:10px 0 12px}
.table-title{font-weight:700;margin-bottom:6px}
table{border-collapse:collapse;width:auto;max-width:100%}
th,td{border:1px solid #cfd7e2;padding:6px 8px;text-align:center;min-width:58px}
th{background:#f7f9fc}
input.answer,input.cell{width:64px;padding:7px 8px;border:1px solid #bfc8d4;border-radius:8px;font-size:1rem;text-align:center;background:white}
input.answer.wide{width:92px}
input:disabled{background:#f1f3f6;color:#747f8c}
button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:white}
button.secondary{background:#e9eef7;color:#243247}
button:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.feedback{min-height:24px;margin-top:8px;font-weight:700}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.solution-box{margin-top:14px;padding:12px;border-radius:12px;background:#fafbfe;border:1px solid var(--line)}
.solution-box.hidden{display:none}
.choice-row{display:flex;flex-direction:column;gap:7px;margin:8px 0}
.choice-row label{display:flex;gap:8px;align-items:center}
.inline-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
canvas{display:block;width:100%;height:auto;background:white;border-radius:12px;border:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.92rem;color:var(--muted)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.dot1{background:#2457c5}.dot2{background:#d04848}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.hintline{background:var(--soft);padding:10px 12px;border-radius:10px;margin:8px 0}
@media (max-width:850px){
  .layout{grid-template-columns:1fr}
  .graph-card{position:static}
  .left{min-height:0}
}
</style>
</head>
<body>
<header>
  <h1>Yhtälöparit – graafinen ratkaisutapa</h1>
  <p>Laske pisteet taulukoihin, tutki kuvaajia ja päättele ratkaisu.</p>
</header>
<main>
  <div class="topbar">
    <div class="progress" id="progress"></div>
    <div class="score" id="score"></div>
  </div>

  <div class="layout">
    <section class="card left" id="taskCard"></section>
    <section class="card graph-card">
      <canvas id="graph" width="560" height="560" aria-label="Koordinaatisto"></canvas>
      <div class="legend"><span><span class="dot dot1"></span>1. kuvaaja</span><span><span class="dot dot2"></span>2. kuvaaja</span></div>
    </section>
  </div>
</main>
<script>
const tasks = [
  {
    eq1:'y = x + 2', f1:x=>x+2, xs1:[-1,0,2], type1:'line',
    eq2:'y = -x + 4', f2:x=>-x+4, xs2:[0,1,3], type2:'line',
    kind:'point', solutions:[[1,3]], range:6
  },
  {
    eq1:'y = 2x - 2', f1:x=>2*x-2, xs1:[0,1,3], type1:'line',
    eq2:'y = x + 1', f2:x=>x+1, xs2:[0,1,3], type2:'line',
    kind:'point', solutions:[[3,4]], range:7
  },
  {
    eq1:'y = -x + 3', f1:x=>-x+3, xs1:[-2,0,2], type1:'line',
    eq2:'y = 1', f2:x=>1, xs2:[-2,0,2], type2:'line',
    kind:'point', solutions:[[2,1]], range:6,self1:true,self2:true
  },
  {
    eq1:'y = 3x - 2', f1:x=>3*x-2, xs1:[-1,0,2], type1:'line',
    eq2:'y = -x + 6', f2:x=>-x+6, xs2:[0,2,4], type2:'line',
    kind:'point', solutions:[[2,4]], range:8,self1:true,self2:true
  },
  {
    eq1:'y = \\frac12x + 1', f1:x=>0.5*x+1, xs1:[-2,0,2], type1:'line',
    eq2:'y = -\\frac12x + 3', f2:x=>-0.5*x+3, xs2:[-2,0,2], type2:'line',
    kind:'point', solutions:[[2,2]], range:6,self1:true,self2:true
  },
  {
    eq1:'x + y = 4', f1:x=>-x+4, xs1:[0,2,4], type1:'line',
    eq2:'y = x', f2:x=>x, xs2:[-2,0,2], type2:'line',
    kind:'point', solutions:[[2,2]], range:6,self1:true,self2:true,transform:true,transformAnswer:'-x+4',transformDisplay:'x+y=4'
  },
  {
    eq1:'2x + 2y - 8 = 0', f1:x=>-x+4, xs1:[0,2,4], type1:'line',
    eq2:'y = 2x - 2', f2:x=>2*x-2, xs2:[0,1,3], type2:'line',
    kind:'point', solutions:[[2,2]], range:7,self1:true,self2:true,transform:true,transformAnswer:'-x+4',transformDisplay:'2x+2y-8=0'
  },
  {
    eq1:'y = x + 2', f1:x=>x+2, xs1:[-2,0,2], type1:'line',
    eq2:'y = x^2', f2:x=>x*x, xs2:[-2,-1,0,1,2], type2:'parabola',
    kind:'twoPoints', solutions:[[-1,1],[2,4]], range:6,self1:true,self2:true
  }
];

let taskIndex=0;
let state={};
let totalScore=0;
const taskCard=document.getElementById('taskCard');
const progress=document.getElementById('progress');
const score=document.getElementById('score');
const canvas=document.getElementById('graph');
const ctx=canvas.getContext('2d');

function fmt(n){ return Number.isInteger(n)? String(n) : String(n).replace('.',','); }
function parseFi(v){ return Number(String(v).trim().replace(',','.')); }

function resetState(){ state={t1:false,t2:false,done:false,attempted:false,live1:[],live2:[]}; }

function renderTask(){
  const t=tasks[taskIndex];
  progress.textContent=`Tehtävä ${taskIndex+1} / ${tasks.length}`;
  score.textContent=`Pisteet: ${totalScore}`;
  let transform = t.transform ? `<div class="hintline"><b>Muuta ensin kuvaajan muotoon:</b><div class="inline-form" style="margin-top:7px">\\(${t.transformDisplay}\\) &nbsp;→&nbsp; \\(y=\\) <input class="answer wide" id="transformInput" placeholder="ratkaistu muoto"><button id="checkTransform">Tarkista</button></div><div class="feedback" id="transformFb"></div></div>` : '';
  taskCard.innerHTML=`
    <div class="eqpair">
      <div class="eqrow"><span class="brace">{</span><div><div>\\(${t.eq1}\\)</div><div>\\(${t.eq2}\\)</div></div></div>
    </div>
    ${transform}
    <div id="tablesWrap" ${t.transform?'style="opacity:.45;pointer-events:none"':''}>
      ${tableHtml(1,t.eq1,t.xs1,!!t.self1)}
      ${tableHtml(2,t.eq2,t.xs2,!!t.self2)}
      <div class="solution-box hidden" id="solutionBox"></div>
    </div>
    <div class="nav">
      <button class="secondary" id="prevBtn" ${taskIndex===0?'disabled':''}>← Edellinen</button>
      <button class="secondary" id="nextBtn">${taskIndex===tasks.length-1?'Valmis':'Seuraava →'}</button>
    </div>
  `;
  wireTable(1,t);
  wireTable(2,t);
  taskCard.querySelectorAll('.cell').forEach(input=>input.addEventListener('input',()=>{updateLiveTable(1,t);updateLiveTable(2,t)}));
  if(t.transform){
    document.getElementById('checkTransform').onclick=()=>{
      state.attempted=true;const raw=document.getElementById('transformInput').value.replace(/\s/g,'').replace('−','-').replace(/^y=/,'');
      const ok=raw.toLowerCase()===t.transformAnswer;
      const fb=document.getElementById('transformFb');
      if(ok){ fb.textContent='Oikein! Nyt voit täyttää taulukot.'; fb.className='feedback good'; document.getElementById('tablesWrap').style=''; }
      else { fb.innerHTML=`Ratkaistu muoto on <b>y = ${t.transformAnswer}</b>. Taulukot on nyt avattu.`; fb.className='feedback bad'; document.getElementById('tablesWrap').style=''; }
    };
  }
  document.getElementById('prevBtn').onclick=()=>{if(taskIndex>0){taskIndex--;resetState();renderTask();}};
  document.getElementById('nextBtn').onclick=()=>{if(!state.attempted){const f=document.getElementById('fbT1');f.textContent='Tarkista tehtävää ennen jatkamista.';f.className='feedback bad';return}if(taskIndex<tasks.length-1){taskIndex++;resetState();renderTask()}else{taskCard.innerHTML=`<h2>Valmis!</h2><p>Olet tehnyt kaikki ${tasks.length} graafista yhtälöparitehtävää.</p><button id="again">Aloita alusta</button>`;document.getElementById('again').onclick=()=>{taskIndex=0;totalScore=0;resetState();renderTask()}}};
  drawGraph();
  if(window.MathJax?.typesetPromise)MathJax.typesetPromise([taskCard]);
}

function tableHtml(n,eq,xs,self){
  return `<div class="table-block">
    <div class="table-title">${n}. kuvaaja: \\(${eq}\\)</div>
    ${self?'<div class="small-note">Valitse itse sopivat kokonaislukuarvot x:lle.</div>':''}
    <table><tr><th>\\(x\\)</th>${xs.map((x,i)=>`<td>${self?`<input class="cell xcell" id="x${n}c${i}" inputmode="numeric">`:fmt(x)}</td>`).join('')}</tr>
    <tr><th>\\(y\\)</th>${xs.map((x,i)=>`<td><input class="cell" id="t${n}c${i}" inputmode="decimal"></td>`).join('')}</tr></table>
    <div class="actions"><button id="checkT${n}">Tarkista taulukko</button></div>
    <div class="feedback" id="fbT${n}"></div>
  </div>`;
}

function wireTable(n,t){
  document.getElementById(`checkT${n}`).onclick=()=>{
    state.attempted=true;let xs=t[`xs${n}`], f=t[`f${n}`];
    if(t[`self${n}`]){xs=xs.map((_,i)=>parseFi(document.getElementById(`x${n}c${i}`).value));if(xs.some(x=>!Number.isInteger(x))||new Set(xs).size<xs.length){const fb=document.getElementById(`fbT${n}`);fb.textContent='Valitse eri kokonaisluvut x-arvoiksi.';fb.className='feedback bad';return}if(xs.some(x=>Math.abs(x)>t.range||Math.abs(f(x))>t.range)){const fb=document.getElementById(`fbT${n}`);fb.textContent='Valitse x-arvot niin, että myös y-arvot mahtuvat koordinaatistoon.';fb.className='feedback bad';return}t[`xs${n}`]=xs;}
    let ok=true;
    xs.forEach((x,i)=>{
      const inp=document.getElementById(`t${n}c${i}`);
      const val=parseFi(inp.value);
      const ans=f(x);
      if(!Number.isFinite(val) || Math.abs(val-ans)>1e-9){ok=false; inp.style.borderColor='#b23a3a';}
      else inp.style.borderColor='#1b7f4b';
    });
    const fb=document.getElementById(`fbT${n}`);
    if(ok){
      state[`t${n}`]=true;
      fb.textContent='Oikein! Kuvaaja on piirretty.'; fb.className='feedback good';
      xs.forEach((x,i)=>document.getElementById(`t${n}c${i}`).disabled=true);
      document.getElementById(`checkT${n}`).disabled=true;
      drawGraph();
      if(state.t1&&state.t2) showSolution(t);
    } else {
      fb.textContent='Tarkista punaisella merkityt arvot.'; fb.className='feedback bad';
    }
  };
}
function updateLiveTable(n,t){
  let xs=t[`xs${n}`];if(t[`self${n}`])xs=xs.map((_,i)=>parseFi(document.getElementById(`x${n}c${i}`)?.value));
  const f=t[`f${n}`],live=[];xs.forEach((x,i)=>{const y=parseFi(document.getElementById(`t${n}c${i}`)?.value);if(Number.isInteger(x)&&Number.isFinite(y)&&Math.abs(y-f(x))<1e-9&&Math.abs(x)<=t.range&&Math.abs(y)<=t.range)live.push([x,y])});state[`live${n}`]=live;drawGraph();
}

function showSolution(t){
  const box=document.getElementById('solutionBox');
  box.classList.remove('hidden');
  if(t.kind==='point'){
    box.innerHTML=`<b>Lue leikkauspiste kuvaajasta.</b><div class="inline-form" style="margin-top:8px">x = <input class="answer" id="sx"> y = <input class="answer" id="sy"><button id="checkSol">Tarkista ratkaisu</button></div><div class="feedback" id="solFb"></div>`;
    document.getElementById('checkSol').onclick=()=>checkPoint(t.solutions[0]);
  } else if(t.kind==='twoPoints'){
    box.innerHTML=`<b>Kuvaajilla on kaksi leikkauspistettä.</b>
    <div class="inline-form" style="margin-top:8px">1. ratkaisu: ( <input class="answer" id="x1"> , <input class="answer" id="y1"> )</div>
    <div class="inline-form" style="margin-top:8px">2. ratkaisu: ( <input class="answer" id="x2"> , <input class="answer" id="y2"> ) <button id="checkSol">Tarkista</button></div>
    <div class="feedback" id="solFb"></div>`;
    document.getElementById('checkSol').onclick=()=>checkTwoPoints(t.solutions);
  } else {
    box.innerHTML=`<b>Mitä kuvaajista voidaan päätellä?</b>
      <div class="choice-row">
        <label><input type="radio" name="ch" value="one"> Yksi ratkaisu</label>
        <label><input type="radio" name="ch" value="none"> Ei ratkaisua</label>
        <label><input type="radio" name="ch" value="infinite"> Äärettömän monta ratkaisua</label>
      </div><button id="checkChoice">Tarkista</button><div class="feedback" id="solFb"></div>`;
    document.getElementById('checkChoice').onclick=()=>{
      const sel=document.querySelector('input[name="ch"]:checked');
      const fb=document.getElementById('solFb');
      if(sel&&sel.value===t.correctChoice){
        const msg=t.correctChoice==='none'?'Oikein! Suorat ovat yhdensuuntaiset eivätkä leikkaa.':'Oikein! Kuvaajat ovat sama suora, joten jokainen suoran piste toteuttaa molemmat yhtälöt.';
        finish(msg);
      } else { fb.textContent='Katso kuvaajia vielä kerran.'; fb.className='feedback bad'; }
    };
  }
}

function checkPoint(sol){
  const x=parseFi(document.getElementById('sx').value), y=parseFi(document.getElementById('sy').value);
  const fb=document.getElementById('solFb');
  if(x===sol[0]&&y===sol[1]) finish(`Oikein! Yhtälöparin ratkaisu on (${fmt(sol[0])}, ${fmt(sol[1])}).`);
  else {fb.textContent='Ei vielä. Etsi kohta, jossa kuvaajat leikkaavat.';fb.className='feedback bad';}
}
function checkTwoPoints(sols){
  const p1=[parseFi(document.getElementById('x1').value),parseFi(document.getElementById('y1').value)];
  const p2=[parseFi(document.getElementById('x2').value),parseFi(document.getElementById('y2').value)];
  const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
  if((same(p1,sols[0])&&same(p2,sols[1]))||(same(p1,sols[1])&&same(p2,sols[0]))) finish(`Oikein! Ratkaisut ovat (${fmt(sols[0][0])}, ${fmt(sols[0][1])}) ja (${fmt(sols[1][0])}, ${fmt(sols[1][1])}).`);
  else {const fb=document.getElementById('solFb');fb.textContent='Ei vielä. Kuvaajilla on kaksi eri leikkauspistettä.';fb.className='feedback bad';}
}
function finish(msg){
  const fb=document.getElementById('solFb');
  fb.textContent=msg; fb.className='feedback good';
  if(!state.done){ totalScore++; state.done=true; score.textContent=`Pisteet: ${totalScore}`; }
  drawGraph(true);
}

function drawGraph(mark=false){
  const t=tasks[taskIndex], R=t.range||6, W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const xToPx=x=>(x+R)/(2*R)*W, yToPx=y=>H-(y+R)/(2*R)*H;
  ctx.lineWidth=1; ctx.font='14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='top';
  for(let i=-R;i<=R;i++){
    const x=xToPx(i), y=yToPx(i);
    ctx.strokeStyle=i===0?'#758294':'#e5e9ef';
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    if(i!==0){ctx.fillStyle='#6a7584';ctx.fillText(i,x,yToPx(0)+4);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(i,xToPx(0)-5,y);ctx.textAlign='center';ctx.textBaseline='top';}
  }
  ctx.fillStyle='#394455';ctx.font='15px system-ui';ctx.fillText('x',W-12,yToPx(0)+5);ctx.fillText('y',xToPx(0)+12,6);
  ctx.fillStyle='#172033';ctx.beginPath();ctx.moveTo(W,yToPx(0));ctx.lineTo(W-14,yToPx(0)-7);ctx.lineTo(W-14,yToPx(0)+7);ctx.fill();ctx.beginPath();ctx.moveTo(xToPx(0),0);ctx.lineTo(xToPx(0)-7,14);ctx.lineTo(xToPx(0)+7,14);ctx.fill();ctx.font='italic 19px Georgia,serif';ctx.fillText('x',W-15,yToPx(0)+22);ctx.fillText('y',xToPx(0)+12,18);
  [[state.live1,'#2457c5'],[state.live2,'#d04848']].forEach(([pts,color])=>{ctx.fillStyle=color;pts.forEach(([x,y])=>{ctx.beginPath();ctx.arc(xToPx(x),yToPx(y),6,0,Math.PI*2);ctx.fill()})});
  if(state.t1) drawFunction(t.f1,t.type1,'#2457c5',t.xs1,R,xToPx,yToPx);
  if(state.t2) drawFunction(t.f2,t.type2,'#d04848',t.xs2,R,xToPx,yToPx);
  if(mark&&state.done&&t.solutions){
    t.solutions.forEach(([x,y])=>{
      ctx.strokeStyle='#198754';ctx.lineWidth=4;ctx.beginPath();ctx.arc(xToPx(x),yToPx(y),9,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#198754';ctx.font='bold 16px system-ui';ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillText(`(${fmt(x)}, ${fmt(y)})`,xToPx(x)+12,yToPx(y)-10);
    });
  }
}
function drawFunction(f,type,color,xs,R,xToPx,yToPx){
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3;ctx.beginPath();
  let first=true;
  const step= type==='parabola'?0.03:0.08;
  for(let x=-R;x<=R;x+=step){
    const y=f(x); if(y<-R-2||y>R+2){first=true;continue;}
    const px=xToPx(x),py=yToPx(y); if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);
  }
  ctx.stroke();
  xs.forEach(x=>{const y=f(x);ctx.beginPath();ctx.arc(xToPx(x),yToPx(y),5,0,Math.PI*2);ctx.fill();});
}
resetState();renderTask();
</script>
</body>
</html>
