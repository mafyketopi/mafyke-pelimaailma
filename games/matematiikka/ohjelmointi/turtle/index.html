<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Mafyke – Turtle-ohjelmointi</title>
<script src="./vendor/skulpt.min.js"></script>
<script src="./vendor/skulpt-stdlib.js"></script>
<style>
:root{--bg:#f5f7fa;--paper:#fff;--ink:#172033;--muted:#5d6a7b;--line:#dce2e8;--blue:#285d91;--green:#14783d;--red:#a33232}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 4vw}
.breadcrumb{font-size:.87rem;color:var(--muted);margin-bottom:5px}
h1{margin:0;font-size:clamp(1.7rem,3vw,2.5rem)} header p{margin:.35rem 0 0;color:var(--muted)}
main{max-width:1450px;margin:auto;padding:18px 3vw 32px}
.progress{display:flex;gap:7px;overflow:auto;padding:3px 0 14px}
.pill{min-width:34px;height:34px;border-radius:50%;border:1px solid #b8c1cb;background:#fff;cursor:pointer;font-weight:650}
.pill.active{background:var(--blue);color:#fff;border-color:var(--blue)} .pill.done{outline:3px solid #cce9d6}
.grid{display:grid;grid-template-columns:minmax(270px,.72fr) minmax(360px,1.05fr) minmax(350px,1.05fr);gap:14px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0000000a}
.head{padding:11px 14px;background:#f9fafb;border-bottom:1px solid var(--line);font-size:.84rem;font-weight:750;letter-spacing:.04em}
.body{padding:16px} .tasktitle{margin:0 0 10px;font-size:1.35rem} .goal{line-height:1.5}
textarea{display:block;width:100%;height:430px;border:0;outline:0;resize:vertical;background:#17212b;color:#f5f7f9;padding:15px;font:15px/1.5 Consolas,monospace;tab-size:4}
.controls{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:#111922;border-top:1px solid #34404d}
button.action{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}
.run{background:#d9efe1;color:#154d2c} .check{background:#dbeaf8;color:#17456f} .soft{background:#eceff2;color:#394653} .stop{background:#fae0e0;color:#7e2020}
#canvas{height:430px;background:#fff;overflow:hidden;border-bottom:1px solid var(--line)} #canvas svg{max-width:100%;max-height:100%}
.output{margin:12px;background:#f7f8f8;border:1px solid var(--line);border-radius:7px;padding:10px;min-height:74px;max-height:150px;overflow:auto;white-space:pre-wrap;font:13px/1.4 Consolas,monospace}
.feedback{margin:0 12px 12px;padding:10px 12px;border-left:4px solid #aab1b8;background:#f6f7f8;font-size:.93rem}
.feedback.ok{border-color:var(--green);background:#edf8f1;color:#105b30} .feedback.bad{border-color:var(--red);background:#fff0f0;color:#772424}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px} .small{font-size:.83rem;color:var(--muted);line-height:1.45}
@media(max-width:1050px){.grid{grid-template-columns:1fr 1.2fr}.visual{grid-column:1/-1}}
@media(max-width:720px){.grid{grid-template-columns:1fr}.visual{grid-column:auto}textarea,#canvas{height:340px}}
</style>
</head>
<body>
<header>
<div class="breadcrumb">Mafyke → Matematiikka → Ohjelmointi → Turtle</div>
<h1>Turtle-ohjelmointi</h1>
<p>Muokkaa koodia, suorita ohjelma ja tarkista tehtävä.</p>
</header>
<main>
<div class="progress" id="progress"></div>
<div class="grid">
<section class="card">
<div class="head">TEHTÄVÄ</div><div class="body">
<h2 class="tasktitle" id="title"></h2><div class="goal" id="goal"></div>
<div class="nav"><button class="action soft" id="prev">← Edellinen</button><button class="action soft" id="next">Seuraava →</button></div>
<p class="small">Tehtävät eivät tallenna nimeä, koodia tai suorituksia palvelimelle. Koodi suoritetaan selaimessasi.</p>
</div></section>
<section class="card">
<div class="head">PYTHON-EDITORI</div><textarea id="code" spellcheck="false"></textarea>
<div class="controls"><button class="action run" id="run">▶ Suorita</button><button class="action check" id="check">✓ Tarkista</button><button class="action soft" id="reset">Palauta alkukoodi</button><button class="action stop" id="stop">■ Pysäytä</button></div>
</section>
<section class="card visual">
<div class="head">TURTLE</div><div id="canvas"></div>
<div class="output" id="output">Paina Suorita.</div><div class="feedback" id="feedback">Tee tehtävän pyytämä muutos.</div>
</section>
</div></main>
<script>
"use strict";
const TASKS=[{"title": "1. Siirrä pistettä", "goal": "Muuta ensimmäinen piste kohtaan (140, 0).", "code": "import turtle\n\nturtle.goto(100, 0)\nturtle.goto(50, 100)\nturtle.goto(0, 0)\n", "checker": "goto140"}, {"title": "2. Sulje kolmio", "goal": "Täydennä ohjelmaa yhdellä goto-komennolla niin, että kolmio sulkeutuu lähtöpisteeseen (0, 0).", "code": "import turtle\n\nturtle.goto(100, 0)\nturtle.goto(50, 100)\n# Täydennä tähän\n", "checker": "close0"}, {"title": "3. Neliö goto-komennolla", "goal": "Piirrä neliö, jonka sivu on 100. Käytä goto-komentoja.", "code": "import turtle\n\nturtle.goto(100, 0)\n# Jatka tästä\n", "checker": "squaregoto"}, {"title": "4. Neliö ilman silmukkaa", "goal": "Täydennä ohjelma neliöksi. Käytä forward- ja left-komentoja, mutta älä vielä silmukkaa.", "code": "import turtle\n\nturtle.forward(80)\nturtle.left(90)\n# Jatka tästä\n", "checker": "squaremanual"}, {"title": "5. Kolmio silmukalla", "goal": "Muuta vain sivunpituudeksi 120. Älä muuta toistojen määrää tai kulmaa.", "code": "import turtle\n\nfor i in range(3):\n    turtle.forward(80)\n    turtle.left(120)\n", "checker": "tri120"}, {"title": "6. Kolmiosta neliö", "goal": "Muuta kolmio neliöksi. Sivunpituus saa pysyä arvossa 80.", "code": "import turtle\n\nfor i in range(3):\n    turtle.forward(80)\n    turtle.left(120)\n", "checker": "squareloop"}, {"title": "7. Säännöllinen kuusikulmio", "goal": "Muuta ohjelma piirtämään säännöllinen kuusikulmio.", "code": "import turtle\n\nfor i in range(4):\n    turtle.forward(70)\n    turtle.left(90)\n", "checker": "hex"}, {"title": "8. Säännöllinen viisikulmio", "goal": "Muuta ohjelma piirtämään säännöllinen viisikulmio.", "code": "import turtle\n\nfor i in range(6):\n    turtle.forward(70)\n    turtle.left(60)\n", "checker": "pent"}, {"title": "9. Säännöllinen kahdeksankulmio", "goal": "Kirjoita silmukalla säännöllinen kahdeksankulmio. Sivunpituus on 60.", "code": "import turtle\n\n# Kirjoita ratkaisu tähän\n", "checker": "oct"}, {"title": "10. Viivan väri", "goal": "Muuta viivan väriksi sininen komennolla turtle.pencolor(\"blue\").", "code": "import turtle\n\nturtle.forward(100)\nturtle.left(90)\nturtle.forward(100)\n", "checker": "blue"}, {"title": "11. Viivan paksuus", "goal": "Aseta viivan paksuudeksi 5 komennolla turtle.pensize(5).", "code": "import turtle\n\nturtle.pencolor(\"blue\")\nturtle.forward(100)\n", "checker": "pensize5"}, {"title": "12. Kynä ylös ja alas", "goal": "Piirrä kaksi 60 × 60 -neliötä niin, ettei niiden väliin tule yhdysviivaa. Käytä penup() ja pendown().", "code": "import turtle\n\nfor i in range(4):\n    turtle.forward(60)\n    turtle.left(90)\n\n# Siirry oikealle ilman piirtojälkeä ja piirrä toinen neliö\n", "checker": "penupdown"}, {"title": "13. Ympyrä", "goal": "Muuta ympyrän säteeksi 70.", "code": "import turtle\n\nturtle.circle(40)\n", "checker": "circle70"}, {"title": "14. Täytetty neliö", "goal": "Täytä neliö punaisella. Käytä fillcolor(\"red\"), begin_fill() ja end_fill().", "code": "import turtle\n\nfor i in range(4):\n    turtle.forward(90)\n    turtle.left(90)\n", "checker": "fillred"}, {"title": "15. Kasvava sivunpituus", "goal": "Täydennä ohjelma niin, että forward-komennon pituus kasvaa i:n mukana. Lisää myös 120 asteen käännös.", "code": "import turtle\n\nturtle.speed(0)\nfor i in range(1, 18):\n    # Täydennä\n    pass\n", "checker": "growtri"}, {"title": "16. Neliöspiraali", "goal": "Muuta ohjelma kasvavaksi neliöspiraaliksi: sivunpituus kasvaa i:n mukana ja käännös on 90 astetta.", "code": "import turtle\n\nturtle.speed(0)\nfor i in range(1, 25):\n    turtle.forward(i * 5)\n    turtle.left(120)\n", "checker": "squarespiral"}, {"title": "17. Sisäkkäiset silmukat", "goal": "Täydennä ulompi silmukka niin, että kolmio piirretään 10 kertaa eri asentoihin. Käännä jokaisen kolmion jälkeen 36 astetta.", "code": "import turtle\n\nturtle.speed(0)\nfor k in range(10):\n    for i in range(3):\n        turtle.forward(80)\n        turtle.left(120)\n    # Täydennä tähän\n", "checker": "nestedtri"}, {"title": "18. Neliörosetti", "goal": "Muuta sisempi kuvio neliöksi. Ulompi silmukka piirtää edelleen 10 kuviota ja kääntyy 36 astetta.", "code": "import turtle\n\nturtle.speed(0)\nfor k in range(10):\n    for i in range(3):\n        turtle.forward(70)\n        turtle.left(120)\n    turtle.right(36)\n", "checker": "nestedsquare"}, {"title": "19. Ympyrärosetti", "goal": "Tee rosetti, jossa on 20 ympyrää. Kuvion tulee kiertyä tasaisesti yhden täyden kierroksen.", "code": "import turtle\n\nturtle.speed(0)\nfor i in range(72):\n    turtle.circle(60)\n    turtle.left(5)\n", "checker": "rosette20"}, {"title": "20. Oma Turtle-kuvio", "goal": "Tee oma kuvio. Käytä vähintään silmukkaa, silmukkamuuttujaa tai muuta muuttujaa, väriä sekä vähintään kahta piirtoon vaikuttavaa Turtle-komentoa.", "code": "import turtle\n\nturtle.speed(0)\n\n# Oma ohjelmasi\n", "checker": "creative"}];
let current=0, runToken=0, completed=new Set(), lastRunOK=false;
const $=id=>document.getElementById(id), code=$("code"), output=$("output"), feedback=$("feedback");

function norm(s){return s.replace(/#.*$/gm,"").replace(/\s+/g," ");}
function count(s,re){return (s.match(re)||[]).length;}
function has(re,s=norm(code.value)){return re.test(s);}
function setFeedback(msg,kind=""){feedback.className="feedback"+(kind?" "+kind:"");feedback.textContent=msg;}
function renderProgress(){
 const p=$("progress");p.innerHTML="";
 TASKS.forEach((t,i)=>{const b=document.createElement("button");b.className="pill"+(i===current?" active":"")+(completed.has(i)?" done":"");b.textContent=i+1;b.title=t.title;b.onclick=()=>load(i);p.appendChild(b);});
}
function load(i){
 current=i; lastRunOK=false; $("title").textContent=TASKS[i].title; $("goal").textContent=TASKS[i].goal; code.value=TASKS[i].code;
 $("canvas").innerHTML=""; output.textContent="Paina Suorita."; setFeedback("Tee tehtävän pyytämä muutos.");
 $("prev").disabled=i===0;$("next").disabled=i===TASKS.length-1;renderProgress();
}
function builtinRead(x){
 if(!Sk.builtinFiles || !Sk.builtinFiles.files[x]) throw new Error("Kirjastoa ei löydy: "+x);
 return Sk.builtinFiles.files[x];
}
function outf(t){output.textContent+=t;}
async function runProgram(){
 const token=++runToken; lastRunOK=false;$("canvas").innerHTML="";output.textContent="";setFeedback("Ohjelmaa suoritetaan…");
 try{
   if(typeof Sk==="undefined") throw new Error("Skulpt-kirjastoa ei ole asennettu vendor-kansioon.");
   Sk.configure({output:outf,read:builtinRead,__future__:Sk.python3,execLimit:5000});
   Sk.execLimit=5000;
   Sk.TurtleGraphics={target:"canvas",width:$("canvas").clientWidth,height:430};
   await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,code.value,true));
   if(token!==runToken) return false;
   lastRunOK=true;if(!output.textContent.trim())output.textContent="Ohjelma suoritettiin.";
   setFeedback("Ohjelma suoritettiin. Tarkista tehtävä, kun olet valmis.","ok"); return true;
 }catch(e){
   if(token!==runToken)return false;
   output.textContent=String(e); setFeedback("Koodissa on virhe tai suoritus keskeytettiin. Korjaa koodia ja yritä uudelleen.","bad"); return false;
 }
}
function stopProgram(){runToken++; lastRunOK=false; try{Sk.execStart=0;Sk.execLimit=1;}catch(e){} setFeedback("Suoritus pysäytettiin.","bad");}
function checkTask(){
 const s=norm(code.value), raw=code.value, k=TASKS[current].checker; let ok=false, msg="Tarkista tehtävänanto ja muokkaa koodia vielä.";
 const range=(n)=>new RegExp("range\\s*\\(\\s*"+n+"\\s*\\)").test(s);
 const angle=(n)=>new RegExp("(?:left|right)\\s*\\(\\s*"+n+"(?:\\.0)?\\s*\\)").test(s);
 const fwd=(n)=>new RegExp("forward\\s*\\(\\s*"+n+"(?:\\.0)?\\s*\\)").test(s);
 if(k==="goto140") ok=/goto\s*\(\s*140\s*,\s*0\s*\)/.test(s);
 else if(k==="close0") ok=count(s,/goto\s*\(/g)>=3 && /goto\s*\(\s*0\s*,\s*0\s*\)/.test(s);
 else if(k==="squaregoto") ok=count(s,/goto\s*\(/g)>=4 && /goto\s*\(\s*0\s*,\s*0\s*\)/.test(s);
 else if(k==="squaremanual") ok=!/\bfor\b/.test(s) && count(s,/forward\s*\(/g)>=4 && count(s,/left\s*\(\s*90\s*\)/g)>=3;
 else if(k==="tri120") ok=range(3)&&fwd(120)&&angle(120);
 else if(k==="squareloop") ok=range(4)&&angle(90)&&/forward\s*\(/.test(s);
 else if(k==="hex") ok=range(6)&&angle(60);
 else if(k==="pent") ok=range(5)&&angle(72);
 else if(k==="oct") ok=range(8)&&angle(45)&&fwd(60);
 else if(k==="blue") ok=/pencolor\s*\(\s*["']blue["']\s*\)/.test(s);
 else if(k==="pensize5") ok=/pensize\s*\(\s*5\s*\)/.test(s);
 else if(k==="penupdown") ok=/penup\s*\(\s*\)/.test(s)&&/pendown\s*\(\s*\)/.test(s)&&count(s,/range\s*\(\s*4\s*\)/g)>=2;
 else if(k==="circle70") ok=/circle\s*\(\s*70\s*\)/.test(s);
 else if(k==="fillred") ok=/fillcolor\s*\(\s*["']red["']\s*\)/.test(s)&&/begin_fill\s*\(\s*\)/.test(s)&&/end_fill\s*\(\s*\)/.test(s);
 else if(k==="growtri") ok=/forward\s*\([^)]*\bi\b[^)]*\)/.test(s)&&angle(120)&&!/\bpass\b/.test(s);
 else if(k==="squarespiral") ok=/forward\s*\([^)]*\bi\b[^)]*\)/.test(s)&&angle(90);
 else if(k==="nestedtri") ok=count(s,/\bfor\b/g)>=2&&range(10)&&range(3)&&angle(36);
 else if(k==="nestedsquare") ok=count(s,/\bfor\b/g)>=2&&range(10)&&range(4)&&angle(90)&&angle(36);
 else if(k==="rosette20") ok=range(20)&&/circle\s*\(/.test(s)&&angle(18);
 else if(k==="creative") ok=/\bfor\b/.test(s)&&/pencolor\s*\(/.test(s)&&count(s,/(?:forward|backward|goto|circle|left|right)\s*\(/g)>=2&&(/\bi\b/.test(s)||/[A-Za-z_]\w*\s*=/.test(s));
 if(ok){completed.add(current);setFeedback("✓ Oikein! Tehtävä on suoritettu.","ok");renderProgress();}
 else setFeedback(msg,"bad");
}
$("run").onclick=runProgram;$("check").onclick=checkTask;$("stop").onclick=stopProgram;
$("reset").onclick=()=>load(current);$("prev").onclick=()=>load(current-1);$("next").onclick=()=>load(current+1);
code.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();let a=code.selectionStart,b=code.selectionEnd;code.value=code.value.slice(0,a)+"    "+code.value.slice(b);code.selectionStart=code.selectionEnd=a+4;}if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();runProgram();}});
load(0);
</script></body></html>
