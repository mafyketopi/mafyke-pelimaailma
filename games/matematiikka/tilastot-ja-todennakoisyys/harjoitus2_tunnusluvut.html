editStatistic('Ikäjakauman väitteet',{context:'Diagrammi näyttää kyselyyn vastanneiden ikäjakauman.',visual:{type:'discretebars',labels:[10,20,30,40],values:[2,4,3,1],max:5,xlabel:'Ikä (vuotta)'},q:'Mitkä väitteet pitävät paikkansa?',statements:['A: Mediaani on 20 vuotta.','B: Keskiarvo on 24 vuotta.','C: Vaihteluvälin pituus on 30 vuotta.'],explain:'A on tosi. Keskiarvo on $\\bar x=\\dfrac{2\\cdot10+4\\cdot20+3\\cdot30+1\\cdot40}{10}=23$ vuotta, joten B on epätosi. C on tosi, sillä $40-10=30$ vuotta.'});
editStatistic('Tunnusluvut arvosanataulukosta',{context:'Taulukossa ovat matematiikan koearvosanojen frekvenssit.',q:'Laske arvosanojen keskiarvo kahden desimaalin tarkkuudella ja mediaani.',fields:['Keskiarvo','Mediaani'],correct:[7.63,8],tolerance:0.0051,explain:'Oppilaita on 24. Painotettu summa on $2\\cdot5+3\\cdot6+5\\cdot7+8\\cdot8+4\\cdot9+2\\cdot10=183$. Keskiarvo on $\\dfrac{183}{24}=7,625\\approx7,63$. Järjestetyn aineiston 12. ja 13. arvosana ovat 8, joten mediaani on 8.'});
editStatistic('Sama mediaani, monta ratkaisua',{q:'Anna kaksi erilaista mahdollista $x$:n arvoa.',fields:['Ensimmäinen x','Toinen x'],explain:'Kun $x\\geq12$, kaksi keskimmäistä arvoa ovat 8 ja 12. Mediaani on $\\dfrac{8+12}{2}=10$. Esimerkiksi $x=12$ ja $x=15$ käyvät.'});
editStatistic('Lentopallon syöttötilasto',{context:'Kahdeksan lentopalloilijan onnistuneiden syöttöjen määrät näkyvät taulukossa. Tiedot ovat suuruusjärjestyksessä. Keskiarvo on 4,5, mediaani 3,5 ja moodi 3.',visual:{type:'table',heads:['Pelaaja','A','B','C','D','E','F','G','H'],rows:[['Onnistuneet syötöt',2,3,3,'?','?',6,7,8]]},q:'Kuinka monta onnistunutta syöttöä pelaajilla D ja E oli?',fields:['Pelaaja D','Pelaaja E'],explain:'Kokonaissumma on $8\\cdot4,5=36$. Tunnettujen lukujen summa on 29, joten $D+E=7$. Järjestys ja moodi 3 määräävät $D=3$ ja $E=4$. Tarkistus: mediaani on $\\dfrac{3+4}{2}=3,5$.'});
editStatistic('Mediaani prosenttijakaumasta',{context:'Taulukossa on erään ylioppilaskokeen arvosanojen prosenttijakauma. Arvosanat ovat parhaasta heikoimpaan L, E, M, C, B, A ja I.',explain:'Alimmista arvosanoista I, A ja B kertyy $6,5\\%+15,7\\%+25,5\\%=47,7\\%$. Arvosana C vie kertymän yli 50 prosentin, joten mediaaniarvosana on C.'});
editStatistic('Viikon kaksi puuttuvaa matkaa',{context:'Oppilas kirjasi askelmittarinsa mittaamat päivittäiset kävelymatkat. Viiden ensimmäisen päivän kilometrit näkyvät taulukossa. Koko viikon keskiarvo oli 2,6 km, ja mediaani oli sama kuin viiden ensimmäisen päivän mediaani.',visual:{type:'table',heads:['Päivä','Ma','Ti','Ke','To','Pe','La','Su'],rows:[['Kävelymatka (km)','1,2','3,8','2,4','1,6','3,0','?','?']]},q:'Anna yksi mahdollinen viikonlopun kävelymatkapari.',fields:['Lauantai (km)','Sunnuntai (km)'],explain:'Arkipäivien summa on 12,0 km ja mediaani 2,4 km. Koko viikon summa on $7\\cdot2,6=18,2$ km, joten viikonlopulle jää $18,2-12,0=6,2$ km. Esimerkiksi lauantain 2,0 km ja sunnuntain 4,2 km toteuttavat molemmat ehdot.'});
editStatistic('Rakenna aineisto tunnusluvuista',{context:'Ammuntaharjoituksessa ammutaan viisi laukausta. Yhdestä laukauksesta voi saada kokonaisluvun 0–10 pistettä. Viiden laukauksen keskiarvo on 8, mediaani 10 ja suurin pistemäärä 10.',visual:{type:'table',heads:['Laukauksia','Keskiarvo','Mediaani','Suurin tulos'],rows:[[5,8,10,10]]},q:'Anna kaksi erilaista mahdollista viiden laukauksen pistemääräsarjaa.',fields:['Ensimmäinen sarja (5 lukua)','Toinen sarja (5 lukua)'],explain:'Esimerkiksi $4,6,10,10,10$ ja $5,5,10,10,10$ käyvät. Molempien summa on 40 ja keskimmäinen arvo 10. Muitakin sarjoja on.'});
editStatistic('Kolme puuttuvaa havaintoa',{fields:['x','y','z'],q:'Anna yksi mahdollinen kokonaislukukolmikko $x,y,z$.',explain:'Mediaaniehto antaa $x+y=7$. Kokonaissumma on $8\\cdot4=32$, joten $z=9$. Esimerkiksi $x=3$, $y=4$ ja $z=9$ toteuttavat myös moodiehdon.'});
