<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murtoluvun käsite</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#637184;--line:#d7dfe8;--blue:#2457a7;--ok:#137647;--bad:#ad2634}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 5% 13px}h1{margin:0;font-size:clamp(1.65rem,3.7vw,2.45rem)}header p{margin:5px 0 0;color:var(--muted)}
main{max-width:1100px;margin:auto;padding:18px 4% 34px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.tab{font:inherit;font-weight:750;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 7px 22px rgba(0,0,0,.035)}h2{margin:0 0 5px}.intro{margin:0 0 12px;color:var(--muted)}
.examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0 14px}.example{background:#f7f9fb;border:1px solid #e0e6ed;border-radius:11px;padding:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-height:74px}.item.good{background:#f6fcf8;border-color:#9ed3b7}.item.bad{background:#fff8f9;border-color:#e1a4ab}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.letter{color:var(--muted);font-weight:800;min-width:21px}.math{font-size:1.08rem;font-weight:720}.small{font-size:.84rem;color:var(--muted)}
input,select{font:inherit;background:#fff;border:1px solid #bac6d3;border-radius:8px;padding:7px 9px}input{width:96px}.xs{width:56px}.wide{width:180px;max-width:65vw}.correct{font-size:.8rem;color:var(--bad);min-height:16px;margin-top:4px}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.action{font:inherit;font-weight:750;border-radius:9px;padding:10px 15px;cursor:pointer;border:0}.primary{background:var(--blue);color:#fff}.secondary{border:1px solid var(--line);background:#eef2f6;color:var(--ink)}
.score{text-align:center;font-weight:850;margin-top:10px}.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;min-width:28px}.frac>.num{border-bottom:1.6px solid currentColor;padding:0 4px 3px}.frac>.den{padding:3px 4px 0}.mixed{display:inline-flex;align-items:center;gap:3px}
.note{font-size:.87rem;color:var(--muted);margin-top:10px}.stage{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}.intermediate{margin-top:8px;padding-top:8px;border-top:1px dashed #d6dee7;color:#526071;font-size:.88rem}
.numberline{position:relative;height:68px;margin:9px 2px 0;user-select:none;touch-action:none}.axis{position:absolute;left:18px;right:18px;top:27px;height:3px;background:#334257}.tick{position:absolute;top:19px;width:2px;height:18px;background:#334257}.tick.minor{top:22px;height:12px;background:#8490a0}.ticklabel{position:absolute;top:43px;transform:translateX(-50%);font-size:.76rem;color:#526071}.dot{position:absolute;top:18px;width:18px;height:18px;border-radius:50%;background:var(--blue);transform:translateX(-9px);cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.fracbar{display:flex;width:220px;height:28px;border:1px solid #445266;border-radius:5px;overflow:hidden}.fracbar span{flex:1;border-right:1px solid #778391}.fracbar span:last-child{border-right:0}.fracbar .fill{background:#cbd8eb}
.finnish{display:inline-grid;align-items:start;grid-template-columns:auto auto;column-gap:3px}.finnish .factor{font-weight:800;font-size:.9rem;margin-top:-2px;white-space:nowrap}.finnish.reduce{grid-template-columns:auto auto}.finnish.reduce .factor{grid-column:2;margin-left:2px}
.mcgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.mcitem{font-size:.9rem;min-height:0}.mcitem label{display:block;margin:4px 0}.mcitem input[type=radio]{width:auto;padding:0}
@media(max-width:820px){.grid,.examples{grid-template-columns:1fr}.mcgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:570px){.mcgrid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Murtoluvun käsite</h1><p>7. luokka · monisteen kappaleen 4 etenemisen mukaan</p></header><main><div class="tabs"><button class="tab active" data-page="division">Jakolasku → murtoluku</button><button class="tab" data-page="mixed">Sekaluvut</button><button class="tab" data-page="expand">Lavennus ja supistus</button><button class="tab" data-page="convert">Muunnokset</button><button class="tab" data-page="order">Suuruus</button></div><section class="card"><h2 id="title"></h2><p id="intro" class="intro"></p><div id="examples" class="examples"></div><div id="grid" class="grid"></div>
<div class="actions"><button id="check" class="action primary">Tarkista kaikki</button><button id="new" class="action secondary">Aloita osio alusta</button></div><div id="score" class="score"></div></section></main><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const V=s=>Number(String(s).trim().replace(/\s/g,'').replace(',','.')); const EQ=(s,x)=>Number.isFinite(V(s))&&Math.abs(V(s)-x)<1e-9;
const G=(a,b)=>b?G(b,a%b):Math.abs(a), L=(a,b)=>Math.abs(a*b)/G(a,b); function simp(n,d){if(d<0){n=-n;d=-d}let g=G(n,d);return[n/g,d/g]}
const F=(n,d)=>`<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`; const MIX=(w,n,d)=>`<span class="mixed">${w} ${F(n,d)}</span>`;
function result(i,ok,msg){let e=$('#it'+i),c=$('#c'+i);e.classList.remove('good','bad');e.classList.add(ok?'good':'bad');c.innerHTML=ok?'✓ Oikein':msg}
function tabs(cb){$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');cb(b.dataset.page)})}

let page='division',tasks=[];const S={division:['Jakolasku ja murtoluku','Suorita jakolasku ja anna tulos sekä murtolukuna että desimaalilukuna.'],mixed:['Murtoluku ja sekaluku','Muunna luvut toiseen muotoon.'],expand:['Laventaminen ja supistaminen','Käytä suomalaista merkintätapaa: lavennusluku murtoluvun vasemmalla puolella muodossa 2), supistusluku oikealla muodossa (2.'],convert:['Murtoluku ja desimaaliluku','Muunna luvut. Supista murtoluku mahdollisimman yksinkertaiseksi.'],order:['Suuruusjärjestys','Järjestä luvut pienimmästä suurimpaan.']};
const division=[[5,2],[8,3],[10,4],[11,2],[19,5],[5,3]],tomixed=[[11,3],[96,8],[41,6],[70,15]],tofrac=[[2,5,7],[9,3,5],[2,1,99],[100,1,2]],reduce=[[8,12],[16,20],[40,75],[72,210],[300,300],[3960,2970]];
const todec=[[2,7,10],[1,1,10],[0,1,1000],[0,17,10],[2,2,5],[0,17,50],[7,11,20],[0,1,200],[0,15,20],[0,9,24],[2,2,3],[2,3,40]],tofr=[[0.4,2,5],[0.75,3,4],[2.21,221,100],[0.375,3,8],[1.125,9,8],[4.44,111,25],[0.16,4,25],[1.1,11,10]];
const same=[[[2,3],[4,5],15],[[1,4],[6,7],28],[[3,4],[5,6],[1,8],24],[[2,3],[3,4],[9,10],[7,15],60]];
function finnishExp(k,n,d){return `<span class="finnish"><span class="factor">${k})</span><span>${F(n,d)}</span></span>`} function finnishRed(k,n,d){return `<span class="finnish reduce"><span>${F(n,d)}</span><span class="factor">(${k}</span></span>`}
function setPage(p){page=p;let s=S[p];$('#title').textContent=s[0];$('#intro').textContent=s[1];$('#examples').innerHTML=p==='expand'?`<div class="example"><b>Lavennus:</b> ${finnishExp(2,6,10)} = ${F(12,20)}. Osoittaja ja nimittäjä kerrotaan kahdella.</div><div class="example"><b>Supistus:</b> ${finnishRed(4,12,20)} = ${F(3,5)}. Osoittaja ja nimittäjä jaetaan neljällä.</div>`:p==='division'?`<div class="example"><b>5 : 2 = ${F(5,2)} = 2,5.</b> Jakolasku voidaan kirjoittaa murtolukuna.</div><div class="example">Murtoluvun viiva tarkoittaa jakamista: ${F(3,4)} = 3 : 4.</div>`:'';render()}
function render(){
 if(page==='division'){tasks=division;$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row"><span class="letter">${String.fromCharCode(97+i)})</span><span class="math">${t[0]} : ${t[1]} =</span>${F(`<input class="xs" id="n${i}">`,`<input class="xs" id="d${i}">`)}<span>=</span><input id="x${i}"></div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='mixed'){tasks=[...tomixed.map(x=>({t:'m',x})),...tofrac.map(x=>({t:'f',x}))];$('#grid').innerHTML=tasks.map((t,i)=>{let z=t.x;return t.t==='m'?`<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span>${F(z[0],z[1])}= <input class="xs" id="w${i}"> ${F(`<input class="xs" id="n${i}">`,`<input class="xs" id="d${i}">`)}</div><div class="correct" id="c${i}"></div></div>`:`<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span>${MIX(z[0],z[1],z[2])}= ${F(`<input class="xs" id="n${i}">`,`<input class="xs" id="d${i}">`)}</div><div class="correct" id="c${i}"></div></div>`}).join('')}
 if(page==='expand'){tasks=[...same.map(x=>({t:'same',x})),...reduce.map(x=>({t:'red',x}))];$('#grid').innerHTML=tasks.map((t,i)=>{if(t.t==='same'){let den=t.x.at(-1),fr=t.x.slice(0,-1);return `<div class="item" id="it${i}"><div><span class="letter">${i+1}.</span> Lavenna samannimisiksi:</div><div class="row">${fr.map((q,j)=>`${finnishExp(den/q[1],q[0],q[1])} = ${F(`<input class="xs" id="n${i}_${j}">`,den)}`).join('<span> ja </span>')}</div><div class="correct" id="c${i}"></div></div>`}let [n,d]=t.x,[sn,sd]=simp(n,d),k=n/sn;return `<div class="item" id="it${i}"><div><span class="letter">${i+1}.</span> Supista niin pitkälle kuin mahdollista.</div><div class="row">${finnishRed(k,n,d)} = ${F(`<input class="xs" id="n${i}">`,`<input class="xs" id="d${i}">`)}</div><div class="correct" id="c${i}"></div></div>`}).join('')}
 if(page==='convert'){tasks=[...todec.map(x=>({t:'dec',x})),...tofr.map(x=>({t:'frac',x}))];$('#grid').innerHTML=tasks.map((t,i)=>{if(t.t==='dec'){let [w,n,d]=t.x;return `<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span>${w?MIX(w,n,d):F(n,d)} = <input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`}let [x,n,d]=t.x;return `<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span>${String(x).replace('.',',')} = ${F(`<input class="xs" id="n${i}">`,`<input class="xs" id="d${i}">`)}</div><div class="correct" id="c${i}"></div></div>`}).join('')}
 if(page==='order'){tasks=[{vals:['0,5','0','3/4','1,7'],ans:'0<0,5<3/4<1,7'},{vals:['1/4','1/3','6/7','1','0,3'],ans:'1/4<0,3<1/3<6/7<1'},{vals:['1/3','0,25','1/2','0,1','0,125','1/9'],ans:'0,1<1/9<0,125<0,25<1/3<1/2'}];$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div><span class="letter">${String.fromCharCode(97+i)})</span> Järjestä pienimmästä suurimpaan:</div><div class="math">${t.vals.join(' ; ')}</div><input class="wide" id="a${i}" placeholder="käytä < merkkiä"><div class="correct" id="c${i}"></div></div>`).join('')}
 $('#score').textContent='';
}
function check(){let p=0;tasks.forEach((t,i)=>{let ok=false,msg='';if(page==='division'){let [a,b]=t;ok=+$('#n'+i).value===a&&+$('#d'+i).value===b&&EQ($('#x'+i).value,a/b);msg=`${a}/${b} = ${String(a/b).replace('.',',')}`}if(page==='mixed'){let z=t.x;if(t.t==='m'){let w=Math.floor(z[0]/z[1]),n=z[0]%z[1];ok=+$('#w'+i).value===w&&+$('#n'+i).value===n&&+$('#d'+i).value===z[1];msg=`${w} ${n}/${z[1]}`}else{let n=z[0]*z[2]+z[1];ok=+$('#n'+i).value===n&&+$('#d'+i).value===z[2];msg=`${n}/${z[2]}`}}if(page==='expand'){if(t.t==='same'){let den=t.x.at(-1),fr=t.x.slice(0,-1);ok=fr.every((q,j)=>+$('#n'+i+'_'+j).value===q[0]*den/q[1]);msg=fr.map(q=>`${q[0]*den/q[1]}/${den}`).join(' ja ')}else{let [sn,sd]=simp(...t.x);ok=+$('#n'+i).value===sn&&+$('#d'+i).value===sd;msg=`${sn}/${sd}`}}if(page==='convert'){if(t.t==='dec'){let [w,n,d]=t.x,x=w+n/d;ok=EQ($('#a'+i).value,x);msg=String(x).replace('.',',')}else{let [,n,d]=t.x;ok=+$('#n'+i).value===n&&+$('#d'+i).value===d;msg=`${n}/${d}`}}if(page==='order'){ok=$('#a'+i).value.replace(/\s/g,'')===t.ans;msg=t.ans}result(i,ok,'Oikea vastaus: '+msg);if(ok)p++});$('#score').textContent=`Tulos: ${p} / ${tasks.length}`}
tabs(setPage);$('#check').onclick=check;$('#new').onclick=()=>setPage(page);setPage(page);
</script></body></html>
