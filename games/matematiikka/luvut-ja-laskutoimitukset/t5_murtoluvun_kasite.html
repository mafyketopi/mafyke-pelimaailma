<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murtoluvun käsite</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#627184;--line:#d8e0e8;--accent:#2457a7;--bad:#b02a37}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px 5% 15px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem)}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:22px 5% 36px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{font:inherit;font-weight:750;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.04)}h2{margin:0 0 5px}.intro{color:var(--muted);margin:0 0 12px}
.theory{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.box{background:#f7f9fb;border:1px solid #e0e6ec;border-radius:11px;padding:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:12px}.item.good{background:#f6fcf8;border-color:#9dd4b7}.item.bad{background:#fff8f9;border-color:#e1a4aa}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.letter{font-weight:800;color:var(--muted)}input,select{font:inherit;padding:8px 10px;border:1px solid #bac6d3;border-radius:8px;background:#fff}input{width:150px;max-width:60vw}.wide{width:280px;max-width:82vw}
.correct{font-size:.82rem;color:var(--bad);min-height:17px;margin-top:4px}.actions{display:flex;justify-content:center;gap:9px;margin-top:15px;flex-wrap:wrap}.action{font:inherit;font-weight:750;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;border:1px solid var(--line);color:var(--ink)}.score{text-align:center;font-weight:850;margin-top:10px}
.finnish{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}.factor{font-weight:850;font-size:.9rem;margin:0}.factor.right{margin-left:2px}.nowrap{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;white-space:nowrap}.wideitem{grid-column:1/-1}.wideitem input{width:125px}
@media(max-width:720px){.grid,.theory{grid-template-columns:1fr}}

.backbar{max-width:1050px;margin:0 auto 14px}.backlink{display:inline-block;color:#2457a7;text-decoration:none;font-weight:750;background:#fff;border:1px solid #d8e0e8;border-radius:10px;padding:8px 12px}.backlink:hover{border-color:#2457a7}
</style>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']]},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head><body>
<header><h1>Murtoluvun käsite</h1><p>7. luokka · murtoluvut, sekaluvut, laventaminen ja supistaminen</p></header>
<main><nav class="backbar"><a class="backlink" href="index.html">← Luvut ja laskutoimitukset</a></nav><div class="tabs">
<button class="tab active" data-page="division">Jakolasku → murtoluku</button>
<button class="tab" data-page="mixed">Sekaluvut</button>
<button class="tab" data-page="expand">Lavennus ja supistus</button>
<button class="tab" data-page="convert">Muunnokset</button>
<button class="tab" data-page="order">Suuruusjärjestys</button>
</div><section class="card"><h2 id="title"></h2><p class="intro" id="intro"></p><div id="theory" class="theory"></div><div id="grid" class="grid"></div>
<div class="actions"><button class="action primary" id="check">Tarkista kaikki</button><button class="action secondary" id="new">Aloita osio alusta</button></div><div id="score" class="score"></div></section></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function raw(s){return String(s).trim().replace(/−/g,'-').replace(/,/g,'.')}
function nonempty(s){return raw(s)!==''}
function parseValue(s){
 let z=raw(s); if(!z)return NaN;
 let ell=/\.\.\.$/.test(z); z=z.replace(/\.\.\.$/,'');
 let m=z.match(/^(-?\d+)\s+(-?\d+)\/(\d+)$/); if(m)return +m[1]+Math.sign(+m[1]||1)*(+m[2]/+m[3]);
 m=z.match(/^(-?\d+)\/(\d+)$/); if(m)return +m[1]/+m[2];
 let v=Number(z); return v;
}
function close(s,x){let v=parseValue(s);if(!Number.isFinite(v))return false;return Math.abs(v-x)<(/\.\.\.$/.test(raw(s))?0.0015:1e-9)}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return Math.abs(a)}
function fractionValueText(s,x){
 let z=raw(s);if(!z)return false;
 let m=z.match(/^(-?\d+)\/(\d+)$/);if(m)return +m[2]>0&&Math.abs((+m[1])/(+m[2])-x)<1e-9;
 return false;
}
function reducedFracText(s,x){
 let z=raw(s);if(!z)return false;
 if(/^[-+]?\d+$/.test(z))return Math.abs(Number(z)-x)<1e-9;
 let m=z.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);if(m){let w=+m[1],n=+m[2],d=+m[3];if(n<=0||n>=d||gcd(n,d)!==1)return false;return Math.abs((w<0?w-n/d:w+n/d)-x)<1e-9}
 m=z.match(/^(-?\d+)\/(\d+)$/);if(m){let n=+m[1],d=+m[2];return d>0&&gcd(Math.abs(n),d)===1&&Math.abs(n/d-x)<1e-9}
 return false;
}
const tex=(n,d)=>`\\(\\frac{${n}}{${d}}\\)`;
function typeset(){if(window.MathJax?.typesetPromise){MathJax.typesetClear?.();MathJax.typesetPromise([$('#theory'),$('#grid')]);}}
let page='division',tasks=[];
const division=[[5,2],[8,3],[10,4],[11,2],[19,5],[5,3]];
const toMixed=[[11,3],[95,8],[41,6],[70,15],[17,4],[29,6]];
const toFrac=[[2,5,7],[9,3,5],[2,1,9],[10,1,2],[4,3,8],[7,2,3]];
const same=[[[2,3],[4,5],15],[[1,4],[6,7],28],[[3,4],[5,6],12],[[2,5],[3,10],10]];
const reduce=[[8,12],[16,20],[40,75],[72,210],[300,450],[3960,2970]];
const decimals=[.5,.25,.2,.125,.75,.4,1.25,2.6];
const fractions=[[1,2],[1,4],[1,5],[1,8],[3,4],[2,5],[5,4],[8,3]];
const order=[
 {vals:['0,5',tex(1,4),tex(3,4),'1,7'],ans:['0,5','1/4','3/4','1,7']},
 {vals:[tex(1,4),tex(1,3),tex(6,7),'1','0,3'],ans:['1/4','0,3','1/3','6/7','1']},
 {vals:[tex(1,3),'0,25',tex(1,2),'0,1','0,125',tex(1,9)],ans:['0,1','1/9','0,125','0,25','1/3','1/2']}
];
function finnishExp(k,n,d){return `<span class="finnish"><span class="factor">${k})</span><span>${tex(n,d)}</span></span>`}
function finnishRed(k,n,d){return `<span class="finnish"><span>${tex(n,d)}</span><span class="factor right">(${k}</span></span>`}
function setPage(p){page=p;render()}
function theory(){
 if(page==='division')return `<div class="box"><b>Murtoluku ja jakolasku:</b> Murtoluvun ${tex(8,3)} arvo on sama kuin osamäärällä 8 : 3.<br>Kun kirjoitat murtoluvun vastaukseen, käytä merkkiä <b>/</b> jakoviivana: 8/3.</div><div class="box"><b>Päättymätön jaksollinen desimaaliluku:</b> ${tex(8,3)} = 2,666... Voit kirjoittaa kolme pistettä jakson jatkumisen merkiksi.</div>`;
 if(page==='mixed')return `<div class="box">${tex(11,3)} = 3 ${tex(2,3)}. Kokonaisosaksi otetaan niin monta kokonaista kuin murtolukuun mahtuu.</div><div class="box">Sekaluvussa murto-osan pitää olla pienempi kuin yksi.</div>`;
 if(page==='expand')return `<div class="box"><b>Laventaminen:</b> <span class="finnish"><span class="factor">2)</span><span>${tex(6,10)}</span></span> = ${tex(12,20)}. Kerro osoittaja ja nimittäjä samalla luvulla.</div><div class="box"><b>Supistaminen:</b> ${tex(12,20)} = ${tex(3,5)}. Jaa osoittaja ja nimittäjä samalla luvulla. Vastauksessa käytä merkkiä <b>/</b>, esim. 3/5.</div>`;
 if(page==='convert')return `<div class="box"><b>Hyödyllisiä yhteyksiä:</b><br>${tex(1,2)} = 0,5 &nbsp; ${tex(1,4)} = 0,25 &nbsp; ${tex(1,5)} = 0,2<br>${tex(1,8)} = 0,125 &nbsp; ${tex(1,3)} = 0,333...</div><div class="box">Murtoluku → desimaaliluku: jaa osoittaja nimittäjällä.<br>Desimaaliluku → murtoluku: kirjoita paikkajärjestelmän avulla ja supista.</div>`;
 return `<div class="box">Voit vertailla murtolukuja muuttamalla niitä samannimisiksi tai desimaaliluvuiksi.</div><div class="box">Muista: lukusuoralla vasemmalla oleva luku on pienempi.</div>`;
}
function render(){
 $('#theory').innerHTML=theory();$('#score').textContent='';
 if(page==='division'){tasks=division;$('#title').textContent='Jakolasku ja murtoluku';$('#intro').textContent='Kirjoita jakolaskun tulos murtolukuna ja desimaalilukuna.';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row"><span class="letter">${String.fromCharCode(97+i)})</span>${t[0]} : ${t[1]} = <input id="f${i}"> = <input id="d${i}"></div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='mixed'){tasks=[...toMixed.map(x=>({t:'m',x})),...toFrac.map(x=>({t:'f',x}))];$('#title').textContent='Murtoluku ja sekaluku';$('#intro').textContent='Muunna murtoluvut sekaluvuiksi ja sekaluvut murtoluvuiksi.';$('#grid').innerHTML=tasks.map((t,i)=>t.t==='m'?`<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span>${tex(t.x[0],t.x[1])} = <input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`:`<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span>${t.x[0]} ${tex(t.x[1],t.x[2])} = <input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='expand'){tasks=[...same.map(x=>({t:'same',x})),...reduce.map(x=>({t:'red',x}))];$('#title').textContent='Laventaminen ja supistaminen';$('#intro').textContent='Kirjoita vastaukset /-merkkiä käyttäen. Kahdessa ensimmäisessä tehtävässä lavennuskerroin on annettu malliksi.';$('#grid').innerHTML=tasks.map((t,i)=>{if(t.t==='same'){let den=t.x[2],a=t.x[0],b=t.x[1];let left=i<2?finnishExp(den/a[1],a[0],a[1]):tex(a[0],a[1]);let right=i<2?finnishExp(den/b[1],b[0],b[1]):tex(b[0],b[1]);return `<div class="item wideitem" id="it${i}"><div><span class="letter">${i+1}.</span> Ilmoita samannimisiksi lavennettuina.</div><div class="nowrap">${left} = <input id="a${i}"> <span>ja</span> ${right} = <input id="b${i}"></div><div class="correct" id="c${i}"></div></div>`}let [n,d]=t.x;return `<div class="item" id="it${i}"><div><span class="letter">${i+1}.</span> Ilmoita supistettuna murtolukuna.</div><div class="row">${tex(n,d)} = <input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`}).join('')}
 if(page==='convert'){tasks=[...fractions.map(x=>({t:'fd',x})),...decimals.map(x=>({t:'df',x}))];$('#title').textContent='Murtoluvun ja desimaaliluvun muunnokset';$('#intro').textContent='Muunna murtoluvut desimaaliluvuiksi ja desimaaliluvut supistetuiksi murtoluvuiksi.';$('#grid').innerHTML=tasks.map((t,i)=>t.t==='fd'?`<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span> Muunna ${tex(t.x[0],t.x[1])} desimaaliluvuksi: <input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`:`<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span> Muunna ${String(t.x).replace('.',',')} murtoluvuksi: <input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='order'){tasks=order;$('#title').textContent='Suuruusjärjestys';$('#intro').textContent='Kirjoita luvut pienimmästä suurimpaan käyttäen < merkkiä. Murtoluvut voit kirjoittaa muodossa 1/4.';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div><span class="letter">${String.fromCharCode(97+i)})</span> Järjestä pienimmästä suurimpaan:</div><div class="row">${t.vals.join(' ; ')}</div><input class="wide" id="a${i}"><div class="correct" id="c${i}"></div></div>`).join('')}
 typeset();
}
function check(){
 let p=0;tasks.forEach((t,i)=>{let ok=false,msg='';
 if(page==='division'){let a=t[0],b=t[1];ok=fractionValueText($('#f'+i).value,a/b)&&close($('#d'+i).value,a/b);msg=`${a}/${b} ja ${a%b===0?fmt(a/b):String(a/b).slice(0,8).replace('.',',')+'...'}`}
 if(page==='mixed'){let z=t.x;if(t.t==='m'){let w=Math.floor(z[0]/z[1]),r=z[0]%z[1];ok=reducedFracText($('#a'+i).value,z[0]/z[1])&&raw($('#a'+i).value).includes(' ');msg=`${w} ${r}/${z[1]}`}else{let n=z[0]*z[2]+z[1];ok=reducedFracText($('#a'+i).value,n/z[2])&&!raw($('#a'+i).value).includes(' ');msg=`${n}/${z[2]}`}}
 if(page==='expand'){if(t.t==='same'){let den=t.x[2],a=t.x[0],b=t.x[1];ok=raw($('#a'+i).value)===`${a[0]*den/a[1]}/${den}`&&raw($('#b'+i).value)===`${b[0]*den/b[1]}/${den}`;msg=`${a[0]*den/a[1]}/${den} ja ${b[0]*den/b[1]}/${den}`}else{let [n,d]=t.x;ok=reducedFracText($('#a'+i).value,n/d);let g=gcd(n,d);msg=`${n/g}/${d/g}`}}
 if(page==='convert'){if(t.t==='fd'){ok=close($('#a'+i).value,t.x[0]/t.x[1]);msg=t.x[0]===8&&t.x[1]===3?'2,666...':String(t.x[0]/t.x[1]).replace('.',',')}else{let x=t.x,den=1;while(Math.abs(x*den-Math.round(x*den))>1e-9&&den<10000)den*=10;let num=Math.round(x*den),g=gcd(num,den);ok=reducedFracText($('#a'+i).value,x);msg=`${num/g}/${den/g}`}}
 if(page==='order'){let got=raw($('#a'+i).value).replace(/\s/g,'').split('<');ok=got.length===t.ans.length&&got.every((x,j)=>x===t.ans[j].replace(',','.'));msg=t.ans.join(' < ')}
 let el=$('#it'+i);el.classList.remove('good','bad');el.classList.add(ok?'good':'bad');$('#c'+i).textContent=ok?'✓ Oikein':'Oikea vastaus: '+msg;if(ok)p++;
 });$('#score').textContent=`Tulos: ${p} / ${tasks.length}`;
}
function fmt(x){return String(x).replace('.',',')}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');setPage(b.dataset.page)});
$('#check').onclick=check;$('#new').onclick=()=>render();render();
</script></body></html>
