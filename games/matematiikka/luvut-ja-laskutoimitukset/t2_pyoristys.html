<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pyöristäminen ja lukujen tarkkuus</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#617083;--line:#d8e0e8;--accent:#2457a7;--bad:#b02a37}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px 5% 15px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem)}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1020px;margin:auto;padding:22px 5% 36px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{font:inherit;font-weight:750;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.04)}h2{margin:0 0 5px}.intro{color:var(--muted);margin:0 0 12px}.theory{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.box{background:#f7f9fb;border:1px solid #e0e6ec;border-radius:11px;padding:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:12px}.item.good{background:#f6fcf8;border-color:#9dd4b7}.item.bad{background:#fff8f9;border-color:#e1a4aa}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.letter{font-weight:800;color:var(--muted)}
input{font:inherit;padding:8px 10px;border:1px solid #bac6d3;border-radius:8px;width:150px;max-width:55vw}.wide{width:290px;max-width:80vw}.mark{font-weight:900}.correct{font-size:.82rem;color:var(--bad);min-height:17px;margin-top:4px}
.actions{display:flex;justify-content:center;gap:9px;margin-top:15px;flex-wrap:wrap}.action{font:inherit;font-weight:750;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;border:1px solid var(--line);color:var(--ink)}.score{text-align:center;font-weight:850;margin-top:10px}
@media(max-width:720px){.grid,.theory{grid-template-columns:1fr}}

.backbar{max-width:1050px;margin:0 auto 14px}.backlink{display:inline-block;color:#2457a7;text-decoration:none;font-weight:750;background:#fff;border:1px solid #d8e0e8;border-radius:10px;padding:8px 12px}.backlink:hover{border-color:#2457a7}
</style>

<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']]},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head><body>
<header><h1>Pyöristäminen ja lukujen tarkkuus</h1><p>7. luokka · pyöristäminen, merkitsevät numerot ja mittaustulokset</p></header>
<main><nav class="backbar"><a class="backlink" href="index.html">← Luvut ja laskutoimitukset</a></nav><div class="tabs">
<button class="tab active" data-page="round">Pyöristäminen</button>
<button class="tab" data-page="sig">Merkitsevät numerot</button>
<button class="tab" data-page="approx">Likiarvot</button>
<button class="tab" data-page="measure">Mittaustulokset</button>
</div>
<section class="card"><h2 id="title"></h2><p class="intro" id="intro"></p><div id="theory" class="theory"></div><div id="grid" class="grid"></div>
<div class="actions"><button class="action primary" id="check">Tarkista kaikki</button><button class="action secondary" id="next">Seuraava tehtävä</button></div><div id="score" class="score"></div></section></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clean=s=>String(s).trim().replace(/\s/g,'').replace(',','.');const V=s=>clean(s)===''?NaN:Number(clean(s));
const EQ=(s,x)=>Number.isFinite(V(s))&&Math.abs(V(s)-x)<1e-9;const fmt=x=>String(x).replace('.',',');
function rdec(x,d){return Math.round((x+Number.EPSILON)*10**d)/10**d}
function rplace(x,p){return Math.round(x/p)*p}
function rsig(x,n){if(x===0)return 0;let p=n-1-Math.floor(Math.log10(Math.abs(x))),f=10**p;return Math.round((x+Number.EPSILON)*f)/f}
let page='round',roundIndex=0,tasks=[];
const roundSets=[
 {q:'Pyöristä satojen tarkkuuteen.',kind:'place',p:100,sets:[[367,1241,965,151],[9949,9951,3472,6849],[1549,761,10249,349]]},
 {q:'Pyöristä tuhansien tarkkuuteen.',kind:'place',p:1000,sets:[[1249,1500,2649,8499],[3499,5101,9851,12420],[951,4499,7201,10549]]},
 {q:'Pyöristä kokonaisten tarkkuuteen.',kind:'dec',d:0,sets:[[4.85,17.45,9.51,29.74],[12.49,6.5,100.099,99.64]]},
 {q:'Ilmoita kymmenesosien tarkkuudella.',kind:'dec',d:1,sets:[[2.82,15.677,4.45,35.95],[.96,99.949,7.04,12.55]]},
 {q:'Ilmoita kahden desimaalin tarkkuudella.',kind:'dec',d:2,sets:[[.468,1.2325,4.965,.999],[9.989,7.3451,2.0049,15.675]]}
];
const sigSets=[
 {q:'Ilmoita kolmen merkitsevän numeron tarkkuudella.',n:3,vals:[2023,476785,12.258,5.5094,.01255,.0059962]},
 {q:'Ilmoita kahden merkitsevän numeron tarkkuudella.',n:2,vals:[125540,1180545,3.875,28.8,.9999,124.888]}
];
const approx=[
 {q:'Ilmoita luvun \\(\\frac{2}{3}\\) kaksidesimaalinen likiarvo.',a:.67},
 {q:'Ilmoita luvun \\(\\frac{7}{11}\\) kaksidesimaalinen likiarvo.',a:.64},
 {q:'Ilmoita luvun \\(\\frac{12}{17}\\) kaksidesimaalinen likiarvo.',a:.71},
 {q:'Ilmoita luvun \\(\\frac{9}{11}\\) likiarvo kolmella merkitsevällä numerolla.',a:.818},
 {q:'Ilmoita luvun \\(\\frac{8}{3}\\) likiarvo kolmella merkitsevällä numerolla.',a:2.67},
 {q:'Ilmoita luvun \\(\\frac{2}{91}\\) likiarvo kolmella merkitsevällä numerolla.',a:.0220,show:'0,0220'}
];
const measure=[
 {q:'3,85 kg + 0,4 kg + 2,27 kg',a:6.5,u:'kg'},
 {q:'14,456 m + 2,3 m + 55,0 m + 37,65 m',a:109.4,u:'m'},
 {q:'25,8 · 3,7',a:95,u:''},{q:'4,0 · 0,8185',a:3.3,u:''},{q:'3,8 · 4,9',a:19,u:''},{q:'12,55 : 0,71',a:18,u:''}
];
function theory(){
 if(page==='round')return `<div class="box"><b>Pyöristäminen:</b> katso pyöristettävää kohtaa seuraavaa numeroa. 0–4 → alas, 5–9 → ylös.</div><div class="box"><b>Esimerkki:</b> 4,67 ≈ 4,7 kymmenesosien tarkkuudella.</div>`;
 if(page==='sig')return `<div class="box"><b>Merkitsevät numerot:</b> laskeminen alkaa ensimmäisestä nollasta poikkeavasta numerosta.<br><b>Kokonaisluku:</b> 47 678 ≈ 47 700 (3 merkitsevää numeroa).</div><div class="box"><b>Desimaaliluku:</b> 0,01255 ≈ 0,0126 (3 merkitsevää numeroa). Alun nollat eivät ole merkitseviä.</div>`;
 if(page==='approx')return `<div class="box">Laske ensin mahdollisimman tarkasti ja pyöristä vasta lopuksi.</div><div class="box">Esim. \\(\\frac{1}{3}=0,333...\\), joten kahden desimaalin likiarvo on 0,33.</div>`;
 return `<div class="box"><b>Yhteen- ja vähennyslasku:</b> tulos ilmoitetaan epätarkimman lähtöluvun desimaalitarkkuuden mukaan.<br>3,85 + 0,4 → vastaus kymmenesosina.</div><div class="box"><b>Kerto- ja jakolasku:</b> tuloksessa on yhtä monta merkitsevää numeroa kuin epätarkimmassa lähtöluvussa.<br>3,8 · 4,9 = 18,62 ≈ 19.</div>`;
}
const roundBatches=roundSets.flatMap(g=>g.sets.map(set=>({g,set})));
const sigBatches=sigSets.flatMap(g=>[g.vals.slice(0,3),g.vals.slice(3,6)].map(set=>({g,set})));
function updateNext(){
 const b=$('#next');
 if(page==='approx'||page==='measure'){b.style.display='none';return;}
 b.style.display='';
 const max=page==='round'?roundBatches.length:sigBatches.length;
 const done=roundIndex>=max-1;
 b.disabled=done;
 b.style.opacity=done?'.45':'1';
 b.style.cursor=done?'default':'pointer';
 b.textContent=done?'Tehtävät tehty':'Seuraava tehtävä';
}
function render(){
 $('#theory').innerHTML=theory();$('#score').textContent='';
 if(page==='round'){
   const o=roundBatches[Math.min(roundIndex,roundBatches.length-1)],g=o.g,set=o.set;
   tasks=set.map(x=>({q:`${fmt(x)} ≈`,a:g.kind==='place'?rplace(x,g.p):rdec(x,g.d)}));
   $('#title').textContent=g.q;$('#intro').textContent='Kaikki neljä lukua pyöristetään samaan tarkkuuteen.';
 }
 if(page==='sig'){
   const o=sigBatches[Math.min(roundIndex,sigBatches.length-1)],g=o.g;
   tasks=o.set.map(x=>({q:`${fmt(x)} ≈`,a:rsig(x,g.n)}));
   $('#title').textContent=g.q;$('#intro').textContent='Kiinnitä huomiota siihen, mistä merkitsevien numeroiden laskeminen alkaa.';
 }
 if(page==='approx'){tasks=approx;$('#title').textContent='Likiarvot';$('#intro').textContent='Näissä tehtävissä laskinta saa käyttää.'}
 if(page==='measure'){tasks=measure;$('#title').textContent='Mittaustulosten tarkkuus';$('#intro').textContent='Laske ja ilmoita vastaus lähtötietojen tarkkuuden mukaisesti.'}
 $('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row"><span class="letter">${String.fromCharCode(97+i)})</span><span>${t.q}</span><input id="a${i}" placeholder="${t.u?'vastaus '+t.u:'vastaus'}"><span class="mark" id="m${i}"></span></div><div class="correct" id="c${i}"></div></div>`).join('');
 updateNext();
 if(window.MathJax?.typesetPromise){MathJax.typesetClear?.();MathJax.typesetPromise([$('#theory'),$('#grid')]);}
}
function check(){let p=0;tasks.forEach((t,i)=>{let raw=$('#a'+i).value,ok=EQ(raw.replace(/[a-zA-Z°]/g,''),t.a);let el=$('#it'+i);el.classList.remove('good','bad');el.classList.add(ok?'good':'bad');$('#m'+i).textContent=ok?'✓':'✗';$('#c'+i).textContent=ok?'':'Oikea vastaus: '+(t.show||fmt(t.a))+(t.u?' '+t.u:'');if(ok)p++});$('#score').textContent=`Tulos: ${p} / ${tasks.length}`}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');page=b.dataset.page;roundIndex=0;render()});
$('#check').onclick=check;$('#next').onclick=()=>{if(!$('#next').disabled){roundIndex++;render()}};render();
</script></body></html>
