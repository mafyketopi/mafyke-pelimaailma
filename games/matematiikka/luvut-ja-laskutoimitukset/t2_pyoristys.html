<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pyöristäminen – 7. lk</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#617083;--line:#d8e0e8;--accent:#2457a7;--good:#16794b;--bad:#b02a37}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px 5% 15px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem)}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:980px;margin:auto;padding:22px 5% 36px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{font:inherit;font-weight:750;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.04)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.badge{font-size:.92rem;color:var(--muted)}
.progress{height:9px;background:#e8edf3;border-radius:999px;overflow:hidden;margin:13px 0 19px}.progress>div{height:100%;background:var(--accent);width:0%;transition:.25s}.lead{font-size:1.08rem;font-weight:750;margin-bottom:13px}.sublead{color:var(--muted);font-size:.92rem;margin:-6px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.item.good{border-color:#9dd4b7;background:#f7fcf9}.item.bad{border-color:#e1a4aa;background:#fff9fa}
.num{font-size:.82rem;color:var(--muted);font-weight:800;margin-bottom:5px}.answer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.q{font-size:1.04rem;font-weight:700;line-height:1.4}
input,select{padding:9px 10px;border:1px solid #bfc9d3;border-radius:9px;font:inherit;font-size:1rem;background:#fff}input{width:175px;max-width:55vw}.wide{width:290px;max-width:82vw}.mark{width:22px;text-align:center;font-weight:900}.correct{font-size:.82rem;color:var(--bad);min-height:18px;margin-top:4px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:17px}button.action{font:inherit;font-weight:750;border:0;border-radius:10px;padding:11px 16px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;color:var(--ink);border:1px solid var(--line)!important}.score{text-align:center;font-weight:850;margin-top:12px}.tip{margin-top:14px;padding:11px 13px;border-radius:10px;background:#f7f9fb;color:var(--muted);font-size:.91rem}.hidden{display:none}
@media(max-width:680px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Pyöristäminen ja lukujen tarkkuus</h1><p>7. luokka · monisteen pyöristyskappaleen pohjalta</p></header><main>
<div class="tabs"><button class="tab active" data-page="round">Pyöristäminen</button><button class="tab" data-page="sig">Merkitsevät numerot</button><button class="tab" data-page="place">Lukuyksiköt</button><button class="tab" data-page="approx">Likiarvot</button><button class="tab" data-page="measure">Mittaustulokset</button></div>
<section class="card"><div class="top"><div class="badge">Pyöristä vasta viimeisessä vaiheessa.</div><div class="badge" id="counter"></div></div><div class="progress"><div id="bar"></div></div>
<div class="lead" id="lead"></div><div class="sublead" id="sublead"></div><div class="grid" id="grid"></div>
<div class="actions"><button class="action primary" id="check">Tarkista kaikki</button><button class="action secondary hidden" id="next">Seuraava tehtävä</button><button class="action secondary" id="new">Aloita osio alusta</button></div><div class="score" id="score"></div>
<div class="tip">Vastauksissa käytetään desimaalipilkkua. Pyöristämisosiossa jokaisessa neljän luvun tehtävässä on sama tarkkuus.</div></section></main><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const V=s=>Number(String(s).trim().replace(/\s/g,'').replace(',','.')); const EQ=(s,x)=>Number.isFinite(V(s))&&Math.abs(V(s)-x)<1e-9;
const fmt=x=>String(x).replace('.',',');
function sigRound(x,n){if(x===0)return 0;let p=n-1-Math.floor(Math.log10(Math.abs(x)));let f=10**p;return Math.round((x+Number.EPSILON)*f)/f}
function decRound(x,n){return Math.round((x+Number.EPSILON)*10**n)/10**n}
function placeRound(x,p){return Math.round(x/p)*p}
let page='round',round=0,tasks=[];
const groups=[
 {label:'Pyöristä satojen tarkkuuteen.',kind:'place',p:100,vals:[367,1241,965,151,9949,9951]},
 {label:'Pyöristä tuhansien tarkkuuteen.',kind:'place',p:1000,vals:[1499,1500,2499,2500,9499,9951]},
 {label:'Pyöristä kokonaisten tarkkuuteen.',kind:'dec',d:0,vals:[4.85,17.45,9.51,29.74,100.099,99.64]},
 {label:'Ilmoita kymmenesosien tarkkuudella.',kind:'dec',d:1,vals:[2.82,15.677,4.45,35.95,.96,99.949]},
 {label:'Ilmoita kahden desimaalin tarkkuudella.',kind:'dec',d:2,vals:[.468,1.2325,4.965,9.989,.999,7.3451]}
];
const sig=[
 {label:'Ilmoita kolmen merkitsevän numeron tarkkuudella.',n:3,vals:[2023,476785,12.258,5.5094,.01255,.0059962]},
 {label:'Ilmoita kahden merkitsevän numeron tarkkuudella.',n:2,vals:[125540,1180545,3.875,28.8,.9999,124.888]}
];
const place=[
 {q:'Kirjoita lukuna: 4 · 100 + 2 · 1 + 3 · 0,1 + 9 · 0,01.',a:402.39},
 {q:'Mitä lukuyksikköä luvussa 9205,17 edustaa numero 7?',a:'sadasosia',alt:['sadasosa','sadasosaa']},
 {q:'Mitä lukuyksikköä luvussa 9205,17 edustaa numero 1?',a:'kymmenesosia',alt:['kymmenesosa','kymmenesosaa']},
 {q:'Kirjoita luvun 9205,17 hajotelma kerto- ja yhteenlaskuna.',a:'9·1000+2·100+5·1+1·0,1+7·0,01',text:true}
];
const approx=[
 {q:'Ilmoita luvun 2/3 kaksidesimaalinen likiarvo.',a:.67},
 {q:'Ilmoita luvun 7/11 kaksidesimaalinen likiarvo.',a:.64},
 {q:'Ilmoita luvun 12/17 kaksidesimaalinen likiarvo.',a:.71},
 {q:'Ilmoita luvun 9/11 likiarvo kolmella merkitsevällä numerolla.',a:.818},
 {q:'Ilmoita luvun 8/3 likiarvo kolmella merkitsevällä numerolla.',a:2.67},
 {q:'Ilmoita luvun 2/91 likiarvo kolmella merkitsevällä numerolla.',a:.0220,display:'0,0220'}
];
const measure=[
 {q:'3,85 kg + 0,4 kg + 2,27 kg',a:6.5,unit:'kg'},
 {q:'14,456 m + 2,3 m + 55,0 m + 37,65 m',a:109.4,unit:'m'},
 {q:'25,8 · 3,7',a:95,unit:''},
 {q:'4,0 · 0,8185',a:3.3,unit:''},
 {q:'3,8 · 4,9',a:19,unit:''},
 {q:'12,55 : 0,71',a:18,unit:''}
];
function setPage(p){page=p;round=0;$('.progress').classList.toggle('hidden',p!=='round'&&p!=='sig');$('#counter').classList.toggle('hidden',p!=='round'&&p!=='sig');render()}
function card(i,q,input='<input id="a'+i+'">'){return `<div class="item" id="it${i}"><div class="num">${String.fromCharCode(97+i)})</div><div class="q">${q}</div><div class="answer">${input}<div class="mark" id="m${i}"></div></div><div class="correct" id="c${i}"></div></div>`}
function render(){
 $('#score').textContent='';$('#next').classList.add('hidden');$('#check').classList.remove('hidden');
 if(page==='round'){let g=groups[round%groups.length];tasks=g.vals.slice(0,4).map(x=>({x,a:g.kind==='place'?placeRound(x,g.p):decRound(x,g.d)}));$('#lead').textContent=g.label;$('#sublead').textContent='Samassa tehtävässä kaikki neljä lukua pyöristetään samaan tarkkuuteen.';$('#counter').textContent=`Tehtävä ${round+1} / ${groups.length}`;$('#bar').style.width=`${round/groups.length*100}%`;$('#grid').innerHTML=tasks.map((t,i)=>card(i,`${fmt(t.x)} ≈`)).join('')}
 if(page==='sig'){let g=sig[round%sig.length];tasks=g.vals.slice(0,4).map(x=>({x,a:sigRound(x,g.n)}));$('#lead').textContent=g.label;$('#sublead').textContent='Merkitsevät numerot alkavat ensimmäisestä nollasta poikkeavasta numerosta.';$('#counter').textContent=`Tehtävä ${round+1} / ${sig.length}`;$('#bar').style.width=`${round/sig.length*100}%`;$('#grid').innerHTML=tasks.map((t,i)=>card(i,`${fmt(t.x)} ≈`)).join('')}
 if(page==='place'){tasks=place;$('#lead').textContent='Lukuyksiköt ja hajotelma';$('#sublead').textContent='Pyöristämisen taustalla on paikkajärjestelmän ymmärtäminen.';$('#grid').innerHTML=tasks.map((t,i)=>card(i,t.q,`<input class="${t.text?'wide':''}" id="a${i}">`)).join('')}
 if(page==='approx'){tasks=approx;$('#lead').textContent='Likiarvot laskimella';$('#sublead').textContent='Näissä tehtävissä laskinta saa käyttää. Pyöristä vasta lopuksi.';$('#grid').innerHTML=tasks.map((t,i)=>card(i,t.q)).join('')}
 if(page==='measure'){tasks=measure;$('#lead').textContent='Mittaustulosten tarkkuus';$('#sublead').textContent='Laske laskimella ja pyöristä tulos lähtötietojen tarkkuuden mukaisesti.';$('#grid').innerHTML=tasks.map((t,i)=>card(i,`${t.q} ≈`, `<input id="a${i}" placeholder="${t.unit?'vastaus '+t.unit:'vastaus'}">`)).join('')}
}
function norm(s){return String(s).toLowerCase().replace(/\s/g,'').replace(/×|\*/g,'·').replace(/\./g,',')}
function check(){
 let p=0;tasks.forEach((t,i)=>{let ok=false,msg='';
 if(page==='place'){if(t.text){ok=norm($('#a'+i).value)===norm(t.a);msg=t.a}else if(typeof t.a==='string'){let z=$('#a'+i).value.toLowerCase().trim();ok=z===t.a||t.alt?.includes(z);msg=t.a}else{ok=EQ($('#a'+i).value,t.a);msg=fmt(t.a)}}
 else if(page==='measure'){let s=$('#a'+i).value.replace(/[a-zA-Z°]/g,'').trim();ok=EQ(s,t.a);msg=fmt(t.a)+(t.unit?' '+t.unit:'')}
 else {ok=EQ($('#a'+i).value,t.a);msg=t.display||fmt(t.a)}
 let el=$('#it'+i),m=$('#m'+i),c=$('#c'+i);el.classList.remove('good','bad');el.classList.add(ok?'good':'bad');m.textContent=ok?'✓':'✗';c.textContent=ok?'':'Oikea vastaus: '+msg;if(ok)p++
 });$('#score').textContent=`Tulos: ${p} / ${tasks.length}`;$('#check').classList.add('hidden');if(page==='round'||page==='sig')$('#next').classList.remove('hidden')}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');setPage(b.dataset.page)});
$('#check').onclick=check;$('#next').onclick=()=>{round=(round+1)%(page==='round'?groups.length:sig.length);render()};$('#new').onclick=render;render();
</script></body></html>
