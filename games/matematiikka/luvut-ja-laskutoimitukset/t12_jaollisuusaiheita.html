<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaollisuusaiheita</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#627184;--line:#d8e0e8;--accent:#2457a7;--bad:#b02a37}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px 5% 15px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem)}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:22px 5% 36px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{font:inherit;font-weight:750;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.04)}h2{margin:0 0 5px}.intro{color:var(--muted);margin:0 0 12px}
.theory{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.box{background:#f7f9fb;border:1px solid #e0e6ec;border-radius:11px;padding:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:12px}.item.good{background:#f6fcf8;border-color:#9dd4b7}.item.bad{background:#fff8f9;border-color:#e1a4aa}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.letter{font-weight:800;color:var(--muted)}input,select{font:inherit;padding:8px 10px;border:1px solid #bac6d3;border-radius:8px;background:#fff}input{width:150px;max-width:60vw}.wide{width:280px;max-width:82vw}
.correct{font-size:.82rem;color:var(--bad);min-height:17px;margin-top:4px}.actions{display:flex;justify-content:center;gap:9px;margin-top:15px;flex-wrap:wrap}.action{font:inherit;font-weight:750;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;border:1px solid var(--line);color:var(--ink)}.score{text-align:center;font-weight:850;margin-top:10px}
.finnish{display:inline-flex;align-items:flex-start;gap:3px}.factor{font-weight:850;font-size:.9rem;margin-top:-2px}.factor.right{margin-left:2px}
@media(max-width:720px){.grid,.theory{grid-template-columns:1fr}}

.backbar{max-width:1050px;margin:0 auto 14px}.backlink{display:inline-block;color:#2457a7;text-decoration:none;font-weight:750;background:#fff;border:1px solid #d8e0e8;border-radius:10px;padding:8px 12px}.backlink:hover{border-color:#2457a7}
</style></head><body>
<header><h1>Jaollisuusaiheita</h1><p>7. luokka · jaollisuus, alkuluvut, SYT ja PYJ</p></header><main><nav class="backbar"><a class="backlink" href="index.html">← Luvut ja laskutoimitukset</a></nav>
<div class="tabs"><button class="tab active" data-page="basic">Jaollisuus</button><button class="tab" data-page="division">Jakoyhtälö</button><button class="tab" data-page="rules">Jaollisuussäännöt</button><button class="tab" data-page="prime">Alkuluvut</button><button class="tab" data-page="gcd">SYT</button><button class="tab" data-page="lcm">PYJ</button></div>
<section class="card"><h2 id="title"></h2><p class="intro" id="intro"></p><div id="theory" class="theory"></div><div id="grid" class="grid"></div><div class="actions"><button class="action primary" id="check">Tarkista kaikki</button><button class="action secondary" id="new">Aloita osio alusta</button></div><div id="score" class="score"></div></section></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const V=s=>{let z=String(s).trim().replace(/\s/g,'').replace(',','.');return z===''?NaN:Number(z)};const EQ=(s,x)=>Number.isFinite(V(s))&&Math.abs(V(s)-x)<1e-9;
let page='basic',tasks=[];
const basic=[[10,2,true],[14,3,false],[70,10,true],[2,1,true],[1,2,false],[100,100,true]];
const divs=[[25,4],[89,7],[23,6],[58,20],[52,4],[81,13]];
const ruleTasks=[
 {n:454725,d:2},{n:454725,d:3},{n:454725,d:5},{n:454725,d:9},{n:454725,d:10},
 {n:12345678910,d:2},{n:12345678910,d:3},{n:12345678910,d:5},{n:12345678910,d:9},{n:12345678910,d:10}
];
const primes=[[21,false],[31,true],[45,false],[47,true],[2,true],[1,false]];
const facts=[[15,'3·5'],[36,'2·2·3·3'],[100,'2·2·5·5'],[250,'2·5·5·5'],[99,'3·3·11'],[78,'2·3·13']];
const gcds=[[12,18,6],[40,60,20],[26,65,13],[13,17,1],[56,84,28],[72,80,8]];
const lcms=[[5,15,15],[8,12,24],[40,60,120],[7,9,63],[12,15,60],[16,48,48]];
function digitSum(n){return String(n).replace(/\D/g,'').split('').reduce((a,b)=>a+Number(b),0)}
function setPage(p){page=p;render()}
function theory(){
 if(page==='basic')return `<div class="box"><b>Jaollinen:</b> luku a on jaollinen luvulla b, jos jakolaskusta a : b ei jää jakojäännöstä.</div><div class="box">Esim. 24 on jaollinen luvulla 6, koska 24 : 6 = 4.</div>`;
 if(page==='division')return `<div class="box"><b>Jakoyhtälö:</b> jaettava = jakaja · osamäärä + jakojäännös.</div><div class="box"><b>Esimerkki:</b> 25 : 4 = 6, jakojäännös 1, joten <b>25 = 4 · 6 + 1</b>. Jakojäännös on aina pienempi kuin jakaja.</div>`;
 if(page==='rules')return `<div class="box"><b>2:</b> viimeinen numero on 0, 2, 4, 6 tai 8.<br><b>5:</b> viimeinen numero on 0 tai 5.<br><b>10:</b> viimeinen numero on 0.</div><div class="box"><b>3:</b> numeroiden summa on jaollinen kolmella.<br><b>9:</b> numeroiden summa on jaollinen yhdeksällä.<br>Tehtävissä 3:n ja 9:n kohdalla lasket myös numeroiden summan.</div>`;
 if(page==='prime')return `<div class="box"><b>Alkuluku</b> on lukua 1 suurempi positiivinen kokonaisluku, jolla on täsmälleen kaksi positiivista tekijää: 1 ja luku itse. Esim. 2, 3, 5, 7 ja 11.</div><div class="box"><b>Alkutekijähajotelma:</b> 60 = 2 · 2 · 3 · 5. Kun kirjoitat hajotelman vastauskenttään, voit käyttää kertomerkkinä <b>*</b>, esim. <b>2*2*3*5</b>.</div>`;
 if(page==='gcd')return `<div class="box"><b>SYT = suurin yhteinen tekijä.</b> Etsi lukujen yhteisistä tekijöistä suurin.</div><div class="box">Esim. 12:n tekijät: 1, 2, 3, 4, 6, 12. 18:n tekijät: 1, 2, 3, 6, 9, 18. Siksi syt(12,18)=6.</div>`;
 return `<div class="box"><b>PYJ = pienin yhteinen jaettava.</b> Se on pienin positiivinen luku, joka on jaollinen kaikilla annetuilla luvuilla.</div><div class="box">Esim. 8:n monikerrat: 8,16,24,... ja 12:n monikerrat: 12,24,... Siksi pyj(8,12)=24.</div>`;
}
function render(){
 $('#score').textContent='';$('#theory').innerHTML=theory();
 if(page==='basic'){tasks=basic;$('#title').textContent='Jaollisuuden käsite';$('#intro').textContent='Päätä, onko ensimmäinen luku jaollinen toisella luvulla.';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row"><span class="letter">${String.fromCharCode(97+i)})</span>Onko ${t[0]} jaollinen luvulla ${t[1]}? <select id="a${i}"><option></option><option>Kyllä</option><option>Ei</option></select></div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='division'){tasks=divs;$('#title').textContent='Jakoyhtälö';$('#intro').textContent='Täydennä osamäärä ja jakojäännös.';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row"><span class="letter">${String.fromCharCode(97+i)})</span>${t[0]} = ${t[1]} · <input style="width:70px" id="q${i}"> + <input style="width:70px" id="r${i}"></div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='rules'){tasks=ruleTasks.map(t=>({...t,ans:t.n%t.d===0,sum:digitSum(t.n)}));$('#title').textContent='Jaollisuussäännöt';$('#intro').textContent='Käytä sääntöä. Kun jaollisuutta tutkitaan luvulla 3 tai 9, laske myös numeroiden summa.';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div>Onko ${t.n.toLocaleString('fi-FI')} jaollinen luvulla ${t.d}?</div>${t.d===3||t.d===9?`<div class="row">Numeroiden summa = <input style="width:90px" id="s${i}"></div>`:''}<div class="row"><select id="a${i}"><option></option><option>Kyllä</option><option>Ei</option></select></div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='prime'){tasks=[...primes.map(x=>({t:'p',x})),...facts.map(x=>({t:'f',x}))];$('#title').textContent='Alkuluvut ja alkutekijät';$('#intro').textContent='Tunnista alkuluvut ja jaa luvut alkutekijöihin.';$('#grid').innerHTML=tasks.map((t,i)=>t.t==='p'?`<div class="item" id="it${i}"><div class="row">Onko ${t.x[0]} alkuluku? <select id="a${i}"><option></option><option>Kyllä</option><option>Ei</option></select></div><div class="correct" id="c${i}"></div></div>`:`<div class="item" id="it${i}"><div class="row">${t.x[0]} = <input class="wide" id="a${i}" ></div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='gcd'){tasks=gcds;$('#title').textContent='Suurin yhteinen tekijä (SYT)';$('#intro').textContent='Etsi lukujen suurin yhteinen tekijä.';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row">syt(${t[0]}, ${t[1]}) = <input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='lcm'){tasks=lcms;$('#title').textContent='Pienin yhteinen jaettava (PYJ)';$('#intro').textContent='Etsi pienin positiivinen luku, joka on jaollinen molemmilla annetuilla luvuilla.';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row">pyj(${t[0]}, ${t[1]}) = <input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`).join('')}
}
function normFactors(s){return String(s).trim().replace(/\s/g,'').replace(/×|·/g,'*').split('*').filter(Boolean).map(Number).sort((a,b)=>a-b).join('*')}
function check(){let p=0;tasks.forEach((t,i)=>{let ok=false,msg='';
 if(page==='basic'){ok=$('#a'+i).value===(t[2]?'Kyllä':'Ei');msg=t[2]?'Kyllä':'Ei'}
 if(page==='division'){let q=Math.floor(t[0]/t[1]),r=t[0]%t[1];ok=EQ($('#q'+i).value,q)&&EQ($('#r'+i).value,r)&&r<t[1];msg=`${t[0]} = ${t[1]} · ${q} + ${r}`}
 if(page==='rules'){let yes=$('#a'+i).value===(t.ans?'Kyllä':'Ei'),sumok=(t.d===3||t.d===9)?EQ($('#s'+i).value,t.sum):true;ok=yes&&sumok;msg=(t.d===3||t.d===9?`numeroiden summa ${t.sum}, `:'')+(t.ans?'Kyllä':'Ei')}
 if(page==='prime'){if(t.t==='p'){ok=$('#a'+i).value===(t.x[1]?'Kyllä':'Ei');msg=t.x[1]?'Kyllä':'Ei'}else{ok=normFactors($('#a'+i).value)===normFactors(t.x[1]);msg=t.x[1]}}
 if(page==='gcd'||page==='lcm'){ok=EQ($('#a'+i).value,t[2]);msg=t[2]}
 let el=$('#it'+i);el.classList.remove('good','bad');el.classList.add(ok?'good':'bad');$('#c'+i).textContent=ok?'✓ Oikein':'Oikea vastaus: '+msg;if(ok)p++;
 });$('#score').textContent=`Tulos: ${p} / ${tasks.length}`}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');page=b.dataset.page;render()});$('#check').onclick=check;$('#new').onclick=render;render();
</script></body></html>
