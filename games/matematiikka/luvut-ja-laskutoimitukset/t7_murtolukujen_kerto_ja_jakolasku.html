<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murtolukujen kerto- ja jakolasku</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#627184;--line:#d8e0e8;--accent:#2457a7;--bad:#b02a37}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px 5% 15px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem)}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:22px 5% 36px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{font:inherit;font-weight:750;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.04)}h2{margin:0 0 5px}.intro{color:var(--muted);margin:0 0 12px}
.theory{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.box{background:#f7f9fb;border:1px solid #e0e6ec;border-radius:11px;padding:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:12px}.item.good{background:#f6fcf8;border-color:#9dd4b7}.item.bad{background:#fff8f9;border-color:#e1a4aa}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.letter{font-weight:800;color:var(--muted)}input,select{font:inherit;padding:8px 10px;border:1px solid #bac6d3;border-radius:8px;background:#fff}input{width:150px;max-width:60vw}.wide{width:280px;max-width:82vw}
.correct{font-size:.82rem;color:var(--bad);min-height:17px;margin-top:4px}.actions{display:flex;justify-content:center;gap:9px;margin-top:15px;flex-wrap:wrap}.action{font:inherit;font-weight:750;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;border:1px solid var(--line);color:var(--ink)}.score{text-align:center;font-weight:850;margin-top:10px}
.finnish{display:inline-flex;align-items:flex-start;gap:3px}.factor{font-weight:850;font-size:.9rem;margin-top:-2px}.factor.right{margin-left:2px}
@media(max-width:720px){.grid,.theory{grid-template-columns:1fr}}
</style>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']]},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head><body>
<header><h1>Murtolukujen kerto- ja jakolasku</h1><p>7. luokka · kertolasku ja jakolasku</p></header><main><div class="tabs"><button class="tab active" data-page="mul">Kertolasku</button><button class="tab" data-page="div">Jakolasku</button><button class="tab" data-page="challenge">Haaste</button></div><section class="card"><h2 id="title"></h2><p class="intro" id="intro"></p><div id="theory" class="theory"></div><div id="grid" class="grid"></div><div class="actions"><button class="action primary" id="check">Tarkista kaikki</button><button class="action secondary" id="new">Aloita osio alusta</button></div><div id="score" class="score"></div></section></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function raw(s){return String(s).trim().replace(/−/g,'-').replace(/,/g,'.')}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return Math.abs(a)}
function parseFrac(s){
 let z=raw(s);if(!z)return null;
 if(/^[-+]?\d+$/.test(z))return {v:Number(z),ok:true,type:'int'};
 let m=z.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);if(m){let w=+m[1],n=+m[2],d=+m[3];if(d<=0||n<=0||n>=d||gcd(n,d)!==1)return null;return {v:w<0?w-n/d:w+n/d,ok:true,type:'mixed'}}
 m=z.match(/^(-?\d+)\/(\d+)$/);if(m){let n=+m[1],d=+m[2];if(d<=0||gcd(Math.abs(n),d)!==1)return null;return {v:n/d,ok:true,type:'frac'}}
 return null;
}
function checkFrac(s,n,d){let p=parseFrac(s);return !!p&&Math.abs(p.v-n/d)<1e-9}
const tex=(n,d)=>`\\(\\frac{${n}}{${d}}\\)`;
const mix=(w,n,d)=>`${w} ${tex(n,d)}`;
function typeset(){if(window.MathJax?.typesetPromise){MathJax.typesetClear?.();MathJax.typesetPromise([$('#theory'),$('#grid')]);}}

let page='mul',tasks=[];
const mul=[
 {q:`4 · ${tex(1,5)}`,n:4,d:5},{q:`3 · ${tex(1,2)}`,n:3,d:2},{q:`${tex(1,2)} · ${tex(1,3)}`,n:1,d:6},
 {q:`${tex(1,4)} · 8`,n:2,d:1},{q:`5 · ${tex(3,7)}`,n:15,d:7},{q:`${tex(3,2)} · ${tex(3,2)}`,n:9,d:4},
 {q:`${tex(7,10)} · ${tex(10,7)}`,n:1,d:1},{q:`${tex(4,7)} · ${tex(2,9)}`,n:8,d:63}
];
const div=[
 {q:`${tex(5,8)} : 5`,n:1,d:8},{q:`${tex(1,2)} : 4`,n:1,d:8},{q:`2 : ${tex(1,2)}`,n:4,d:1},
 {q:`3 : ${tex(1,6)}`,n:18,d:1},{q:`${tex(4,3)} : ${tex(1,3)}`,n:4,d:1},{q:`${tex(2,5)} : ${tex(4,5)}`,n:1,d:2},
 {q:`${tex(3,8)} : ${tex(2,5)}`,n:15,d:16},{q:`${mix(1,2,3)} : ${mix(1,1,2)}`,n:10,d:9}
];
const challenge=[
 {q:`${mix(1,1,5)} · (${mix(2,1,2)} + ${mix(3,1,3)})`,n:7,d:1},
 {q:`3 litraa limsaa jaetaan ${tex(1,6)} litran annoksiin. Montako annosta saadaan?`,n:18,d:1},
 {q:`Juna kulkee ${mix(2,1,3)} km minuutissa. Mikä on tuntinopeus km/h?`,n:140,d:1},
 {q:`${tex(15,2)} : ${tex(5,7)}`,n:21,d:2}
];
function setPage(p){page=p;render()}
function render(){
 tasks=page==='mul'?mul:page==='div'?div:challenge;
 $('#title').textContent=page==='mul'?'Murtolukujen kertolasku':page==='div'?'Murtolukujen jakolasku':'Haaste';
 $('#intro').textContent='Kirjoita vastaus muodossa 1/4 tai 2 1/3. Anna vastaus aina supistettuna. Kokonaisluku kirjoitetaan kokonaislukuna.';
 $('#theory').innerHTML=page==='div'
 ?`<div class="box"><b>Jakolasku:</b> ${tex(3,8)} : ${tex(2,5)} = ${tex(3,8)} · ${tex(5,2)}. Jakajan tilalle tulee sen käänteisluku.</div><div class="box">Supista lopuksi. Esim. 6/4 → 3/2 → 1 1/2.</div>`
 :`<div class="box"><b>Kertolasku:</b> kerro osoittajat keskenään ja nimittäjät keskenään.</div><div class="box">Supista ennen kertomista tai viimeistään lopuksi. Vastaukseksi käy supistettu murto- tai sekaluku.</div>`;
 $('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row"><span class="letter">${String.fromCharCode(97+i)})</span><span>${t.q} =</span><input id="a${i}" placeholder="esim. 1/4 tai 2 1/3"></div><div class="correct" id="c${i}"></div></div>`).join('');
 $('#score').textContent='';typeset();
}
function check(){let p=0;tasks.forEach((t,i)=>{let ok=checkFrac($('#a'+i).value,t.n,t.d);let el=$('#it'+i);el.classList.remove('good','bad');el.classList.add(ok?'good':'bad');$('#c'+i).textContent=ok?'✓ Oikein':'Oikea vastaus: '+(t.d===1?t.n:`${t.n}/${t.d}`);if(ok)p++});$('#score').textContent=`Tulos: ${p} / ${tasks.length}`}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');setPage(b.dataset.page)});
$('#check').onclick=check;$('#new').onclick=render;render();
</script></body></html>
