<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negatiiviset luvut</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#627184;--line:#d8e0e8;--accent:#2457a7;--bad:#b02a37}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px 5% 15px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem)}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:22px 5% 36px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{font:inherit;font-weight:750;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.04)}h2{margin:0 0 5px}.intro{color:var(--muted);margin:0 0 12px}
.theory{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.box{background:#f7f9fb;border:1px solid #e0e6ec;border-radius:11px;padding:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:12px}.item.good{background:#f6fcf8;border-color:#9dd4b7}.item.bad{background:#fff8f9;border-color:#e1a4aa}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.letter{font-weight:800;color:var(--muted)}input,select{font:inherit;padding:8px 10px;border:1px solid #bac6d3;border-radius:8px;background:#fff}input{width:150px;max-width:60vw}.wide{width:280px;max-width:82vw}
.correct{font-size:.82rem;color:var(--bad);min-height:17px;margin-top:4px}.actions{display:flex;justify-content:center;gap:9px;margin-top:15px;flex-wrap:wrap}.action{font:inherit;font-weight:750;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;border:1px solid var(--line);color:var(--ink)}.score{text-align:center;font-weight:850;margin-top:10px}
.finnish{display:inline-flex;align-items:flex-start;gap:3px}.factor{font-weight:850;font-size:.9rem;margin-top:-2px}.factor.right{margin-left:2px}
@media(max-width:720px){.grid,.theory{grid-template-columns:1fr}}

.numberline{position:relative;height:68px;margin:9px 2px 0;user-select:none;touch-action:none}.axis{position:absolute;left:18px;right:18px;top:27px;height:3px;background:#334257}.tick{position:absolute;top:19px;width:2px;height:18px;background:#334257}.tick.minor{top:22px;height:12px;background:#8490a0}.ticklabel{position:absolute;top:43px;transform:translateX(-50%);font-size:.76rem;color:#526071}.dot{position:absolute;top:18px;width:18px;height:18px;border-radius:50%;background:#2457a7;transform:translateX(-9px);cursor:grab}

.backbar{max-width:1050px;margin:0 auto 14px}.backlink{display:inline-block;color:#2457a7;text-decoration:none;font-weight:750;background:#fff;border:1px solid #d8e0e8;border-radius:10px;padding:8px 12px}.backlink:hover{border-color:#2457a7}
</style>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']]},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head><body>
<header><h1>Negatiiviset luvut</h1><p>7. luokka · lukusuora, vastaluku, itseisarvo ja vertailu</p></header>
<main><nav class="backbar"><a class="backlink" href="index.html">← Luvut ja laskutoimitukset</a></nav><div class="tabs">
<button class="tab active" data-page="line">Lukusuora</button><button class="tab" data-page="temp">Lämpötila</button><button class="tab" data-page="concept">Vastaluku</button><button class="tab" data-page="compare">Vertailu</button><button class="tab" data-page="logic">Väitteet</button>
</div><section class="card"><h2 id="title"></h2><p class="intro" id="intro"></p><div id="theory" class="theory"></div><div id="grid" class="grid"></div><div class="actions"><button class="action primary" id="check">Tarkista kaikki</button><button class="action secondary" id="new">Aloita osio alusta</button></div><div id="score" class="score"></div></section></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const val=s=>{let z=String(s).trim().replace(/−/g,'-').replace(',','.');return z===''?NaN:Number(z)};const eq=(s,x)=>Number.isFinite(val(s))&&Math.abs(val(s)-x)<1e-9;
const tex=(n,d)=>`\\(\\frac{${n}}{${d}}\\)`;let page='line',tasks=[];
const lineTasks=[{label:'4',v:4},{label:'−4',v:-4},{label:'2',v:2},{label:'−2',v:-2},{label:'0',v:0},{label:'−0,5',v:-.5},{label:tex(1,4),v:.25},{label:`−${tex(5,4)}`,v:-1.25},{label:'1,75',v:1.75},{label:`−${tex(3,2)}`,v:-1.5}];
const temps=[[5,-5,0],[-12,8,-4],[0,-7,-7],[3.5,-4,-.5],[-1.2,-2.1,-3.3],[-16.5,15.5,-1]];
const concepts=[['Luvun −12 vastaluku',12],['Luvun +15 vastaluku',-15],['|−8|',8],['|100|',100],['−(−40)',40],['−(−24,7)',24.7],['2,8 = −x. Mikä on x?',-2.8]];
const comps=[
 {a:'0',av:0,b:'3',bv:3},{a:'0',av:0,b:'−5',bv:-5},{a:'−0,75',av:-.75,b:'−2',bv:-2},
 {a:'2',av:2,b:'−1',bv:-1},{a:'−5',av:-5,b:'−11',bv:-11},{a:'−2,1',av:-2.1,b:'−2,2',bv:-2.2},
 {a:`−${tex(2,3)}`,av:-2/3,b:`−${tex(3,4)}`,bv:-3/4},{a:tex(3,5),av:3/5,b:tex(4,10),bv:4/10}
];
const claims=[['−3 < −2,8',true],['2 > 1,7',true],['−3 < −2,5',true],['0,5 < −1,2',false],[`−${tex(1,2)} > −${tex(3,4)}`,true],[`${tex(3,5)} > ${tex(4,10)}`,true],['−2 > −1',false],['−(−15) = 15',true]];
function typeset(){if(window.MathJax?.typesetPromise){MathJax.typesetClear?.();MathJax.typesetPromise([$('#theory'),$('#grid')]);}}
function setPage(p){page=p;render()}
function lineHTML(t,i){let parts='';for(let k=-20;k<=20;k++){let v=k/4,pct=(v+5)/10*100,major=Number.isInteger(v);parts+=`<span class="tick ${major?'':'minor'}" style="left:calc(18px + (100% - 36px)*${pct/100})"></span>`;if(major)parts+=`<span class="ticklabel" style="left:calc(18px + (100% - 36px)*${pct/100})">${v}</span>`}return `<div class="item" id="it${i}"><div><span class="letter">${i+1}.</span> Sijoita <b>${t.label}</b> lukusuoralle.</div><div class="numberline" id="nl${i}"><div class="axis"></div>${parts}<div class="dot" id="dot${i}" style="left:50%"></div></div><div class="correct" id="c${i}"></div></div>`}
function bind(){tasks.forEach((t,i)=>{let nl=$('#nl'+i),d=$('#dot'+i);let move=e=>{let r=nl.getBoundingClientRect(),x=Math.max(18,Math.min(r.width-18,e.clientX-r.left)),v=-5+(x-18)/(r.width-36)*10;t.pos=Math.round(v*4)/4;d.style.left=`calc(18px + (100% - 36px)*${(t.pos+5)/10})`};d.onpointerdown=e=>{d.setPointerCapture(e.pointerId);move(e)};d.onpointermove=e=>{if(d.hasPointerCapture(e.pointerId))move(e)};nl.onclick=e=>{if(e.target!==d)move(e)}})}
function render(){
 $('#score').textContent='';
 if(page==='line'){tasks=lineTasks.map(x=>({...x,pos:0}));$('#title').textContent='Luvut lukusuoralla';$('#intro').textContent='Siirrä sinistä pistettä lukusuoralla ja sijoita annettu luku oikealle kohdalle.';$('#theory').innerHTML='<div class="box">Lukusuoralla vasemmalla oleva luku on pienempi ja oikealla oleva suurempi.</div>';$('#grid').innerHTML=tasks.map(lineHTML).join('');bind()}
 if(page==='temp'){tasks=temps;$('#title').textContent='Lämpötilan muutos';$('#intro').textContent='Kirjoita vastauskenttään vain luku. Yksikkö °C on valmiina.';$('#theory').innerHTML='<div class="box">Nousu tarkoittaa lisäämistä ja lasku vähentämistä. Esim. −4 °C + 7 °C = 3 °C.</div>';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row"><span class="letter">${String.fromCharCode(97+i)})</span><b>Alkulämpötila:</b> ${String(t[0]).replace('.',',')} °C &nbsp; <b>Muutos:</b> ${t[1]>=0?'+':''}${String(t[1]).replace('.',',')} °C &nbsp; <b>Loppulämpötila:</b> <input id="a${i}"> °C</div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='concept'){tasks=concepts;$('#title').textContent='Vastaluku ja itseisarvo';$('#intro').textContent='Vastaluku on yhtä kaukana nollasta vastakkaisella puolella. Itseisarvo kertoo etäisyyden nollasta.';$('#theory').innerHTML='<div class="box">Luvun −4 vastaluku on 4.</div><div class="box">|−4| = 4 ja |4| = 4.</div>';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span>${t[0]} = <input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='compare'){tasks=comps.map(t=>({...t,ans:t.av<t.bv?'<':t.av>t.bv?'>':'='}));$('#title').textContent='Lukujen vertailu';$('#intro').textContent='Valitse oikea vertailumerkki.';$('#theory').innerHTML='<div class="box">Esim. −5 < −2, koska −5 on lukusuoralla vasemmalla.</div>';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span>${t.a} <select id="a${i}"><option></option><option>&lt;</option><option>&gt;</option><option>=</option></select> ${t.b}</div><div class="correct" id="c${i}"></div></div>`).join('')}
 if(page==='logic'){tasks=claims;$('#title').textContent='Tosi vai epätosi';$('#intro').textContent='Päätä, onko väite tosi.';$('#theory').innerHTML='';$('#grid').innerHTML=tasks.map((t,i)=>`<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span>${t[0]} <select id="a${i}"><option></option><option value="true">tosi</option><option value="false">epätosi</option></select></div><div class="correct" id="c${i}"></div></div>`).join('')}
 typeset();
}
function check(){let p=0;tasks.forEach((t,i)=>{let ok=false,msg='';if(page==='line'){ok=Math.abs(t.pos-t.v)<.126;msg=t.label}if(page==='temp'){ok=eq($('#a'+i).value,t[2]);msg=String(t[2]).replace('.',',')+' °C'}if(page==='concept'){ok=eq($('#a'+i).value,t[1]);msg=t[1]}if(page==='compare'){ok=$('#a'+i).value===t.ans;msg=t.ans}if(page==='logic'){ok=$('#a'+i).value===String(t[1]);msg=t[1]?'tosi':'epätosi'}let el=$('#it'+i);el.classList.remove('good','bad');el.classList.add(ok?'good':'bad');$('#c'+i).textContent=ok?'✓ Oikein':'Oikea vastaus: '+msg;if(ok)p++});$('#score').textContent=`Tulos: ${p} / ${tasks.length}`}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');setPage(b.dataset.page)});$('#check').onclick=check;$('#new').onclick=render;render();
</script></body></html>
