<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peruslaskutoimitusten kertaus</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#637184;--line:#d7dfe8;--blue:#2457a7;--ok:#137647;--bad:#ad2634}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 5% 13px}h1{margin:0;font-size:clamp(1.65rem,3.7vw,2.45rem)}header p{margin:5px 0 0;color:var(--muted)}
main{max-width:1100px;margin:auto;padding:18px 4% 34px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.tab{font:inherit;font-weight:750;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 7px 22px rgba(0,0,0,.035)}h2{margin:0 0 5px}.intro{margin:0 0 12px;color:var(--muted)}
.examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0 14px}.example{background:#f7f9fb;border:1px solid #e0e6ed;border-radius:11px;padding:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-height:74px}.item.good{background:#f6fcf8;border-color:#9ed3b7}.item.bad{background:#fff8f9;border-color:#e1a4ab}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.letter{color:var(--muted);font-weight:800;min-width:21px}.math{font-size:1.08rem;font-weight:720}.small{font-size:.84rem;color:var(--muted)}
input,select{font:inherit;background:#fff;border:1px solid #bac6d3;border-radius:8px;padding:7px 9px}input{width:96px}.xs{width:56px}.wide{width:180px;max-width:65vw}.correct{font-size:.8rem;color:var(--bad);min-height:16px;margin-top:4px}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.action{font:inherit;font-weight:750;border-radius:9px;padding:10px 15px;cursor:pointer;border:0}.primary{background:var(--blue);color:#fff}.secondary{border:1px solid var(--line);background:#eef2f6;color:var(--ink)}
.score{text-align:center;font-weight:850;margin-top:10px}.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;min-width:28px}.frac>.num{border-bottom:1.6px solid currentColor;padding:0 4px 3px}.frac>.den{padding:3px 4px 0}.mixed{display:inline-flex;align-items:center;gap:3px}
.note{font-size:.87rem;color:var(--muted);margin-top:10px}.stage{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}.intermediate{margin-top:8px;padding-top:8px;border-top:1px dashed #d6dee7;color:#526071;font-size:.88rem}
.numberline{position:relative;height:68px;margin:9px 2px 0;user-select:none;touch-action:none}.axis{position:absolute;left:18px;right:18px;top:27px;height:3px;background:#334257}.tick{position:absolute;top:19px;width:2px;height:18px;background:#334257}.tick.minor{top:22px;height:12px;background:#8490a0}.ticklabel{position:absolute;top:43px;transform:translateX(-50%);font-size:.76rem;color:#526071}.dot{position:absolute;top:18px;width:18px;height:18px;border-radius:50%;background:var(--blue);transform:translateX(-9px);cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.fracbar{display:flex;width:220px;height:28px;border:1px solid #445266;border-radius:5px;overflow:hidden}.fracbar span{flex:1;border-right:1px solid #778391}.fracbar span:last-child{border-right:0}.fracbar .fill{background:#cbd8eb}
.finnish{display:inline-grid;align-items:start;grid-template-columns:auto auto;column-gap:3px}.finnish .factor{font-weight:800;font-size:.9rem;margin-top:-2px;white-space:nowrap}.finnish.reduce{grid-template-columns:auto auto}.finnish.reduce .factor{grid-column:2;margin-left:2px}
.mcgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.mcitem{font-size:.9rem;min-height:0}.mcitem label{display:block;margin:4px 0}.mcitem input[type=radio]{width:auto;padding:0}
@media(max-width:820px){.grid,.examples{grid-template-columns:1fr}.mcgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:570px){.mcgrid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Peruslaskutoimitusten kertaus</h1><p>7. luokka · monisteen kappaleen 1 tehtävärakenteesta</p></header><main><div class="tabs"><button class="tab active" data-page="head">Päässälaskut</button><button class="tab" data-page="steps">Välivaiheet</button><button class="tab" data-page="wording">Merkitse ja laske</button></div><section class="card"><h2 id="title"></h2><p id="intro" class="intro"></p><div id="examples" class="examples"></div><div id="grid" class="grid"></div>
<div class="actions"><button id="check" class="action primary">Tarkista kaikki</button><button id="new" class="action secondary">Aloita osio alusta</button></div><div id="score" class="score"></div></section></main><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const V=s=>Number(String(s).trim().replace(/\s/g,'').replace(',','.')); const EQ=(s,x)=>Number.isFinite(V(s))&&Math.abs(V(s)-x)<1e-9;
const G=(a,b)=>b?G(b,a%b):Math.abs(a), L=(a,b)=>Math.abs(a*b)/G(a,b); function simp(n,d){if(d<0){n=-n;d=-d}let g=G(n,d);return[n/g,d/g]}
const F=(n,d)=>`<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`; const MIX=(w,n,d)=>`<span class="mixed">${w} ${F(n,d)}</span>`;
function result(i,ok,msg){let e=$('#it'+i),c=$('#c'+i);e.classList.remove('good','bad');e.classList.add(ok?'good':'bad');c.innerHTML=ok?'✓ Oikein':msg}
function tabs(cb){$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');cb(b.dataset.page)})}

let page='head',tasks=[];const sections={head:['Päässälaskut','Laske päässä. Tehtävät etenevät monisteen tapaan peruslaskuista laskujärjestykseen.'],steps:['Laskujärjestys','Laske välivaiheittain. Kirjoita vähintään yksi välivaihe ennen vastausta.'],wording:['Merkitse ja laske','Muodosta annetuista luvuista pyydetty laskulauseke ja laske.']};
const head=[['862 + 139',1001],['1111 − 121',990],['17 · 100',1700],['21 · 20',420],['2500 : 500',5],['5550 : 5',1110],['12 − 3 · 4',0],['8 · 7 · 6 · 0 · 1',0],['6278 + 75',6353],['10001 − 837',9164],['12 · 28',336],['100 · 5 + 10 · 4',540],['75 : 15 − 5',0],['60 : (12 − 6)',10],['12 − 12 : 12',11],['(100 − 100) : 10',0]];
const steps=[['64 − 4 · 10','64 − 40',24],['100 + 25 · 2 − 50','100 + 50 − 50',100],['4 · 4 · 4 − 3 · 3 · 3','64 − 27',37],['(3 · 100 − 50) : (10 − 5)','250 : 5',50]];
const wording=[{q:'Lukujen 48 ja 12 summa.',e:'48+12',a:60},{q:'Lukujen 48 ja 12 erotus.',e:'48−12',a:36},{q:'Lukujen 48 ja 12 tulo.',e:'48·12',a:576},{q:'Lukujen 48 ja 12 osamäärä.',e:'48:12',a:4},{q:'Lukujen 18 ja 6 summan ja erotuksen tulo.',e:'(18+6)·(18−6)',a:288},{q:'Lukujen 18 ja 6 summan ja erotuksen osamäärä.',e:'(18+6):(18−6)',a:2}];
function setPage(p){page=p;let s=sections[p];$('#title').textContent=s[0];$('#intro').textContent=s[1];$('#examples').innerHTML=p==='steps'?'<div class="example"><b>Esimerkki:</b> 20 + 3 · 4 = 20 + 12 = 32.</div>':'';render()}
function render(){tasks=page==='head'?head:page==='steps'?steps:wording;$('#grid').innerHTML=tasks.map((t,i)=>page==='head'?`<div class="item" id="it${i}"><div class="row"><span class="letter">${i+1}.</span><span class="math">${t[0]} =</span><input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`:page==='steps'?`<div class="item" id="it${i}"><div class="row"><span class="letter">${String.fromCharCode(97+i)})</span><span class="math">${t[0]} =</span><input id="a${i}"></div><div class="intermediate">Välivaihe: <input class="wide" id="s${i}"></div><div class="correct" id="c${i}"></div></div>`:`<div class="item" id="it${i}"><div><span class="letter">${String.fromCharCode(97+i)})</span> ${t.q}</div><div class="row"><input class="wide" id="e${i}" placeholder="laskulauseke"><span>=</span><input id="a${i}"></div><div class="correct" id="c${i}"></div></div>`).join('');$('#score').textContent=''}
function norm(s){return String(s).replace(/\s/g,'').replace(/×/g,'·').replace(/-/g,'−')}
function check(){let p=0;tasks.forEach((t,i)=>{let ok,msg;if(page==='head'){ok=EQ($('#a'+i).value,t[1]);msg='Oikea vastaus: '+t[1]}if(page==='steps'){ok=EQ($('#a'+i).value,t[2])&&norm($('#s'+i).value)===norm(t[1]);msg=`Välivaihe: ${t[1]}; vastaus ${t[2]}`}if(page==='wording'){ok=EQ($('#a'+i).value,t.a)&&norm($('#e'+i).value)===norm(t.e);msg=`Lauseke: ${t.e}; vastaus ${t.a}`}result(i,ok,msg);if(ok)p++});$('#score').textContent=`Tulos: ${p} / ${tasks.length}`}
tabs(setPage);$('#check').onclick=check;$('#new').onclick=()=>setPage(page);setPage(page);
</script></body></html>
