<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luvut ja laskutoimitukset – kertaustesti</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#627184;--line:#d8e0e8;--accent:#2457a7;--bad:#b02a37}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px 5% 15px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem)}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:22px 5% 36px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{font:inherit;font-weight:750;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.04)}h2{margin:0 0 5px}.intro{color:var(--muted);margin:0 0 12px}
.theory{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.box{background:#f7f9fb;border:1px solid #e0e6ec;border-radius:11px;padding:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:12px}.item.good{background:#f6fcf8;border-color:#9dd4b7}.item.bad{background:#fff8f9;border-color:#e1a4aa}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.letter{font-weight:800;color:var(--muted)}input,select{font:inherit;padding:8px 10px;border:1px solid #bac6d3;border-radius:8px;background:#fff}input{width:150px;max-width:60vw}.wide{width:280px;max-width:82vw}
.correct{font-size:.82rem;color:var(--bad);min-height:17px;margin-top:4px}.actions{display:flex;justify-content:center;gap:9px;margin-top:15px;flex-wrap:wrap}.action{font:inherit;font-weight:750;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;border:1px solid var(--line);color:var(--ink)}.score{text-align:center;font-weight:850;margin-top:10px}
.finnish{display:inline-flex;align-items:flex-start;gap:3px}.factor{font-weight:850;font-size:.9rem;margin-top:-2px}.factor.right{margin-left:2px}
@media(max-width:720px){.grid,.theory{grid-template-columns:1fr}}

.mcgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mcitem{font-size:.92rem}.mcitem label{display:block;margin:5px 0}.mcitem input[type=radio]{width:auto}
@media(max-width:850px){.mcgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:570px){.mcgrid{grid-template-columns:1fr}}
</style>

</head><body><header><h1>Luvut ja laskutoimitukset – kertaustesti</h1><p>7. luokka · 30 monivalintatehtävää</p></header>
<main><section class="card"><h2>30 tehtävän kertaustesti</h2><p class="intro">Valitse jokaiseen kohtaan paras vastaus. Väärissä vaihtoehdoissa on mukana tavallisia laskuvirheitä.</p><div id="grid" class="mcgrid"></div><div class="actions"><button class="action primary" id="check">Tarkista kaikki</button></div><div id="score" class="score"></div></section></main>
<script>
const Q=[["1 − 1/2", "1/2", ["−1/2", "1/2", "1", "3/2"]], ["2 · (−3)", "−6", ["−6", "−1", "5", "6"]], ["3 − 12 · 2", "−21", ["−21", "−18", "−9", "18"]], ["1/2 − 2/3", "−1/6", ["−1/6", "1/6", "1/3", "−1/3"]], ["4/5 : 2/5", "2", ["2/5", "1/2", "2", "8/25"]], ["−0,80 : (−0,20)", "4", ["−4", "0,4", "4", "40"]], ["16 − 21", "−5", ["−5", "5", "−37", "37"]], ["15 − 3 · 5", "0", ["0", "12", "60", "−60"]], ["(27 − 12) · 10", "150", ["15", "150", "270", "−150"]], ["1,6 − 0,39", "1,21", ["1,21", "1,31", "1,29", "0,23"]], ["100 · 1,2", "120", ["12", "120", "1200", "0,012"]], ["350 : 1000", "0,35", ["0,035", "0,35", "3,5", "350000"]], ["3,2 : 0,4", "8", ["0,8", "8", "80", "1,28"]], ["25 : 0,5", "50", ["12,5", "25,5", "50", "0,5"]], ["1 : 8", "0,125", ["0,08", "0,125", "0,8", "8"]], ["2/3 + 2/3", "4/3", ["4/6", "2/3", "4/3", "1"]], ["3 − 1 1/4", "1 3/4", ["1 1/4", "1 3/4", "2 1/4", "2 3/4"]], ["2 1/3 + 1 2/3", "4", ["3", "3 2/3", "4", "4 1/3"]], ["2/5 · 5", "2", ["2/25", "2/5", "2", "5/2"]], ["1/2 : 3", "1/6", ["1/6", "2/3", "3/2", "1 1/2"]], ["2/3 − 1/2", "1/6", ["−1/6", "1/6", "1/3", "2/5"]], ["−5 − 5 + 9", "−1", ["−19", "−1", "1", "9"]], ["−15 − (−6)", "−9", ["−21", "−9", "9", "21"]], ["30 · (−0,2) · 5", "−30", ["−30", "−6", "6", "30"]], ["−115 : 5", "−23", ["−575", "−23", "23", "110"]], ["Mikä on luvun −4 vastaluku?", "4", ["−4", "−1/4", "0", "4"]], ["Mikä on |−85|?", "85", ["−85", "−1/85", "0", "85"]], ["0,04 murtolukuna supistettuna", "1/25", ["4/10", "4/100", "1/25", "1/4"]], ["Pyöristä 12,55 kymmenesosien tarkkuuteen.", "12,6", ["12,5", "12,6", "12,55", "13,0"]], ["Mikä on pienin luvuista −2,8; −2,08; −2,18 ja −2,81?", "−2,81", ["−2,8", "−2,08", "−2,18", "−2,81"]]];const $=s=>document.querySelector(s);
function texify(s){
 let z=String(s);
 z=z.replace(/(−?\d+)\s+(\d+)\/(\d+)/g,(m,w,n,d)=>`${w} \\(\\frac{${n}}{${d}}\\)`);
 z=z.replace(/(−?)\b(\d+)\/(\d+)\b/g,(m,sg,n,d)=>`${sg}\\(\\frac{${n}}{${d}}\\)`);
 return z;
}
function render(){$('#grid').innerHTML=Q.map((q,i)=>`<div class="item mcitem" id="it${i}"><div><b>${i+1}.</b> ${texify(q[0])}</div>${q[2].map(x=>`<label><input type="radio" name="q${i}" value="${x}"> ${texify(x)}</label>`).join('')}<div class="correct" id="c${i}"></div></div>`).join('');if(window.MathJax?.typesetPromise){MathJax.typesetPromise([$('#grid')]);}}
function check(){let p=0;Q.forEach((q,i)=>{let z=$(`input[name=q${i}]:checked`),ok=z&&z.value===q[1];let el=$('#it'+i);el.classList.remove('good','bad');el.classList.add(ok?'good':'bad');$('#c'+i).textContent=ok?'✓ Oikein':'Oikea vastaus: '+q[1];if(ok)p++});$('#score').textContent=`Tulos: ${p} / 30`}
$('#check').onclick=check;render();
</script></body></html>
