function parse(text){

 function power(){let n=atom();if(t[pos]==='^'){pos++;let z=t[pos++];if(!['2','1','0'].includes(z))throw Error('Tässä käytetään vain potensseja 0, 1 ja 2.');n={k:'pow',v:n,exp:Number(z)}}return n}

function poly(n){if(n.k==='num')return[n.v,0,0,0];if(['x','a','b'].includes(n.k)){let p=[0,0,0,0];p[['x','a','b'].indexOf(n.k)+1]=1;return p}if(n.k==='group')return poly(n.v);if(n.k==='neg')return poly(n.v).map(v=>v*n.sign);if(n.k==='pow'||n.k==='sqrt'){let p=poly(n.v);if(p.slice(1).some(v=>!near(v,0)))throw Error('Tässä harjoituksessa käytetään ensimmäisen asteen lausekkeita.');return[n.k==='sqrt'?Math.sqrt(p[0]):p[0]**n.exp,0,0,0]}let l=poly(n.l),r=poly(n.r);if(n.k==='+'||n.k==='-')return l.map((v,i)=>v+(n.k==='+'?1:-1)*r[i]);let scalar=p=>p.slice(1).every(v=>near(v,0));if(n.k==='/'){if(!scalar(r)||near(r[0],0))throw Error('Jaa vain nollasta poikkeavalla luvulla.');return l.map(v=>v/r[0])}if(n.k==='*'){if(!scalar(l)&&!scalar(r))throw Error('Tässä harjoituksessa kerrotaan luvulla.');return scalar(r)?l.map(v=>v*r[0]):r.map(v=>v*l[0])}throw Error('Käytä tässä x:ää sekä tarvittaessa a:ta ja b:tä.')}
function equation(text){let p=text.split('=');if(p.length!==2)throw Error('Kirjoita kokonainen yhtälö, jossa on yksi =.');let L=parse(p[0]),R=parse(p[1]),l=poly(L),r=poly(R);if([...l,...r].some(v=>!Number.isFinite(v)||Math.abs(v)>1e12))throw Error('Tarkista luvut.');return {L,R,l,r,text,symbolic:has(L,'a')||has(R,'a')||has(L,'b')||has(R,'b')}}

function has(n,k){return count(n,k)>0}function samePoly(a,b){return a.every((v,i)=>near(v,b[i]))}
function fmt(v){if(near(v,Math.round(v)))return String(Math.round(v));for(let d=2;d<=120;d++)if(near(v*d,Math.round(v*d)))return Math.round(v*d)+'/'+d;return String(Number(v.toFixed(8))).replace('.',',')}
function linear(p){let text='';for(let i of [1,2,3,0]){let v=p[i]||0;if(near(v,0))continue;let abs=Math.abs(v),term=i?(near(abs,1)?'':fmt(abs).includes('/')?'('+fmt(abs)+')':fmt(abs))+['','x','a','b'][i]:fmt(abs);text+=(text?(v<0?'-':'+'):v<0?'-':'')+term}return text||'0'}

function astMath(n,sub){if(n.highlight){let m={...n};delete m.highlight;return '<mstyle mathcolor="#bc401d" mathvariant="bold" class="substituted">'+astMath(m)+'</mstyle>'}if(['y','a','b','u','v','k'].includes(n.k))return '<mi>'+n.k+'</mi>';if(n.k==='pow')return '<msup>'+astMath(n.v,sub)+'<mn>'+n.exp+'</mn></msup>';if(n.k==='sqrt')return '<msqrt>'+astMath(n.v,sub)+'</msqrt>';if(n.k==='num')return '<mn>'+String(n.v).replace('.',',')+'</mn>';if(n.k==='x')return sub===undefined?'<mi>x</mi>':'<mstyle mathcolor="#c04626"><mrow><mo>(</mo>'+astMath(parse(String(sub)))+'<mo>)</mo></mrow></mstyle>';if(n.k==='group'&&['/','sqrt'].includes(strip(n.v).k))return astMath(n.v,sub);if(n.k==='group')return '<mrow><mo>(</mo>'+astMath(n.v,sub)+'<mo>)</mo></mrow>';if(n.k==='neg')return '<mrow><mo>'+(n.sign===-1?'−':'+')+'</mo>'+astMath(n.v,sub)+'</mrow>';if(n.k==='/')return '<mfrac>'+astMath(strip(n.l),sub)+astMath(strip(n.r),sub)+'</mfrac>';return '<mrow>'+astMath(n.l,sub)+'<mo>'+(n.k==='*'?(['x','y','a','b','u','v','k','pow'].includes(strip(n.r).k)?'⁢':'·'):n.k==='-'?'−':'+')+'</mo>'+astMath(n.r,sub)+'</mrow>'}

function substitute(n,v){if(n.k==='x')return v<0?{k:'group',v:parse(String(v)),highlight:true}:{...parse(String(v)),highlight:true};let m={...n};for(let k of ['l','r','v'])if(n[k]&&typeof n[k]==='object')m[k]=substitute(n[k],v);return m}

function operation(e,raw){let z=raw.trim().replace(/^\|\|/,'').trim().replace(/−/g,'-'),type=z[0];if(!['+','-',':','/','*','·','×'].includes(type))throw Error('Aloita laskutoimitus merkillä +, −, : tai *.');let p=poly(parse(['+','-'].includes(type)?z:z.slice(1))),l=e.l.slice(),r=e.r.slice();if(type==='+'||type==='-'){let change=p;let cancels=[l,r].some(side=>side.some((v,i)=>!near(v,0)&&near(v+change[i],0)));if(!cancels)throw Error('Valitse laskutoimitus, joka poistaa yhtälöstä termin.');l=l.map((v,i)=>v+change[i]);r=r.map((v,i)=>v+change[i])}else{if(p.slice(1).some(v=>!near(v,0))||near(p[0],0))throw Error('Kerro tai jaa vain nollasta poikkeavalla luvulla.');let factor=[':','/'].includes(type)?1/p[0]:p[0];if(near(factor,1))throw Error('Valitse laskutoimitus, joka muuttaa yhtälöä.');l=l.map(v=>v*factor);r=r.map(v=>v*factor)}return fromPolys(l,r)}

function simpleNumber(n){n=strip(n);if(n.k==='num')return true;if(n.k==='neg')return simpleNumber(n.v);return n.k==='/'&&simpleNumber(n.l)&&simpleNumber(n.r)}

function help(parent){let d=document.createElement('details');d.className='writing-help';d.innerHTML='<summary>'+(helpSeen?'Tarkista kirjoitusohjeet':'Katso kirjoitusohjeet ennen vastaamista')+'</summary><p><b>Pystyviivojen taakse:</b> lisää 4: <code>+4</code>, vähennä 4: <code>-4</code>, kerro luvulla 3: <code>*3</code>, jaa luvulla 3: <code>:3</code>.</p><p>Ohjelma näyttää laskutoimituksen molemmilla puolilla. Laske itse ja kirjoita koko sievennetty yhtälö alle, esimerkiksi <code>3x=12</code>. Voit myös kirjoittaa välivaiheen suoraan alle.</p><p><b>Murtoluku:</b> <code>3/4</code>. Usean termin osoittaja sulkeisiin: <code>(x+3)/4</code>. Negatiivinen jakaja sulkeisiin: <code>:(-3)</code>. Desimaalissa käy pilkku tai piste.</p><p>Paina <b>Enter</b> tai <b>Tarkista</b>.</p>';d.ontoggle=()=>{if(d.open){helpSeen=true;document.querySelectorAll('.writing-help summary').forEach(s=>s.textContent='Tarkista kirjoitusohjeet')}};parent.append(d)}

function expanded(e,raw){let z=raw.trim().replace(/^\|\|/,'').trim().replace(/−/g,'-'),type=z[0],operand=z.slice(1),parts=e.text.split('=');function protect(text){let n=parse(text);return n.k==='group'?text:['+','-','neg'].includes(strip(n).k)?'('+text+')':text}let apply=side=>type==='+'||type==='-'?side+z:type===':'||type==='/'?protect(side)+'/'+(strip(parse(operand)).k==='/'?'('+operand+')':protect(operand)):protect(side)+'*'+protect(operand);return equation(parts.map(apply).join('='))}

function solveCard(parent,state,done){let c=document.createElement('article');c.innerHTML='<h2>'+(/[a-wyz]/i.test(state.rows[0].e.text)?'Ratkaise yhtälö x:n suhteen.':'Ratkaise yhtälö.')+'</h2><div class="board"></div><div class="feedback" aria-live="polite" role="status"></div>';parent.append(c);let board=c.querySelector('.board');help(board);if(!state.phase)state.phase='op';if(state.rows.length===1&&!simplified(state.rows[0].e))state.phase='simplify';
