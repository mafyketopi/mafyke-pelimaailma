</style><main><h1>Yhtälön perusteet</h1><div id="navigation" hidden><nav class="activity-nav" aria-label="Harjoitus"><button class="active" aria-pressed="true" data-kind="study">Ratkaisun tutkiminen</button><button aria-pressed="false" data-kind="mental">Yhtälöpäässälaskuja</button></nav><nav class="level-nav" aria-label="Vaikeustaso"><button class="active" aria-pressed="true" data-tab="basic">Perus</button><button aria-pressed="false" data-tab="challenge">Haastavat</button></nav><div class="top-actions"><button id="exampleButton">Johdantoesimerkki</button></div></div><section id="example"></section><section id="basic" hidden></section><section id="challenge" hidden></section><section id="mental-basic" hidden></section><section id="mental-challenge" hidden></section></main><script>function numberCalculationPending(n){if(!n)return false;n=strip(n);if(['+','-','*','pow'].includes(n.k)){try{scalar(polynomialText(numericPoly(n)));if(!count(n,'x')&&!count(n,'y')&&!/[a-z]/i.test(JSON.stringify(n).replace(/"k":"[a-z]+"/g,''))){return true}}catch{}}if(['+','-','*'].includes(n.k)){try{let p=numericPoly(n);if(p.slice(1).every(v=>near(v,0))&&!count(n,'x')&&!count(n,'y'))return true}catch{}}return ['a','b','v','L','R'].some(k=>typeof n[k]==='object'&&numberCalculationPending(n[k]))}
function rowNeedsCalculation(e){function unfinished(n){if(numberCalculationPending(n))return true;if(has(n,'/'))return false;try{return nodes(parse(polynomialText(numericPoly(n))))<nodes(n)}catch{return false}}return !!e&&(unfinished(e.L)||unfinished(e.R))}

const near=(a,b)=>Math.abs(a-b)<1e-9*Math.max(1,Math.abs(a),Math.abs(b));
function parse(text){
 let src=text.trim().replace(/−/g,'-').replace(/,/g,'.').replace(/[·×]/g,'*').replace(/:/g,'/').replace(/²/g,'^2').replace(/√/g,'sqrt');
 if(!src||src.length>220)throw Error('Kirjoita lauseke (enintään 220 merkkiä).');
 let ts=src.match(/sqrt|\d+(?:\.\d+)?|\.\d+|[xyauvk]|[()+*/^\-]/g)||[];
 if(ts.join('')!==src.replace(/\s/g,''))throw Error('Käytä lukuja, x:ää, y:tä, a:ta, sulkeita ja laskumerkkejä. Potenssiin kaksi: x^2. Neliöjuuri: sqrt(7).');
 let t=[];ts.forEach((z,i)=>{let prev=ts[i-1];if(i&&(/^(\d|\.|[xyauvk]|\))/.test(prev))&&(/^(\d|\.|[xyauvk]|\(|sqrt)/.test(z))){if(/^(\d|\.)/.test(prev)&&/^(\d|\.)/.test(z))throw Error('Lukujen välistä puuttuu laskumerkki.');t.push('*')}t.push(z)});
 let pos=0,depth=0;
 function atom(){if(++depth>30)throw Error('Liian monta sisäkkäistä suljetta.');let z=t[pos++],n;if(z==='('){n={k:'group',v:add()};if(t[pos++]!==')')throw Error('Tarkista sulkeiden pari.')}else if(z==='sqrt'){if(t[pos++]!=='(')throw Error('Kirjoita neliöjuuri sqrt(7).');n={k:'sqrt',v:add()};if(t[pos++]!==')')throw Error('Tarkista juuren sulkeet.')}else if(['x','y','a','u','v','k'].includes(z))n={k:z};else if(z!==undefined&&/^\d|^\./.test(z))n={k:'num',v:Number(z)};else throw Error('Lauseke on kesken.');depth--;return n}
 function power(){let n=atom();if(t[pos]==='^'){pos++;let z=t[pos++];if(!['2','1','0'].includes(z))throw Error('Tässä käytetään vain potensseja 0, 1 ja 2.');n={k:'pow',v:n,exp:Number(z)}}return n}
 function unary(){if(t[pos]==='+'||t[pos]==='-'){let sign=t[pos++]==='-'?-1:1;return{k:'neg',sign,v:unary()}}return power()}
 function mul(){let n=unary();while(t[pos]==='*'||t[pos]==='/'){let k=t[pos++];n={k,l:n,r:unary()}}return n}
 function add(){let n=mul();while(t[pos]==='+'||t[pos]==='-'){let k=t[pos++];n={k,l:n,r:mul()}}return n}
 let n=add();if(pos!==t.length)throw Error('Tarkista laskumerkit ja sulkeet.');return n;
}

const banks={basic:[['2x+1=7',3],['2x-1=3',2],['3(x-1)=4',2],['3x+1=-7',-2],['4x+1=3','1/2'],['5x-3=2x+3',2],['5x-10=-2x+11',3]],challenge:[['(x-1)^2=(x-2)^2+3',3],['x^2=3-2x',-3],['(x^2-3x)/(x^2+1)=2',-2]]};
const mental={basic:['16+x=34','x-6=32','-9+x=-12','x-1=-5','-2+x=-2','4-x=-9','-12-x=-16','-8*x=-16','5x=30','3x=-12','-x=4','-x*2=10','x/5=0','x/7=1','x/(-9)=-1','x/4=12'],challenge:['x/4=-4','10/x=2','-16/x=8','-20/x=-4','24/x=-6','-48/x=8','x/0.01=4','x/0.07=5','x/0.3=0.5','x/0.9=1.2','x/1.05=1.8','x/1.3=0.9']};
function clean(n){if(n.k==='group')return clean(n.v);if(n.k==='neg'&&!containsX(n))return{k:'num',v:value(n)};return n}
function containsX(n){return n.k==='x'||['l','r','v'].some(k=>typeof n[k]==='object'&&containsX(n[k]))}
function value(n,x){switch(n.k){case'num':return n.v;case'x':if(x===undefined)throw Error('Korvaa jokainen x annetulla luvulla.');return x;case'group':return value(n.v,x);case'neg':return n.sign*value(n.v,x);case'pow':return value(n.v,x)**n.exp;case'+':return value(n.l,x)+value(n.r,x);case'-':return value(n.l,x)-value(n.r,x);case'*':return value(n.l,x)*value(n.r,x);case'/':{let d=value(n.r,x);if(near(d,0))throw Error('Nollalla ei voi jakaa.');return value(n.l,x)/d;}default:throw Error('Tarkista lauseke.')}}
function eq(s){let a=s.split('=');if(a.length!==2)throw Error('Kirjoita koko rivi ja yksi yhtäsuuruusmerkki.');return a.map(parse)}
function sub(n,x){if(n.k==='x')return x<0?{k:'group',v:parse(String(x)),highlight:true}:{...parse(String(x)),highlight:true};let m={...n};for(let k of ['l','r','v'])if(typeof n[k]==='object')m[k]=sub(n[k],x);return m}
function same(a,b){a=clean(a);b=clean(b);if(a.k!==b.k)return false;if(a.k==='num')return near(a.v,b.v);if(a.exp!==b.exp||a.sign!==b.sign)return false;return ['l','r','v'].every(k=>typeof a[k]!=='object'||same(a[k],b[k]))}
function render(n){if(n.highlight){let m={...n};delete m.highlight;return '<mstyle mathcolor="#bc401d" mathvariant="bold" class="substituted">'+render(m)+'</mstyle>'}switch(n.k){case'num':return '<mn>'+String(n.v).replace('.',',')+'</mn>';case'x':return '<mi>x</mi>';case'group':return '<mrow><mo>(</mo>'+render(n.v)+'<mo>)</mo></mrow>';case'neg':return '<mrow><mo>'+(n.sign<0?'−':'+')+'</mo>'+render(n.v)+'</mrow>';case'pow':return '<msup>'+render(n.v)+'<mn>'+n.exp+'</mn></msup>';case'/':if(n.l.k==='*')return render({k:'*',l:n.l.l,r:{k:'/',l:n.l.r,r:n.r}});return '<mfrac>'+render(cleanGroup(n.l))+render(cleanGroup(n.r))+'</mfrac>';default:return '<mrow>'+render(n.l)+'<mo>'+(n.k==='*'?(n.r.k==='x'?'⁢':'·'):n.k==='-'?'−':'+')+'</mo>'+render(n.r)+'</mrow>'}}
function cleanGroup(n){return n.k==='group'?cleanGroup(n.v):n}
function math(a){return '<math xmlns="http://www.w3.org/1998/Math/MathML"><mrow>'+render(a[0])+'<mo>=</mo>'+render(a[1])+'</mrow></math>'}
function xmath(x){return '<math><mi>x</mi><mo>=</mo>'+render(parse(String(x)))+'</math>'}
function feedback(c,msg,ok=false){let f=c.querySelector('.feedback');f.textContent=msg;f.classList.toggle('ok',ok)}

let helpSeen=false;
const helpHTML='<p>Kirjoita kertolasku merkillä <code>*</code>, jakolasku merkillä <code>/</code> ja potenssiin kaksi merkinnällä <code>^2</code>.</p><ul><li>'+math(eq('2*3+1=7'))+' → <code>2*3+1=7</code></li><li><math>'+render(parse('(-2)^2'))+'</math> → <code>(-2)^2</code></li><li><math>'+render(parse('(4+6)/(4+1)'))+'</math> → <code>(4+6)/(4+1)</code></li></ul><p>Käytä sulkeita negatiivisen luvun ympärillä, kun sijoitat sen yhtälöön. Murtoluvussa sulje useasta termistä koostuva osoittaja tai nimittäjä sulkeisiin.</p><p>Tarkista painamalla <b>Enter</b> tai <b>Tarkista</b>.</p>';
function writingHelp(parent){let d=document.createElement('details');d.className='writing-help';d.innerHTML='<summary>'+(helpSeen?'Kirjoitusohjeet ?':'Katso kirjoitusohjeet ennen vastaamista.')+'</summary>'+helpHTML;d.ontoggle=()=>{if(d.open){helpSeen=true;document.querySelectorAll('.writing-help summary').forEach(e=>e.textContent='Kirjoitusohjeet ?')}};parent.append(d)}
function preview(i,target){try{let text=i.value.trim();target.innerHTML=text?(text.includes('=')?math(eq(text)):'<math>'+render(parse(text))+'</math>'):''}catch{target.replaceChildren()}}
function field(c,label,fn,check=true){const wrap=document.createElement('form');wrap.className='entry';const i=document.createElement('input');i.type='text';i.autocomplete='off';i.spellcheck=false;i.setAttribute('aria-label',label);const b=document.createElement('button');b.className='check';b.textContent='Tarkista';const pr=document.createElement('div');pr.className='preview';pr.setAttribute('aria-label','Vastauksen matemaattinen esikatselu');wrap.append(i,pr);if(check)wrap.append(b);c.querySelector('.work').append(wrap);i.oninput=()=>preview(i,pr);wrap.onsubmit=e=>{e.preventDefault();try{fn(i.value,wrap)}catch(err){feedback(c,err.message)}};return i}
function row(c,a){let d=document.createElement('div');d.className='accepted';d.innerHTML=math(a);c.querySelector('.work').append(d)}
function choices(c,items,fn){let w=document.createElement('div');w.className='choices';for(const [text,v] of items){let b=document.createElement('button');b.innerHTML=text;b.onclick=()=>{try{fn(v,w)}catch(err){feedback(c,err.message)}};w.append(b)}c.querySelector('.work').append(w);w.querySelector('button').focus({preventScroll:true})}
let serial=0;
function card(parent,heading,a){let c=document.createElement('article');c.dataset.id=++serial;c.innerHTML='<h2>'+heading+'</h2><div class="equation">'+math(a)+'</div><div class="work"></div><div class="feedback" role="status" aria-live="polite"></div>';parent.append(c);return c}
function nextButton(c,onDone){c.querySelectorAll('.next').forEach(x=>x.remove());let b=document.createElement('button');b.className='next';b.textContent='Seuraava';b.onclick=onDone;c.append(b);b.focus({preventScroll:true})}
function study(parent,text,x,onDone,finalLabel='Seuraava'){let a=eq(text),c=card(parent,'Tutki, onko '+xmath(x)+' yhtälön ratkaisu.',a),work=c.querySelector('.work');let p=document.createElement('p');p.className='prompt';p.innerHTML='Sijoita yhtälöön '+xmath(x)+'.';if(parent.id==='example'||parent.id==='basic'&&positions.basic===0)work.append(p);writingHelp(work);let expected=a.map(n=>sub(n,x)),last=expected;
const focus=i=>i.focus({preventScroll:true});
function conclude(b){if(parent.id==='example'){const tip=parent.querySelector('.optional-step-note');if(tip)tip.hidden=false}const truth=near(value(b[0]),value(b[1]));choices(c,[['Tosi',true],['Epätosi',false]],(v,w)=>{if(v!==truth)throw Error('Ovatko yhtälön puolten arvot samat?');w.remove();let d=document.createElement('p');d.className='accepted';d.textContent=truth?'Tosi':'Epätosi';work.append(d);feedback(c,'');choices(c,[[xmath(x)+' on yhtälön ratkaisu.',true],[xmath(x)+' ei ole yhtälön ratkaisu.',false]],(v,w)=>{if(v!==truth)throw Error('Annettu luku on ratkaisu, kun yhtälö on sijoituksen jälkeen tosi.');w.remove();let d=document.createElement('p');d.className='complete';d.innerHTML=xmath(x)+(truth?' on yhtälön ratkaisu.':' ei ole yhtälön ratkaisu.');work.append(d);feedback(c,'');nextButton(c,onDone);c.querySelector('.next').textContent=finalLabel})})}
function calculate(){let i=field(c,'Kirjoita seuraava laskuvaihe',(s,w)=>{let b=eq(s);if(b.some(containsX)||!b.every((n,i)=>Number.isFinite(value(n))&&near(value(n),value(expected[i]))))throw Error('Tarkista kummankin puolen laskut.');if(b.every((n,i)=>same(n,last[i])))throw Error('Laske seuraava välivaihe. Voit sieventää yhtä puolta kerrallaan.');w.remove();row(c,b);last=b;feedback(c,'');if(b.every(simpleNumber))conclude(b);else calculate()});focus(i)}
field(c,'Kirjoita yhtälö sijoituksen jälkeen',(s,w)=>{let next=eq(s);if(next.some(containsX)||!next.every((n,i)=>substitutionSame1(n,expected[i])))throw Error('Sijoita annettu luku jokaisen x:n paikalle. Säilytä laskutoimitukset.');w.remove();p.remove();row(c,expected);feedback(c,'');calculate()});return c}
function simpleNumber(n){n=cleanGroup(n);if(n.k==='num')return true;if(n.k==='neg')return simpleNumber(n.v);return n.k==='/'&&simpleNumber(n.l)&&simpleNumber(n.r)}
function mentalAnswer(text){let a=eq(text); // These tasks are linear, or have one constant numerator divided by x.
let test=x=>value(a[0],x)-value(a[1],x);if(containsReciprocal(a[0])||containsReciprocal(a[1])){let A=test(1),B=test(2),k=2*(A-B),constant=A-k;return -k/constant}let b=test(0),s=test(1)-b;return -b/s}
function containsReciprocal(n){return n.k==='/'&&containsX(n.r)||['l','r','v'].some(k=>typeof n[k]==='object'&&containsReciprocal(n[k]))}


const positions={basic:0,challenge:0};let activeLevel='basic',activeKind='study',introDone=false;
const levelForKind={study:'basic',mental:'basic'};
function decimal(v){return String(Number(v.toFixed(10))).replace('.',',')}
function mentalGroup(parent,level){
 let h=document.createElement('h2');h.textContent='Laske tai päättele yhtälön ratkaisu. Ilmoita pelkkä ratkaisu.';parent.append(h);writingHelp(parent);
 let grid=document.createElement('div');grid.className='mental-grid';parent.append(grid);let cards=[];
 mental[level].forEach((e,i)=>{let a=eq(e),c=card(grid,(i+1)+'.',a);c.classList.add('mental');c.dataset.taskNumber=i;
 let f=document.createElement('form');f.className='entry mental-answer';let label=document.createElement('label');label.innerHTML='<math><mi>x</mi><mo>=</mo></math>';let input=document.createElement('input');input.autocomplete='off';input.spellcheck=false;input.setAttribute('aria-label','Tehtävä '+(i+1)+': x:n arvo');label.append(input);let check=document.createElement('button');check.type='submit';check.className='check';check.textContent='Tarkista';f.append(label,check);c.querySelector('.work').append(f);
 let show=document.createElement('button');show.type='button';show.className='text-link mental-reveal';show.textContent='Vihje';c.append(show);let record={c,input,e,done:false};cards.push(record);
 f.onsubmit=ev=>{ev.preventDefault();let correct=false;try{let n=parse(input.value.trim().replace(/^x\s*=/,''));correct=!containsX(n)&&near(value(n),mentalAnswer(e))}catch{}feedback(c,correct?'Oikein.':input.value.trim()?'Tarkista vastauksesi.':'Kirjoita ratkaisu.',correct);if(correct){record.done=true;input.style.borderColor='#07804c';input.style.background='#eff9f2';check.textContent='✓';show.hidden=true;updateNext()}};
 show.onclick=()=>{if(!record.hint){record.hint=true;feedback(c,'Mikä luku tekee yhtälöstä toden? Kokeile sijoittamista.');show.textContent='Näytä vastaus';return}record.done=true;let out=c.querySelector('.answers');if(!out){out=document.createElement('div');out.className='answers';c.append(out)}out.innerHTML=math([parse('x'),parse(decimal(mentalAnswer(e)))]);feedback(c,'Vastaus katsottu.',true);show.hidden=true;updateNext()};
 });
 let actions=document.createElement('div');actions.className='group-actions';parent.append(actions);
 function updateNext(){if(cards.every(q=>q.done)&&!actions.querySelector('.next')){let n=document.createElement('button');n.className='next';n.textContent=level==='basic'?'Haastaviin tehtäviin':'Valmis';n.onclick=()=>{if(level==='basic')selectView('mental','challenge');else{let done=document.createElement('p');done.className='complete';done.textContent='Harjoitus valmis.';actions.after(done);n.remove()}};actions.append(n)}}
}
function renderLevel(level){let parent=document.getElementById(level);parent.replaceChildren();let idx=positions[level];if(idx<banks[level].length){let p=document.createElement('p');p.className='progress';p.textContent='Sijoitustehtävä '+(idx+1)+' / '+banks[level].length;parent.append(p);let [text,x]=banks[level][idx];study(parent,text,x,()=>{positions[level]++;renderLevel(level);window.scrollTo(0,0);parent.querySelector('input')?.focus({preventScroll:true})})}else{let h=document.createElement('h2');h.textContent='Harjoitus valmis.';parent.append(h);let b=document.createElement('button');b.textContent='Harjoittele uudelleen';b.onclick=()=>{positions[level]=0;renderLevel(level)};parent.append(b);let n=document.createElement('button');n.className='next';n.textContent=level==='basic'?'Siirry haastaviin':'Siirry yhtälöpäässälaskuihin';n.onclick=()=>selectView(level==='basic'?'study':'mental',level==='basic'?'challenge':'basic');parent.append(n)}}
function selectView(kind,level){if(!introDone)return;activeKind=kind;activeLevel=level;levelForKind[kind]=level;document.getElementById('example').hidden=true;document.getElementById('navigation').hidden=false;document.querySelectorAll('[data-kind]').forEach(t=>{let on=t.dataset.kind===kind;t.classList.toggle('active',on);t.setAttribute('aria-pressed',on)});document.querySelectorAll('[data-tab]').forEach(t=>{let on=t.dataset.tab===level;t.classList.toggle('active',on);t.setAttribute('aria-pressed',on)});for(let l of ['basic','challenge']){document.getElementById(l).hidden=kind!=='study'||level!==l;document.getElementById('mental-'+l).hidden=kind!=='mental'||level!==l}window.scrollTo(0,0)}
